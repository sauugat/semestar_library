name: Document Ingestion Worker (Phase D2)

on:
  schedule:
    # Hourly backup sweep (worker exits early if no queued jobs exist)
    - cron: '0 * * * *'
  workflow_dispatch:
    inputs:
      max_jobs:
        description: 'Maximum ingestion jobs to process in this run'
        required: false
        default: '20'
      backfill_dry_run:
        type: boolean
        description: 'Dry run backfill (count and print missing unindexed files without enqueuing)'
        required: false
        default: false
      backfill_limit:
        description: 'Number of unindexed files to backfill/enqueue (0 = do not backfill unless backfill_dry_run is true)'
        required: false
        default: '0'

concurrency:
  group: doc-ingestion-worker
  cancel-in-progress: false

jobs:
  ingest:
    name: Process Queued Document Ingestion Jobs
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install poppler-utils
        run: sudo apt-get update && sudo apt-get install -y poppler-utils

      - name: Install dependencies
        run: npm ci --omit=dev

      - name: Run Document Ingestion Worker
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DIRECT_URL: ${{ secrets.DIRECT_URL }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          DOC_VISION_MODEL: ${{ vars.DOC_VISION_MODEL || secrets.DOC_VISION_MODEL }}
          DOC_VISION_DAILY_REQUEST_CAP: ${{ vars.DOC_VISION_DAILY_REQUEST_CAP || '100' }}
          DOC_READ_IMAGES: ${{ vars.DOC_READ_IMAGES || 'false' }}
          DOC_VISION_BATCH_PAGES: ${{ vars.DOC_VISION_BATCH_PAGES || '1' }}
          DOC_MAX_VISION_PAGES: ${{ vars.DOC_MAX_VISION_PAGES || '60' }}
          DOC_MAX_FILE_BYTES: ${{ vars.DOC_MAX_FILE_BYTES || '104857600' }}
          DOC_PAGE_TIMEOUT_MS: ${{ vars.DOC_PAGE_TIMEOUT_MS || '25000' }}
          DOC_KNOWLEDGE_BUDGET_MS: ${{ vars.DOC_KNOWLEDGE_BUDGET_MS || '480000' }}
          DOC_WORKER_MAX_JOBS: ${{ github.event.inputs.max_jobs || '20' }}
          BACKFILL_DRY_RUN: ${{ github.event.inputs.backfill_dry_run || 'false' }}
          BACKFILL_LIMIT: ${{ github.event.inputs.backfill_limit || '0' }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          KYANA_KNOWLEDGE_V3: ${{ vars.KYANA_KNOWLEDGE_V3 || 'true' }}
          KYANA_KNOWLEDGE_V3_USERS: ${{ vars.KYANA_KNOWLEDGE_V3_USERS }}
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "::error::DATABASE_URL secret is not configured."
            exit 1
          fi

          LIMIT_ARG=""
          if [ -n "$BACKFILL_LIMIT" ] && [ "$BACKFILL_LIMIT" != "0" ]; then
            LIMIT_ARG="--limit $BACKFILL_LIMIT"
          fi

          if [ "$BACKFILL_DRY_RUN" = "true" ]; then
            echo "[Workflow] Running backfill reconcile step in dry-run mode..."
            node scripts/doc-ingestion-worker.js --reconcile --dry-run $LIMIT_ARG
          elif [ -n "$BACKFILL_LIMIT" ] && [ "$BACKFILL_LIMIT" != "0" ]; then
            echo "[Workflow] Running backfill reconcile step with limit $BACKFILL_LIMIT..."
            node scripts/doc-ingestion-worker.js --reconcile $LIMIT_ARG
          fi

          echo "[Workflow] Running document ingestion worker..."
          node scripts/doc-ingestion-worker.js --max-jobs "${DOC_WORKER_MAX_JOBS}"

