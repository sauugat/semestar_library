name: Durable Push Outbox Worker

on:
  schedule:
    # Run every 5 minutes around the clock
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  process-push-retries:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Trigger Push Outbox & Receipt Worker
        env:
          APP_URL: ${{ secrets.PRODUCTION_APP_URL || 'https://semestar-library.vercel.app' }}
          CRON_SECRET: ${{ secrets.CRON_SECRET || secrets.INTERNAL_CRON_SECRET }}
        run: |
          if [ -z "$CRON_SECRET" ]; then
            if [ "${{ github.event_name }}" = "pull_request" ]; then
              echo "Skipping push outbox worker on pull_request (secrets unavailable)."
              exit 0
            fi
            echo "::error::CRON_SECRET (or INTERNAL_CRON_SECRET) is not configured in repository secrets."
            exit 1
          fi

          echo "Triggering durable push retry sweep at $(date -u --iso-8601=seconds)..."
          HTTP_STATUS=$(curl -s -o response.json -w "%{http_code}" -X POST \
            "${APP_URL%/}/api/internal/push/process" \
            -H "Authorization: Bearer ${CRON_SECRET}" \
            -H "x-cron-secret: ${CRON_SECRET}" \
            -H "Content-Type: application/json" \
            -d '{"limit": 100, "includeReceipts": true}' \
            --max-time 30)
          
          echo "Worker Response HTTP Status: $HTTP_STATUS"
          cat response.json
          
          if [ "$HTTP_STATUS" -ne 200 ]; then
            echo "::error::Push worker execution failed with HTTP status $HTTP_STATUS"
            exit 1
          fi
