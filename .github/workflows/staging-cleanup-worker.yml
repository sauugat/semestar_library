name: Staged Attachment Cleanup Worker

on:
  schedule:
    # Run once every hour around the clock
    - cron: '0 * * * *'
  workflow_dispatch:

jobs:
  cleanup-staged-uploads:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Trigger Staging Cleanup Worker
        run: |
          echo "Triggering staged attachment cleanup at $(date -u --iso-8601=seconds)..."
          HTTP_STATUS=$(curl -s -o response.json -w "%{http_code}" -X POST \
            "https://semestar-library.vercel.app/api/internal/posts/cleanup-staging" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            -H "Content-Type: application/json" \
            -d '{"ttlHours": 24}')
          
          echo "Worker Response HTTP Status: $HTTP_STATUS"
          cat response.json
          
          if [ "$HTTP_STATUS" -ne 200 ]; then
            echo "::error::Staged attachment cleanup failed with HTTP status $HTTP_STATUS"
            exit 1
          fi
