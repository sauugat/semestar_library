<!DOCTYPE html>
<html lang="en" data-theme="dark">

<head>
  <script src="/theme.js"></script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Attendance — Semester Library</title>

  <link rel="manifest" href="/manifest.json">
  <link rel="apple-touch-icon" href="/logo.jpg">
  <link rel="icon" type="image/png" sizes="192x192" href="/logo.jpg">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Semester Library">
  <meta name="theme-color" content="#ffffff">
  <script>
    (function () {
      try {
        var t = localStorage.getItem('theme') || 'dark';
        document.documentElement.setAttribute('data-theme', t);
        if (t === 'dark') {
          document.documentElement.classList.add('dark');
        } else {
          document.documentElement.classList.remove('dark');
        }
      } catch (e) {}
    })();
  </script>

  <script src="/auth.js?v=27"></script>
  <script>
    SemesterAuth.protectPage();
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@600;700;800&family=Outfit:wght@600;700;800&family=Inter:wght@400;500;600;700;800&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="style.v4.css">
  <link rel="stylesheet" href="chatbot.css">
  <link rel="stylesheet" href="auth-modal.css">
  <link rel="stylesheet" href="/theme-overrides.css">
  <script src="/academic-context.js"></script>
  <style>
    :root {
      --bg: #f8f9fa;
      --surface: #ffffff;
      --border: rgba(0, 0, 0, 0.13);
      --text: #111827;
      --text-muted: #4b5563;
      --teach-bg: #f8f9fa;
      --teach-surface: #ffffff;
      --teach-surface-subtle: #f3f4f6;
      --teach-surface-hover: #e5e7eb;
      --teach-border: rgba(0, 0, 0, 0.13);
      --teach-border-subtle: rgba(0, 0, 0, 0.08);
      --teach-text-primary: #111827;
      --teach-text-secondary: #4b5563;
      --teach-text-tertiary: #6b7280;
      --teach-badge-bg: #f3f4f6;
      --teach-badge-text: #111827;
      --teach-btn-primary-bg: #111827;
      --teach-btn-primary-text: #ffffff;
      --teach-btn-secondary-bg: #f3f4f6;
      --teach-btn-secondary-text: #111827;
      --teach-shadow-sm: 0 1px 3px rgba(0, 0, 0, 0.05);
      --teach-shadow-md: 0 4px 14px rgba(0, 0, 0, 0.06);
    }

    [data-theme="dark"],
    html.dark,
    body.dark-mode {
      --bg: var(--bg-base, #0a0a0a);
      --surface: var(--bg-surface-raised, #18181b);
      --border: #2e2e32;
      --text: var(--text-primary, #f5f5f5);
      --text-muted: var(--text-secondary, #a1a1aa);
      --teach-bg: var(--bg-base, #0a0a0a);
      --teach-surface: var(--bg-surface-raised, #18181b);
      --teach-surface-subtle: #1c1c1c;
      --teach-surface-hover: #242424;
      --teach-border: #2e2e32;
      --teach-border-subtle: #242424;
      --teach-text-primary: var(--text-primary, #f5f5f5);
      --teach-text-secondary: var(--text-secondary, #a1a1aa);
      --teach-text-tertiary: #71717a;
      --teach-badge-bg: #27272a;
      --teach-badge-text: #f4f4f5;
      --teach-btn-primary-bg: #f5f5f5;
      --teach-btn-primary-text: #0a0a0a;
      --teach-btn-secondary-bg: #27272a;
      --teach-btn-secondary-text: #f4f4f5;
      --teach-shadow-sm: 0 1px 3px rgba(0, 0, 0, 0.3);
      --teach-shadow-md: 0 6px 20px rgba(0, 0, 0, 0.4);
    }

    body.dash {
      background: var(--bg);
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      color: var(--text);
      -webkit-font-smoothing: antialiased;
    }

    .att-page-wrap {
      width: 100%;
      max-width: none;
      margin: 0;
      padding: 28px 6vw 96px;
      box-sizing: border-box;
    }

    /* Apple Obsidian Black Hero Box */
    .att-page-head.dash-hero,
    body.dash .att-page-head.dash-hero.cl-animated-hero {
      position: relative;
      width: 100%;
      max-width: none;
      margin: 0 0 28px !important;
      padding: 34px 40px !important;
      min-height: 148px !important;
      background: #0d0d0f !important;
      border: 1.5px solid rgba(255, 255, 255, 0.14) !important;
      border-radius: var(--ap-radius-hero, 26px);
      box-shadow: none !important;
      box-sizing: border-box;
      color: #fff;
      overflow: hidden;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 28px;
      flex-wrap: wrap;
      transform: none !important;
      transition: border-color 0.35s ease;
    }
    .att-page-head.dash-hero:hover,
    body.dash .att-page-head.dash-hero.cl-animated-hero:hover {
      transform: none !important;
      border-color: rgba(255, 255, 255, 0.32) !important;
      box-shadow: none !important;
    }
    .att-page-head.dash-hero::before,
    .att-page-head.dash-hero::after {
      display: none !important;
      content: none !important;
    }
    [data-theme="dark"] .att-page-head.dash-hero {
      background: #0d0d0f !important;
      border-color: rgba(255, 255, 255, 0.14) !important;
      box-shadow: none !important;
    }
    .att-hero-copy {
      position: relative;
      z-index: 3;
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 5px;
      min-width: 0;
      flex: 1;
      max-width: none;
    }
    .att-hero-kicker {
      font-family: 'Plus Jakarta Sans', 'Outfit', -apple-system, BlinkMacSystemFont, "SF Pro Display", sans-serif;
      font-size: 13.5px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.12em;
      color: rgba(255, 255, 255, 0.82);
      line-height: 1.2;
      margin: 0;
    }
    .att-page-title {
      font-family: 'Plus Jakarta Sans', 'Outfit', -apple-system, BlinkMacSystemFont, "SF Pro Display", sans-serif;
      font-size: clamp(30px, 3.8vw, 48px);
      font-weight: 800;
      letter-spacing: -0.02em;
      line-height: 1.05;
      margin: 0;
      color: #ffffff;
    }
    .att-hero-sub {
      display: none;
    }
    @media (max-width: 768px) {
      .att-page-wrap {
        padding: 14px 12px 60px !important;
      }
      .att-page-head.dash-hero,
      body.dash .att-page-head.dash-hero.cl-animated-hero {
        margin: 0 0 16px !important;
        padding: 18px 16px !important;
        min-height: auto !important;
        flex-direction: column !important;
        align-items: stretch !important;
        gap: 14px !important;
        border-radius: 18px !important;
      }
      .att-hero-kicker {
        font-size: 11px !important;
        letter-spacing: 0.1em !important;
      }
      .att-page-title {
        font-size: 26px !important;
        line-height: 1.15 !important;
      }
    }

    .teach-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 8px 16px;
      font-size: 0.85rem;
      font-weight: 600;
      border-radius: 8px;
      cursor: pointer;
      text-decoration: none;
      border: 1px solid transparent;
      transition: all 0.15s ease;
      white-space: nowrap;
      font-family: inherit;
    }

    .teach-btn-primary {
      background: var(--teach-btn-primary-bg);
      color: var(--teach-btn-primary-text);
      border-color: var(--teach-btn-primary-bg);
    }

    .teach-btn-primary:hover:not(:disabled) {
      opacity: 0.9;
    }

    .teach-btn-secondary {
      background: var(--teach-btn-secondary-bg);
      color: var(--teach-btn-secondary-text);
      border-color: var(--teach-border);
    }

    .teach-btn-secondary:hover:not(:disabled) {
      background: var(--teach-surface-hover);
    }

    .teach-btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .teach-modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.6);
      backdrop-filter: blur(4px);
      -webkit-backdrop-filter: blur(4px);
      z-index: 1000;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .teach-modal-overlay.open {
      display: flex;
    }

    .teach-modal-card {
      background: var(--teach-surface);
      border: 1px solid var(--teach-border);
      border-radius: 16px;
      max-width: 520px;
      width: 100%;
      padding: 28px;
      box-shadow: var(--teach-shadow-md);
      position: relative;
    }

    .teach-modal-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 20px;
    }

    .teach-modal-title {
      font-size: 1.2rem;
      font-weight: 700;
      margin: 0;
      letter-spacing: -0.01em;
    }

    .teach-modal-close {
      background: transparent;
      border: none;
      font-size: 1.2rem;
      color: var(--teach-text-secondary);
      cursor: pointer;
      padding: 4px;
      border-radius: 6px;
    }
  </style>
</head>

<body class="dash">

  <header class="dash-header">
    <a href="dashboard.html" class="lib-wordmark">Semester Library</a>

    <nav class="dash-header-nav">
      <a href="dashboard.html" class="header-nav-item">Feed</a>
      <a href="library.html" class="header-nav-item">Library</a>
      <a href="/code-lab/subjects.html" class="header-nav-item">Assignments</a>
      <a href="routine.html" class="header-nav-item">Routine</a>
      <a href="attendance.html" class="header-nav-item active">Attendance</a>
      <a href="chat.html" class="header-nav-item">Chat</a>
      <a href="chatbot.html" class="header-nav-item">Kyana AI</a>
      <a href="download.html" class="header-nav-item">App</a>
    </nav>

    <div class="dash-header-actions">
      <button type="button" class="theme-toggle-btn" id="themeToggleBtn" aria-label="Toggle theme" title="Toggle theme">
        <span class="theme-toggle-track">
          <svg class="theme-icon-sun" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="5"></circle><line x1="12" y1="1" x2="12" y2="3"></line><line x1="12" y1="21" x2="12" y2="23"></line><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line><line x1="1" y1="12" x2="3" y2="12"></line><line x1="21" y1="12" x2="23" y2="12"></line><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line></svg>
          <svg class="theme-icon-moon" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path></svg>
        </span>
      </button>
      <a href="profile.html" class="dash-profile-chip" title="View Profile">
        <div class="dash-profile-avatar" id="headerAvatar">·</div>
        <span class="dash-profile-label" id="headerProfileName">Profile</span>
      </a>
    </div>
  </header>

  <main class="att-page-wrap">
    <section class="att-page-head dash-hero cl-animated-hero" id="attHeroBanner">
      <div class="att-hero-copy">
        <span class="att-hero-kicker" id="attHeroKicker">ACADEMIC REGISTER</span>
        <h1 class="att-page-title" id="attPageTitle">Attendance</h1>
        <p id="attPageSubtitle" class="att-hero-sub">
          Track your semester attendance percentage, subject-wise session counts, and eligibility status.
        </p>
      </div>
    </section>

    <div id="studentAttendanceMount"></div>
    <div id="teacherAttendanceMount" style="display:none;"></div>
  </main>

  <script src="/js/student-attendance.js?v=2"></script>
  <script src="/js/attendance-drive-sync.js?v=2"></script>
  <script src="/js/teacher-attendance.js?v=2"></script>
  <script>
    document.addEventListener('DOMContentLoaded', async () => {
      try {
        const user = await SemesterAuth.getUser();
        if (!user) {
          window.location.replace('/login.html');
          return;
        }
        SemesterAuth.initHeader(user);
        const role = String(user.role || 'student').trim().toLowerCase();
        const params = new URLSearchParams(window.location.search);
        const subjectKey = params.get('subject') || params.get('subjectId') || null;

        // Teachers open the attendance workspace directly on this page (starting with subject selection unless a subject query param is provided).
        if (role === 'teacher' || role === 'faculty') {
          const titleEl = document.getElementById('attPageTitle');
          const subEl = document.getElementById('attPageSubtitle');
          const stuMount = document.getElementById('studentAttendanceMount');
          const teaMount = document.getElementById('teacherAttendanceMount');
          if (titleEl) titleEl.textContent = 'Attendance';
          if (subEl) {
            subEl.textContent = '';
            subEl.style.display = 'none';
          }
          if (stuMount) stuMount.style.display = 'none';
          if (teaMount) {
            teaMount.style.display = 'block';
            if (window.TeacherAttendanceWorkspace) {
              await window.TeacherAttendanceWorkspace.mount('#teacherAttendanceMount', { subjectKey });
            }
          }
          return;
        }

        if (role === 'admin') {
          if (window.StudentAttendanceDashboard && typeof window.StudentAttendanceDashboard.injectStyles === 'function') {
            window.StudentAttendanceDashboard.injectStyles();
          }
          const mountEl = document.getElementById('studentAttendanceMount');
          if (mountEl) {
            mountEl.innerHTML = `
              <div class="stu-att-root">
                <div class="stu-att-card" style="text-align:center; padding:40px 24px;">
                  <div style="font-size:1.12rem; font-weight:800; margin-bottom:8px;">Administrator Account Detected</div>
                  <div style="font-size:0.88rem; color:var(--text-muted); max-width:500px; margin:0 auto 18px; line-height:1.5;">
                    This page displays personal attendance summaries for enrolled student and CR accounts. Use the Admin Dashboard to manage class attendance.
                  </div>
                  <div style="display:flex; justify-content:center; gap:10px; flex-wrap:wrap;">
                    <a href="/admin-dashboard.html" class="stu-att-btn">Admin Dashboard</a>
                  </div>
                </div>
              </div>
            `;
          }
          return;
        }

        if (window.StudentAttendanceDashboard) {
          await window.StudentAttendanceDashboard.mount('#studentAttendanceMount');
        }
      } catch (err) {
        window.location.replace('/login.html');
      }
    });
  </script>
</body>

</html>
