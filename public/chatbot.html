<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Kyana AI — Semester Library</title>
  <meta name="description" content="Meet Kyana AI, your personal study assistant for Gandaki University BIT notes, syllabus, and exam routines.">

  <!-- Web App Manifest & iOS PWA Metadata -->
  <link rel="manifest" href="/manifest.json">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Semester Library">
  <meta name="theme-color" content="#ffffff">
  <script>
    fetch('/api/me').then(r => { 
      if (!r.ok) {
        document.addEventListener('DOMContentLoaded', showAuthToast);
      } 
    }).catch(() => {
      document.addEventListener('DOMContentLoaded', showAuthToast);
    });

    function showAuthToast() {
      const toast = document.getElementById('minimalAuthToast');
      if (toast) {
        toast.classList.add('show');
        setTimeout(() => toast.classList.remove('show'), 4000);
      }
    }
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&family=Outfit:wght@500;600;700;800&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.css">
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/contrib/auto-render.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <link rel="stylesheet" href="style.v4.css">
  <link rel="stylesheet" href="chatbot.css">
  <link rel="stylesheet" href="auth-modal.css">
</head>
<body class="dash sla-fullpage-mode">

  <!-- TOP NAVIGATION HEADER -->
  <header class="dash-header">
    <a href="dashboard.html" class="lib-wordmark">Semester Library</a>

    <nav class="dash-header-nav">
      <a href="dashboard.html" class="header-nav-item">Feed</a>
      <a href="library.html" class="header-nav-item">Library</a>
      <a href="syllabus.html" class="header-nav-item">Syllabus</a>
      <a href="routine.html" class="header-nav-item">Routine</a>
      <a href="chat.html" class="header-nav-item">Chat</a>
      <a href="chatbot.html" class="header-nav-item active">Kyana AI</a>
    </nav>

    <div class="dash-header-actions">
      <button type="button" class="sla-tool-btn" id="slaClearBtn" title="Clear Chat" style="width:32px; height:32px; border-radius:8px; background:rgba(168, 85, 247, 0.15); color:#d8b4fe; border:1px solid rgba(168,85,247,0.25);">
        <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M3 6h18M19 6v14a2 2 0 01-2 2H7a2 2 0 01-2-2V6m3 0V4a2 2 0 012-2h4a2 2 0 012 2v2"/></svg>
      </button>
      <a href="profile.html" class="dash-profile-chip" id="headerProfileChip" title="View Profile">
        <div class="dash-profile-avatar" id="headerAvatar">S</div>
        <span class="dash-profile-label" id="headerProfileName">Profile</span>
      </a>
    </div>
  </header>

  <!-- FULLPAGE ASSISTANT CONTAINER (FULL-SCREEN RESPONSIVE CHATSPACE) -->
  <div class="sla-fullpage-wrapper">
    
    <!-- MAIN CHAT STAGE -->
    <main class="sla-fullpage-chatbox">

      <!-- Atmospheric Glowing Smoke / Rising Vapor Canvas -->
      <div class="sla-ambient-glow-canvas" aria-hidden="true">
        <div class="sla-smoke-base"></div>
        <div class="sla-smoke-plume sla-smoke-plume-1"></div>
        <div class="sla-smoke-plume sla-smoke-plume-2"></div>
        <div class="sla-smoke-plume sla-smoke-plume-3"></div>
      </div>

      <!-- MESSAGES SCROLL AREA -->
      <div class="sla-chat-messages" id="slaMessages">
        <!-- Minimal Empty State -->
        <div class="sla-welcome-hero" id="slaWelcomeHero">
          <div class="sla-welcome-sparkle">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M12 2v4M12 18v4M4.93 4.93l2.83 2.83M16.24 16.24l2.83 2.83M2 12h4M18 12h4M4.93 19.07l2.83-2.83M16.24 7.76l2.83-2.83"/>
            </svg>
          </div>
          <h2 id="slaHeroGreeting">Hi, I am Kyana</h2>
          <p>Your BIT study companion. Ask me anything about your curriculum, notes, files, or pre-board routine.</p>
        </div>
      </div>

      <!-- INPUT FOOTER -->
      <div class="sla-panel-footer">
        <form class="sla-input-capsule" id="slaForm">
          <textarea 
            id="slaInput" 
            class="sla-input-textarea" 
            placeholder="Ask Kyana AI a question…" 
            rows="1" 
            autocomplete="off" 
            maxlength="600"
          ></textarea>
          
          <button type="submit" class="sla-send-btn" id="slaSendBtn" title="Send (Enter)">
            <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <line x1="22" y1="2" x2="11" y2="13"></line>
              <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
            </svg>
          </button>
        </form>

        <div class="sla-disclaimer-text">
          Grounded in Gandaki University BIT curriculum and uploaded notes.
        </div>
      </div>

    </main>

  </div>

  <script>
    fetch('/api/profile').then(r => {
      if (r.ok) return r.json();
      throw new Error('Not logged in');
    }).then(p => {
      if (p) {
        const headerAvatar = document.getElementById('headerAvatar');
        const headerName = document.getElementById('headerProfileName');
        const heroGreeting = document.getElementById('slaHeroGreeting');
        
        const firstName = p.name ? p.name.split(' ')[0] : '';
        if (headerName) headerName.textContent = firstName || 'Profile';
        if (heroGreeting) {
          heroGreeting.textContent = `Hi, I am Kyana`;
        }

        if (headerAvatar) {
          if (p.avatarUrl) {
            headerAvatar.innerHTML = `<img src="${p.avatarUrl}" alt="${p.name}" style="width:100%; height:100%; border-radius:50%; object-fit:cover;">`;
          } else {
            headerAvatar.textContent = p.name ? p.name.charAt(0).toUpperCase() : 'S';
          }
        }
      }
    }).catch(() => {});
  </script>

  <script src="chatbot.js"></script>

  <div id="minimalAuthToast" class="minimal-auth-toast">
    <svg viewBox="0 0 24 24" width="20" height="20" stroke="currentColor" fill="none" stroke-width="2.5" style="opacity: 0.9;">
      <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
      <path d="M7 11V7a5 5 0 0110 0v4"></path>
    </svg>
    <span>Login required to access this page. <a href="javascript:void(0)" onclick="showAuthModal()">Sign In</a></span>
  </div>
  <script src="auth-modal.js"></script>
  <!-- PWA Service Worker Registration -->
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('/sw.js').catch(err => {
          console.warn('[SW Registration Notice]:', err);
        });
      });
    }
  </script>
</body>
</html>
