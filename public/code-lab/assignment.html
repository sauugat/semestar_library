            if (questions.length > 1) {
                wrap.style.display = 'block';
                wrap.innerHTML = `
                  <button type="button" class="cl-btn-submit-all" id="globalSubmitAllBtn">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path><polyline points="22 4 12 14.01 9 11.01"></polyline></svg>
                    <span>Submit All Questions</span>
                  </button>
                `;
                document.getElementById('globalSubmitAllBtn').addEventListener('click', () => submitAll(questions));
            } else {
                wrap.style.display = 'none';
                wrap.innerHTML = '';
            }
        }

        async function addNewQuestionSlot(assignment) {
            const addBtn = document.getElementById('addQuestionBtn');
            if (addBtn) {
                addBtn.disabled = true;
                addBtn.innerHTML = `
                    <span class="cl-loading-spinner" style="width:12px;height:12px;border-color:rgba(0,0,0,0.15);border-top-color:#111;"></span>
                    <span>Adding...</span>
                `;
            }

            try {
                const lang = (assignment.questions && assignment.questions[0]?.language) || 'c';
                const res = await fetch(`/api/code-lab/assignments/${assignment.id}/student-questions`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ language: lang })
                });
                const data = await res.json();
                if (!res.ok) throw new Error(data.message || 'Failed to add question slot.');

                const newQ = data.question;
                assignment.questions.push(newQ);

                // Create tab and panel
                createQuestionTabAndPanel(newQ, assignment.questions.length - 1, false, assignment);

                // Initialize editor
                initEditor(newQ);

                // Switch to this new question
                switchTab(newQ.id);

                // Update progress badge and submit-all button
                updateProgressBadge(assignment.questions);
                renderSubmitAllButton(assignment.questions);
            } catch (err) {
                showErrorAlert(err.message || 'Could not add question slot.', 'Error');
            } finally {
                if (addBtn) {
                    addBtn.disabled = false;
                    addBtn.innerHTML = `
                        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
                        <span>Add Question</span>
                    `;
                }
            }
        }

        function switchTab(questionId) {
            if (activeQuestionId) flushEvents(activeQuestionId);
            activeQuestionId = questionId;

            document.querySelectorAll('.cl-tab-btn').forEach(t => {
                t.classList.toggle('active', Number(t.dataset.qid) === questionId);
            });
            document.querySelectorAll('.question-panel').forEach(p => {
                p.classList.toggle('active', p.id === `panel-${questionId}`);
            });

            const state = questionState[questionId];
            if (state && state.editor) {
                setTimeout(() => state.editor.layout(), 60);
            }
        }

        function initEditor(q) {
            if (typeof monaco === 'undefined' || !monaco.editor) {
                require(['vs/editor/editor.main'], function () {
                    initEditor(q);
                });
                return;
            }
            const state = questionState[q.id];
            let monacoLang = normalizeLanguage(q.language);
            const initialCode = (q.userSubmission && q.userSubmission.code) ? q.userSubmission.code : '// Write your code here\n';
            if (/public\s+class\s+\w+|public\s+static\s+void\s+main|System\.(out|err)\./.test(initialCode)) {
                monacoLang = 'java';
            }

            state.editor = monaco.editor.create(document.getElementById(`editor-${q.id}`), {
                value: initialCode,
                language: monacoLang,
                theme: 'cl-vibrant-dark',
                fontSize: 13.5,
                lineHeight: 22,
                letterSpacing: 0.25,
                fontWeight: "400",
                fontLigatures: true,
                minimap: { enabled: false },
                scrollBeyondLastLine: false,
                automaticLayout: true,
                padding: { top: 14, bottom: 14 },
                fontFamily: "'SF Mono', Menlo, Monaco, Consolas, 'Courier New', monospace",
                roundedSelection: true,
                cursorBlinking: 'smooth',
                cursorSmoothCaretAnimation: "on",
                smoothScrolling: true,
                lineNumbersMinChars: 3
            });

            // Restore previous terminal output if already submitted
            if (q.userSubmission) {
                state.hasRun = true;
                state.lastRunCode = q.userSubmission.code || '';
                state.lastRunSuccess = !q.userSubmission.stderr;
                state.lastRunError = q.userSubmission.stderr || null;
                state.stdout = q.userSubmission.stdout || '';
                state.stderr = q.userSubmission.stderr || '';

                if (q.userSubmission.stdout || q.userSubmission.stderr) {
                    const stdoutEl = document.getElementById(`stdout-${q.id}`);
                    const stderrEl = document.getElementById(`stderr-${q.id}`);
                    if (stdoutEl) {
                        stdoutEl.className = '';
                        stdoutEl.textContent = q.userSubmission.stdout || '';
                    }
                    if (stderrEl) {
                        if (q.userSubmission.stderr) {
                            stderrEl.style.display = 'block';
                            stderrEl.textContent = q.userSubmission.stderr;
                        } else {
                            stderrEl.style.display = 'none';
                            stderrEl.textContent = '';
                        }
                    }
                    const pill = document.getElementById(`statusPill-${q.id}`);
                    if (pill) {
                        pill.className = 'cl-output-status-pill success';
                        pill.textContent = 'Submitted Output';
                    }
                }
                // (saved solution restored silently — no toast)
            }

            // Filename input handling
            const fileExt = getFileExtension(q.language);
            const filenameInput = document.getElementById(`filename-${q.id}`);
            if (filenameInput) {
                const resizeInput = () => {
                    filenameInput.style.width = Math.max(80, Math.min(220, (filenameInput.value.length + 1) * 8.5)) + 'px';
                };
                resizeInput();
                filenameInput.addEventListener('input', resizeInput);
                filenameInput.addEventListener('blur', () => {
                    let val = filenameInput.value.trim();
                    if (!val) val = `solution.${fileExt}`;
                    if (!val.includes('.')) val += `.${fileExt}`;
                    filenameInput.value = val;
                    state.filename = val;
                    resizeInput();

                    const ext = val.split('.').pop().toLowerCase();
                    let targetLang = null;
                    if (ext === 'java') targetLang = 'java';
                    else if (ext === 'py') targetLang = 'python';
                    else if (ext === 'js' || ext === 'javascript') targetLang = 'javascript';
                    else if (ext === 'c' || ext === 'cpp' || ext === 'cc') targetLang = 'cpp';

                    if (targetLang && state.editor && state.editor.getModel()) {
                        monaco.editor.setModelLanguage(state.editor.getModel(), targetLang);
                        state.language = targetLang;
                    }
                    showMsg(q.id, `File renamed to ${val}`, 'success');
                });
                filenameInput.addEventListener('keydown', (e) => {
                    if (e.key === 'Enter') {
                        filenameInput.blur();
                    }
                });
            }

            // Check if this is genuinely first-ever open for this student on this question
            const currentStudentId = window._currentStudentId;
            if (currentStudentId) {
                fetch(`/api/code-lab/questions/${q.id}/events/${currentStudentId}`)
                    .then(r => r.ok ? r.json() : [])
                    .then(pastEvs => {
                        if (Array.isArray(pastEvs) && pastEvs.length === 0) {
                            logEvent(q.id, 'first_open', { questionId: q.id });
                        }
                    })
                    .catch(e => console.warn('Could not check first open:', e))
                    .finally(() => {
                        logEvent(q.id, 'session_start', {});
                    });
            } else {
                logEvent(q.id, 'session_start', {});
            }

            // Anti-cheat: Paste block
            state.editor.onDidPaste(() => {
                state.editor.trigger('source', 'undo', null);
                showErrorAlert('Direct pasting is disabled for this assignment.', 'Pasting Disabled');
                logEvent(q.id, 'paste_attempt', {});
            });

            // Typing speed / large-change & idle detection
            state.lastValueLength = state.editor.getValue().length;
            state.lastChangeAt = Date.now();
            state.lastKeystrokeAt = Date.now();
            state.hasLoggedFirstKeystroke = false;
            state.hasLoggedIdleStretch = false;
            state.keystrokeGaps = [];

            state.editor.onDidChangeModelContent(() => {
                const now = Date.now();
                if (!state.hasLoggedFirstKeystroke) {
                    state.hasLoggedFirstKeystroke = true;
                    logEvent(q.id, 'first_keystroke', { questionId: q.id });
                }
                if (state.hasLoggedIdleStretch) {
                    const idleMs = now - state.lastKeystrokeAt;
                    logEvent(q.id, 'idle_ended', { questionId: q.id, idleMs });
                    state.hasLoggedIdleStretch = false;
                }

                // Inter-keystroke gaps for typing rhythm (exclude long pauses > 8s)
                if (state.lastKeystrokeAt) {
                    const gap = now - state.lastKeystrokeAt;
                    if (gap > 0 && gap < 8000) {
                        state.keystrokeGaps.push(gap);
                    }
                }
                state.lastKeystrokeAt = now;

                const newLength = state.editor.getValue().length;
                const delta = newLength - state.lastValueLength;
                const elapsedMs = now - state.lastChangeAt;
                state.lastValueLength = newLength;
                state.lastChangeAt = now;

                if (delta >= 15) {
                    const charsPerSec = delta / Math.max(elapsedMs, 1) * 1000;
                    if (charsPerSec > 40) {
                        logEvent(q.id, 'large_change', { delta, elapsedMs, charsPerSec: Math.round(charsPerSec) });
                    }
                }
            });

            // Periodic code snapshots
            state.lastSnapshotCode = state.editor.getValue();
            setInterval(() => {
                const current = state.editor.getValue();
                if (current !== state.lastSnapshotCode) {
                    state.lastSnapshotCode = current;
                    logEvent(q.id, 'code_snapshot', { code: current.slice(0, 6000) });
                }
            }, 15000);

            // Heartbeat & Idle-on-tab detection (every 15s)
            setInterval(() => {
                logEvent(q.id, 'heartbeat', {});

                const now = Date.now();
                if (!document.hidden && (now - state.lastKeystrokeAt > 3 * 60 * 1000) && !state.hasLoggedIdleStretch) {
                    state.hasLoggedIdleStretch = true;
                    logEvent(q.id, 'idle_on_tab', { questionId: q.id, idleMs: now - state.lastKeystrokeAt });
                }
            }, 15000);

            // Typing rhythm aggregation (every ~10s)
            setInterval(() => {
                flushTypingRhythm(q.id);
            }, 10000);

            // Run button
            document.getElementById(`runBtn-${q.id}`).addEventListener('click', () => runCode(q));

            // Submit button
            document.getElementById(`submitBtn-${q.id}`).addEventListener('click', () => submitQuestion(q));
        }

        function flushTypingRhythm(qId) {
            const state = questionState[qId];
            if (!state || !state.keystrokeGaps || state.keystrokeGaps.length < 5) return;

            const samples = state.keystrokeGaps;
            state.keystrokeGaps = [];

            const count = samples.length;
            const sum = samples.reduce((acc, val) => acc + val, 0);
            const avgGapMs = sum / count;
            const variance = samples.reduce((acc, val) => acc + Math.pow(val - avgGapMs, 2), 0) / count;
            const stdDevMs = Math.sqrt(variance);

            logEvent(qId, 'typing_rhythm', {
                questionId: qId,
                avgGapMs: Math.round(avgGapMs),
                stdDevMs: Math.round(stdDevMs),
                sampleCount: count
            });
        }

        function clearTerminal(qId) {
            const stdoutEl = document.getElementById(`stdout-${qId}`);
            const stderrEl = document.getElementById(`stderr-${qId}`);
            const statusPill = document.getElementById(`statusPill-${qId}`);
            const explainWrap = document.getElementById(`explainWrap-${qId}`);
            if (stdoutEl) {
                stdoutEl.className = 'placeholder';
                stdoutEl.innerHTML = '<span class="cl-terminal-prompt">$</span>Ready to execute. Click &quot;Run Code&quot; (⌘+Enter) to compile and view output here.';
            }
            if (stderrEl) {
                stderrEl.style.display = 'none';
                stderrEl.textContent = '';
            }
            if (statusPill) {
                statusPill.className = 'cl-output-status-pill';
                statusPill.textContent = 'Ready';
            }
            if (explainWrap) {
                explainWrap.style.display = 'none';
            }
        }

        async function runCode(q) {
            const state = questionState[q.id];
            if (!state || !state.editor) return;

            const code = state.editor.getValue();
            const outputEl = document.getElementById(`output-${q.id}`);
            const stdoutEl = document.getElementById(`stdout-${q.id}`);
            const stderrEl = document.getElementById(`stderr-${q.id}`);
            const runBtn = document.getElementById(`runBtn-${q.id}`);
            const statusPill = document.getElementById(`statusPill-${q.id}`);

            if (stdoutEl) {
                stdoutEl.className = '';
                stdoutEl.textContent = 'Compiling and executing…';
            }
            if (stderrEl) {
                stderrEl.style.display = 'none';
                stderrEl.textContent = '';
            }
            if (statusPill) {
                statusPill.className = 'cl-output-status-pill';
                statusPill.textContent = 'Running…';
            }

            runBtn.disabled = true;
            const originalBtnHTML = runBtn.innerHTML;
            runBtn.innerHTML = `
        <span class="cl-loading-spinner" style="border-color: rgba(0, 0, 0, 0.2); border-top-color: #000000; width: 11px; height: 11px;"></span>
        <span>Running…</span>
      `;

            try {
                const res = await fetch('/api/code-lab/run', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ language: normalizeLanguage(state.language), code, stdin: '' })
                });
                const data = await res.json();
                if (!res.ok) throw new Error(data.error || 'Execution failed.');

                const exitCode = Number(data.exitCode ?? (data.stderr ? 1 : 0));
                const isSuccess = !data.stderr && !data.error && exitCode === 0;

                state.stdout = data.stdout || '';
                state.stderr = data.stderr || '';
                state.hasRun = true;
                state.lastRunCode = code;
                state.lastRunSuccess = isSuccess;
                state.lastRunError = !isSuccess ? (data.stderr || data.error || `Process exited with code ${exitCode}`) : null;

                if (stdoutEl) {
                    stdoutEl.className = '';
                    stdoutEl.textContent = data.stdout || '';
                    if (!data.stdout && !data.stderr) {
                        stdoutEl.textContent = 'Program finished execution with no output.';
                    }
                }
                if (stderrEl) {
                    if (data.stderr) {
                        stderrEl.style.display = 'block';
                        stderrEl.textContent = data.stderr;
                    } else {
                        stderrEl.style.display = 'none';
                        stderrEl.textContent = '';
                    }
                }

                if (statusPill) {
                    if (!isSuccess) {
                        statusPill.className = 'cl-output-status-pill error';
                        statusPill.textContent = data.stderr ? 'Runtime / Error' : `Exit Code: ${exitCode}`;
                    } else {
                        statusPill.className = 'cl-output-status-pill success';
                        statusPill.textContent = 'Exit Code: 0 (Success)';
                    }
                }

                // Log run event with compiler status
                const exitStatus = data.status || (isSuccess ? 'success' : 'error');
                logEvent(q.id, 'run_clicked', { questionId: q.id, success: isSuccess, exitStatus });

                // Show/hide AI explain button based on stderr
                const explainWrap = document.getElementById(`explainWrap-${q.id}`);
                const explanationBox = document.getElementById(`explanationBox-${q.id}`);
                if (data.stderr && !isSuccess) {
                    if (explainWrap) explainWrap.style.display = 'block';
                    if (explanationBox) { explanationBox.style.display = 'none'; }
                } else {
                    if (explainWrap) explainWrap.style.display = 'none';
                }
            } catch (err) {
                state.stdout = '';
                state.stderr = err.message;
                state.hasRun = true;
                state.lastRunCode = code;
                state.lastRunSuccess = false;
                state.lastRunError = err.message;
                if (stdoutEl) {
                    stdoutEl.className = '';
                    stdoutEl.textContent = '';
                }
                if (stderrEl) {
                    stderrEl.style.display = 'block';
                    stderrEl.textContent = err.message;
                }
                if (statusPill) {
                    statusPill.className = 'cl-output-status-pill error';
                    statusPill.textContent = 'Failed';
                }
                logEvent(q.id, 'run_clicked', { questionId: q.id, success: false, exitStatus: 'failed', error: err.message });

                // Show AI explain button on failure
                const explainWrapErr = document.getElementById(`explainWrap-${q.id}`);
                const explanationBoxErr = document.getElementById(`explanationBox-${q.id}`);
                if (explainWrapErr) explainWrapErr.style.display = 'block';
                if (explanationBoxErr) explanationBoxErr.style.display = 'none';
            } finally {
                runBtn.disabled = false;
                runBtn.innerHTML = originalBtnHTML;
            }
        }

        async function explainError(qId) {
            const state = questionState[qId];
            if (!state) return;

            const btn = document.getElementById(`explainBtn-${qId}`);
            const explanationBox = document.getElementById(`explanationBox-${qId}`);
            const explanationText = document.getElementById(`explanationText-${qId}`);
            if (!btn || !explanationBox || !explanationText) return;

            // Log usage
            logEvent(qId, 'ai_explain_used', { questionId: qId });

            btn.disabled = true;
            const originalHTML = btn.innerHTML;
            btn.innerHTML = `
              <span class="cl-loading-spinner" style="border-color: rgba(0,0,0,0.15); border-top-color: #374151; width: 12px; height: 12px;"></span>
              <span>Thinking...</span>
            `;
            explanationBox.style.display = 'block';
            explanationText.innerHTML = '';

            try {
                const res = await fetch('/api/code-lab/explain-error', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        code: state.editor ? state.editor.getValue() : '',
                        stderr: state.stderr || '',
                        language: state.language || 'code'
                    })
                });
                const data = await res.json();
                if (!res.ok) throw new Error(data.message || 'Could not get an explanation.');
                if (window.marked && typeof window.marked.parse === 'function') {
                    explanationText.innerHTML = marked.parse(data.explanation);
                } else {
                    explanationText.textContent = data.explanation;
                }
            } catch (err) {
                explanationText.textContent = err.message || 'Something went wrong getting the explanation.';
            } finally {
                btn.disabled = false;
                btn.innerHTML = originalHTML;
            }
        }

        function validateQuestionForSubmission(q) {
            const state = questionState[q.id];
            if (!state || !state.editor) {
                return { valid: false, reason: 'uninitialized', message: 'Editor not initialized.' };
            }

            const code = state.editor.getValue().trim();
            if (!code || code === '// Write your code here') {
                return { valid: false, reason: 'unanswered', message: 'Please write your code before submitting.' };
            }

            // If the code matches a previously accepted submission and has not changed
            if (q.userSubmission && q.userSubmission.code && q.userSubmission.code.trim() === code && !q.userSubmission.stderr) {
                return { valid: true };
            }

            // Check if code has been run for the current editor contents
            const codeRunForCurrent = state.hasRun && state.lastRunCode && state.lastRunCode.trim() === code;
            if (!codeRunForCurrent) {
                return { valid: false, reason: 'not_run', message: 'Please run your code before submitting.' };
            }

            // Check if code run produced an error
            if (!state.lastRunSuccess || state.lastRunError || state.stderr) {
                return { valid: false, reason: 'has_error', message: 'Cannot submit code with errors. Please fix all errors and run successfully.' };
            }

            return { valid: true };
        }

        async function submitQuestion(q) {
            const state = questionState[q.id];
            if (!state || !state.editor) return false;

            const validation = validateQuestionForSubmission(q);
            if (!validation.valid) {
                showErrorAlert(validation.message, 'Cannot Submit');
                return false;
            }

            const submitBtn = document.getElementById(`submitBtn-${q.id}`);
            submitBtn.disabled = true;
            const originalSubmitHTML = submitBtn.innerHTML;
            submitBtn.innerHTML = `
        <span class="cl-loading-spinner"></span>
        <span>Submitting…</span>
      `;

            const code = state.editor.getValue();
            if (state.hasLoggedIdleStretch) {
                const idleMs = Date.now() - state.lastKeystrokeAt;
                logEvent(q.id, 'idle_ended', { questionId: q.id, idleMs });
                state.hasLoggedIdleStretch = false;
            }
            flushTypingRhythm(q.id);
            logEvent(q.id, 'code_snapshot', { code: code.slice(0, 6000) });
            logEvent(q.id, 'submit_clicked', {});
            flushEvents(q.id);

            const qTitleInput = document.getElementById(`q-title-input-${q.id}`);
            const questionTitle = qTitleInput ? qTitleInput.value.trim() : (q.title || `Question ${q.questionNumber}`);

            try {
                const res = await fetch(`/api/code-lab/questions/${q.id}/submissions`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        code,
                        stdout: state.stdout,
                        stderr: state.stderr,
                        questionTitle: questionTitle || `Question ${q.questionNumber}`
                    })
                });
                const data = await res.json();
                if (res.ok) {
                    showMsg(q.id, `Q${q.questionNumber} submitted successfully!`, 'success');
                    q.title = questionTitle || q.title;
                    q.userSubmission = {
                        code,
                        stdout: state.stdout,
                        stderr: state.stderr,
                        questionTitle: questionTitle || q.title,
                        submittedAt: new Date().toISOString()
                    };

                    // Update tab checkmark
                    const tabBtn = document.getElementById(`tab-btn-${q.id}`);
                    if (tabBtn && !tabBtn.querySelector('.cl-tab-check')) {
                        tabBtn.insertAdjacentHTML('afterbegin', '<span class="cl-tab-check">✓</span>');
                    }

                    // Update progress badge in header
                    const allQuestions = Object.values(questionState).map(s => s.questionObj).filter(Boolean);
                    if (allQuestions.length) updateProgressBadge(allQuestions);
                    return true;
                } else {
                    showErrorAlert(data.message || 'Submission failed. Please try again.', 'Submission Failed');
                    return false;
                }
            } catch (err) {
                showErrorAlert('Network error — could not reach server.', 'Connection Error');
                return false;
            } finally {
                submitBtn.disabled = false;
                submitBtn.innerHTML = originalSubmitHTML;
            }
        }

        function submitAll(questions) {
            const readyQuestions = [];
            const unreadyQuestions = [];

            questions.forEach(q => {
                const v = validateQuestionForSubmission(q);
                if (v.valid) {
                    readyQuestions.push(q);
                } else {
                    unreadyQuestions.push({ q, reason: v.reason, message: v.message });
                }
            });

            if (readyQuestions.length === 0) {
                showErrorAlert('None of the questions are ready to submit. Please write and run your code successfully first.', 'Cannot Submit');
                return;
            }

            if (unreadyQuestions.length > 0) {
                openSubmitConfirmModal(readyQuestions, unreadyQuestions, questions.length);
                return;
            }

        }

        async function executeSubmitAll(readyQuestions, totalCount) {
            const btn = document.getElementById('globalSubmitAllBtn');
            if (btn) {
                btn.disabled = true;
                btn.innerHTML = `
          <span class="cl-loading-spinner"></span>
          <span>Submitting ${readyQuestions.length} of ${totalCount} questions…</span>
        `;
            }
            let successCount = 0;
            for (const q of readyQuestions) {
                const ok = await submitQuestion(q);
                if (ok) successCount++;
            }
            if (btn) {
                btn.disabled = false;
                btn.innerHTML = `
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg>
          <span>${successCount}/${totalCount} Questions Submitted</span>
        `;
                setTimeout(() => {
                    btn.innerHTML = `
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path><polyline points="22 4 12 14.01 9 11.01"></polyline></svg>
            <span>Submit All Questions</span>
          `;
                }, 3500);
            }
        }

        function openSubmitConfirmModal(readyQuestions, unreadyQuestions, totalCount) {
            const modal = document.getElementById('submitConfirmModal');
            const summaryText = document.getElementById('submitConfirmSummary');
            const detailsList = document.getElementById('submitConfirmDetails');
            const confirmBtn = document.getElementById('submitConfirmAnywayBtn');

            if (!modal) return;

            if (summaryText) {
                summaryText.style.display = 'none';
                summaryText.innerHTML = '';
            }

            let unreadyHtml = '';
            unreadyQuestions.forEach(item => {
                const reasonLabel = item.reason === 'unanswered' ? 'Not answered' : item.reason === 'not_run' ? 'Code not run' : 'Execution had errors';
                unreadyHtml += `
                    <div style="display: flex; align-items: center; justify-content: space-between; padding: 10px 14px; background: #f9fafb; border: 1px solid #e5e7eb; border-radius: 8px; margin-bottom: 6px; font-size: 13px;">
                        <div style="display: flex; flex-direction: column; gap: 2px; overflow: hidden; margin-right: 12px;">
                            <span style="font-weight: 600; color: #111827; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;">Task ${item.q.questionNumber}: ${escapeHtml(item.q.title)}</span>
                            <span style="font-size: 11.5px; color: #6b7280;">${reasonLabel}</span>
                        </div>
                        <span style="color: #dc2626; font-weight: 600; font-size: 12.5px; white-space: nowrap;">Not submitted</span>
                    </div>
                `;
            });
            detailsList.innerHTML = unreadyHtml;

            confirmBtn.onclick = () => {
                closeSubmitConfirmModal();
                executeSubmitAll(readyQuestions, totalCount);
            };

            modal.style.display = 'flex';
        }

        function closeSubmitConfirmModal() {
            const modal = document.getElementById('submitConfirmModal');
            if (modal) modal.style.display = 'none';
        }

        function showErrorAlert(message, title = 'Cannot Submit') {
            const modal = document.getElementById('errorAlertModal');
            const titleEl = document.getElementById('errorAlertTitle');
            const msgEl = document.getElementById('errorAlertMessage');
            const okBtn = document.getElementById('errorAlertOkBtn');
            if (!modal || !msgEl) return;

            // Strip any emojis from message or title
            const cleanMsg = String(message || '').replace(/[\u{1F300}-\u{1F9FF}]|[\u{2600}-\u{26FF}]|[\u{2700}-\u{27BF}]/gu, '').trim();
            const cleanTitle = String(title || 'Cannot Submit').replace(/[\u{1F300}-\u{1F9FF}]|[\u{2600}-\u{26FF}]|[\u{2700}-\u{27BF}]/gu, '').trim();

            if (titleEl) titleEl.textContent = cleanTitle;
            msgEl.textContent = cleanMsg;

            modal.style.display = 'flex';
            if (okBtn) okBtn.focus();
        }

        function closeErrorAlertModal() {
            const modal = document.getElementById('errorAlertModal');
            if (modal) modal.style.display = 'none';
        }

        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') {
                closeSubmitConfirmModal();
                closeErrorAlertModal();
            }
            if (e.key === 'Enter') {
                const errorModal = document.getElementById('errorAlertModal');
                if (errorModal && errorModal.style.display === 'flex') {
                    e.preventDefault();
                    closeErrorAlertModal();
                }
            }
        });
        document.addEventListener('click', (e) => {
            const submitModal = document.getElementById('submitConfirmModal');
            if (submitModal && e.target === submitModal) closeSubmitConfirmModal();

            const errorModal = document.getElementById('errorAlertModal');
            if (errorModal && e.target === errorModal) closeErrorAlertModal();
        });

        function showMsg(qId, text, type) {
            if (type === 'error') {
                showErrorAlert(text, 'Cannot Submit');
                return;
            }
            const el = document.getElementById(`msg-${qId}`);
            if (!el) return;
            el.textContent = text;
            el.className = `cl-toast-msg show ${type || 'success'}`;
            setTimeout(() => {
                el.className = 'cl-toast-msg';
                el.textContent = '';
            }, 4500);
        }
    </script>

    <!-- Submit All Confirmation Modal -->
    <div id="submitConfirmModal" class="cl-modal-overlay" style="display: none;">
        <div class="cl-modal-card">
            <div class="cl-modal-header">
                <h3 class="cl-modal-title">Incomplete Assignment</h3>
                <button type="button" class="cl-modal-close-btn" onclick="closeSubmitConfirmModal()" aria-label="Close modal">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <line x1="18" y1="6" x2="6" y2="18"></line>
                        <line x1="6" y1="6" x2="18" y2="18"></line>
                    </svg>
                </button>
            </div>
            <div class="cl-modal-body" id="submitConfirmSummary" style="display: none;"></div>
            <div id="submitConfirmDetails" style="max-height: 220px; overflow-y: auto; margin-bottom: 16px;"></div>
            <div class="cl-modal-actions">
                <button type="button" class="cl-modal-btn cancel" onclick="closeSubmitConfirmModal()">Cancel</button>
                <button type="button" class="cl-modal-btn confirm" id="submitConfirmAnywayBtn">Submit Anyway</button>
            </div>
        </div>
    </div>

    <!-- Error Alert Popup Modal -->
    <div id="errorAlertModal" class="cl-modal-overlay" style="display: none;">
        <div class="cl-modal-card error-modal" style="max-width: 440px;">
            <div class="cl-modal-header">
                <div class="cl-modal-title-wrap">
                    <div class="cl-modal-error-icon">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                            <circle cx="12" cy="12" r="10"></circle>
                            <line x1="12" y1="8" x2="12" y2="12"></line>
                            <line x1="12" y1="16" x2="12.01" y2="16"></line>
                        </svg>
                    </div>
                    <h3 class="cl-modal-title" id="errorAlertTitle">Cannot Submit</h3>
                </div>
                <button type="button" class="cl-modal-close-btn" onclick="closeErrorAlertModal()" aria-label="Close error modal">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <line x1="18" y1="6" x2="6" y2="18"></line>
                        <line x1="6" y1="6" x2="18" y2="18"></line>
                    </svg>
                </button>
            </div>
            <div class="cl-modal-body" id="errorAlertMessage"></div>
            <div class="cl-modal-actions">
                <button type="button" class="cl-modal-btn error-btn" id="errorAlertOkBtn" onclick="closeErrorAlertModal()" style="min-width: 80px;">OK</button>
            </div>
        </div>
    </div>
</body>

</html>
