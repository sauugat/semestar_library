<!DOCTYPE html>
<html lang="en" data-theme="dark">

<head>
  <script src="/theme.js"></script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Create Post — Semester Library</title>

  <link rel="manifest" href="/manifest.json">
  <link rel="apple-touch-icon" href="/logo.jpg">
  <link rel="icon" type="image/png" sizes="192x192" href="/logo.jpg">
  <meta name="theme-color" content="#121214">

  <!-- Anti-flash inline script: executes before paint to prevent FOUC -->
  <script>
    (function () {
      try {
        var t = localStorage.getItem('theme');
        if (!t) {
          t = 'dark';
          try { localStorage.setItem('theme', 'dark'); } catch (e) { }
        }
        var d = t === 'dark';
        document.documentElement.setAttribute('data-theme', t);
        if (d) {
          document.documentElement.classList.add('dark');
        } else {
          document.documentElement.classList.remove('dark');
        }
      } catch (e) { }
    })();
  </script>

  <script src="/auth.js"></script>
  <script>SemesterAuth.protectPage();</script>
  <script src="/academic-context.js"></script>
  <script src="/markdown.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/style.v4.css?v=4.2">

  <style>
    /* Strict Monochrome Palette Tokens (Subtle low-contrast borders) */
    :root {
      --page-bg: #f5f5f7;
      --card-bg: #ffffff;
      --border-color: rgba(0, 0, 0, 0.08);
      --border-subtle: rgba(0, 0, 0, 0.04);
      --border-strong: rgba(0, 0, 0, 0.16);
      --border-hover: rgba(0, 0, 0, 0.12);
      --text-main: #111113;
      --text-muted: #71717a;
      --text-faint: #a1a1aa;
      --input-bg: #fcfcfd;
      --select-hover: #f4f4f5;
      --btn-bg: #18181b;
      --btn-text: #ffffff;
      --btn-hover: #27272a;
      --badge-bg: #f4f4f5;
    }

    [data-theme="dark"],
    body.dark-mode {
      --page-bg: #09090b;
      --card-bg: #121214;
      --border-color: rgba(255, 255, 255, 0.08);
      --border-subtle: rgba(255, 255, 255, 0.04);
      --border-strong: rgba(255, 255, 255, 0.16);
      --border-hover: rgba(255, 255, 255, 0.12);
      --text-main: #f4f4f6;
      --text-muted: #8e8e93;
      --text-faint: #52525b;
      --input-bg: #161618;
      --select-hover: #1f1f23;
      --btn-bg: #27272a;
      --btn-text: #f4f4f5;
      --btn-hover: #3f3f46;
      --badge-bg: #1c1c1f;
    }

    body {
      background: var(--page-bg);
      color: var(--text-main);
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      margin: 0;
      padding: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* Top Navigation Header */
    .create-page-header {
      position: sticky;
      top: 0;
      z-index: 100;
      background: var(--page-bg);
      border-bottom: 1px solid var(--border-color);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
    }

    .header-inner {
      max-width: 840px;
      margin: 0 auto;
      padding: 14px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
    }

    .header-left {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .back-link {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 7px 12px;
      border-radius: 8px;
      background: transparent;
      border: 1px solid var(--border-color);
      color: var(--text-main);
      text-decoration: none;
      font-size: 13.5px;
      font-weight: 500;
      transition: all 0.15s ease;
    }

    .back-link:hover {
      background: var(--select-hover);
      border-color: var(--border-strong);
    }

    .header-brand {
      font-size: 14px;
      font-weight: 700;
      letter-spacing: 0.2px;
      color: var(--text-muted);
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .theme-toggle-btn {
      width: 36px;
      height: 36px;
      border-radius: 8px;
      border: 1px solid var(--border-color);
      background: transparent;
      color: var(--text-main);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: background 0.15s ease;
    }

    .theme-toggle-btn:hover {
      background: var(--select-hover);
    }

    /* Main Container */
    .create-page-main {
      flex: 1;
      max-width: 840px;
      width: 100%;
      margin: 0 auto;
      padding: 30px 20px 60px 20px;
      box-sizing: border-box;
    }

    .composer-card {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 14px;
      padding: 28px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.04);
    }

    @media (max-width: 600px) {
      .composer-card {
        padding: 20px 16px;
      }
    }

    .composer-header {
      margin-bottom: 22px;
    }

    .composer-title {
      font-size: 22px;
      font-weight: 700;
      margin: 0 0 6px 0;
      color: var(--text-main);
      letter-spacing: -0.3px;
    }

    .composer-subtitle {
      font-size: 13.5px;
      color: var(--text-muted);
      margin: 0;
    }

    /* Author info strip */
    .author-strip {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px 14px;
      border-radius: 10px;
      background: var(--input-bg);
      border: 1px solid var(--border-color);
      margin-bottom: 20px;
    }

    .author-avatar {
      width: 34px;
      height: 34px;
      border-radius: 50%;
      background: var(--select-hover);
      border: 1px solid var(--border-color);
      color: var(--text-main);
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      font-size: 14px;
      flex-shrink: 0;
    }

    .author-details {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .author-name {
      font-size: 13.5px;
      font-weight: 600;
      color: var(--text-main);
    }

    .author-role-badge {
      display: inline-block;
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 0.5px;
      text-transform: uppercase;
      color: var(--text-muted);
      background: rgba(255, 255, 255, 0.04);
      padding: 2px 6px;
      border-radius: 4px;
      border: 1px solid var(--border-subtle);
      width: fit-content;
    }

    [data-theme="light"] .author-role-badge,
    body.light-mode .author-role-badge {
      background: rgba(0, 0, 0, 0.04);
    }

    /* Form Fields */
    .form-group {
      margin-bottom: 18px;
    }

    .form-label {
      display: block;
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 0.5px;
      color: var(--text-muted);
      text-transform: uppercase;
      margin-bottom: 7px;
    }

    .label-optional {
      font-size: 11px;
      font-weight: 400;
      color: var(--text-faint);
      text-transform: none;
    }

    .composer-input,
    .composer-textarea {
      width: 100%;
      box-sizing: border-box;
      background: var(--input-bg);
      border: 1px solid var(--border-color);
      border-radius: 10px;
      padding: 12px 14px;
      font-size: 14px;
      font-family: inherit;
      color: var(--text-main);
      outline: none;
      transition: border-color 0.15s ease, background 0.15s ease;
    }

    .composer-input:focus,
    .composer-textarea:focus {
      border-color: var(--border-strong);
      background: var(--card-bg);
    }

    .composer-textarea {
      resize: vertical;
      min-height: 160px;
      line-height: 1.55;
    }

    /* Markdown Composer Toolbar & Preview System */
    .composer-toolbar-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 8px;
    }

    .markdown-toolbar {
      display: flex;
      align-items: center;
      gap: 3px;
      padding: 6px 10px;
      background: var(--input-bg);
      border: 1px solid var(--border-color);
      border-top: 1px solid var(--border-subtle);
      border-top-left-radius: 0;
      border-top-right-radius: 0;
      border-bottom-left-radius: 10px;
      border-bottom-right-radius: 10px;
      overflow-x: auto;
      scrollbar-width: thin;
      user-select: none;
      transition: border-color 0.15s ease;
    }

    .toolbar-group {
      display: flex;
      align-items: center;
      gap: 2px;
    }

    .toolbar-divider {
      width: 1px;
      height: 16px;
      background: var(--border-subtle);
      margin: 0 4px;
      flex-shrink: 0;
    }

    .md-tool-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 28px;
      height: 28px;
      padding: 0 6px;
      border-radius: 6px;
      border: 1px solid transparent;
      background: transparent;
      color: var(--text-muted);
      font-size: 12.5px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.12s ease, border-color 0.12s ease, color 0.12s ease;
      user-select: none;
      font-family: inherit;
    }

    .md-tool-btn:hover {
      background: var(--select-hover);
      color: var(--text-main);
    }

    .md-tool-btn.active,
    .md-tool-btn[aria-pressed="true"] {
      background: #27272a;
      color: #fafafa;
      border-color: rgba(255, 255, 255, 0.14);
    }

    [data-theme="light"] .md-tool-btn.active,
    body.light-mode .md-tool-btn.active,
    [data-theme="light"] .md-tool-btn[aria-pressed="true"],
    body.light-mode .md-tool-btn[aria-pressed="true"] {
      background: #e4e4e7;
      color: #18181b;
      border-color: rgba(0, 0, 0, 0.12);
    }

    .md-tool-btn svg {
      display: block;
    }

    .composer-editor-wrap {
      position: relative;
    }

    .composer-wysiwyg-editor {
      min-height: 180px;
      max-height: 480px;
      overflow-y: auto;
      padding: 14px 16px;
      background: var(--input-bg);
      border: 1px solid var(--border-color);
      border-bottom: none;
      border-top-left-radius: 10px;
      border-top-right-radius: 10px;
      border-bottom-left-radius: 0;
      border-bottom-right-radius: 0;
      line-height: 1.6;
      box-sizing: border-box;
      outline: none;
      font-family: inherit;
      font-size: 14px;
      color: var(--text-main);
      transition: border-color 0.15s ease;
      word-break: break-word;
    }

    .composer-wysiwyg-editor:focus {
      border-color: var(--border-hover);
    }

    .form-group:focus-within .composer-wysiwyg-editor,
    .form-group:focus-within .markdown-toolbar {
      border-color: var(--border-hover);
    }

    .composer-wysiwyg-editor:empty:before,
    .composer-wysiwyg-editor[data-empty="true"]:before {
      content: attr(data-placeholder);
      color: var(--text-muted);
      pointer-events: none;
      display: block;
    }

    .composer-wysiwyg-editor p {
      margin: 0 0 6px 0;
      line-height: 1.5;
    }

    .composer-wysiwyg-editor p:last-child {
      margin-bottom: 0;
    }

    .composer-wysiwyg-editor h1,
    .composer-wysiwyg-editor h2,
    .composer-wysiwyg-editor h3 {
      margin-top: 0.6em;
      margin-bottom: 0.4em;
      line-height: 1.3;
    }

    .composer-wysiwyg-editor blockquote {
      border-left: 3px solid var(--border-color);
      padding-left: 12px;
      margin: 0.6em 0;
      color: var(--text-muted);
      font-style: italic;
    }

    .composer-wysiwyg-editor pre {
      background: rgba(0, 0, 0, 0.25);
      border: 1px solid var(--border-color);
      border-radius: 6px;
      padding: 10px 12px;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: 13px;
      margin: 0.6em 0;
      overflow-x: auto;
    }

    .composer-wysiwyg-editor code {
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: 12.5px;
      background: rgba(125, 125, 125, 0.15);
      padding: 2px 5px;
      border-radius: 4px;
    }

    .composer-wysiwyg-editor pre code {
      background: transparent;
      padding: 0;
    }

    .composer-wysiwyg-editor ul,
    .composer-wysiwyg-editor ol {
      padding-left: 24px;
      margin: 0.5em 0;
    }

    .composer-wysiwyg-editor .md-table-wrapper {
      width: 100%;
      overflow-x: auto;
      margin: 12px 0;
      border-radius: 8px;
      border: 1px solid var(--border-color);
      -webkit-overflow-scrolling: touch;
    }

    .composer-wysiwyg-editor table.md-table {
      width: 100%;
      border-collapse: collapse;
      text-align: left;
      font-size: 13.5px;
      line-height: 1.5;
      background: var(--card-bg);
    }

    .composer-wysiwyg-editor table.md-table th,
    .composer-wysiwyg-editor table.md-table td {
      padding: 8px 12px;
      border: 1px solid var(--border-color);
      vertical-align: top;
      min-width: 60px;
    }

    .composer-wysiwyg-editor table.md-table th {
      background: var(--select-hover);
      font-weight: 600;
      color: var(--text-main);
    }

    .composer-wysiwyg-editor table.md-table tbody tr:hover {
      background: var(--select-hover);
    }

    /* Modern Email Dispatch Layout */
    .email-dispatch-header {
      background: var(--input-bg);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      margin-bottom: 20px;
      position: relative;
      overflow: visible;
      transition: border-color 0.15s ease;
    }

    .email-dispatch-header:focus-within {
      border-color: var(--border-strong);
    }

    .email-header-row {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 10px 16px;
      border-bottom: 1px solid var(--border-subtle);
      min-height: 46px;
      box-sizing: border-box;
      position: relative;
    }

    .email-header-row:first-child {
      border-top-left-radius: 12px;
      border-top-right-radius: 12px;
    }

    .email-header-row:last-child {
      border-bottom: none;
      border-bottom-left-radius: 12px;
      border-bottom-right-radius: 12px;
    }

    .email-row-label {
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.6px;
      color: var(--text-muted);
      min-width: 50px;
      flex-shrink: 0;
      user-select: none;
      text-transform: uppercase;
    }

    .email-row-content {
      flex: 1;
      display: flex;
      align-items: center;
      min-width: 0;
      position: relative;
    }

    .email-sender-chip {
      display: inline-flex;
      align-items: center;
      gap: 9px;
    }

    .email-sender-chip .author-avatar {
      width: 24px;
      height: 24px;
      font-size: 11px;
      border-radius: 50%;
      background: var(--select-hover);
      border: 1px solid var(--border-color);
      color: var(--text-main);
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      flex-shrink: 0;
    }

    .email-author-name {
      font-size: 13.5px;
      font-weight: 600;
      color: var(--text-main);
    }

    .email-title-input,
    input#postTitle,
    [data-theme="dark"] input#postTitle:not(#unmatched),
    body.dark-mode input#postTitle:not(#unmatched) {
      width: 100% !important;
      border: none !important;
      border-width: 0 !important;
      background: transparent !important;
      background-color: transparent !important;
      padding: 6px 0 !important;
      font-size: 14.5px !important;
      font-weight: 500 !important;
      color: var(--text-main) !important;
      font-family: inherit !important;
      outline: none !important;
      box-shadow: none !important;
      border-radius: 0 !important;
    }

    .email-title-input:focus,
    input#postTitle:focus,
    [data-theme="dark"] input#postTitle:focus,
    body.dark-mode input#postTitle:focus {
      border: none !important;
      outline: none !important;
      box-shadow: none !important;
    }

    .email-title-input::placeholder,
    input#postTitle::placeholder {
      font-weight: 400;
      color: var(--text-muted) !important;
    }

    .email-to-trigger {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      padding: 4px 10px;
      border-radius: 6px;
      font-size: 12.5px;
      font-weight: 500;
      background: rgba(255, 255, 255, 0.04) !important;
      border: 1px solid var(--border-color) !important;
      color: var(--text-main) !important;
      cursor: pointer;
      width: auto !important;
      max-width: fit-content;
      transition: all 0.12s ease;
    }

    [data-theme="light"] .email-to-trigger,
    body.light-mode .email-to-trigger {
      background: rgba(0, 0, 0, 0.03) !important;
    }

    .email-to-trigger:hover {
      background: var(--select-hover) !important;
      border-color: var(--border-strong) !important;
    }

    .email-body-label {
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.6px;
      color: var(--text-muted);
      text-transform: uppercase;
      margin-bottom: 7px;
    }

    /* Metadata Controls Grid */
    .meta-controls-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(210px, 1fr));
      gap: 14px;
      margin-bottom: 20px;
    }

    .dropdown-container {
      position: relative;
      width: 100%;
    }

    .dropdown-trigger {
      width: 100%;
      box-sizing: border-box;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      background: var(--input-bg);
      border: 1px solid var(--border-color);
      border-radius: 9px;
      padding: 9px 13px;
      font-size: 13.5px;
      font-weight: 500;
      color: var(--text-main);
      cursor: pointer;
      font-family: inherit;
      text-align: left;
      transition: border-color 0.15s ease;
    }

    .dropdown-trigger:hover {
      border-color: var(--border-strong);
    }

    .dropdown-menu {
      position: absolute;
      top: calc(100% + 5px);
      left: 0;
      width: 100%;
      min-width: 230px;
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 10px;
      box-shadow: 0 12px 32px rgba(0, 0, 0, 0.35);
      z-index: 1000;
      padding: 6px;
      box-sizing: border-box;
      overflow: hidden;
    }

    .dropdown-option {
      width: 100%;
      box-sizing: border-box;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 8px 11px;
      border-radius: 6px;
      background: transparent;
      border: 1px solid transparent;
      font-size: 13.5px;
      font-weight: 500;
      color: var(--text-main);
      cursor: pointer;
      font-family: inherit;
      text-align: left;
      transition: background 0.12s ease;
    }

    .dropdown-option:hover {
      background: var(--select-hover);
    }

    .dropdown-option.selected {
      background: #27272a;
      color: #ffffff;
      border-color: rgba(255, 255, 255, 0.12);
    }

    [data-theme="light"] .dropdown-option.selected {
      background: #e4e4e7;
      color: #18181b;
      border-color: rgba(0, 0, 0, 0.1);
    }

    .dropdown-option .opt-check {
      display: none;
    }

    .dropdown-option.selected .opt-check {
      display: block;
    }

    /* Semester Multi-select Menu */
    #semesterMenu {
      width: auto;
      min-width: 260px;
      max-width: 340px;
    }

    .semester-options-list {
      display: flex;
      flex-direction: column;
      gap: 2px;
      max-height: 240px;
      overflow-y: auto;
      padding: 4px 0;
    }

    .semester-check-label {
      display: flex;
      align-items: center;
      gap: 9px;
      padding: 7px 10px;
      border-radius: 6px;
      font-size: 13px;
      color: var(--text-main);
      cursor: pointer;
      user-select: none;
      transition: background 0.12s ease;
    }

    .semester-check-label:hover {
      background: var(--select-hover);
    }

    .semester-check-label input {
      accent-color: #71717a;
      cursor: pointer;
    }

    .semester-menu-footer {
      padding-top: 8px;
      margin-top: 6px;
      border-top: 1px solid var(--border-subtle);
    }

    .semester-apply-btn {
      width: 100%;
      padding: 8px 0;
      border-radius: 6px;
      background: #27272a;
      color: #f4f4f5;
      border: 1px solid rgba(255, 255, 255, 0.1);
      font-size: 12.5px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.15s ease, color 0.15s ease;
    }

    .semester-apply-btn:hover {
      background: #3f3f46;
      color: #ffffff;
    }

    [data-theme="light"] .semester-apply-btn,
    body.light-mode .semester-apply-btn {
      background: #18181b;
      color: #ffffff;
      border: 1px solid #18181b;
    }

    [data-theme="light"] .semester-apply-btn:hover,
    body.light-mode .semester-apply-btn:hover {
      background: #000000;
    }

    /* Attachments Preview */
    .attachments-toolbar {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 14px 0;
      border-top: 1px solid var(--border-subtle);
      border-bottom: 1px solid var(--border-subtle);
      margin-bottom: 20px;
      flex-wrap: wrap;
    }

    .tool-btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 8px 14px;
      border-radius: 8px;
      background: var(--input-bg);
      border: 1px solid var(--border-color);
      color: var(--text-muted);
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      font-family: inherit;
      transition: all 0.15s ease;
    }

    .tool-btn:hover {
      background: var(--select-hover);
      border-color: var(--border-strong);
      color: var(--text-main);
    }

    /* Thumbnails Container */
    .preview-section {
      margin-bottom: 16px;
    }

    .preview-header-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 8px;
      font-size: 12px;
      color: var(--text-muted);
    }

    .clear-btn {
      background: transparent;
      border: none;
      color: var(--text-faint);
      font-size: 12px;
      cursor: pointer;
      text-decoration: underline;
    }

    .thumbnails-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(100px, 1fr));
      gap: 10px;
    }

    .thumbnail-card {
      position: relative;
      aspect-ratio: 1;
      border-radius: 8px;
      overflow: hidden;
      border: 1px solid var(--border-color);
      background: var(--input-bg);
    }

    .thumbnail-card img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .remove-thumb-btn {
      position: absolute;
      top: 4px;
      right: 4px;
      width: 22px;
      height: 22px;
      border-radius: 50%;
      background: rgba(0, 0, 0, 0.7);
      color: #ffffff;
      border: none;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }

    .files-list {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .file-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 8px 12px;
      border-radius: 8px;
      background: var(--input-bg);
      border: 1px solid var(--border-color);
      font-size: 13px;
    }

    .file-info {
      display: flex;
      align-items: center;
      gap: 8px;
      overflow: hidden;
    }

    .file-name {
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 320px;
    }

    /* Actions Bottom Bar */
    .composer-actions-bar {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 12px;
      margin-top: 24px;
    }

    .cancel-btn {
      padding: 9px 18px;
      border-radius: 8px;
      background: transparent;
      border: 1px solid var(--border-color);
      color: var(--text-muted);
      font-size: 13.5px;
      font-weight: 500;
      cursor: pointer;
      text-decoration: none;
      transition: all 0.15s ease;
    }

    .cancel-btn:hover {
      background: var(--select-hover);
      color: var(--text-main);
      border-color: var(--border-strong);
    }

    .submit-post-btn {
      padding: 9px 22px;
      border-radius: 8px;
      background: #f4f4f5;
      color: #09090b;
      border: 1px solid transparent;
      font-size: 13.5px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.15s ease;
    }

    .submit-post-btn:hover:not(:disabled) {
      background: #ffffff;
    }

    [data-theme="light"] .submit-post-btn,
    body.light-mode .submit-post-btn {
      background: #18181b;
      color: #ffffff;
    }

    [data-theme="light"] .submit-post-btn:hover:not(:disabled),
    body.light-mode .submit-post-btn:hover:not(:disabled) {
      background: #000000;
    }

    .submit-post-btn:disabled {
      opacity: 0.45;
      cursor: not-allowed;
    }

    .feedback-message {
      margin-top: 14px;
      font-size: 13.5px;
      color: #ef4444;
      text-align: right;
    }
  </style>
</head>

<body>
  <!-- Header -->
  <header class="create-page-header">
    <div class="header-inner">
      <div class="header-left">
        <a href="/dashboard.html" class="back-link" title="Return to feed">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="19" y1="12" x2="5" y2="12"></line>
            <polyline points="12 19 5 12 12 5"></polyline>
          </svg>
          <span>Feed</span>
        </a>
        <span class="header-brand">Semester Library</span>
      </div>
      <div class="header-actions">
        <button type="button" class="theme-toggle-btn" id="themeToggleBtn" aria-label="Toggle theme" title="Toggle theme">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="5"></circle>
            <line x1="12" y1="1" x2="12" y2="3"></line>
            <line x1="12" y1="21" x2="12" y2="23"></line>
          </svg>
        </button>
      </div>
    </div>
  </header>

  <!-- Main Content -->
  <main class="create-page-main">
    <div class="composer-card">
      <div class="composer-header">
        <h1 class="composer-title">Create Post</h1>
        <p class="composer-subtitle">Share an update, notes, or announcement with your semester</p>
      </div>

      <!-- Author Strip -->
      <div class="author-strip" id="authorStrip">
        <div class="author-avatar" id="authorAvatar">·</div>
        <div class="author-details">
          <span class="author-name" id="authorName">Student</span>
          <span class="author-role-badge" id="authorRole">STUDENT</span>
        </div>
      </div>

      <form id="standalonePostForm">
        <!-- Metadata Controls: Category and Audience -->
        <div class="meta-controls-grid">
          <!-- Category Selector -->
          <div class="dropdown-container" id="categoryContainer">
            <label class="form-label">Category</label>
            <button type="button" class="dropdown-trigger" id="categoryBtn" aria-haspopup="listbox" aria-expanded="false">
              <span id="categoryValue">General</span>
              <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                <polyline points="6 9 12 15 18 9"></polyline>
              </svg>
            </button>
            <div class="dropdown-menu" id="categoryMenu" role="listbox" hidden>
              <button type="button" role="option" class="dropdown-option selected" data-value="general">

              </button>
              <button type="button" role="option" class="dropdown-option" data-value="notice" id="optNotice">
                <span>Notice</span>
                <svg class="opt-check" viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="20 6 9 17 4 12"></polyline></svg>
              </button>
              <button type="button" role="option" class="dropdown-option" data-value="announcement">
                <span>Announcement</span>
                <svg class="opt-check" viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="20 6 9 17 4 12"></polyline></svg>
              </button>
              <button type="button" role="option" class="dropdown-option" data-value="news">
                <span>News</span>
                <svg class="opt-check" viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="20 6 9 17 4 12"></polyline></svg>
              </button>
              <button type="button" role="option" class="dropdown-option" data-value="complaints">
                <span>Complaints</span>
                <svg class="opt-check" viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="20 6 9 17 4 12"></polyline></svg>
              </button>
              <button type="button" role="option" class="dropdown-option" data-value="feedback">

          <!-- Target Semester Selector (Active for General mode) -->

          <!-- Audience Selector (Students / CRs only) -->

            <label class="form-label">Audience</label>
            <button type="button" class="dropdown-trigger" id="audienceBtn" aria-haspopup="listbox" aria-expanded="false">
              <span id="audienceValue">Everyone</span>

                <polyline points="6 9 12 15 18 9"></polyline>
              </svg>
            </button>
            <div class="dropdown-menu" id="audienceMenu" role="listbox" hidden>
              <button type="button" role="option" class="dropdown-option selected" data-value="everyone">

                <svg class="opt-check" viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="20 6 9 17 4 12"></polyline></svg>
              </button>
            </div>
            <p id="audienceHelperText" style="display: none; font-size: 11px; color: var(--text-muted); margin: 4px 0 0 0; line-height: 1.35;">Students Only &mdash; This post won't appear in teacher or university staff feeds.</p>
          </div>

        <!-- Modern Email Dispatch Theme (Active for non-General posts) -->
        <div class="email-dispatch-header" id="emailDispatchHeader" style="display: none;">
          <!-- FROM ROW -->
          <div class="email-header-row email-from-row">

            </div>

          <!-- TITLE ROW -->
          <div class="email-header-row email-title-row" id="titleGroup">
            <span class="email-row-label">TITLE :</span>

              <input type="text" id="postTitle" name="title" maxlength="200" placeholder="Subject / Title of your post" class="email-title-input">

        <!-- Content / Body Field with Direct WYSIWYG Formatting Toolbar -->

          <div class="composer-editor-wrap">

              <button type="button" class="md-tool-btn" data-format="italic" title="Italic (Ctrl+I)" aria-label="Italic"><i>I</i></button>

              <button type="button" class="md-tool-btn" data-format="h2" title="Heading 2" aria-label="Heading 2">H2</button>

              <button type="button" class="md-tool-btn" data-format="bullet-list" title="Bullet list" aria-label="Bullet list">
                <svg viewBox="0 0 24 24" width="14" height="14" fill="currentColor"><path d="M4 6h2v2H4zm0 5h2v2H4zm0 5h2v2H4zm5-9h11v2H9zm0 5h11v2H9zm0 5h11v2H9z"/></svg>
              </button>
              <button type="button" class="md-tool-btn" data-format="number-list" title="Numbered list" aria-label="Numbered list">
                <svg viewBox="0 0 24 24" width="14" height="14" fill="currentColor"><path d="M3 5h2v4H4V6H3zm0 6h2v1h-1v1h1v1H3zm0 5h2v3H3zm6-10h11v2H9zm0 5h11v2H9zm0 5h11v2H9z"/></svg>

              <button type="button" class="md-tool-btn" data-format="quote" title="Quote" aria-label="Quote">

              <button type="button" class="md-tool-btn" data-format="table" title="Table" aria-label="Table">

  </main>

  <script>
    // Theme toggle
    const themeToggleBtn = document.getElementById('themeToggleBtn');
    if (themeToggleBtn) {
      themeToggleBtn.addEventListener('click', () => {
        const currentTheme = document.documentElement.getAttribute('data-theme') || 'dark';
        const newTheme = currentTheme === 'dark' ? 'light' : 'dark';
        document.documentElement.setAttribute('data-theme', newTheme);
        if (newTheme === 'dark') {
          document.documentElement.classList.add('dark');
          document.body.classList.add('dark-mode');
        } else {
          document.documentElement.classList.remove('dark');
          document.body.classList.remove('dark-mode');
        }
        try { localStorage.setItem('theme', newTheme); } catch (_) {}
      });
    }

    // State
    let selectedCategory = 'general';
    let selectedAudience = 'everyone';
    let isAllSemesters = true;
    let selectedSemesters = [];
    let composerImages = [];
    let composerFiles = [];
    let canPostNotice = false;
    let canSelectAudience = false;

    // Load User and Meta Info
    Promise.all([
      fetch('/api/me').then(r => r.ok ? r.json() : null),
      fetch('/api/posts/meta').then(r => r.ok ? r.json() : null)
    ]).then(([userData, metaData]) => {
      if (userData) {
        const nameEl = document.getElementById('authorName');
        const roleEl = document.getElementById('authorRole');
        const avatarEl = document.getElementById('authorAvatar');
        const emailNameEl = document.getElementById('emailAuthorName');
        const emailRoleEl = document.getElementById('emailAuthorRole');
        const emailAvatarEl = document.getElementById('emailAuthorAvatar');

        const userName = userData.name || 'Student';
        const userRole = (userData.role || 'STUDENT').toUpperCase();
        const userInitial = (userData.name || 'S').charAt(0).toUpperCase();

        if (nameEl) nameEl.textContent = userName;
        if (roleEl) roleEl.textContent = userRole;
        if (avatarEl) avatarEl.textContent = userInitial;
        if (emailNameEl) emailNameEl.textContent = userName;
        if (emailRoleEl) emailRoleEl.textContent = userRole;
        if (emailAvatarEl) emailAvatarEl.textContent = userInitial;
      }

      if (metaData) {
        canPostNotice = Boolean(metaData.canPostNotice);
        canSelectAudience = Boolean(metaData.canSelectAudience);
      } else if (userData) {
        const role = (userData.role || 'student').toLowerCase();
        canPostNotice = ['admin', 'superadmin', 'teacher', 'faculty'].includes(role);
        canSelectAudience = ['student', 'cr'].includes(role) || userData.isCR;
      }

      // Hide Notice if not authorized
      const optNotice = document.getElementById('optNotice');
      if (optNotice && !canPostNotice) {
        optNotice.style.display = 'none';
      }

      // Show audience selector if authorized
      const audienceContainer = document.getElementById('audienceContainer');
      if (audienceContainer) {
        audienceContainer.style.display = canSelectAudience ? 'block' : 'none';
      }
    }).catch(() => {});

    // Category dropdown controls
    const categoryBtn = document.getElementById('categoryBtn');
    const categoryMenu = document.getElementById('categoryMenu');
    const categoryValue = document.getElementById('categoryValue');
    const titleGroup = document.getElementById('titleGroup');
    const categoryOptions = document.querySelectorAll('#categoryMenu .dropdown-option');

    function toggleCategoryMenu(forceOpen) {
      if (!categoryMenu) return;
      const willOpen = forceOpen !== undefined ? forceOpen : categoryMenu.hidden;
      categoryMenu.hidden = !willOpen;
      categoryBtn.setAttribute('aria-expanded', String(willOpen));

    // Close dropdowns on outside click
    document.addEventListener('click', (e) => {

    // Direct WYSIWYG Post Editor
    const postEditor = document.getElementById('postEditor');
    const postContent = document.getElementById('postContent');
    const charCounter = document.getElementById('charCounter');
    const markdownToolbar = document.getElementById('markdownToolbar');

    function cleanZeroWidthSpaces() {
      if (!postEditor) return;
      const walker = document.createTreeWalker(postEditor, NodeFilter.SHOW_TEXT, null);
      let node;
      while ((node = walker.nextNode())) {
        if (node.nodeValue && node.nodeValue.length > 1 && node.nodeValue.includes('\u200B')) {
          node.nodeValue = node.nodeValue.replace(/\u200B/g, '');
        }
      }
    }

    function syncEditorToMarkdown() {
      if (!postEditor) return '';
      cleanZeroWidthSpaces();
      const html = postEditor.innerHTML;
      const md = (typeof htmlToMarkdown === 'function')
        ? htmlToMarkdown(html).trim()
        : (postEditor.innerText || '').trim();
      if (postContent) postContent.value = md;
      return md;
    }

    function updateCharCounter() {
      if (!postEditor) return;
      const md = syncEditorToMarkdown();
      const plainLen = (postEditor.innerText || '').replace(/[\r\n\u200B]/g, '').trim().length;
      if (charCounter) {
        charCounter.textContent = `${plainLen.toLocaleString()} / 1,000,000`;
        if (plainLen > 1000000) {
          charCounter.style.color = '#ef4444';
        } else {
          charCounter.style.color = 'var(--text-muted)';
        }
      }

      // Check placeholder visibility
      const hasRealContent = !!(postEditor.innerText || '').replace(/[\r\n\u200B]/g, '').trim();
      if (!hasRealContent) {
        postEditor.setAttribute('data-empty', 'true');
      } else {
        postEditor.removeAttribute('data-empty');
      }
    }

    function setBtnActive(format, active) {
      const btn = document.querySelector(`.md-tool-btn[data-format="${format}"]`);
      if (!btn) return;
      if (active) {
        btn.classList.add('active');
        btn.setAttribute('aria-pressed', 'true');
      } else {
        btn.classList.remove('active');
        btn.setAttribute('aria-pressed', 'false');
      }
    }

    function findClosestElement(node, tagNames) {
      if (!node) return null;
      let cur = node.nodeType === Node.ELEMENT_NODE ? node : node.parentElement;
      const lowerTags = tagNames.map(t => t.toLowerCase());
      while (cur && cur !== postEditor) {
        if (lowerTags.includes(cur.tagName.toLowerCase())) {
          return cur;
        }
        cur = cur.parentElement;
      }
      return null;
    }

    function getCurrentBlock(node) {
      if (!node) return null;
      const blockTags = ['p', 'h1', 'h2', 'h3', 'blockquote', 'pre', 'ul', 'ol', 'li', 'div'];

      // First check if already inside a block element
      let cur = node.nodeType === Node.ELEMENT_NODE ? node : node.parentElement;
      while (cur && cur !== postEditor) {
        if (blockTags.includes(cur.tagName.toLowerCase())) {
          return cur;
        }
        cur = cur.parentElement;
      }

      // If not, find the direct child of postEditor
      let topChild = node;
      while (topChild && topChild.parentNode && topChild.parentNode !== postEditor) {
        topChild = topChild.parentNode;
      }

      if (topChild && topChild.parentNode === postEditor) {
        if (topChild.nodeType === Node.TEXT_NODE || !blockTags.includes(topChild.tagName.toLowerCase())) {
          const p = document.createElement('p');
          postEditor.insertBefore(p, topChild);
          p.appendChild(topChild);
          return p;
        }
        return topChild;
      }

      return null;
    }

    function isBlockEmpty(block) {
      if (!block) return true;
      const text = (block.textContent || '').replace(/[\u200B\r\n]/g, '').trim();
      return text.length === 0;
    }

    function setCursorAtStart(el, sel) {
      el.focus();
      const range = document.createRange();
      if (el.firstChild) {
        range.setStart(el.firstChild, 0);
      } else {
        range.setStart(el, 0);
      }
      range.collapse(true);
      sel.removeAllRanges();
      sel.addRange(range);
    }

    function setCursorAtEnd(el, sel) {
      el.focus();
      const range = document.createRange();
      range.selectNodeContents(el);
      range.collapse(false);
      sel.removeAllRanges();
      sel.addRange(range);
    }

    function updateToolbarActiveState() {
      if (!postEditor) return;
      const sel = window.getSelection();
      if (!sel || sel.rangeCount === 0 || !postEditor.contains(sel.anchorNode)) {
        return;
      }

      try {
        const anchor = sel.anchorNode;
        const curBlock = getCurrentBlock(anchor);
        const blockTag = curBlock ? curBlock.tagName.toLowerCase() : '';

        // Bold
        const isBold = document.queryCommandState('bold') || !!findClosestElement(anchor, ['b', 'strong']);
        setBtnActive('bold', isBold);

        // Italic
        const isItalic = document.queryCommandState('italic') || !!findClosestElement(anchor, ['i', 'em']);
        setBtnActive('italic', isItalic);

        // Underline
        const isUnderline = document.queryCommandState('underline') || !!findClosestElement(anchor, ['u']);
        setBtnActive('underline', isUnderline);

        // Strikethrough
        const isStrike = document.queryCommandState('strikeThrough') || !!findClosestElement(anchor, ['s', 'del', 'strike']);
        setBtnActive('strike', isStrike);

        // Lists
        const isUl = blockTag === 'ul' || (curBlock && curBlock.closest('ul') !== null);
        const isOl = blockTag === 'ol' || (curBlock && curBlock.closest('ol') !== null);
        setBtnActive('bullet-list', isUl);
        setBtnActive('number-list', isOl);

        // Headings & Quote
        setBtnActive('h1', blockTag === 'h1');
        setBtnActive('h2', blockTag === 'h2');
        setBtnActive('h3', blockTag === 'h3');
        setBtnActive('quote', blockTag === 'blockquote');

        // Code
        const isCode = !!findClosestElement(anchor, ['code']) && blockTag !== 'pre';
        const isCodeBlock = blockTag === 'pre' || (curBlock && curBlock.closest('pre') !== null);
        setBtnActive('code-inline', isCode);
        setBtnActive('code-block', isCodeBlock);
      } catch (_) {}
    }

    function ensureEditorFocus() {
      if (!postEditor) return;
      if (!postEditor.innerHTML.trim() || postEditor.innerHTML === '<br>') {
        postEditor.innerHTML = '<p><br></p>';
      }
      postEditor.focus();
      const sel = window.getSelection();
      if (!sel || sel.rangeCount === 0 || !postEditor.contains(sel.anchorNode)) {
        const range = document.createRange();
        range.selectNodeContents(postEditor.lastElementChild || postEditor);
        range.collapse(false);
        sel.removeAllRanges();
        sel.addRange(range);
      }
    }

    function escapeInlineTag(tagName, range, sel) {
      const tags = [tagName, tagName === 'b' ? 'strong' : '', tagName === 'i' ? 'em' : ''].filter(Boolean);
      const el = findClosestElement(range.startContainer, tags);
      if (el) {
        const zws = document.createTextNode('\u200B');
        if (el.nextSibling) {
          el.parentNode.insertBefore(zws, el.nextSibling);
        } else {
          el.parentNode.appendChild(zws);
        }
        const newRange = document.createRange();
        newRange.setStart(zws, 1);
        newRange.collapse(true);
        sel.removeAllRanges();
        sel.addRange(newRange);
      }
    }

    function toggleInlineFormat(cmd, tagName) {
      ensureEditorFocus();
      const sel = window.getSelection();
      if (!sel || sel.rangeCount === 0) return;
      const range = sel.getRangeAt(0);

      // Selected text: format or unformat selected characters only
      if (!sel.isCollapsed && range.toString().length > 0) {
        if (cmd) {
          document.execCommand(cmd, false, null);
        } else if (tagName === 'code') {
          const parentCode = findClosestElement(range.commonAncestorContainer, ['code']);
          if (parentCode) {
            const text = parentCode.textContent || '';
            parentCode.replaceWith(document.createTextNode(text));
          } else {
            const codeEl = document.createElement('code');
            codeEl.appendChild(range.extractContents());
            range.insertNode(codeEl);
            sel.selectAllChildren(codeEl);
          }
        }
        updateToolbarActiveState();
        updateCharCounter();
        return;
      }

      // Collapsed cursor: format for UPCOMING text without altering written text
      if (cmd) {
        document.execCommand(cmd, false, null);
      } else if (tagName === 'code') {
        const parentCode = findClosestElement(range.startContainer, ['code']);
        if (parentCode) {
          const zws = document.createTextNode('\u200B');
          if (parentCode.nextSibling) {
            parentCode.parentNode.insertBefore(zws, parentCode.nextSibling);
          } else {
            parentCode.parentNode.appendChild(zws);
          }
          const newRange = document.createRange();
          newRange.setStart(zws, 1);
          newRange.collapse(true);
          sel.removeAllRanges();
          sel.addRange(newRange);
        } else {
          const codeEl = document.createElement('code');
          const zws = document.createTextNode('\u200B');
          codeEl.appendChild(zws);
          range.insertNode(codeEl);
          const newRange = document.createRange();
          newRange.setStart(zws, 1);
          newRange.collapse(true);
          sel.removeAllRanges();
          sel.addRange(newRange);
        }
      }

      updateToolbarActiveState();
      updateCharCounter();
    }

    function applyBlockFormat(tagName) {
      ensureEditorFocus();
      const sel = window.getSelection();
      if (!sel || sel.rangeCount === 0) return;
      const range = sel.getRangeAt(0);

      // Selected text: convert selection block to tagName
      if (!sel.isCollapsed && range.toString().trim().length > 0) {
        const curBlock = getCurrentBlock(range.commonAncestorContainer);
        if (curBlock && curBlock.tagName.toLowerCase() === tagName.toLowerCase()) {
          // Toggle off: back to <p>
          const p = document.createElement('p');
          p.innerHTML = curBlock.innerHTML;
          curBlock.parentNode.replaceChild(p, curBlock);
          sel.selectAllChildren(p);
        } else if (curBlock && curBlock !== postEditor) {
          const newBlock = document.createElement(tagName);
          newBlock.innerHTML = curBlock.innerHTML;
          curBlock.parentNode.replaceChild(newBlock, curBlock);
          sel.selectAllChildren(newBlock);
        } else {
          const newBlock = document.createElement(tagName);
          newBlock.appendChild(range.extractContents());
          range.insertNode(newBlock);
          sel.selectAllChildren(newBlock);
        }
        updateToolbarActiveState();
        updateCharCounter();
        return;
      }

      // Collapsed cursor: apply for UPCOMING text!
      const curBlock = getCurrentBlock(range.startContainer);

      // If already inside this heading/quote: toggle off to normal <p>
      if (curBlock && curBlock.tagName.toLowerCase() === tagName.toLowerCase()) {
        const p = document.createElement('p');
        p.innerHTML = curBlock.innerHTML || '<br>';
        curBlock.parentNode.replaceChild(p, curBlock);
        setCursorAtEnd(p, sel);
        updateToolbarActiveState();
        updateCharCounter();
        return;
      }

      // If current block is empty: convert this empty line to tagName
      if (isBlockEmpty(curBlock)) {
        const newBlock = document.createElement(tagName);
        newBlock.innerHTML = '<br>';
        if (curBlock && curBlock !== postEditor) {
          curBlock.parentNode.replaceChild(newBlock, curBlock);
        } else {
          postEditor.innerHTML = '';
          postEditor.appendChild(newBlock);
        }
        setCursorAtStart(newBlock, sel);
      } else {
        // Current block has written text: DO NOT CHANGE WRITTEN TEXT!
        // Start a fresh line of tagName for upcoming text!
        const newBlock = document.createElement(tagName);
        newBlock.innerHTML = '<br>';
        if (curBlock && curBlock.nextSibling) {
          curBlock.parentNode.insertBefore(newBlock, curBlock.nextSibling);
        } else if (curBlock) {
          curBlock.parentNode.appendChild(newBlock);
        } else {
          postEditor.appendChild(newBlock);
        }
        setCursorAtStart(newBlock, sel);
      }

      updateToolbarActiveState();
      updateCharCounter();
    }

    function applyListFormat(listType) {
      ensureEditorFocus();
      const sel = window.getSelection();
      if (!sel || sel.rangeCount === 0) return;
      const range = sel.getRangeAt(0);

      // If selection exists: convert via execCommand
      if (!sel.isCollapsed && range.toString().trim().length > 0) {
        document.execCommand(listType === 'ul' ? 'insertUnorderedList' : 'insertOrderedList', false, null);
        updateToolbarActiveState();
        updateCharCounter();
        return;
      }

      const curBlock = getCurrentBlock(range.startContainer);
      const curList = curBlock?.closest('ul, ol');

      // If already inside this list: toggle off list
      if (curList && curList.tagName.toLowerCase() === listType) {
        document.execCommand(listType === 'ul' ? 'insertUnorderedList' : 'insertOrderedList', false, null);
        updateToolbarActiveState();
        updateCharCounter();
        return;
      }

      // If current line has written text: do not alter it, start list on new line for upcoming text
      const listEl = document.createElement(listType);
      const li = document.createElement('li');
      li.innerHTML = '<br>';
      listEl.appendChild(li);

      if (isBlockEmpty(curBlock)) {
        if (curBlock && curBlock !== postEditor) {
          curBlock.parentNode.replaceChild(listEl, curBlock);
        } else {
          postEditor.innerHTML = '';
          postEditor.appendChild(listEl);
        }
      } else if (curBlock && curBlock !== postEditor) {
        if (curBlock.nextSibling) {
          curBlock.parentNode.insertBefore(listEl, curBlock.nextSibling);
        } else {
          curBlock.parentNode.appendChild(listEl);
        }
      } else {
        postEditor.appendChild(listEl);
      }

      setCursorAtStart(li, sel);
      updateToolbarActiveState();
      updateCharCounter();
    }

    function applyCodeBlock() {
      ensureEditorFocus();
      const sel = window.getSelection();
      if (!sel || sel.rangeCount === 0) return;
      const range = sel.getRangeAt(0);

      const pre = document.createElement('pre');
      pre.className = 'md-code-block';
      const code = document.createElement('code');

      if (!sel.isCollapsed && range.toString().trim().length > 0) {
        code.textContent = range.toString();
        pre.appendChild(code);
        range.deleteContents();
        range.insertNode(pre);
        setCursorAtEnd(code, sel);
      } else {
        code.innerHTML = '<br>';
        pre.appendChild(code);
        const curBlock = getCurrentBlock(range.startContainer);

        if (isBlockEmpty(curBlock)) {
          if (curBlock && curBlock !== postEditor) {
            curBlock.parentNode.replaceChild(pre, curBlock);
          } else {
            postEditor.innerHTML = '';
            postEditor.appendChild(pre);
          }
        } else if (curBlock && curBlock !== postEditor) {
          if (curBlock.nextSibling) {
            curBlock.parentNode.insertBefore(pre, curBlock.nextSibling);
          } else {
            curBlock.parentNode.appendChild(pre);
          }
        } else {
          postEditor.appendChild(pre);
        }

        // Add a normal paragraph below for easy exiting
        if (!pre.nextSibling) {
          const p = document.createElement('p');
          p.innerHTML = '<br>';
          pre.parentNode.appendChild(p);
        }
        setCursorAtStart(code, sel);
      }

      updateToolbarActiveState();
      updateCharCounter();
    }

    function applyFormat(format) {
      switch (format) {
        case 'bold':
          toggleInlineFormat('bold', 'b');
          break;
        case 'italic':
          toggleInlineFormat('italic', 'i');
          break;
        case 'underline':
          toggleInlineFormat('underline', 'u');
          break;
        case 'strike':
          toggleInlineFormat('strikeThrough', 's');
          break;
        case 'h1':
          applyBlockFormat('h1');
          break;
        case 'h2':
          applyBlockFormat('h2');
          break;
        case 'h3':
          applyBlockFormat('h3');
          break;
        case 'quote':
          applyBlockFormat('blockquote');
          break;
        case 'bullet-list':
          applyListFormat('ul');
          break;
        case 'number-list':
          applyListFormat('ol');
          break;
        case 'code-inline':
          toggleInlineFormat(null, 'code');
          break;
        case 'code-block':
          applyCodeBlock();
          break;
        case 'link': {
          ensureEditorFocus();
          const sel = window.getSelection();
          const selText = sel ? sel.toString().trim() : '';
          const url = prompt('Enter link URL (e.g. https://example.com):', 'https://');
          if (url && url !== 'https://' && !url.startsWith('javascript:')) {
            if (!selText) {
              const a = document.createElement('a');
              a.href = url;
              a.textContent = url;
              a.target = '_blank';
              a.rel = 'noopener noreferrer';
              if (sel && sel.rangeCount > 0) {
                const range = sel.getRangeAt(0);
                range.insertNode(a);
                const zws = document.createTextNode('\u200B');
                if (a.nextSibling) {
                  a.parentNode.insertBefore(zws, a.nextSibling);
                } else {
                  a.parentNode.appendChild(zws);
                }
                const newRange = document.createRange();
                newRange.setStart(zws, 1);
                newRange.collapse(true);
                sel.removeAllRanges();
                sel.addRange(newRange);
              }
            } else {
              document.execCommand('createLink', false, url);
            }
          }
          break;
        }
        case 'table': {
          ensureEditorFocus();
          const starterTableHtml = '<div class="md-table-wrapper"><table class="md-table"><thead><tr><th>Header 1</th><th>Header 2</th><th>Header 3</th></tr></thead><tbody><tr><td>Data 1</td><td>Data 2</td><td>Data 3</td></tr><tr><td>Data 4</td><td>Data 5</td><td>Data 6</td></tr></tbody></table></div><p><br></p>';
          document.execCommand('insertHTML', false, starterTableHtml);
          break;
        }
        case 'divider': {
          ensureEditorFocus();
          const sel = window.getSelection();
          if (sel && sel.rangeCount > 0) {
            const hr = document.createElement('hr');
            hr.className = 'md-divider';
            const p = document.createElement('p');
            p.innerHTML = '<br>';
            const range = sel.getRangeAt(0);
            range.insertNode(p);
            range.insertNode(hr);
            setCursorAtStart(p, sel);
          }
          break;
        }
      }

      updateToolbarActiveState();
      updateCharCounter();
    }

    // Attach mousedown with preventDefault so the editor never blurs or loses caret/selection
    document.querySelectorAll('.md-tool-btn').forEach(btn => {
      btn.addEventListener('mousedown', (e) => {
        e.preventDefault();
        const fmt = btn.getAttribute('data-format');
        if (fmt) applyFormat(fmt);
      });
      btn.addEventListener('click', (e) => {
        e.preventDefault();
      });
    });

    if (postEditor) {
      postEditor.addEventListener('input', () => {
        updateCharCounter();
        updateToolbarActiveState();
      });
      postEditor.addEventListener('keyup', updateToolbarActiveState);
      postEditor.addEventListener('mouseup', updateToolbarActiveState);

      // Handle Enter key for headings, blockquotes, and lists
      postEditor.addEventListener('keydown', (e) => {
        const isMod = e.ctrlKey || e.metaKey;
        if (isMod && (e.key === 'b' || e.key === 'B')) {
          e.preventDefault();
          toggleInlineFormat('bold', 'b');
          return;
        }
        if (isMod && (e.key === 'i' || e.key === 'I')) {
          e.preventDefault();
          toggleInlineFormat('italic', 'i');
          return;
        }
        if (isMod && (e.key === 'u' || e.key === 'U')) {
          e.preventDefault();
          toggleInlineFormat('underline', 'u');
          return;
        }
        if (isMod && (e.key === 'k' || e.key === 'K')) {
          e.preventDefault();
          applyFormat('link');
          return;
        }

        // Enter key handling: automatically resume normal paragraph on next line after heading
        if (e.key === 'Enter' && !e.shiftKey) {
          const sel = window.getSelection();
          if (!sel || sel.rangeCount === 0) return;
          const range = sel.getRangeAt(0);
          const node = range.startContainer;

          // Headings: Enter creates normal paragraph <p>
          const heading = findClosestElement(node, ['h1', 'h2', 'h3']);
          if (heading) {
            e.preventDefault();
            const p = document.createElement('p');
            p.innerHTML = '<br>';
            if (heading.nextSibling) {
              heading.parentNode.insertBefore(p, heading.nextSibling);
            } else {
              heading.parentNode.appendChild(p);
            }
            setCursorAtStart(p, sel);
            updateToolbarActiveState();
            updateCharCounter();
            return;
          }

          // Lists: Enter on empty item exits list into paragraph
          const li = findClosestElement(node, ['li']);
          if (li && isBlockEmpty(li)) {
            e.preventDefault();
            const list = li.closest('ul, ol');
            li.remove();
            const p = document.createElement('p');
            p.innerHTML = '<br>';
            if (list && list.nextSibling) {
              list.parentNode.insertBefore(p, list.nextSibling);
            } else if (list) {
              list.parentNode.appendChild(p);
            } else {
              postEditor.appendChild(p);
            }
            if (list && list.children.length === 0) {
              list.remove();
            }
            setCursorAtStart(p, sel);
            updateToolbarActiveState();
            updateCharCounter();
            return;
          }

          // Blockquote: Enter on empty line exits blockquote
          const quote = findClosestElement(node, ['blockquote']);
          if (quote && isBlockEmpty(quote)) {
            e.preventDefault();
            const p = document.createElement('p');
            p.innerHTML = '<br>';
            quote.parentNode.replaceChild(p, quote);
            setCursorAtStart(p, sel);
            updateToolbarActiveState();
            updateCharCounter();
            return;
          }
        }
      });

      // Selection tracking for active states
      document.addEventListener('selectionchange', () => {
        const sel = window.getSelection();
        if (sel && postEditor.contains(sel.anchorNode)) {
          updateToolbarActiveState();
        }
      });

      function normalizeEditorTables() {
        if (!postEditor) return;
        const tables = postEditor.querySelectorAll('table');
        tables.forEach(table => {
          if (!table.classList.contains('md-table')) {
            table.classList.add('md-table');
          }
          const parent = table.parentElement;
          if (!parent || !parent.classList.contains('md-table-wrapper')) {
            const wrapper = document.createElement('div');
            wrapper.className = 'md-table-wrapper';
            table.parentNode.insertBefore(wrapper, table);
            wrapper.appendChild(table);
          }
        });
      }

      function hasMarkdownTable(str) {
        if (!str || !str.includes('|')) return false;
        const lines = str.replace(/\r\n/g, '\n').replace(/\r/g, '\n').split('\n');
        for (let i = 0; i < lines.length - 1; i++) {
          const line = lines[i].trim();
          const nextLine = lines[i + 1].trim();
          if (line.includes('|') && isMarkdownDelimiter(nextLine)) {
            return true;
          }
        }
        return false;
      }

      function isMarkdownDelimiter(str) {
        if (!str || !str.includes('|')) return false;
        const cells = str.trim().replace(/^\||\|$/g, '').split('|');
        if (cells.length === 0) return false;
        return cells.every(c => /^\s*:?-{1,}:?\s*$/.test(c));
      }

      function isTsvTable(str) {
        if (!str || !str.includes('\t')) return false;
        const lines = str.replace(/\r\n/g, '\n').replace(/\r/g, '\n').split('\n').filter(l => l.trim());
        if (lines.length < 2) return false;
        const colCount = lines[0].split('\t').length;
        return colCount >= 2 && lines.slice(1).every(l => Math.abs(l.split('\t').length - colCount) <= 1);
      }

      function tsvToMarkdown(tsv) {
        const lines = tsv.replace(/\r\n/g, '\n').replace(/\r/g, '\n').split('\n').filter(l => l.trim());
        if (lines.length === 0) return '';
        const rows = lines.map(line => line.split('\t').map(c => c.trim()));
        const headerCols = rows[0].length;
        const mdLines = [];
        mdLines.push('| ' + rows[0].join(' | ') + ' |');
        mdLines.push('| ' + rows[0].map(() => '---').join(' | ') + ' |');
        for (let r = 1; r < rows.length; r++) {
          const row = rows[r];
          while (row.length < headerCols) row.push('');
          mdLines.push('| ' + row.slice(0, headerCols).join(' | ') + ' |');
        }
        return mdLines.join('\n');
      }

      // Smart Paste: Preserve rich HTML elements, format markdown/TSV tables, and strip clashing inline CSS
      postEditor.addEventListener('paste', (e) => {
        const clipboard = e.clipboardData || window.clipboardData;
        if (clipboard) {
          const plainText = clipboard.getData('text/plain') || '';
          let mdToRender = '';

          if (hasMarkdownTable(plainText)) {
            mdToRender = plainText;
          } else if (isTsvTable(plainText)) {
            mdToRender = tsvToMarkdown(plainText);
          }

          if (mdToRender && typeof window.renderPostMarkdown === 'function') {
            e.preventDefault();
            const renderedHtml = window.renderPostMarkdown(mdToRender);
            if (renderedHtml) {
              const insertHtml = renderedHtml + '<p><br></p>';
              document.execCommand('insertHTML', false, insertHtml);
              normalizeEditorTables();
              updateCharCounter();
              updateToolbarActiveState();
              return;
            }
          }
        }

        setTimeout(() => {
          normalizeEditorTables();
          postEditor.querySelectorAll('*:not(th):not(td)').forEach(el => {
            el.removeAttribute('style');
          });
          updateCharCounter();
          updateToolbarActiveState();
        }, 0);
      });

      updateCharCounter();
    }

    // Image Uploads
    const imageInput = document.getElementById('imageInput');
    const addImageBtn = document.getElementById('addImageBtn');
    const imagesPreviewSection = document.getElementById('imagesPreviewSection');
    const thumbnailsGrid = document.getElementById('thumbnailsGrid');
    const imagesCountLabel = document.getElementById('imagesCountLabel');
    const clearImagesBtn = document.getElementById('clearImagesBtn');

    if (addImageBtn && imageInput) {
      addImageBtn.addEventListener('click', () => imageInput.click());
      imageInput.addEventListener('change', () => {
        const files = Array.from(imageInput.files || []);
        for (const file of files) {
          if (composerImages.length >= 10) break;
          if (!file.type.startsWith('image/')) continue;
          if (file.size > 5 * 1024 * 1024) continue;
          composerImages.push(file);
        }
        imageInput.value = '';
        renderImagePreviews();
      });
    }

    function renderImagePreviews() {
      if (!thumbnailsGrid || !imagesPreviewSection) return;
      if (composerImages.length === 0) {
        imagesPreviewSection.style.display = 'none';
        thumbnailsGrid.innerHTML = '';
        return;
      }
      imagesPreviewSection.style.display = 'block';
      if (imagesCountLabel) imagesCountLabel.textContent = `Photos (${composerImages.length}/10)`;
      thumbnailsGrid.innerHTML = '';
      composerImages.forEach((file, index) => {
        const card = document.createElement('div');
        card.className = 'thumbnail-card';
        const img = document.createElement('img');
        img.src = URL.createObjectURL(file);
        const delBtn = document.createElement('button');
        delBtn.type = 'button';
        delBtn.className = 'remove-thumb-btn';
        delBtn.innerHTML = '&times;';
        delBtn.title = 'Remove image';
        delBtn.onclick = () => {
          composerImages.splice(index, 1);
          renderImagePreviews();
        };
        card.appendChild(img);
        card.appendChild(delBtn);
        thumbnailsGrid.appendChild(card);
      });
    }

    if (clearImagesBtn) {
      clearImagesBtn.addEventListener('click', () => {
        composerImages = [];
        renderImagePreviews();
      });
    }

    // Document File Uploads
    const fileInput = document.getElementById('fileInput');
    const addFileBtn = document.getElementById('addFileBtn');
    const filesPreviewSection = document.getElementById('filesPreviewSection');
    const filesList = document.getElementById('filesList');
    const filesCountLabel = document.getElementById('filesCountLabel');
    const clearFilesBtn = document.getElementById('clearFilesBtn');

    if (addFileBtn && fileInput) {
      addFileBtn.addEventListener('click', () => fileInput.click());
      fileInput.addEventListener('change', () => {
        const files = Array.from(fileInput.files || []);
        for (const file of files) {
          if (composerFiles.length >= 5) break;
          if (file.size > 4 * 1024 * 1024) continue;
          composerFiles.push(file);
        }
        fileInput.value = '';
        renderFilePreviews();
      });
    }

    function renderFilePreviews() {
      if (!filesList || !filesPreviewSection) return;
      if (composerFiles.length === 0) {
        filesPreviewSection.style.display = 'none';
        filesList.innerHTML = '';
        return;
      }
      filesPreviewSection.style.display = 'block';
      if (filesCountLabel) filesCountLabel.textContent = `Attached Documents (${composerFiles.length}/5)`;
      filesList.innerHTML = '';
      composerFiles.forEach((file, index) => {
        const item = document.createElement('div');
        item.className = 'file-item';
        const info = document.createElement('div');
        info.className = 'file-info';
        info.innerHTML = `<span class="file-name">${escapeHtml(file.name)}</span> <span style="font-size:11.5px; opacity:0.6;">(${formatBytes(file.size)})</span>`;
        const delBtn = document.createElement('button');
        delBtn.type = 'button';
        delBtn.style.background = 'transparent';
        delBtn.style.border = 'none';
        delBtn.style.color = 'var(--text-faint)';
        delBtn.style.cursor = 'pointer';
        delBtn.style.fontSize = '18px';
        delBtn.innerHTML = '&times;';
        delBtn.onclick = () => {
          composerFiles.splice(index, 1);
          renderFilePreviews();
        };
        item.appendChild(info);
        item.appendChild(delBtn);
        filesList.appendChild(item);
      });
    }

    if (clearFilesBtn) {
      clearFilesBtn.addEventListener('click', () => {
        composerFiles = [];
        renderFilePreviews();
      });
    }

    function formatBytes(bytes) {
      if (!bytes) return '0 B';
      const k = 1024;
      const dm = 1;
      const sizes = ['B', 'KB', 'MB', 'GB'];
      const i = Math.floor(Math.log(bytes) / Math.log(k));
      return parseFloat((bytes / Math.pow(k, i)).toFixed(dm)) + ' ' + sizes[i];
    }

    function escapeHtml(str) {
      return (str || '').replace(/[&<>"']/g, m => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[m]));
    }

    // Form Submit
    const form = document.getElementById('standalonePostForm');
    const submitBtn = document.getElementById('submitBtn');
    const feedback = document.getElementById('formFeedback');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const text = syncEditorToMarkdown();
      const titleEl = document.getElementById('postTitle');
      const hasMedia = composerImages.length > 0 || composerFiles.length > 0;

      if (!text && !hasMedia) {
        if (feedback) feedback.textContent = 'Write something before publishing.';
        if (postEditor) postEditor.focus();
        return;
      }

      submitBtn.disabled = true;
      submitBtn.textContent = 'Publishing…';
      if (feedback) feedback.textContent = '';

      try {
        const formData = new FormData();
        if (selectedCategory !== 'general' && titleEl && titleEl.value.trim()) {
          formData.append('title', titleEl.value.trim());
        }
        formData.append('content', text);
        formData.append('type', selectedCategory === 'notice' ? 'notice' : 'status');
        formData.append('category', selectedCategory);
        formData.append('audience', (canSelectAudience && selectedAudience) ? selectedAudience : 'everyone');
        formData.append('visibility', (canSelectAudience && selectedAudience) ? selectedAudience : 'everyone');
        
        if (isAllSemesters || !selectedSemesters || selectedSemesters.length === 0) {
          formData.append('targetSemesters', 'all');
        } else {
          formData.append('targetSemesters', JSON.stringify(selectedSemesters));
        }

        composerImages.forEach((file, idx) => {
          if (idx === 0) formData.append('image', file);
          else formData.append('images', file);
        });

        composerFiles.forEach(file => {
          formData.append('files', file);
        });

        const res = await fetch('/api/posts', {
          method: 'POST',
          body: formData
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.message || 'Could not publish post.');

        // Successfully published - redirect back to feed
        window.location.href = '/dashboard.html';
      } catch (err) {
        if (feedback) feedback.textContent = err.message || 'Error publishing post. Please try again.';
        submitBtn.disabled = false;
        submitBtn.textContent = 'Post';
      }
    });
  </script>
</body>
