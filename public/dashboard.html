    function safePostUrl(value) {
      if (typeof value !== 'string' || !value) return '';
      try {
        const hasValidOrigin = typeof window !== 'undefined' &&
          window.location &&
          window.location.origin &&
          window.location.origin !== 'null' &&
          !window.location.origin.startsWith('file:');
        const base = hasValidOrigin ? window.location.origin : 'https://semester-library.local';
        const url = new URL(value, base);
        return ['http:', 'https:'].includes(url.protocol) ? escapeHtml(url.href) : '';
      } catch (_) {
        return '';
      }
    }

    function getFileExt(filename) {
      return (filename || '').split('.').pop().toLowerCase();
    }

    function getFileIconSvg(ext) {
      const e = (ext || '').toLowerCase();
      if (e === 'pdf') {
        return `<svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline><path d="M10 12v6M10 15h3a1.5 1.5 0 0 0 0-3h-3z"></path></svg>`;
      }
      if (['doc', 'docx'].includes(e)) {
        return `<svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline><line x1="16" y1="13" x2="8" y2="13"></line><line x1="16" y1="17" x2="8" y2="17"></line><polyline points="10 9 9 9 8 9"></polyline></svg>`;
      }
      if (['ppt', 'pptx'].includes(e)) {
        return `<svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="3" width="20" height="14" rx="2" ry="2"></rect><line x1="8" y1="21" x2="16" y2="21"></line><line x1="12" y1="17" x2="12" y2="21"></line></svg>`;
      }
      if (['xls', 'xlsx'].includes(e)) {
        return `<svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect><line x1="3" y1="9" x2="21" y2="9"></line><line x1="3" y1="15" x2="21" y2="15"></line><line x1="9" y1="3" x2="9" y2="21"></line><line x1="15" y1="3" x2="15" y2="21"></line></svg>`;
      }
      if (['zip', 'rar', '7z'].includes(e)) {
        return `<svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="21 8 21 21 3 21 3 8"></polyline><rect x="1" y="3" width="22" height="5"></rect><line x1="10" y1="12" x2="14" y2="12"></line></svg>`;
      }
      return `<svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M13 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9z"></path><polyline points="13 2 13 9 20 9"></polyline></svg>`;
    }

    function getFileColorClass(ext) {
      const e = (ext || '').toLowerCase();
      if (e === 'pdf') return 'file-icon-pdf';
      if (['doc', 'docx'].includes(e)) return 'file-icon-doc';
      if (['ppt', 'pptx'].includes(e)) return 'file-icon-ppt';
      if (['xls', 'xlsx'].includes(e)) return 'file-icon-xls';
      if (['zip', 'rar', '7z'].includes(e)) return 'file-icon-zip';
      return 'file-icon-generic';
    }

    const openCommentPosts = new Set();

    function needsTruncation(content) {
      return (content || '').trim().split(/\s+/).filter(Boolean).length > 150;
    }

    function renderStatusPost(post) {
      return renderFeedPostCard(post);
    }

    function renderFeedPostCard(post) {
      const profileUrl = 'profile.html?id=' + encodeURIComponent(post.studentId);
      const avatarUrl = safePostUrl(post.avatarUrl);
      const avatar = avatarUrl
        ? `<img src="${avatarUrl}" alt="${escapeHtml(post.name)}" class="post-avatar-img">`
        : escapeHtml((post.name || 'S').charAt(0).toUpperCase());

      const isSpecialRole = post.role === 'admin' || post.role === 'teacher' || post.role === 'faculty';
      const isClassRep = post.role === 'cr' || post.role === 'class_rep';

      // PART 1: Role badge - only render if not default student
      let roleBadgeHtml = '';
      if (post.role === 'admin') {
        roleBadgeHtml = `<span class="post-verified-badge post-admin-badge" title="Verified System Administrator"><svg viewBox="0 0 24 24" width="11" height="11" fill="currentColor"><path d="M12 1L3 5v6c0 5.55 3.84 10.74 9 12 5.16-1.26 9-6.45 9-12V5l-9-4zm-2 16l-4-4 1.41-1.41L10 14.17l6.59-6.59L18 9l-8 8z"/></svg>Admin</span>`;
      } else if (post.role === 'teacher' || post.role === 'faculty') {
        roleBadgeHtml = `<span class="post-verified-badge post-admin-badge" title="Verified Faculty"><svg viewBox="0 0 24 24" width="11" height="11" fill="currentColor"><path d="M12 1L3 5v6c0 5.55 3.84 10.74 9 12 5.16-1.26 9-6.45 9-12V5l-9-4zm-2 16l-4-4 1.41-1.41L10 14.17l6.59-6.59L18 9l-8 8z"/></svg>Teacher</span>`;
      } else if (isClassRep) {
        roleBadgeHtml = `<span class="post-verified-badge post-cr-badge" title="Official Class Representative"><svg viewBox="0 0 24 24" width="11" height="11" fill="currentColor"><path d="M12 1L3 5v6c0 5.55 3.84 10.74 9 12 5.16-1.26 9-6.45 9-12V5l-9-4zm-2 16l-4-4 1.41-1.41L10 14.17l6.59-6.59L18 9l-8 8z"/></svg>Class Rep</span>`;
      }

      // PART 1 & 6: Only show @studentID when author's role is admin or teacher, with proper spacing
      const handleHtml = isSpecialRole
        ? `<span class="post-student-handle">@${escapeHtml(post.studentId)}</span> <span class="post-meta-sep">&middot;</span> `
        : '';

      const attachmentUrl = safePostUrl(post.attachment_url);

      // PART 2: Long text - Show more truncation (>150 words) and collapse 3+ newlines to max 2
      const cleanContent = (post.content || '').replace(/\n{3,}/g, '\n\n');
      const shouldTruncate = needsTruncation(cleanContent);

      // PART 5: Notice visual accent for Admin or Notice posts
      const isNotice = post.type === 'notice' || isSpecialRole;
      const noticeClass = isNotice ? ' notice' : '';

      const commentCount = post.comment_count ?? post.commentCount ?? 0;
      const likeCount = post.like_count ?? post.likeCount ?? 0;
      const isCommentsOpen = openCommentPosts.has(post.id);

      // Attached Media & Files handling
      const postImages = [];
      const postFiles = [];

      if (Array.isArray(post.media) && post.media.length > 0) {
        post.media.forEach(m => {
          const type = (m.media_type || m.type || 'image').toLowerCase();
          const safeUrl = safePostUrl(m.url);
          if (!safeUrl) return;
          if (type === 'image') {
            postImages.push({
              url: safeUrl,
              name: m.file_name || '',
              size: m.file_size
            });
          } else if (type === 'file') {
            postFiles.push({
              url: safeUrl,
              name: m.file_name || m.url.split('/').pop() || 'Attachment',
              size: m.file_size,
              mime: m.mime_type
            });
          }
        });
      }

      // Backward compatibility fallback for single attachment_url
      if (postImages.length === 0 && attachmentUrl) {
        postImages.push({ url: attachmentUrl, name: '', size: null });
      }

      let imageHtml = '';
      if (postImages.length === 1) {
        const singleUrl = postImages[0].url;
        imageHtml = `<div class="post-image"><img src="${singleUrl}" alt="Image attached by ${escapeHtml(post.name)}" loading="lazy" decoding="async" tabindex="0" role="button" aria-label="Open full image" aria-haspopup="dialog" onerror="this.hidden = true; this.nextElementSibling.hidden = false;"><a class="status-post-attachment" href="${singleUrl}" target="_blank" rel="noopener noreferrer" hidden>View attachment ↗</a></div>`;
      } else if (postImages.length === 2) {
        imageHtml = `
          <div class="post-image post-media-grid grid-2">
            ${postImages.map((img, i) => `
              <div class="post-media-cell">
                <img src="${img.url}" alt="Photo ${i + 1} attached by ${escapeHtml(post.name)}" loading="lazy" decoding="async" tabindex="0" role="button" aria-label="Open photo ${i + 1}" aria-haspopup="dialog" data-gallery-index="${i}">
              </div>
            `).join('')}
          </div>
        `;
      } else if (postImages.length === 3) {
        imageHtml = `
          <div class="post-image post-media-grid grid-3">
            <div class="post-media-cell cell-main">
              <img src="${postImages[0].url}" alt="Photo 1 attached by ${escapeHtml(post.name)}" loading="lazy" decoding="async" tabindex="0" role="button" aria-label="Open photo 1" aria-haspopup="dialog" data-gallery-index="0">
            </div>
            <div class="post-media-cell cell-sub">
              <img src="${postImages[1].url}" alt="Photo 2 attached by ${escapeHtml(post.name)}" loading="lazy" decoding="async" tabindex="0" role="button" aria-label="Open photo 2" aria-haspopup="dialog" data-gallery-index="1">
            </div>
            <div class="post-media-cell cell-sub">
              <img src="${postImages[2].url}" alt="Photo 3 attached by ${escapeHtml(post.name)}" loading="lazy" decoding="async" tabindex="0" role="button" aria-label="Open photo 3" aria-haspopup="dialog" data-gallery-index="2">
            </div>
          </div>
        `;
      } else if (postImages.length >= 4) {
        const displayImgs = postImages.slice(0, 4);
        const remaining = postImages.length - 4;
        imageHtml = `
          <div class="post-image post-media-grid grid-4">
            ${displayImgs.map((img, i) => {
              const isLastWithMore = i === 3 && remaining > 0;
              return `
                <div class="post-media-cell${isLastWithMore ? ' cell-more' : ''}">
                  <img src="${img.url}" alt="Photo ${i + 1} attached by ${escapeHtml(post.name)}" loading="lazy" decoding="async" tabindex="0" role="button" aria-label="Open photo ${i + 1}" aria-haspopup="dialog" data-gallery-index="${i}">
                  ${isLastWithMore ? `
                    <div class="post-media-more-overlay" role="button" tabindex="0" aria-label="View all ${postImages.length} photos" data-gallery-index="3">
                      <span>+${remaining}</span>
                    </div>
                  ` : ''}
                </div>
              `;
            }).join('')}
          </div>
        `;
      }

      let filesHtml = '';
      if (postFiles.length > 0) {
        filesHtml = `
          <div class="post-file-attachments">
            ${postFiles.map(file => {
              const ext = getFileExt(file.name).toUpperCase();
              const sizeStr = (typeof formatSize === 'function' && file.size) ? formatSize(file.size) : '';
              return `
                <a href="${file.url}" target="_blank" rel="noopener noreferrer" class="post-attachment-card" download="${escapeHtml(file.name)}" title="Download ${escapeHtml(file.name)}">
                  <div class="attachment-main">
                    <div class="attachment-icon-box ${getFileColorClass(ext)}">
                      ${getFileIconSvg(ext)}
                    </div>
                    <div class="attachment-text">
                      <span class="attachment-name">${escapeHtml(file.name)}</span>
                      <div class="attachment-meta">
                        <span class="attachment-file-badge">${escapeHtml(ext)}</span>
                        ${sizeStr ? `<span class="attachment-file-size">&middot; ${sizeStr}</span>` : ''}
                      </div>
                    </div>
                  </div>
                  <div class="attachment-download-btn" aria-hidden="true" title="Download">
                    <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                      <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
                      <polyline points="7 10 12 15 17 10"></polyline>
                      <line x1="12" y1="15" x2="12" y2="3"></line>
                    </svg>
                  </div>
                </a>
              `;
            }).join('')}
          </div>
        `;
      }

      const categoryLabel = (post.category_label || post.category || 'General').toUpperCase();
      let semDisplay = post.semester_display;
      if (!semDisplay) {
        if (post.allSemesters || post.target_all_semesters === 1 || !post.targetSemesters || post.targetSemesters.length === 0) {
          semDisplay = 'All Semesters';
        } else {
          semDisplay = 'Semester ' + post.targetSemesters.join(', ');
        }
      }

      const isStudentsOnly = post.visibility === 'students_only' || post.audience === 'students_only';
      const audienceBadgeHtml = isStudentsOnly
        ? `<span class="post-monochrome-badge post-audience-tag">STUDENTS ONLY</span>`
        : '';

      const tagsHtml = `
        <div class="post-tags-row">
          <span class="post-monochrome-badge post-category-tag">${escapeHtml(categoryLabel)}</span>
          ${audienceBadgeHtml}
          <span class="post-monochrome-badge post-semester-tag">${escapeHtml(semDisplay)}</span>
        </div>
      `;
      const isGeneral = (post.category === 'general' || post.category_key === 'general');
      const titleHtml = (!isGeneral && post.title) ? `<h3 class="post-card-title">${escapeHtml(post.title)}</h3>` : '';

      return renderPostShell({
        kind: 'post', id: post.id, className: 'status-post-card' + noticeClass,
        profileUrl, avatar, name: post.name, badge: roleBadgeHtml,
        meta: `${handleHtml}<time class="post-timestamp" datetime="${escapeHtml(post.created_at)}">${timeAgo(post.created_at)}</time>`,
        controls: post.canDelete ? `<button type="button" class="post-delete-btn" onclick="deleteStatusPost(${post.id}, this)" aria-label="Delete post" title="Delete post"><svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18M19 6v14H5V6m3 0V3h8v3"/></svg></button>` : '',
        body: `
            ${tagsHtml}
            ${titleHtml}
            <div class="post-content">
              ${shouldTruncate ? `
                <div class="post-content-clamped">
                  <p class="status-post-text">${escapeHtml(cleanContent)}</p>
                </div>
                <button type="button" class="show-more-link post-expand-btn" onclick="togglePostExpand(this)">Show more</button>
              ` : `
                <div class="post-content-unclamped">
                  <p class="status-post-text">${escapeHtml(cleanContent)}</p>
                </div>
              `}
            </div>
            ${imageHtml}
            ${filesHtml}
`,
        actions: renderPostActions({ liked: post.liked_by_me, likes: likeCount, comments: commentCount,
          likeAction: `toggleStatusLike(${post.id}, this)`, commentAction: `togglePostComments(${post.id}, this.closest('.feed-card'))`, shareAction: `copySharePostLink(${post.id})`,
          extra: post.type === 'assignment' ? `<span class="post-submitted-count">${post.submission_count} submitted</span>` : '' }),
        comments: `<div class="post-comments-drawer${isCommentsOpen ? ' open' : ''}" id="comments-drawer-${post.id}">
              <div class="post-comments-header-row">
                <span class="post-comments-title">Replies</span>
                <button type="button" class="post-comments-close-btn" onclick="closePostComments(${post.id})" aria-label="Hide replies" title="Hide replies">
                  <svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
                  <span>Hide</span>
                </button>
              </div>
              <form class="post-comment-composer" onsubmit="submitPostComment(${post.id}, this, event)">
                <textarea class="post-comment-textarea" placeholder="Post your reply…" rows="2" maxlength="2000" required></textarea>
                <div class="post-comment-composer-actions">
                  <button type="submit" class="post-comment-submit-btn">Reply</button>
                </div>
              </form>
              <div class="post-comments-list"></div>
            </div>`
      });
    }

    let currentFeedCategoryFilter = 'all';

    function renderFeed() {
      const container = document.getElementById('realFiles');
      feedItems = feedItems.filter(item => item._feedType !== 'assignment' && item.type !== 'assignment');
      feedItems.sort((a, b) => b._feedTime - a._feedTime || b.id - a.id);

      let visibleItems = feedItems;
      if (currentFeedCategoryFilter && currentFeedCategoryFilter !== 'all') {
        visibleItems = feedItems.filter(item => {
          if (item._feedType !== 'post') return false;
          const cat = (item.category || 'general').toLowerCase();
          return cat === currentFeedCategoryFilter.toLowerCase();
        });
      }

      // Reuse existing cards so paging or publishing preserves open comments and pending likes.
      const fragment = document.createDocumentFragment();
      visibleItems.forEach(item => {
        const attribute = { post: 'post', assignment: 'assignment', file: 'file' }[item._feedType];
        const existing = container.querySelector(`[data-${attribute}-id="${item.id}"]`);
        if (existing) {
          fragment.appendChild(existing);
        } else {
          const template = document.createElement('template');
          template.innerHTML = renderPost(item);
          fragment.appendChild(template.content);
        }
      });
      container.replaceChildren(fragment);
      if (!visibleItems.length) {
        if (currentFeedCategoryFilter && currentFeedCategoryFilter !== 'all') {
          container.innerHTML = `<div class="post-feed-empty"><p>No ${escapeHtml(currentFeedCategoryFilter)} posts found</p><p>Share a post in this category or switch back to All Posts.</p></div>`;
        } else {
          container.innerHTML = `<div class="post-feed-empty"><p>No posts shared yet</p><p>Share a status above or upload notes in Library.</p></div>`;
        }
      }
      loadMorePostsBtn.hidden = postsLoaded && postsCursor === null;
      loadMorePostsBtn.textContent = postsLoaded ? 'Load older posts' : 'Retry loading posts';
      initDashboardCardPhysics();
    }

    const filterPills = document.querySelectorAll('#feedCategoryFilterBar .feed-filter-pill');
    filterPills.forEach(pill => {
      pill.addEventListener('click', () => {
        filterPills.forEach(p => {
          p.classList.remove('active');
          p.setAttribute('aria-selected', 'false');
        });
        pill.classList.add('active');
        pill.setAttribute('aria-selected', 'true');
        currentFeedCategoryFilter = pill.dataset.category || 'all';
        renderFeed();
      });
    });

    function addFeedPosts(posts) {
      const existing = new Set(feedItems.filter(item => item._feedType === 'post').map(item => item.id));
      posts.forEach(post => {
        if (post.type === 'assignment') return;
        if (!existing.has(post.id)) {
          feedItems.push({ ...post, _feedType: 'post', _feedTime: new Date(post.created_at).getTime() });
          existing.add(post.id);
        }
      });
    }

    async function fetchPostPage(before = null) {
      const response = await fetch('/api/posts?limit=20' + (before === null ? '' : '&before=' + before));
      if (!response.ok) throw new Error('Could not load posts. Please try again.');
      return response.json();
    }

    async function loadFeed() {
      const [files, page] = await Promise.all([
        fetch('/api/files').then(r => r.ok ? r.json() : []).catch(() => []),
        fetchPostPage().catch(err => { postFeedMessage.textContent = err.message; return null; })
      ]);
      feedItems = [
        ...files.map(f => ({ ...f, _feedType: 'file', _feedTime: new Date(f.uploadedAt || f.createdAt || 0).getTime() }))
      ];
      if (page) {
        addFeedPosts(page.posts);
        postsCursor = page.nextCursor;
        postsLoaded = true;
      }
      renderFeed();
    }

    const feedReady = loadFeed();

    loadMorePostsBtn.addEventListener('click', async () => {
      loadMorePostsBtn.disabled = true;
      postFeedMessage.textContent = '';
      try {
        const page = await fetchPostPage(postsCursor);
        addFeedPosts(page.posts);
        postsCursor = page.nextCursor;
        postsLoaded = true;
        renderFeed();
      } catch (err) {
        postFeedMessage.textContent = err.message;
      } finally {
        loadMorePostsBtn.disabled = false;
      }
    });

    // --- Create Post Controls ---
    const openPostModalBtn = document.getElementById('openPostModalBtn');

    function openPostModal() {
      window.location.href = '/create-post';
    }

    function closePostModal() {
      // No-op fallback
    }

    if (openPostModalBtn) {
      openPostModalBtn.addEventListener('click', (e) => {
        // Direct navigation to dedicated /create-post page
        window.location.href = '/create-post';
      });
    }

    const postContentInput = document.getElementById('postContent');
    if (postContentInput) {
      postContentInput.addEventListener('input', () => {
        if (typeof updatePostButtonState === 'function') updatePostButtonState();
      });
    }

    const postImageInput = document.getElementById('postImageInput');
    const postFileInput = document.getElementById('postFileInput');
    const postImagePreview = document.getElementById('postImagePreview');
    const postImagePreviewImg = document.getElementById('postImagePreviewImg');
    const postImageError = document.getElementById('postImageError');
    const choosePostImageBtn = document.getElementById('choosePostImage');
    const choosePostFilesBtn = document.getElementById('choosePostFiles');
    const removePostImageBtn = document.getElementById('removePostImage');
    const retryPostImageBtn = document.getElementById('retryPostImage');
    const clearAllImagesBtn = document.getElementById('clearAllImagesBtn');
    const clearAllFilesBtn = document.getElementById('clearAllFilesBtn');
    const postSingleImagePreviewCard = document.getElementById('postSingleImagePreviewCard');
    const postMultiImagesGrid = document.getElementById('postMultiImagesGrid');
    const postImagesPreviewHeader = document.getElementById('postImagesPreviewHeader');
    const postImagesCount = document.getElementById('postImagesCount');
    const postFilesPreview = document.getElementById('postFilesPreview');
    const postFilesList = document.getElementById('postFilesList');
    const postFilesCount = document.getElementById('postFilesCount');
    const choosePostImageLabel = document.getElementById('choosePostImageLabel');
    const choosePostFilesLabel = document.getElementById('choosePostFilesLabel');

    let postImagePreviewUrl = null;
    let composerImages = [];
    let composerFiles = [];
    const composerImageUrls = new Map();

    function updateLabelsAndButtons() {
      if (choosePostImageLabel) {
        choosePostImageLabel.textContent = composerImages.length > 0 ? `Photos (${composerImages.length})` : 'Add photos';
      }
      if (choosePostFilesLabel) {
        choosePostFilesLabel.textContent = composerFiles.length > 0 ? `Files (${composerFiles.length})` : 'Attach files';
      }
      if (choosePostImageBtn && choosePostImageBtn.classList) {
        if (composerImages.length > 0 || (postImageInput && postImageInput.files && postImageInput.files.length > 0)) {
          choosePostImageBtn.classList.add('has-attachment');
        } else {
          choosePostImageBtn.classList.remove('has-attachment');
        }
      }
      if (choosePostFilesBtn && choosePostFilesBtn.classList) {
        if (composerFiles.length > 0 || (postFileInput && postFileInput.files && postFileInput.files.length > 0)) {
          choosePostFilesBtn.classList.add('has-attachment');
        } else {
          choosePostFilesBtn.classList.remove('has-attachment');
        }
      }
    }

    function updatePostButtonState() {
      const content = document.getElementById('postContent');
      const fileInput = document.getElementById('postImageInput');
      const docInput = document.getElementById('postFileInput');
      const button = document.getElementById('publishPost');
      if (!content || !button) return;
      const hasText = content.value.trim().length > 0;
      const hasImage = !!((fileInput && fileInput.files && fileInput.files.length > 0) || composerImages.length > 0);
      const hasFiles = !!((docInput && docInput.files && docInput.files.length > 0) || composerFiles.length > 0);
      button.disabled = !hasText && !hasImage && !hasFiles;
    }

    function renderComposerImagesPreview() {
      if (composerImages.length === 0) {
        clearPostImage();
        return;
      }

      if (postImagePreview) {
        postImagePreview.hidden = false;
        if (postImagePreview.classList) postImagePreview.classList.add('has-image');
      }

      if (composerImages.length === 1) {
        const file = composerImages[0];
        let url = composerImageUrls.get(file);
        if (!url) {
          url = URL.createObjectURL(file);
          composerImageUrls.set(file, url);
        }
        if (postImagePreviewUrl && postImagePreviewUrl !== url) {
          URL.revokeObjectURL(postImagePreviewUrl);
        }
        postImagePreviewUrl = url;

        if (postImagePreviewImg) {
          postImagePreviewImg.src = postImagePreviewUrl;
          if (postImagePreviewImg.style) postImagePreviewImg.style.display = 'block';
        }
        if (postImageError && postImageError.style) postImageError.style.display = 'none';
        if (postSingleImagePreviewCard && postSingleImagePreviewCard.style) postSingleImagePreviewCard.style.display = 'flex';
        if (postMultiImagesGrid && postMultiImagesGrid.style) postMultiImagesGrid.style.display = 'none';
        if (postImagesPreviewHeader && postImagesPreviewHeader.style) postImagesPreviewHeader.style.display = 'none';
      } else {
        if (postSingleImagePreviewCard && postSingleImagePreviewCard.style) postSingleImagePreviewCard.style.display = 'none';
        if (postImagesPreviewHeader && postImagesPreviewHeader.style) postImagesPreviewHeader.style.display = 'flex';
        if (postImagesCount) postImagesCount.textContent = `Photos (${composerImages.length}/10)`;

        const firstUrl = composerImageUrls.get(composerImages[0]);
        if (firstUrl && postImagePreviewImg) postImagePreviewImg.src = firstUrl;

        if (postMultiImagesGrid) {
          postMultiImagesGrid.style.display = 'flex';
          postMultiImagesGrid.innerHTML = composerImages.map((f, idx) => {
            const u = composerImageUrls.get(f) || '';
            return `
              <div class="composer-thumb-card">
                <img src="${u}" alt="Photo ${idx + 1}" class="composer-thumb-img">
                <span class="composer-thumb-idx">${idx + 1}</span>
                <button type="button" class="composer-thumb-remove" onclick="removeComposerImageAt(${idx})" aria-label="Remove photo ${idx + 1}" title="Remove photo">
                  <svg viewBox="0 0 24 24" width="12" height="12" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
                </button>
              </div>
            `;
          }).join('');
        }
      }

      updateLabelsAndButtons();
      if (typeof updatePostButtonState === 'function') updatePostButtonState();
    }

    function removeComposerImageAt(index) {
      if (index < 0 || index >= composerImages.length) return;
      const [removed] = composerImages.splice(index, 1);
      if (removed) {
        const u = composerImageUrls.get(removed);
        if (u) {
          URL.revokeObjectURL(u);
          composerImageUrls.delete(removed);
        }
      }
      if (composerImages.length === 0) {
        clearPostImage();
      } else {
        renderComposerImagesPreview();
      }
    }
    if (typeof window !== 'undefined') window.removeComposerImageAt = removeComposerImageAt;

    function clearPostImage() {
      if (postImagePreviewUrl) URL.revokeObjectURL(postImagePreviewUrl);

      composerImages.forEach(f => {
        const u = composerImageUrls.get(f);
        if (u && u !== postImagePreviewUrl) URL.revokeObjectURL(u);
      });
      postImagePreviewUrl = null;
      composerImages = [];
      composerImageUrls.clear();

      if (postImageInput) postImageInput.value = '';
      if (postImagePreviewImg) {
        postImagePreviewImg.removeAttribute('src');
        if (postImagePreviewImg.style) postImagePreviewImg.style.display = 'none';
      }
      if (postImageError && postImageError.style) postImageError.style.display = 'none';
      if (postSingleImagePreviewCard && postSingleImagePreviewCard.style) postSingleImagePreviewCard.style.display = 'none';
      if (postMultiImagesGrid) {
        postMultiImagesGrid.innerHTML = '';
        if (postMultiImagesGrid.style) postMultiImagesGrid.style.display = 'none';
      }
      if (postImagesPreviewHeader && postImagesPreviewHeader.style) postImagesPreviewHeader.style.display = 'none';
      if (postImagePreview) {
        postImagePreview.hidden = true;
        if (postImagePreview.classList) postImagePreview.classList.remove('has-image');
      }
      if (choosePostImageBtn && choosePostImageBtn.classList) choosePostImageBtn.classList.remove('has-attachment');
      updateLabelsAndButtons();
      if (typeof updatePostButtonState === 'function') updatePostButtonState();
    }

    function renderComposerFilesPreview() {
      if (composerFiles.length === 0) {
        clearPostFiles();
        return;
      }

      if (postFilesPreview) postFilesPreview.hidden = false;
      if (postFilesCount) postFilesCount.textContent = `Attached Files (${composerFiles.length}/5)`;

      if (postFilesList) {
        postFilesList.innerHTML = composerFiles.map((f, idx) => {
          const ext = (f.name || '').split('.').pop().toUpperCase();
          const sizeStr = (typeof formatSize === 'function' && f.size) ? formatSize(f.size) : '';
          return `
            <div class="composer-file-card">
              <div class="composer-file-icon ${getFileColorClass(ext)}">
                ${getFileIconSvg(ext)}
              </div>
              <div class="composer-file-info">
                <span class="composer-file-name" title="${escapeHtml(f.name)}">${escapeHtml(f.name)}</span>
                <span class="composer-file-meta">${escapeHtml(ext)}${sizeStr ? ` &middot; ${sizeStr}` : ''}</span>
              </div>
              <button type="button" class="composer-file-remove" onclick="removeComposerFileAt(${idx})" aria-label="Remove ${escapeHtml(f.name)}" title="Remove file">
                <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
              </button>
            </div>
          `;
        }).join('');
      }

      updateLabelsAndButtons();
      if (typeof updatePostButtonState === 'function') updatePostButtonState();
    }

    function removeComposerFileAt(index) {
      if (index < 0 || index >= composerFiles.length) return;
      composerFiles.splice(index, 1);
      if (composerFiles.length === 0) {
        clearPostFiles();
      } else {
        renderComposerFilesPreview();
      }
    }
    if (typeof window !== 'undefined') {
      window.removeComposerFileAt = removeComposerFileAt;
      window.addComposerImages = function(newFiles) {
        composerImages = [...composerImages, ...newFiles].slice(0, 10);
        composerImages.forEach(f => {
          if (!composerImageUrls.has(f)) {
            composerImageUrls.set(f, f.previewUrl || (typeof URL !== 'undefined' && URL.createObjectURL ? URL.createObjectURL(f) : ''));
          }
        });
        renderComposerImagesPreview();
      };
      window.addComposerFiles = function(newFiles) {
        composerFiles = [...composerFiles, ...newFiles].slice(0, 5);
        renderComposerFilesPreview();
      };
    }

    function clearPostFiles() {
      composerFiles = [];
      if (postFileInput) postFileInput.value = '';
      if (postFilesPreview) postFilesPreview.hidden = true;
      if (postFilesList) postFilesList.innerHTML = '';
      if (choosePostFilesBtn && choosePostFilesBtn.classList) choosePostFilesBtn.classList.remove('has-attachment');
      updateLabelsAndButtons();
      if (typeof updatePostButtonState === 'function') updatePostButtonState();
    }

    if (choosePostImageBtn) choosePostImageBtn.addEventListener('click', () => postImageInput && postImageInput.click());
    if (choosePostFilesBtn) choosePostFilesBtn.addEventListener('click', () => postFileInput && postFileInput.click());
    if (removePostImageBtn) removePostImageBtn.addEventListener('click', clearPostImage);
    if (clearAllImagesBtn) clearAllImagesBtn.addEventListener('click', clearPostImage);
    if (clearAllFilesBtn) clearAllFilesBtn.addEventListener('click', clearPostFiles);
    if (retryPostImageBtn) retryPostImageBtn.addEventListener('click', () => postImageInput && postImageInput.click());

    if (postImageInput) {
      postImageInput.addEventListener('change', () => {
        const fileList = postImageInput.files;
        const message = document.getElementById('postComposerMessage');
        if (message) message.textContent = '';
        if (!fileList || fileList.length === 0) return clearPostImage();

        const incoming = Array.from(fileList);
        for (const file of incoming) {
          if (!file.type || !file.type.startsWith('image/')) {
            clearPostImage();
            if (message) message.textContent = 'Please choose a valid image file.';
            return;
          }
          if (file.size > 5 * 1024 * 1024) {
            clearPostImage();
            if (message) message.textContent = 'Images must be 5 MB or smaller.';
            return;
          }
        }

        // When selecting 1 image, replace single image preview and revoke previous URLs
        if (incoming.length === 1) {
          const file = incoming[0];
          if (postImagePreviewUrl) URL.revokeObjectURL(postImagePreviewUrl);
          composerImages.forEach(f => {
            const u = composerImageUrls.get(f);
            if (u && u !== postImagePreviewUrl) URL.revokeObjectURL(u);
          });
          composerImages = [file];
          composerImageUrls.clear();

          postImagePreviewUrl = URL.createObjectURL(file);
          composerImageUrls.set(file, postImagePreviewUrl);

          if (postImagePreviewImg) {
            postImagePreviewImg.src = postImagePreviewUrl;
            if (postImagePreviewImg.style) postImagePreviewImg.style.display = 'block';
            postImagePreviewImg.onerror = () => {
              if (postImagePreviewImg.style) postImagePreviewImg.style.display = 'none';
              if (postImageError && postImageError.style) postImageError.style.display = 'flex';
            };
          }
          if (postImageError && postImageError.style) postImageError.style.display = 'none';
          if (postSingleImagePreviewCard && postSingleImagePreviewCard.style) postSingleImagePreviewCard.style.display = 'flex';
          if (postMultiImagesGrid && postMultiImagesGrid.style) postMultiImagesGrid.style.display = 'none';
          if (postImagesPreviewHeader && postImagesPreviewHeader.style) postImagesPreviewHeader.style.display = 'none';
          if (postImagePreview) {
            postImagePreview.hidden = false;
            if (postImagePreview.classList) postImagePreview.classList.add('has-image');
          }
          if (choosePostImageBtn && choosePostImageBtn.classList) choosePostImageBtn.classList.add('has-attachment');
        } else {
          // Multiple images selection
          const existingKeys = new Set(composerImages.map(f => `${f.name}_${f.size}`));
          const toAdd = incoming.filter(f => !existingKeys.has(`${f.name}_${f.size}`));
          if (composerImages.length + toAdd.length > 10) {
            if (message) message.textContent = 'Maximum 10 images allowed per post.';
            toAdd.splice(10 - composerImages.length);
          }
          toAdd.forEach(f => {
            const url = URL.createObjectURL(f);
            composerImageUrls.set(f, url);
            composerImages.push(f);
          });
          renderComposerImagesPreview();
        }

        updateLabelsAndButtons();
        if (typeof updatePostButtonState === 'function') updatePostButtonState();
      });
    }

    if (postFileInput) {
      postFileInput.addEventListener('change', () => {
        const fileList = postFileInput.files;
        const message = document.getElementById('postComposerMessage');
        if (message) message.textContent = '';
        if (!fileList || fileList.length === 0) return;

        const incoming = Array.from(fileList);
        for (const file of incoming) {
          if (file.size > 4 * 1024 * 1024) {
            if (message) message.textContent = 'Files must be 4 MB or smaller. For larger study materials, upload to Semester Library.';
            return;
          }
        }

        const existingKeys = new Set(composerFiles.map(f => `${f.name}_${f.size}`));
        const toAdd = incoming.filter(f => !existingKeys.has(`${f.name}_${f.size}`));
        if (composerFiles.length + toAdd.length > 5) {
          if (message) message.textContent = 'Maximum 5 files allowed per post.';
          toAdd.splice(5 - composerFiles.length);
        }
        toAdd.forEach(f => composerFiles.push(f));
        renderComposerFilesPreview();
      });
    }

    // --- Category, Audience, and Semester Selector Controls ---
    let selectedComposerCategory = 'general';
    let selectedComposerAudience = 'everyone';
    let isComposerAllSemesters = true;
    let selectedComposerSemesters = [];

    const composerCategoryWrap = document.getElementById('composerCategoryWrap');
    const composerCategoryBtn = document.getElementById('composerCategoryBtn');
    const composerCategoryMenu = document.getElementById('composerCategoryMenu');
    const composerCategoryValue = document.getElementById('composerCategoryValue');
    const categoryOptions = document.querySelectorAll('#composerCategoryMenu .category-option');

    function updateComposerCategoryUI(cat) {
      selectedComposerCategory = cat || 'general';
      const postTitleWrap = document.getElementById('postTitleWrap');
      if (postTitleWrap) {
        postTitleWrap.style.display = selectedComposerCategory === 'general' ? 'none' : 'block';
      }
      const postTypeEl = document.getElementById('postType');
      if (postTypeEl) {
        postTypeEl.value = selectedComposerCategory === 'notice' ? 'notice' : 'status';
      }
    }

    function toggleCategoryMenu(forceOpen) {
      if (!composerCategoryMenu) return;
      const willOpen = forceOpen !== undefined ? forceOpen : composerCategoryMenu.hidden;
      composerCategoryMenu.hidden = !willOpen;
      if (composerCategoryBtn) composerCategoryBtn.setAttribute('aria-expanded', String(willOpen));
      if (willOpen) {
        if (composerAudienceMenu) toggleAudienceMenu(false);
        if (composerSemestersMenu) toggleSemesterMenu(false);
      }
    }

    if (composerCategoryBtn) {
      composerCategoryBtn.addEventListener('click', (e) => {
        e.preventDefault();
        e.stopPropagation();
        toggleCategoryMenu();
      });
    }

    categoryOptions.forEach(opt => {
      opt.addEventListener('click', (e) => {
        e.preventDefault();
        e.stopPropagation();
        categoryOptions.forEach(o => o.classList.remove('selected'));
        opt.classList.add('selected');
        selectedComposerCategory = opt.dataset.value || 'general';
        const label = opt.querySelector('span')?.textContent || 'General';
        if (composerCategoryValue) composerCategoryValue.textContent = label;
        updateComposerCategoryUI(selectedComposerCategory);
        toggleCategoryMenu(false);
      });
    });

    // --- Audience Selector Controls (Students / CRs only) ---
    const composerAudienceWrap = document.getElementById('composerAudienceWrap');
    const composerAudienceBtn = document.getElementById('composerAudienceBtn');
    const composerAudienceMenu = document.getElementById('composerAudienceMenu');
    const composerAudienceValue = document.getElementById('composerAudienceValue');
    const composerAudienceHelper = document.getElementById('composerAudienceHelper');
    const audienceOptions = document.querySelectorAll('#composerAudienceMenu .audience-option');

    function toggleAudienceMenu(forceOpen) {
      if (!composerAudienceMenu) return;
      const willOpen = forceOpen !== undefined ? forceOpen : composerAudienceMenu.hidden;
      composerAudienceMenu.hidden = !willOpen;
      if (composerAudienceBtn) composerAudienceBtn.setAttribute('aria-expanded', String(willOpen));
      if (willOpen) {
        if (composerCategoryMenu) toggleCategoryMenu(false);
        if (composerSemestersMenu) toggleSemesterMenu(false);
      }
    }

    if (composerAudienceBtn) {
      composerAudienceBtn.addEventListener('click', (e) => {
        e.preventDefault();
        e.stopPropagation();
        toggleAudienceMenu();
      });
    }

    audienceOptions.forEach(opt => {
      opt.addEventListener('click', (e) => {
        e.preventDefault();
        e.stopPropagation();
        audienceOptions.forEach(o => o.classList.remove('selected'));
        opt.classList.add('selected');
        selectedComposerAudience = opt.dataset.value || 'everyone';
        const label = opt.querySelector('span')?.textContent || 'Everyone';
        if (composerAudienceValue) composerAudienceValue.textContent = label;
        if (composerAudienceHelper) {
          composerAudienceHelper.style.display = selectedComposerAudience === 'students_only' ? 'block' : 'none';
        }
        toggleAudienceMenu(false);
      });
    });

    const composerSemestersWrap = document.getElementById('composerSemestersWrap');
    const composerSemestersBtn = document.getElementById('composerSemestersBtn');
    const composerSemestersMenu = document.getElementById('composerSemestersMenu');
    const composerSemestersValue = document.getElementById('composerSemestersValue');
    const closeSemesterMenuBtn = document.getElementById('closeSemesterMenuBtn');
    const applySemesterBtn = document.getElementById('applySemesterBtn');
    const semAllCheck = document.getElementById('semAllCheck');
    const semIndivChecks = document.querySelectorAll('.sem-indiv-check');

    function toggleSemesterMenu(forceOpen) {
      if (!composerSemestersMenu) return;
      const willOpen = forceOpen !== undefined ? forceOpen : composerSemestersMenu.hidden;
      composerSemestersMenu.hidden = !willOpen;
      if (composerSemestersBtn) composerSemestersBtn.setAttribute('aria-expanded', String(willOpen));
      if (willOpen) {
        if (composerCategoryMenu) toggleCategoryMenu(false);
        if (composerAudienceMenu) toggleAudienceMenu(false);
      }
    }

    if (composerSemestersBtn) {
      composerSemestersBtn.addEventListener('click', (e) => {
        e.preventDefault();
        e.stopPropagation();
        toggleSemesterMenu();
      });
    }

    if (closeSemesterMenuBtn) {
      closeSemesterMenuBtn.addEventListener('click', (e) => {
        e.preventDefault();
        e.stopPropagation();
        toggleSemesterMenu(false);
      });
    }

    if (semAllCheck) {
      semAllCheck.addEventListener('change', () => {
        if (semAllCheck.checked) {
          semIndivChecks.forEach(chk => { chk.checked = false; });
        } else {
          // Prevent empty selection
          semAllCheck.checked = true;
        }
      });
    }

    semIndivChecks.forEach(chk => {
      chk.addEventListener('change', () => {
        if (chk.checked) {
          if (semAllCheck) semAllCheck.checked = false;
        } else {
          // If all individual are unchecked, revert to All Semesters
          const anyChecked = Array.from(semIndivChecks).some(c => c.checked);
          if (!anyChecked && semAllCheck) {
            semAllCheck.checked = true;
          }
        }
      });
    });

    if (applySemesterBtn) {
      applySemesterBtn.addEventListener('click', (e) => {
        e.preventDefault();
        e.stopPropagation();
        const checkedVals = Array.from(semIndivChecks).filter(c => c.checked).map(c => Number(c.value)).sort((a,b) => a - b);
        if (checkedVals.length === 0 || (semAllCheck && semAllCheck.checked)) {
          isComposerAllSemesters = true;
          selectedComposerSemesters = [];
          if (composerSemestersValue) composerSemestersValue.textContent = 'All Semesters';
        } else {
          isComposerAllSemesters = false;
          selectedComposerSemesters = checkedVals;
          if (composerSemestersValue) composerSemestersValue.textContent = 'Semester ' + checkedVals.join(', ');
        }

      });

    function resetComposerAudience() {
      selectedComposerAudience = 'everyone';
      if (composerAudienceValue) composerAudienceValue.textContent = 'Everyone';
      if (composerAudienceHelper) composerAudienceHelper.style.display = 'none';
      audienceOptions.forEach(opt => {
        if (opt.dataset.value === 'everyone') opt.classList.add('selected');

    function resetComposerSemesters() {
      isComposerAllSemesters = true;
      selectedComposerSemesters = [];
      if (composerSemestersValue) composerSemestersValue.textContent = 'All Semesters';
      if (semAllCheck) semAllCheck.checked = true;
      semIndivChecks.forEach(chk => { chk.checked = false; });

    document.getElementById('postComposer').addEventListener('submit', async (event) => {
      event.preventDefault();
      const content = document.getElementById('postContent');
      const type = document.getElementById('postType');
      const button = document.getElementById('publishPost');
      const message = document.getElementById('postComposerMessage');
      if (button.disabled) return;
      const hasText = content.value.trim().length > 0;
      const imagesToSend = composerImages.length > 0
        ? composerImages
        : (postImageInput && postImageInput.files && postImageInput.files.length > 0 ? Array.from(postImageInput.files) : []);
      const filesToSend = composerFiles.length > 0
        ? composerFiles
        : (postFileInput && postFileInput.files && postFileInput.files.length > 0 ? Array.from(postFileInput.files) : []);

      const hasMedia = imagesToSend.length > 0 || filesToSend.length > 0;
      if (!hasText && !hasMedia) {
        message.textContent = 'Write something before posting.';
        content.focus();
        return;
      }
      button.disabled = content.disabled = type.disabled = true;
      if (postImageInput) postImageInput.disabled = true;
      if (postFileInput) postFileInput.disabled = true;
      if (choosePostImageBtn) choosePostImageBtn.disabled = true;
      if (choosePostFilesBtn) choosePostFilesBtn.disabled = true;
      if (removePostImageBtn) removePostImageBtn.disabled = true;
      button.textContent = 'Posting…';
      message.textContent = '';
      try {
        await feedReady;
        const formData = new FormData();
        const postTitleInput = document.getElementById('postTitle');
        if (selectedComposerCategory !== 'general' && postTitleInput && postTitleInput.value.trim()) {
          formData.append('title', postTitleInput.value.trim());
        }
        formData.append('content', content.value);
        formData.append('type', type.value);
        formData.append('category', selectedComposerCategory || 'general');
        formData.append('audience', (window.canSelectAudience && selectedComposerAudience) ? selectedComposerAudience : 'everyone');
        formData.append('visibility', (window.canSelectAudience && selectedComposerAudience) ? selectedComposerAudience : 'everyone');
        if (isComposerAllSemesters || !selectedComposerSemesters || selectedComposerSemesters.length === 0) {
          formData.append('targetSemesters', 'all');
        } else {
          formData.append('targetSemesters', JSON.stringify(selectedComposerSemesters));
        }

        // Append images: first image with key 'image' for compatibility, subsequent with 'images'
        imagesToSend.forEach((file, index) => {
          if (index === 0) formData.append('image', file);
          else formData.append('images', file);
        });

        // Append files
        filesToSend.forEach(file => {
          formData.append('files', file);
        });

        const response = await fetch('/api/posts', {
          method: 'POST',
          body: formData
        });
        const data = await response.json();
        if (!response.ok) throw new Error(data.message || 'Could not publish your post.');
        addFeedPosts([data]);
        renderFeed();
        content.value = '';
        if (postTitleInput) postTitleInput.value = '';
        resetComposerCategory();
        resetComposerAudience();
        resetComposerSemesters();
        clearPostImage();
        clearPostFiles();
        message.textContent = 'Post shared with your class.';
        if (typeof showToast === 'function') showToast('Post shared with your class.');
        if (typeof closePostModal === 'function') closePostModal();
      } catch (err) {
        message.textContent = err.message || 'Could not publish your post. Please try again.';
      } finally {
        button.disabled = false;
        content.disabled = type.disabled = false;
        if (postImageInput) postImageInput.disabled = false;
        if (postFileInput) postFileInput.disabled = false;
        if (choosePostImageBtn) choosePostImageBtn.disabled = false;
        if (choosePostFilesBtn) choosePostFilesBtn.disabled = false;
        if (removePostImageBtn) removePostImageBtn.disabled = false;
        button.textContent = 'Post';
      }
    });

    const pendingPostLikes = new Set();

    function updateStatusLike(id, liked, count) {
      const post = feedItems.find(item => item._feedType === 'post' && item.id === id);
      if (post) Object.assign(post, { liked_by_me: liked, like_count: count });
      const button = document.querySelector(`[data-post-id="${id}"] .like-btn`);
      if (!button) return;
      button.dataset.liked = String(liked);
      button.classList.toggle('liked', liked);
      button.setAttribute('aria-pressed', String(liked));
      button.setAttribute('aria-label', liked ? 'Unlike post' : 'Like post');
      button.querySelector('svg').setAttribute('fill', liked ? 'currentColor' : 'none');
      button.querySelector('.like-count').textContent = count;
      button.disabled = pendingPostLikes.has(id);
    }

    async function toggleStatusLike(id, button) {
      if (pendingPostLikes.has(id)) return;
      const liked = button.dataset.liked === 'true';
      const count = Number(button.querySelector('.like-count').textContent);
      pendingPostLikes.add(id);
      updateStatusLike(id, !liked, Math.max(0, count + (liked ? -1 : 1)));
      try {
        const response = await fetch(`/api/posts/${id}/like`, { method: liked ? 'DELETE' : 'POST' });
        const data = await response.json();
        if (!response.ok) throw new Error(data.message || 'Could not update like.');
        updateStatusLike(id, data.liked_by_me, data.like_count);
      } catch (err) {
        updateStatusLike(id, liked, count);
        showToast(escapeHtml(err.message || 'Could not update like. Please try again.'));
      } finally {
        pendingPostLikes.delete(id);
        const currentButton = document.querySelector(`[data-post-id="${id}"] .like-btn`);
        if (currentButton) currentButton.disabled = false;
      }
    }

    async function deleteStatusPost(id, button) {
      const confirmed = await showAppleConfirmModal({
        title: 'Delete Post?',
        message: 'Are you sure you want to delete this post? This action cannot be undone.',
        confirmText: 'Delete Post',
        cancelText: 'Cancel',
        isDanger: true
      });
      if (!confirmed) return;
      button.disabled = true;
      try {
        const response = await fetch(`/api/posts/${id}`, { method: 'DELETE' });
        const data = await response.json();
        if (!response.ok) throw new Error(data.message || 'Could not delete post.');
        feedItems = feedItems.filter(item => item._feedType !== 'post' || item.id !== id);
        renderFeed();
        showToast('Post deleted.');
      } catch (err) {
        button.disabled = false;
        showToast(escapeHtml(err.message || 'Could not delete post. Please try again.'));
      }
    }

    function togglePostExpand(btn) {
      const container = btn.closest('.post-content');
      if (!container) return;
      const clamped = container.querySelector('.post-content-clamped');
      if (!clamped) return;
      const isExpanded = clamped.classList.toggle('expanded');
      btn.textContent = isExpanded ? 'Show less' : 'Show more';
    }

    function copySharePostLink(postId) {
      const url = `${window.location.origin}/dashboard.html?post=${encodeURIComponent(postId)}`;
      const onCopied = () => showToast('Post link copied to clipboard');
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(url).then(onCopied).catch(() => fallbackCopy(url, onCopied));
      } else {
        fallbackCopy(url, onCopied);
      }
    }

    function fallbackCopy(text, cb) {
      const el = document.createElement('textarea');
      el.value = text;
      el.style.position = 'fixed';
      el.style.left = '-9999px';
      document.body.appendChild(el);
      el.select();
      try {
        document.execCommand('copy');
        if (cb) cb();
      } catch (_) {
        showToast('Failed to copy link');
      }
      document.body.removeChild(el);
    }

    function renderPostCommentItem(c) {
      const profileUrl = 'profile.html?id=' + encodeURIComponent(c.studentId || c.student_id || '');

      const isCR = c.role === 'cr' || c.role === 'class_rep';

      if (c.role === 'admin') {
        roleBadge = `<span class="post-verified-badge post-admin-badge" style="font-size: 10px; padding: 1px 6px;">Admin</span>`;
      } else if (c.role === 'teacher' || c.role === 'faculty') {

      } else if (isCR) {

    function renderPostCommentsList(listEl, comments) {
      if (!comments || !comments.length) {
        listEl.innerHTML = '<p class="post-comments-empty">No comments yet. Be the first to reply!</p>';
        return;
      }
      listEl.innerHTML = comments.map(c => renderPostCommentItem(c)).join('');

    function closePostComments(postId) {
      openCommentPosts.delete(postId);
      const drawer = document.getElementById(`comments-drawer-${postId}`);
      if (drawer) {
        drawer.classList.remove('open');
      }
    }

    async function togglePostComments(postId, card) {
      if (!card) card = document.querySelector(`[data-post-id="${postId}"]`);
      if (!card) return;
      const drawer = card.querySelector(`#comments-drawer-${postId}`) || card.querySelector('.post-comments-drawer');
      if (!drawer) return;

      const isOpen = openCommentPosts.has(postId) || drawer.classList.contains('open');
      if (isOpen) {
        openCommentPosts.delete(postId);
        drawer.classList.remove('open');
        return;
      }

      openCommentPosts.add(postId);
      drawer.classList.add('open');

      if (!drawer.dataset.loaded) {
        const listEl = drawer.querySelector('.post-comments-list');
        if (listEl) {
          listEl.innerHTML = '<p class="post-comments-empty" style="text-align: center;">Loading comments…</p>';
          try {
            const res = await fetch(`/api/posts/${postId}/comments`);
            if (!res.ok) throw new Error('Could not load comments');
            const data = await res.json();
            drawer.dataset.loaded = 'true';
            renderPostCommentsList(listEl, Array.isArray(data) ? data : (data.comments || []));
          } catch (err) {
            listEl.innerHTML = `<p class="post-comments-empty" style="color: var(--accent-red, #ff453a);">${escapeHtml(err.message)}</p>`;
          }
        }
      }

      const textarea = drawer.querySelector('.post-comment-textarea');
      if (textarea) textarea.focus();
    }

    async function submitPostComment(postId, form, event) {
      if (event) event.preventDefault();
      const textarea = form.querySelector('.post-comment-textarea');
      const submitBtn = form.querySelector('.post-comment-submit-btn');
      const content = textarea.value.trim();
      if (!content) return;

      submitBtn.disabled = true;
      textarea.disabled = true;
      try {
        const res = await fetch(`/api/posts/${postId}/comments`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ content })
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.message || 'Could not post comment.');

        textarea.value = '';
        openCommentPosts.add(postId);
        const drawer = form.closest('.post-comments-drawer');
        if (drawer) drawer.classList.add('open');
        const listEl = drawer ? drawer.querySelector('.post-comments-list') : null;
        if (listEl) {
          drawer.dataset.loaded = 'true';
          const emptyMsg = listEl.querySelector('.post-comments-empty');
          if (emptyMsg) emptyMsg.remove();
          const temp = document.createElement('div');
          temp.innerHTML = renderPostCommentItem(data.comment);
          listEl.appendChild(temp.firstElementChild);
        }

        const card = document.querySelector(`[data-post-id="${postId}"]`);
        if (card) {
          const countEl = card.querySelector('.comment-count');
          if (countEl) countEl.textContent = data.comment_count;
        }
        const postObj = feedItems.find(item => item._feedType === 'post' && item.id === postId);
        if (postObj) {
          postObj.comment_count = data.comment_count;
          postObj.commentCount = data.comment_count;
        }

        showToast('Reply posted');
      } catch (err) {
        showToast(escapeHtml(err.message || 'Failed to post reply'));
      } finally {
        submitBtn.disabled = false;
        textarea.disabled = false;
        textarea.focus();
      }
    }

    // --- Search Logic ---
    const searchInput = document.getElementById('headerSearchInput');
    const searchResults = document.getElementById('searchResults');
    const realFiles = document.getElementById('realFiles');

    const dashHero = document.querySelector('.dash-hero');

    let searchTimeout = null;
    let searchAbortController = null;
    let searchRequestId = 0;

    function renderSubjectCard(s) {
      return `
        <a href="library.html?subject=${encodeURIComponent(s.subject)}" class="search-subject-card">

    function renderStudentCard(s) {
      const initial = (s.name || 'S').charAt(0).toUpperCase();
      const avatarHtml = s.avatarUrl
        ? `<img src="${s.avatarUrl}" alt="${escapeHtml(s.name)}">`
        : initial;

      let badgeHtml = '';
      if (s.role === 'admin') {
        badgeHtml = `<span class="post-verified-badge post-admin-badge" title="System Administrator">Admin</span>`;
      } else if (s.role === 'cr' || s.role === 'class_rep') {

              <h4 class="student-card-name">${escapeHtml(s.name)}</h4>
              ${badgeHtml}
            </div>
            <div class="student-card-meta">
              <span>@${escapeHtml(s.studentId)}</span>
              &middot; <span>${escapeHtml(s.semester || 'Semester 1')}</span>
              &middot; <span>${s.filesCount || s.filescount || 0} upload${(s.filesCount || s.filescount) == 1 ? '' : 's'}</span>
            </div>
          </div>
        </a>
      `;
    }

    if (searchInput) {
      searchInput.addEventListener('input', (e) => {
        const q = e.target.value.trim();
        clearTimeout(searchTimeout);
        if (searchAbortController) {
          try { searchAbortController.abort(); } catch {}
          searchAbortController = null;
        }

        if (!q) {
          searchRequestId++;
          // Restore default view
          searchResults.style.display = 'none';
          dashHero.style.display = 'flex'; // .dash-hero is flex
          feedHeading.style.display = 'flex';
          const composerSec = document.getElementById('postComposerSection');
          if (composerSec) composerSec.hidden = false;
          document.getElementById('postPagination').hidden = false;
          realFiles.style.display = 'block';
          if (demoNotes) demoNotes.style.display = 'block';
          return;
        }

        searchTimeout = setTimeout(async () => {
          const thisReqId = ++searchRequestId;
          searchAbortController = typeof AbortController !== 'undefined' ? new AbortController() : null;
          try {
            const fetchOpts = searchAbortController ? { signal: searchAbortController.signal } : {};
            const res = await fetch('/api/search?q=' + encodeURIComponent(q), fetchOpts);
            if (thisReqId !== searchRequestId) return;
            if (!res.ok) return;
            const data = await res.json();
            if (thisReqId !== searchRequestId) return;

            dashHero.style.display = 'none';
            feedHeading.style.display = 'none';
            const composerSec = document.getElementById('postComposerSection');
            if (composerSec) composerSec.hidden = true;
            document.getElementById('postPagination').hidden = true;
            realFiles.style.display = 'none';
            if (demoNotes) demoNotes.style.display = 'none';

            searchResults.style.display = 'block';

            let html = '<div class="search-results-heading"><h2>Search Results</h2><span>For "' + escapeHtml(q) + '"</span></div>';

            if (data.assignments && data.assignments.length > 0) {
              html += '<h3 class="search-section-title">Code Lab Assignments</h3>';
              html += data.assignments.map(renderAssignmentPost).join('');
            }

            if (data.students && data.students.length > 0) {
              html += '<h3 class="search-section-title">Students & Classmates</h3>';
              html += '<div class="search-students-grid">';
              html += data.students.map(renderStudentCard).join('');
              html += '</div>';
            }

            if (data.subjects && data.subjects.length > 0) {
              html += '<h3 class="search-section-title">Subjects</h3>';
              html += '<div class="search-subjects-grid">';
              html += data.subjects.map(renderSubjectCard).join('');
              html += '</div>';
            }

            if (data.files && data.files.length > 0) {
              html += '<h3 class="search-section-title">Files & Notes</h3>';
              html += data.files.map(renderPost).join('');
            }

            const hasResults = (data.assignments && data.assignments.length > 0) || (data.students && data.students.length > 0) || (data.subjects && data.subjects.length > 0) || (data.files && data.files.length > 0);
            if (!hasResults) {
              html += `
                <div class="empty-search-state" style="text-align:center; padding:36px 16px;">
                  <img src="/minecraft-404-voxel-ruby.svg" alt="No results found" class="empty-voxel-illu" style="max-width: 230px; margin: 0 auto 14px;">
                  <p style="font-size:15px; font-weight:700; color:var(--text-primary,#111827); margin:0 0 4px;">No results found</p>
                  <p style="font-size:13px; color:var(--text-tertiary,#86868b); margin:0;">No assignments, students, files, or subjects found matching your query.</p>
                </div>
              `;
            }

            searchResults.innerHTML = html;
            setTimeout(initDashboardCardPhysics, 50);
          } catch (err) {
            if (err && err.name === 'AbortError') return;
            console.error("Search error:", err);
          }
        }, 300);
      });
    }

    // --- 3D Gyro Perspective Tilt Physics (Same as Photo Gallery) ---
    function initDashboardCardPhysics() {
      const cards = document.querySelectorAll('.feed-card, .fb-card, .social-post-card, .search-subject-card, .search-student-card');
      cards.forEach(card => {
        if (card.matches('.post-card, .post-composer')) return;
        if (card.dataset.physicsBound) return;
        card.dataset.physicsBound = 'true';

        let rect;
        card.addEventListener('mouseenter', () => {
          rect = card.getBoundingClientRect();
        });

        card.addEventListener('mousemove', (e) => {
          if (!rect) rect = card.getBoundingClientRect();
          const x = e.clientX - rect.left;
          const y = e.clientY - rect.top;
          const cx = rect.width / 2;
          const cy = rect.height / 2;
          const rotateX = ((y - cy) / cy) * -3.2;
          const rotateY = ((x - cx) / cx) * 3.2;

          card.style.transform = `perspective(900px) rotateX(${rotateX.toFixed(2)}deg) rotateY(${rotateY.toFixed(2)}deg) translateZ(4px)`;
        });

        card.addEventListener('mouseleave', () => {
          card.style.transform = '';
        });
      });
    }

    setTimeout(initDashboardCardPhysics, 400);
    const dashObs = new MutationObserver(() => initDashboardCardPhysics());
    if (realFiles) dashObs.observe(realFiles, { childList: true });
    if (searchResults) dashObs.observe(searchResults, { childList: true });

  </div>

  <div id="imageLightbox" class="lightbox hidden" role="dialog" aria-modal="true" aria-label="Full image" tabindex="-1">
    <button type="button" class="lightbox-close" aria-label="Close full image">&times;</button>
    <button type="button" class="lightbox-nav-btn lightbox-prev" id="lightboxPrev" aria-label="Previous image" style="display: none;">
      <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"></polyline></svg>
    </button>
    <img id="lightboxImg" alt="">
    <div id="lightboxCounter" class="lightbox-counter" style="display: none;">1 / 1</div>
    <button type="button" class="lightbox-nav-btn lightbox-next" id="lightboxNext" aria-label="Next image" style="display: none;">
      <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"></polyline></svg>
    </button>
  </div>
  <script>
    const imageLightbox = document.getElementById('imageLightbox');
    const lightboxImg = document.getElementById('lightboxImg');
    const lightboxClose = imageLightbox.querySelector('.lightbox-close');
    const lightboxPrev = document.getElementById('lightboxPrev');
    const lightboxNext = document.getElementById('lightboxNext');
    const lightboxCounter = document.getElementById('lightboxCounter');
    let lightboxTrigger = null;
    let lightboxPreviousOverflow = '';
    let galleryImages = [];
    let galleryIndex = 0;

    function updateLightboxNav() {
      if (!lightboxPrev || !lightboxNext || !lightboxCounter) return;
      if (galleryImages.length > 1) {
        lightboxPrev.style.display = 'flex';
        lightboxNext.style.display = 'flex';
        lightboxCounter.style.display = 'block';
        lightboxCounter.textContent = `${galleryIndex + 1} / ${galleryImages.length}`;
      } else {
        lightboxPrev.style.display = 'none';
        lightboxNext.style.display = 'none';
        lightboxCounter.style.display = 'none';
      }
    }

    function showLightboxIndex(idx) {
      if (galleryImages.length === 0) return;
      if (idx < 0) idx = galleryImages.length - 1;
      if (idx >= galleryImages.length) idx = 0;
      galleryIndex = idx;
      const targetImg = galleryImages[galleryIndex];
      if (targetImg) {
        lightboxImg.src = targetImg.currentSrc || targetImg.src;
        lightboxImg.alt = targetImg.alt || '';
      }
      updateLightboxNav();
    }

    function openPostImage(image) {
      if (!image || image.hidden) return;
      lightboxTrigger = image;
      lightboxPreviousOverflow = document.body.style.overflow;

      const postMedia = image.closest('.post-image');
      if (postMedia) {
        galleryImages = Array.from(postMedia.querySelectorAll('img:not([hidden])'));
        galleryIndex = Math.max(0, galleryImages.indexOf(image));
      } else {
        galleryImages = [image];
        galleryIndex = 0;
      }

      showLightboxIndex(galleryIndex);
      document.body.style.overflow = 'hidden';
      imageLightbox.classList.remove('hidden');
      lightboxClose.focus();
    }

    function closePostImage() {
      imageLightbox.classList.add('hidden');
      lightboxImg.removeAttribute('src');
      galleryImages = [];
      galleryIndex = 0;
      updateLightboxNav();
      document.body.style.overflow = lightboxPreviousOverflow;
      if (lightboxTrigger?.isConnected) lightboxTrigger.focus();
      lightboxTrigger = null;
    }

    document.getElementById('realFiles').addEventListener('click', (event) => {
      const moreOverlay = event.target.closest('.post-media-more-overlay');
      if (moreOverlay) {
        const postMedia = moreOverlay.closest('.post-image');
        const imgs = postMedia ? Array.from(postMedia.querySelectorAll('img:not([hidden])')) : [];
        if (imgs.length >= 4) openPostImage(imgs[3]);
        return;
      }
      if (event.target.matches('.post-image img')) openPostImage(event.target);
    });
    document.getElementById('realFiles').addEventListener('keydown', (event) => {
      if (event.target.matches('.post-image img, .post-media-more-overlay') && ['Enter', ' '].includes(event.key)) {
        event.preventDefault();
        if (event.target.matches('.post-media-more-overlay')) {
          const postMedia = event.target.closest('.post-image');
          const imgs = postMedia ? Array.from(postMedia.querySelectorAll('img:not([hidden])')) : [];
          if (imgs.length >= 4) openPostImage(imgs[3]);
        } else {
          openPostImage(event.target);
        }
      }
    });

    if (lightboxPrev) {
      lightboxPrev.addEventListener('click', (e) => {
        e.stopPropagation();
        showLightboxIndex(galleryIndex - 1);
      });
    }
    if (lightboxNext) {
      lightboxNext.addEventListener('click', (e) => {
        e.stopPropagation();
        showLightboxIndex(galleryIndex + 1);
      });
    }

    lightboxClose.addEventListener('click', closePostImage);
    imageLightbox.addEventListener('click', (event) => {
      if (event.target === imageLightbox) closePostImage();
    });
    document.addEventListener('keydown', (event) => {
      if (imageLightbox.classList.contains('hidden')) return;
      if (event.key === 'Escape') closePostImage();
      if (event.key === 'ArrowLeft' && galleryImages.length > 1) showLightboxIndex(galleryIndex - 1);
      if (event.key === 'ArrowRight' && galleryImages.length > 1) showLightboxIndex(galleryIndex + 1);
      if (event.key === 'Tab') {
        event.preventDefault();
        lightboxClose.focus();
      }
    });
  </script>
  <!-- PWA Service Worker Registration -->
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('/sw.js').catch(err => {
          console.warn('[SW Registration Notice]:', err);
        });
      });
    }
  </script>
</body>

</html>
