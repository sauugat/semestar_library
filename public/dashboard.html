<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard — Semester Library</title>
<script>
  fetch('/api/me').then(r => { if (!r.ok) window.location.replace('login.html'); }).catch(() => window.location.replace('login.html'));
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body class="dash">

  <header class="dash-header">
    <a href="dashboard.html" class="lib-wordmark">Semester Library</a>
    <div class="jitter-prompt-pill header-search-wrapper">
      <div class="jitter-prompt-icon-left" title="Powered by Google Gemini Flash">
        <svg class="gemini-spark-icon" viewBox="0 0 24 24" width="16" height="16">
          <defs>
            <linearGradient id="geminiSparkGradHero" x1="0%" y1="0%" x2="100%" y2="100%">
              <stop offset="0%" stop-color="#4285f4" />
              <stop offset="35%" stop-color="#9b72cb" />
              <stop offset="70%" stop-color="#f06292" />
              <stop offset="100%" stop-color="#8ab4f8" />
            </linearGradient>
          </defs>
          <path fill="url(#geminiSparkGradHero)"
            d="M12 0C12 6.627 6.627 12 0 12C6.627 12 12 17.373 12 24C12 17.373 17.373 12 24 12C17.373 12 12 6.627 12 0Z" />
        </svg>
      </div>
      <div class="jitter-prompt-input-area">
        <input type="search" id="headerSearchInput" class="header-search-input" placeholder="Search files, subjects...">
      </div>
      <div class="jitter-prompt-tools" style="padding-right: 4px;">
        <button type="button" class="jitter-tool-btn" style="pointer-events: none;">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" width="16" height="16">
            <circle cx="11" cy="11" r="8"></circle>
            <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
          </svg>
        </button>
      </div>
    </div>
    <div class="dash-header-actions">
      <a href="profile.html" class="dash-profile-chip" title="View Profile">
        <div class="dash-profile-avatar" id="headerAvatar">·</div>
        <span class="dash-profile-label" id="headerProfileName">Profile</span>
      </a>
    </div>
  </header>

  <section class="dash-hero">
    <div class="dash-avatar" id="avatarInitial">·</div>
    <div>
      <p class="dash-greeting-line" id="greetingLine">Loading…</p>
      <p class="dash-id" id="idLine"></p>
    </div>
  </section>

  <div class="feed-heading">
    <h2>Your Feed</h2>
    <span>Updated just now</span>
  </div>

  <main class="feed">
    <div id="searchResults" style="display: none;"></div>
    <div id="realFiles"></div>
    <div id="demoNotes"></div>
  </main>

  <nav class="bottom-nav">
    <a href="dashboard.html" class="nav-item active">
      <svg viewBox="0 0 24 24"><path d="M4 11a9 9 0 0 1 9 9"/><path d="M4 4a16 16 0 0 1 16 16"/><circle cx="5" cy="19" r="1.5" fill="currentColor"/></svg>
      <span class="nav-label">Feed</span>
    </a>
    <a href="chat.html" class="nav-item">
      <svg viewBox="0 0 24 24"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path></svg>
      <span class="nav-label">Chat</span>
    </a>
    <a href="library.html" class="nav-item">
      <svg viewBox="0 0 24 24"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg>
      <span class="nav-label">Library</span>
    </a>
    <a href="syllabus.html" class="nav-item">
      <svg viewBox="0 0 24 24"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>
      <span class="nav-label">Syllabus</span>
    </a>
    <a href="routine.html" class="nav-item">
      <svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg>
      <span class="nav-label">Routine</span>
    </a>
  </nav>



  <script>
    function getGreeting() {
      const hour = new Date().getHours();
      if (hour < 12) return "Good morning";
      if (hour < 17) return "Good afternoon";
      return "Good evening";
    }

    fetch('/api/me')
      .then(res => {
        if (!res.ok) throw new Error('Not logged in');
        return res.json();
      })
      .then(data => {
        document.getElementById('greetingLine').textContent = `${getGreeting()}, ${data.name}`;
        document.getElementById('idLine').textContent = `Student ID: ${data.studentId}`;
        document.getElementById('avatarInitial').textContent = data.name.charAt(0).toUpperCase();

        // Populate top right header profile chip
        const headerAvatar = document.getElementById('headerAvatar');
        const headerName = document.getElementById('headerProfileName');
        if (headerName) headerName.textContent = data.name.split(' ')[0];
        if (headerAvatar) headerAvatar.textContent = data.name.charAt(0).toUpperCase();

        // Fetch avatar if uploaded
        fetch('/api/profile').then(r => r.json()).then(p => {
          if (p && p.avatarUrl && headerAvatar) {
            headerAvatar.innerHTML = `<img src="${p.avatarUrl}" alt="${p.name}">`;
          }
        }).catch(() => {});
      })
      .catch(() => {
        window.location.href = 'login.html';
      });

    const logoutBtnEl = document.getElementById('logoutBtn');
    if (logoutBtnEl) {
      logoutBtnEl.addEventListener('click', () => {
        fetch('/api/logout', { method: 'POST' })
          .then(() => window.location.href = 'index.html');
      });
    }

    document.querySelectorAll('.nav-item').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.nav-item').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
      });
    });

    function escapeHtml(str) {
      if (!str) return '';
      return String(str).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
    }

    function formatSize(bytes) {
      if (bytes < 1024) return bytes + ' B';
      if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(1) + ' KB';
      return (bytes / (1024 * 1024)).toFixed(1) + ' MB';
    }

    function timeAgo(iso) {
      if (!iso) return 'just now';
      const diffMs = Date.now() - new Date(iso).getTime();
      const mins = Math.floor(diffMs / 60000);
      if (mins < 1) return 'just now';
      if (mins < 60) return mins + 'm ago';
      const hrs = Math.floor(mins / 60);
      if (hrs < 24) return hrs + 'h ago';
      return Math.floor(hrs / 24) + 'd ago';
    }

    function getFileBadge(name) {
      const ext = (name.match(/\.([a-zA-Z0-9]+)$/) || ['', 'FILE'])[1].toUpperCase();
      let iconClass = 'badge-doc';
      if (['PDF'].includes(ext)) iconClass = 'badge-pdf';
      else if (['ZIP', 'RAR', '7Z', 'TAR', 'GZ'].includes(ext)) iconClass = 'badge-zip';
      else if (['JPG', 'JPEG', 'PNG', 'WEBP', 'GIF', 'SVG'].includes(ext)) iconClass = 'badge-img';
      else if (['JS', 'PY', 'CPP', 'C', 'JAVA', 'HTML', 'CSS', 'JSON', 'SQL'].includes(ext)) iconClass = 'badge-code';
      else if (['PPT', 'PPTX', 'KEY'].includes(ext)) iconClass = 'badge-slide';
      return { ext, iconClass };
    }

    function showToast(message) {
      let toast = document.getElementById('socialToast');
      if (!toast) {
        toast = document.createElement('div');
        toast.id = 'socialToast';
        toast.className = 'social-toast';
        document.body.appendChild(toast);
      }
      toast.innerHTML = `<svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M20 6L9 17l-5-5"/></svg><span>${message}</span>`;
      toast.classList.add('show');
      setTimeout(() => toast.classList.remove('show'), 2400);
    }

    function copyPostLink(fileId) {
      const url = `${window.location.origin}/api/files/${fileId}/view`;
      navigator.clipboard.writeText(url).then(() => {
        showToast('Direct file link copied to clipboard');
      }).catch(() => {
        showToast('Link ready to share');
      });
    }

    async function toggleLike(fileId, btn) {
      try {
        const res = await fetch(`/api/files/${fileId}/like`, { method: 'POST' });
        const data = await res.json();
        btn.dataset.liked = data.liked;
        btn.querySelector('.like-count').textContent = data.likeCount;
        btn.classList.toggle('liked', data.liked);
      } catch (err) {
        console.error('Like error:', err);
      }
    }

    async function toggleCommentPanel(fileId, card) {
      const panel = card.querySelector('.post-comment-drawer, .comment-panel');
      const isOpen = panel.classList.contains('open');
      if (isOpen) {
        panel.classList.remove('open');
        return;
      }
      panel.classList.add('open');
      if (!panel.dataset.loaded) {
        const res = await fetch(`/api/files/${fileId}/comments`);
        const comments = await res.json();
        panel.querySelector('.comment-list').innerHTML = comments.map(c => `
          <div class="comment-item">
            <div class="comment-avatar">${escapeHtml(c.commenterName.charAt(0).toUpperCase())}</div>
            <div style="flex: 1; min-width: 0;">
              <p class="comment-author">${escapeHtml(c.commenterName)}</p>
              <p class="comment-text">${escapeHtml(c.commentText)}</p>
            </div>
          </div>
        `).join('') || '<p class="comment-empty">No comments yet. Start the discussion!</p>';
        panel.dataset.loaded = 'true';
      }
    }

    async function submitComment(fileId, card) {
      const input = card.querySelector('.comment-input');
      const text = input.value.trim();
      if (!text) return;
      const res = await fetch(`/api/files/${fileId}/comments`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ text })
      });
      if (!res.ok) return;
      input.value = '';
      const panel = card.querySelector('.post-comment-drawer, .comment-panel');
      panel.dataset.loaded = '';
      await toggleCommentPanel(fileId, card);
      toggleCommentPanel(fileId, card);

      // Increment comment badge count
      const countEl = card.querySelector('.comment-count');
      if (countEl) {
        countEl.textContent = parseInt(countEl.textContent || '0') + 1;
      }
    }

    async function deletePost(fileId, btn) {
      if (!confirm('Are you sure you want to delete this resource? This action cannot be undone.')) return;
      try {
        const res = await fetch(`/api/files/${fileId}`, { method: 'DELETE' });
        const data = await res.json();
        if (res.ok) {
          showToast('Post deleted successfully');
          const card = btn.closest('.feed-card');
          if (card) {
            card.style.transition = 'all 0.3s ease';
            card.style.opacity = '0';
            card.style.transform = 'scale(0.96)';
            setTimeout(() => card.remove(), 300);
          }
        } else {
          alert(data.message || 'Failed to delete post');
        }
      } catch (err) {
        alert('Network error while deleting post');
      }
    }

    function renderPost(f) {
      const badge = getFileBadge(f.originalName);
      const initial = (f.uploaderName || 'S').charAt(0).toUpperCase();
      const avatarHtml = f.uploaderAvatar 
        ? `<img src="${f.uploaderAvatar}" alt="${escapeHtml(f.uploaderName)}" class="post-avatar-img">`
        : initial;
      const isAdminUploader = f.isOfficial || f.uploaderRole === 'admin';
      
      const subjectTag = f.subject ? `<span class="post-pill-tag"><svg viewBox="0 0 24 24" width="12" height="12" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg>${escapeHtml(f.subject)}</span>` : '';
      const chapterTag = f.chapter ? `<span class="post-pill-tag"><svg viewBox="0 0 24 24" width="12" height="12" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/></svg>${escapeHtml(f.chapter)}</span>` : '';

      const verifiedBadgeHtml = isAdminUploader
        ? `<span class="post-verified-badge post-admin-badge" title="Verified Class Rep / Admin">
            <svg viewBox="0 0 24 24" width="11" height="11" fill="currentColor"><path d="M12 1L3 5v6c0 5.55 3.84 10.74 9 12 5.16-1.26 9-6.45 9-12V5l-9-4zm-2 16l-4-4 1.41-1.41L10 14.17l6.59-6.59L18 9l-8 8z"/></svg>
            Admin
          </span>`
        : `<span class="post-verified-badge" title="Verified Gandaki University Student">
            <svg viewBox="0 0 24 24" width="11" height="11" fill="currentColor"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-2 15l-5-5 1.41-1.41L10 14.17l7.59-7.59L19 8l-9 9z"/></svg>
            GU Student
          </span>`;

      const deleteBtnHtml = f.canDelete
        ? `<button class="post-delete-btn" onclick="deletePost(${f.id}, this)" title="Delete post">
            <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M3 6h18M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/>
            </svg>
          </button>`
        : '';

      return `
        <article class="feed-card social-post-card" data-file-id="${f.id}">
          
          <header class="post-header">
            <a href="profile.html?id=${f.uploadedBy}" class="post-avatar" title="View ${escapeHtml(f.uploaderName)}'s Profile">${avatarHtml}</a>
            <div class="post-user-info">
              <div class="post-author-row">
                <a href="profile.html?id=${f.uploadedBy}" class="post-author-name post-author-link">${escapeHtml(f.uploaderName || 'Student')}</a>
                ${verifiedBadgeHtml}
              </div>
              <div class="post-meta-row">
                <span class="post-student-handle">@${escapeHtml(f.uploadedBy || 'student')}</span>
                <span class="post-meta-sep">&middot;</span>
                <time class="post-timestamp" datetime="${f.uploadedAt}">${timeAgo(f.uploadedAt)}</time>
                <span class="post-meta-sep">&middot;</span>
                <span class="post-visibility" title="Public to Semester">
                  <svg viewBox="0 0 24 24" width="12" height="12" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M2 12h20M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/></svg>
                </span>
              </div>
            </div>

            <div class="post-header-actions">
              ${deleteBtnHtml}
              <button class="post-more-btn" onclick="copyPostLink(${f.id})" title="Copy link to file">
                <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/><circle cx="5" cy="12" r="1"/></svg>
              </button>
            </div>
          </header>

          <div class="post-content">
            <h3 class="post-title">${escapeHtml(f.title || f.originalName)}</h3>
            ${(subjectTag || chapterTag) ? `<div class="post-tags-row">${subjectTag}${chapterTag}</div>` : ''}
          </div>

          <div class="post-attachment-card">
            <div class="attachment-file-badge ${badge.iconClass}">
              <span>${badge.ext}</span>
            </div>
            <div class="attachment-details">
              <p class="attachment-name" title="${escapeHtml(f.originalName)}">${escapeHtml(f.originalName)}</p>
              <span class="attachment-meta">${formatSize(f.sizeBytes)} &middot; ${badge.ext} Resource</span>
            </div>
            <div class="attachment-actions">
              <a href="/api/files/${f.id}/view" target="_blank" rel="noopener" class="attach-action-btn attach-btn-view" title="Preview file in browser">
                <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
                <span>View</span>
              </a>
              <a href="/api/files/${f.id}/download" class="attach-action-btn attach-btn-download" title="Download file">
                <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M7 10l5 5 5-5M12 15V3"/></svg>
                <span>Get</span>
              </a>
            </div>
          </div>

          <footer class="post-engage-bar">
            <button class="post-action-btn like-btn ${f.liked ? 'liked' : ''}" data-liked="${f.liked ? 'true' : 'false'}" onclick="toggleLike(${f.id}, this)">
              <svg viewBox="0 0 24 24" fill="${f.liked ? 'currentColor' : 'none'}" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                <path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.6l-1-1a5.5 5.5 0 0 0-7.8 7.8l1 1L12 21l7.8-7.6 1-1a5.5 5.5 0 0 0 0-7.8z"/>
              </svg>
              <span class="like-count">${f.likeCount || 0}</span>
            </button>

            <button class="post-action-btn comment-btn" onclick="toggleCommentPanel(${f.id}, this.closest('.feed-card'))">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                <path d="M21 11.5a8.5 8.5 0 0 1-8.5 8.5 8.4 8.4 0 0 1-3.5-.75L3 21l1.8-5.4A8.4 8.4 0 0 1 4 12.5 8.5 8.5 0 1 1 21 11.5z"/>
              </svg>
              <span class="comment-count">${f.commentCount || 0}</span>
            </button>

            <button class="post-action-btn share-btn" onclick="copyPostLink(${f.id})" title="Copy link">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                <path d="M4 12v8a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-8M16 6l-4-4-4 4M12 2v13"/>
              </svg>
              <span>Share</span>
            </button>
          </footer>

          <div class="comment-panel post-comment-drawer">
            <div class="comment-list"></div>
            <div class="comment-composer">
              <input type="text" class="comment-input post-comment-input" placeholder="Write a comment for the class…" maxlength="500">
              <button class="comment-submit post-comment-submit" onclick="submitComment(${f.id}, this.closest('.feed-card'))" title="Post comment">
                <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 2L11 13M22 2l-7 20-4-9-9-4 20-7z"/></svg>
              </button>
            </div>
          </div>

        </article>
      `;
    }

    fetch('/api/files')
      .then(res => res.ok ? res.json() : [])
      .then(files => {
        if (!files.length) return;
        document.getElementById('realFiles').innerHTML = files.map(renderPost).join('');
      });

    // --- Search Logic ---
    const searchInput = document.getElementById('headerSearchInput');
    const searchResults = document.getElementById('searchResults');
    const realFiles = document.getElementById('realFiles');
    const demoNotes = document.getElementById('demoNotes');
    const dashHero = document.querySelector('.dash-hero');
    const feedHeading = document.querySelector('.feed-heading');
    
    let searchTimeout = null;

    function renderSubjectCard(s) {
      return `
        <a href="library.html?subject=${encodeURIComponent(s.subject)}" class="search-subject-card">
          <div class="subject-icon">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg>
          </div>
          <div class="subject-info">
            <h4>${escapeHtml(s.subject)}</h4>
            <span>${s.fileCount} files &middot; ${s.chapterCount} chapters</span>
          </div>
        </a>
      `;
    }

    if (searchInput) {
      searchInput.addEventListener('input', (e) => {
        const q = e.target.value.trim();
        clearTimeout(searchTimeout);

        if (!q) {
          // Restore default view
          searchResults.style.display = 'none';
          dashHero.style.display = 'flex'; // .dash-hero is flex
          feedHeading.style.display = 'flex';
          realFiles.style.display = 'block';
          if(demoNotes) demoNotes.style.display = 'block';
          return;
        }

        searchTimeout = setTimeout(async () => {
          try {
            const res = await fetch('/api/search?q=' + encodeURIComponent(q));
            if (!res.ok) return;
            const data = await res.json();

            dashHero.style.display = 'none';
            feedHeading.style.display = 'none';
            realFiles.style.display = 'none';
            if(demoNotes) demoNotes.style.display = 'none';
            
            searchResults.style.display = 'block';
            
            let html = '<div class="search-results-heading"><h2>Search Results</h2><span>For "' + escapeHtml(q) + '"</span></div>';

            if (data.subjects && data.subjects.length > 0) {
              html += '<h3 class="search-section-title">Subjects</h3>';
              html += '<div class="search-subjects-grid">';
              html += data.subjects.map(renderSubjectCard).join('');
              html += '</div>';
            }

            if (data.files && data.files.length > 0) {
              html += '<h3 class="search-section-title">Files</h3>';
              html += data.files.map(renderPost).join('');
            }

            if ((!data.subjects || data.subjects.length === 0) && (!data.files || data.files.length === 0)) {
              html += '<div class="empty-search-state"><p>No files or subjects found matching your query.</p></div>';
            }

            searchResults.innerHTML = html;
            setTimeout(initDashboardCardPhysics, 50);
          } catch (err) {
            console.error("Search error:", err);
          }
        }, 300);
      });
    }

    // --- 3D Gyro Perspective Tilt Physics (Same as Photo Gallery) ---
    function initDashboardCardPhysics() {
      const cards = document.querySelectorAll('.feed-card, .fb-card, .social-post-card, .search-subject-card');
      cards.forEach(card => {
        if (card.dataset.physicsBound) return;
        card.dataset.physicsBound = 'true';

        let rect;
        card.addEventListener('mouseenter', () => {
          rect = card.getBoundingClientRect();
        });

        card.addEventListener('mousemove', (e) => {
          if (!rect) rect = card.getBoundingClientRect();
          const x = e.clientX - rect.left;
          const y = e.clientY - rect.top;
          const cx = rect.width / 2;
          const cy = rect.height / 2;
          const rotateX = ((y - cy) / cy) * -3.2;
          const rotateY = ((x - cx) / cx) * 3.2;

          card.style.transform = `perspective(900px) rotateX(${rotateX.toFixed(2)}deg) rotateY(${rotateY.toFixed(2)}deg) translateZ(4px)`;
        });

        card.addEventListener('mouseleave', () => {
          card.style.transform = '';
        });
      });
    }

    setTimeout(initDashboardCardPhysics, 400);
    const dashObs = new MutationObserver(() => initDashboardCardPhysics());
    if (realFiles) dashObs.observe(realFiles, { childList: true });
    if (searchResults) dashObs.observe(searchResults, { childList: true });
  </script>
  <script src="notifications.js"></script>
</body>
</html>
