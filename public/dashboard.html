<html lang="en">
<head>

<title>Dashboard — Semester Library</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

<body class="dash">

  <header class="dash-header">
    <span class="lib-wordmark">Semester Library</span>
    <div class="dash-header-actions">
      <button class="dash-logout" onclick="location.href='files.html'">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 3v12"/><path d="M7 8l5-5 5 5"/><path d="M5 21h14a2 2 0 0 0 2-2v-4"/><path d="M3 15v4a2 2 0 0 0 2 2"/>
        </svg>
        Files
      </button>
      <button id="logoutBtn" class="dash-logout">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/>
          <path d="M16 17l5-5-5-5"/>
          <path d="M21 12H9"/>
        </svg>
        Logout
      </button>
    </div>
  </header>

  <section class="dash-hero">
    <div class="dash-avatar" id="avatarInitial">·</div>
    <div>
      <p class="dash-greeting-line" id="greetingLine">Loading…</p>
      <p class="dash-id" id="idLine"></p>
    </div>
  </section>

  <div class="feed-heading">
    <h2>Your Feed</h2>
    <span>Updated just now</span>
  </div>

  <main class="feed">
    <div id="realFiles"></div>
    <div id="demoNotes"></div>
  </main>

  <nav class="bottom-nav">
    <button class="nav-item active" data-tab="notes">
      <svg viewBox="0 0 24 24"><path d="M14 3v4a1 1 0 0 0 1 1h4"/><path d="M17 21H7a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h7l5 5v11a2 2 0 0 1-2 2z"/><path d="M9 13h6M9 17h4"/></svg>
      <span class="nav-label">Notes</span>
    </button>
    <button class="nav-item" data-tab="notice">
      <svg viewBox="0 0 24 24"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>
      <span class="nav-label">Notice</span>
    </button>
   <a href="library.html" class="nav-item" data-tab="Library">
  <svg viewBox="0 0 24 24">
    <path d="M21 11.5a8.5 8.5 0 0 1-8.5 8.5 8.4 8.4 0 0 1-3.5-.75L3 21l1.8-5.4A8.4 8.4 0 0 1 4 12.5 8.5 8.5 0 1 1 21 11.5z"/>
  </svg>
  <span class="nav-label">Library</span>
</a> 

    <a href="routine.html" class="nav-item" data-tab="routine">
  <svg viewBox="0 0 24 24">
    <rect x="3" y="4" width="18" height="18" rx="2"/>
    <path d="M16 2v4M8 2v4M3 10h18"/>
  </svg>

  <span class="nav-label">Routine</span>
</a> 

  <script>
    function getGreeting() {
      const hour = new Date().getHours();
      if (hour < 12) return "Good morning";
      if (hour < 17) return "Good afternoon";
      return "Good evening";
    }

    fetch('/api/me')
      .then(res => {
        if (!res.ok) throw new Error('Not logged in');
        return res.json();
      })
      .then(data => {
        document.getElementById('greetingLine').textContent = `${getGreeting()}, ${data.name}`;
        document.getElementById('idLine').textContent = `Student ID: ${data.studentId}`;
        document.getElementById('avatarInitial').textContent = data.name.charAt(0).toUpperCase();
      })
      .catch(() => {
        window.location.href = 'login.html';
      });

    document.getElementById('logoutBtn').addEventListener('click', () => {
      fetch('/api/logout', { method: 'POST' })
        .then(() => window.location.href = 'index.html');
    });

    document.querySelectorAll('.nav-item').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.nav-item').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
      });
    });

    // --- Demo notes (placeholder content — safe to delete once real notices exist) ---
    document.getElementById('demoNotes').innerHTML = `
      <article class="feed-card">
        <div class="feed-card-top">
          <span class="feed-icon icon-note">
            <svg viewBox="0 0 24 24" fill="none" stroke-linecap="round" stroke-linejoin="round">
              <path d="M14 3v4a1 1 0 0 0 1 1h4"/>
              <path d="M17 21H7a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h7l5 5v11a2 2 0 0 1-2 2z"/>
              <path d="M9 13h6M9 17h4"/>
            </svg>
          </span>
          <div class="feed-card-heading"><span class="feed-tag">Note</span></div>
          <span class="feed-meta">Basics of IT &middot; 2h ago</span>
        </div>
        <h3>Chapter 4 slides uploaded</h3>
        <p>Slides for "Basics of IT — Networking Fundamentals" are now available in Resources. Review before Thursday's class.</p>
      </article>
      <article class="feed-card">
        <div class="feed-card-top">
          <span class="feed-icon icon-notice">
            <svg viewBox="0 0 24 24" fill="none" stroke-linecap="round" stroke-linejoin="round">
              <path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"/>
              <path d="M13.73 21a2 2 0 0 1-3.46 0"/>
            </svg>
          </span>
          <div class="feed-card-heading"><span class="feed-tag">Notice</span></div>
          <span class="feed-meta">Exam Section &middot; 5h ago</span>
        </div>
        <h3>Mid-term routine published</h3>
        <p>The mid-term examination routine for Year I has been finalized. Check the Routine tab for your schedule.</p>
      </article>
    `;

    // --- Real uploaded files, pulled into the feed ---
    function formatSize(bytes) {
      if (bytes < 1024) return bytes + ' B';
      if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(1) + ' KB';
      return (bytes / (1024 * 1024)).toFixed(1) + ' MB';
    }

    function timeAgo(iso) {
      const diffMs = Date.now() - new Date(iso).getTime();
      const mins = Math.floor(diffMs / 60000);
      if (mins < 1) return 'just now';
      if (mins < 60) return mins + 'm ago';
      const hrs = Math.floor(mins / 60);
      if (hrs < 24) return hrs + 'h ago';
      return Math.floor(hrs / 24) + 'd ago';
    }  

    function isImageFile(name) {
      return /\.(jpg|jpeg|png|gif|webp|svg)$/i.test(name);
    }

    function getFileExt(name) {
      const match = name.match(/\.([a-zA-Z0-9]+)$/);
      return match ? match[1].toUpperCase() : 'FILE';
    }

    async function toggleLike(fileId, btn) {
      const res = await fetch(`/api/files/${fileId}/like`, { method: 'POST' });
      const data = await res.json();
      btn.dataset.liked = data.liked;
      btn.querySelector('.like-count').textContent = data.likeCount;
      btn.classList.toggle('liked', data.liked);
    }

    async function toggleCommentPanel(fileId, card) {
      const panel = card.querySelector('.comment-panel');
      const isOpen = panel.classList.contains('open');
      if (isOpen) {
        panel.classList.remove('open');
        return;
      }
      panel.classList.add('open');
      if (!panel.dataset.loaded) {
        const res = await fetch(`/api/files/${fileId}/comments`);
        const comments = await res.json();
        panel.querySelector('.comment-list').innerHTML = comments.map(c => `
          <div class="comment-item">
            <div class="comment-avatar">${c.commenterName.charAt(0).toUpperCase()}</div>
            <div>
              <p class="comment-author">${c.commenterName}</p>
              <p class="comment-text">${c.commentText}</p>
            </div>
          </div>
        `).join('') || '<p class="comment-empty">No comments yet.</p>';
        panel.dataset.loaded = 'true';
      }
    }

    async function submitComment(fileId, card) {
      const input = card.querySelector('.comment-input');
      const text = input.value.trim();
      if (!text) return;
      const res = await fetch(`/api/files/${fileId}/comments`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ text })
      });
      if (!res.ok) return;
      input.value = '';
      const panel = card.querySelector('.comment-panel');
      panel.dataset.loaded = '';
      await toggleCommentPanel(fileId, card);
      toggleCommentPanel(fileId, card);
    }  
    function isImageFile(name) {
      return /\.(jpg|jpeg|png|gif|webp|svg)$/i.test(name);
    }

    function getFileExt(name) {
      const match = name.match(/\.([a-zA-Z0-9]+)$/);
      return match ? match[1].toUpperCase() : 'FILE';
    }

    async function toggleLike(fileId, btn) {
      const res = await fetch(`/api/files/${fileId}/like`, { method: 'POST' });
      const data = await res.json();
      btn.dataset.liked = data.liked;
      btn.querySelector('.like-count').textContent = data.likeCount;
      btn.classList.toggle('liked', data.liked);
    }

    async function toggleCommentPanel(fileId, card) {
      const panel = card.querySelector('.comment-panel');
      const isOpen = panel.classList.contains('open');
      if (isOpen) {
        panel.classList.remove('open');
        return;
      }
      panel.classList.add('open');
      if (!panel.dataset.loaded) {
        const res = await fetch(`/api/files/${fileId}/comments`);
        const comments = await res.json();
        panel.querySelector('.comment-list').innerHTML = comments.map(c => `
          <div class="comment-item">
            <div class="comment-avatar">${c.commenterName.charAt(0).toUpperCase()}</div>
            <div>
              <p class="comment-author">${c.commenterName}</p>
              <p class="comment-text">${c.commentText}</p>
            </div>
          </div>
        `).join('') || '<p class="comment-empty">No comments yet.</p>';
        panel.dataset.loaded = 'true';
      }
    }

    async function submitComment(fileId, card) {
      const input = card.querySelector('.comment-input');
      const text = input.value.trim();
      if (!text) return;
      const res = await fetch(`/api/files/${fileId}/comments`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ text })
      });
      if (!res.ok) return;
      input.value = '';
      const panel = card.querySelector('.comment-panel');
      panel.dataset.loaded = '';
      await toggleCommentPanel(fileId, card);
      toggleCommentPanel(fileId, card);
    }

function isImageFile(name) {
      return /\.(jpg|jpeg|png|gif|webp|svg)$/i.test(name);
    }

    function getFileExt(name) {
      const match = name.match(/\.([a-zA-Z0-9]+)$/);
      return match ? match[1].toUpperCase() : 'FILE';
    }
    fetch('/api/files')
      .then(res => res.ok ? res.json() : [])
      .then(files => {
        if (!files.length) return;
        document.getElementById('realFiles').innerHTML = files.map(f => `
          <article class="fb-card" data-file-id="${f.id}">
            <div class="fb-card-header">
              <div class="fb-avatar">${f.uploaderName.charAt(0).toUpperCase()}</div>
              <div class="fb-header-text">
                <p class="fb-uploader-name">${f.uploaderName}</p>
                <p class="fb-meta">uploaded a file &middot; ${timeAgo(f.uploadedAt)}</p>
              </div>
            </div>
            <p class="fb-caption">${f.title || f.originalName}</p>
            <a href="/api/files/${f.id}/view" target="_blank" class="fb-preview">
              ${isImageFile(f.originalName) ? `
                <img src="/api/files/${f.id}/view" alt="${f.originalName}" class="fb-preview-img">
              ` : `
                <div class="fb-doc-thumb">
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M14 3v4a1 1 0 0 0 1 1h4"/>
                    <path d="M17 21H7a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h7l5 5v11a2 2 0 0 1-2 2z"/>
                  </svg>
                  <span class="fb-ext-badge">${getFileExt(f.originalName)}</span>
                  <div class="fb-play-badge">
                    <svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
                  </div>
                </div>
                <div class="fb-doc-titlebar">${f.originalName} &middot; ${formatSize(f.sizeBytes)}</div>
              `}
            </a>

            <div class="fb-engage-bar">
              <button class="like-btn ${f.liked ? 'liked' : ''}" data-liked="${f.liked ? 'true' : 'false'}" onclick="toggleLike(${f.id}, this)">
                <svg viewBox="0 0 24 24" fill="${f.liked ? 'currentColor' : 'none'}" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.6l-1-1a5.5 5.5 0 0 0-7.8 7.8l1 1L12 21l7.8-7.6 1-1a5.5 5.5 0 0 0 0-7.8z"/>
                </svg>
                <span class="like-count">${f.likeCount}</span>
              </button>
              <button class="comment-btn" onclick="toggleCommentPanel(${f.id}, this.closest('.fb-card'))">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M21 11.5a8.5 8.5 0 0 1-8.5 8.5 8.4 8.4 0 0 1-3.5-.75L3 21l1.8-5.4A8.4 8.4 0 0 1 4 12.5 8.5 8.5 0 1 1 21 11.5z"/>
                </svg>
                <span>${f.commentCount}</span>
              </button>
              <a href="/api/files/${f.id}/view" target="_blank" class="fb-view-link">View</a>
              <a href="/api/files/${f.id}/download" class="fb-download-link">Download</a>
            </div>

            <div class="comment-panel">
              <div class="comment-list"></div>
              <div class="comment-form">
                <input type="text" class="comment-input" placeholder="Write a comment…" maxlength="500">
                <button class="comment-submit" onclick="submitComment(${f.id}, this.closest('.fb-card'))">Post</button>
              </div>
            </div>
          </article>
        `).join('');
      });

    // --- Hover preview popup ---
   
  </script>
  </script>
</body>
</html>
