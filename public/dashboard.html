  <!-- Anti-flash inline script: executes before paint to prevent FOUC -->
  <script>
    (function() {
      try {
        var t = localStorage.getItem('theme');
        if (!t) t = (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) ? 'dark' : 'light';
        var d = t === 'dark';
        document.documentElement.setAttribute('data-theme', t);
        if (d) {
          document.documentElement.classList.add('dark');
        } else {
          document.documentElement.classList.remove('dark');
        }
      } catch (e) {}
    })();
  </script>

    /* Create Post Modal Dialog */
    .post-modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.45);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 2000;
      padding: 16px;
      opacity: 0;
      visibility: hidden;
      transition: opacity 0.22s cubic-bezier(0.16, 1, 0.3, 1), visibility 0.22s ease;
    }

    .post-modal-overlay:not([hidden]).open {
      opacity: 1;
      visibility: visible;
    }

    .post-modal-overlay[hidden] {
      display: none !important;
    }

    .post-modal-card {
      background: var(--ap-surface, #ffffff);
      border: 1px solid var(--border-color, rgba(0, 0, 0, 0.12));
      border-radius: 20px;
      width: 100%;
      max-width: 520px;
      padding: 24px;
      box-shadow: 0 24px 64px rgba(0, 0, 0, 0.24);
      transform: scale(0.96) translateY(8px);
      transition: transform 0.24s cubic-bezier(0.16, 1, 0.3, 1);
      display: flex;
      flex-direction: column;
      max-height: 90vh;
      overflow-y: auto;
    }

    .post-modal-overlay.open .post-modal-card {
      transform: scale(1) translateY(0);
    }

    [data-theme="dark"] .post-modal-overlay,
    body.dark-mode .post-modal-overlay {
      background: rgba(0, 0, 0, 0.65);
    }

    [data-theme="dark"] .post-modal-card,
    body.dark-mode .post-modal-card {
      background: var(--bg-surface, #1c1c1e);
      border-color: var(--border-color, rgba(255, 255, 255, 0.12));
      color: var(--text-primary, #f5f5f7);
      box-shadow: 0 24px 64px rgba(0, 0, 0, 0.7);
    }

    .post-modal-card .modal-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 16px;
      padding-bottom: 12px;
      border-bottom: 1px solid var(--border-color, rgba(0, 0, 0, 0.08));
    }

    .post-modal-card .modal-title {
      font-size: 17px;
      font-weight: 700;
      color: var(--text-primary);
      margin: 0;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .post-modal-card .modal-subtitle {
      font-size: 13px;
      color: var(--text-secondary, #86868b);
      margin: 4px 0 0;
    }

    .post-modal-card .modal-close {
      background: transparent;
      border: none;
      font-size: 22px;
      line-height: 1;
      color: var(--text-secondary, #86868b);
      cursor: pointer;
      padding: 4px 8px;
      border-radius: 8px;
      transition: color 0.15s ease, background 0.15s ease;
    }

    .post-modal-card .modal-close:hover {
      color: var(--text-primary);
      background: var(--ap-surface-hover, rgba(0, 0, 0, 0.05));
    }

    .modal-post-composer {
      display: flex;
      flex-direction: column;
      background: transparent !important;
      border: none !important;
      box-shadow: none !important;
      padding: 0 !important;
      transform: none !important;
      animation: none !important;
    }

    .modal-post-composer textarea {
      width: 100%;
      box-sizing: border-box;
      background: var(--bg-secondary, #f5f5f7);
      border: 1px solid var(--border-color, #e5e5ea);
      border-radius: 12px;
      color: var(--text-primary, #1d1d1f);
      font: inherit;
      font-size: 14.5px;
      line-height: 1.5;
      padding: 12px 14px;
      resize: vertical;
      min-height: 110px;
      margin: 0 0 12px 0;
      outline: none;
      transition: border-color 0.2s ease, box-shadow 0.2s ease;
    }

    .modal-post-composer textarea:focus {
      border-color: var(--accent-color, #0071e3);
      box-shadow: 0 0 0 3px rgba(0, 113, 227, 0.15);
    }

    .modal-post-composer .post-composer-actions {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-top: 6px;
    }

    .modal-post-composer .post-type-selector-wrap {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .modal-post-composer .post-type-selector-wrap label {
      font-size: 13px;
      font-weight: 600;
      color: var(--text-secondary);
    }

    .modal-post-composer select#postType {
      background: var(--bg-secondary, #f5f5f7);
      color: var(--text-primary, #1d1d1f);
      border: 1px solid var(--border-color, #e5e5ea);
      border-radius: 10px;
      padding: 7px 12px;
      font-size: 13.5px;
      font-family: inherit;
      outline: none;
      cursor: pointer;
    }

    .modal-post-composer .post-composer-actions button#publishPost {
      margin-left: auto;
      background: var(--accent-color, #0071e3);
      color: #ffffff;
      border: none;
      font-weight: 600;
      font-size: 14px;
      padding: 8px 20px;
      border-radius: 980px;
      cursor: pointer;
      transition: transform 0.15s ease, opacity 0.15s ease, background 0.15s ease;
    }

    .modal-post-composer .post-composer-actions button#publishPost:hover {
      background: var(--accent-hover, #0077ed);
      transform: scale(1.02);
    }

    .modal-post-composer .post-composer-actions button#choosePostImage {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 36px;
      height: 36px;
      padding: 0;
      border-radius: 50%;
      border: 1px solid var(--border-color, #e5e5ea);
      background: var(--bg-secondary, #f5f5f7);
      color: var(--text-primary, #1d1d1f);
      cursor: pointer;
      margin-left: 0;
      transition: background 0.2s ease, border-color 0.2s ease, color 0.2s ease;
    }

    .modal-post-composer .post-composer-actions button#choosePostImage:hover {
      border-color: var(--accent-color, #0071e3);
      color: var(--accent-color, #0071e3);
    }

    /* Resource and Lab embeds share a compact attachment layout. */
    .post-card .file-attachment {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-top: 10px;
      padding: 12px;
      border: 1px solid var(--border-color);
      border-radius: 12px;
      background: var(--bg-secondary);
      min-width: 0;
    }
    .post-card .file-icon {
      width: 40px;
      height: 40px;
      flex-shrink: 0;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--text-primary);
      color: var(--bg-primary);
      font-size: 11px;
      font-weight: 700;
    }
    .post-card .file-icon-lab { background: var(--text-primary); }
    .post-card .post-actions button:disabled { opacity: 0.45; cursor: not-allowed; }
    .post-card .file-info { flex: 1; min-width: 0; }
    .post-card .file-name {
      margin: 0;
      font-size: 14px;
      font-weight: 400;
      color: var(--text-primary);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .post-card[data-file-id] .post-title { font-weight: 400; }
    .post-card .file-meta { font-size: 12px; color: var(--text-muted); }
    .post-card .file-actions { display: flex; gap: 8px; flex-shrink: 0; }
    .post-card .file-action {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 13px;
      font-weight: 600;
      border: 1px solid var(--border-color);
      background: transparent;
      color: var(--text-primary);
      text-decoration: none;
    }
    .post-card .file-action.primary { background: var(--text-primary); color: var(--bg-primary); border-color: transparent; }
    .post-tags { display: flex; flex-wrap: wrap; gap: 6px; margin: 6px 0 4px; }
    .post-tag { font-size: 12px; padding: 3px 10px; border-radius: 20px; background: var(--bg-secondary); color: var(--text-muted); border: 1px solid var(--border-color); }
    body.dash .feed .post-card .post-actions { justify-content: flex-start; gap: 8px 32px !important; }
    body.dash .feed .post-card .post-actions > * { position: static; margin: 0 !important; }
    body.dash .feed .post-card .post-actions .status-btn { background: transparent !important; color: var(--text-muted) !important; }
    body.dash .feed .post-card .post-actions button:focus-visible { outline: 2px solid var(--text-primary) !important; outline-offset: 3px; }
    @media (max-width: 600px) {
      .post-card .file-attachment { flex-wrap: wrap; }
      .post-card .file-info { flex-basis: calc(100% - 52px); }
      .post-card .file-actions { margin-left: 52px; }
    }
  </style>
</head>

            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="3"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="m21 15-5-5L5 21"/></svg>
          </button>
          <div class="post-type-selector-wrap">
            <label for="postType">Post type</label>
            <select id="postType" name="type">
              <option value="status">Status</option>
              <option value="notice">Notice</option>
            </select>
          </div>
          <button type="submit" id="publishPost" class="post-action-btn">Post</button>
        </div>
        <p id="postComposerMessage" class="post-feedback" role="status" aria-live="polite"></p>
      </form>
    </div>
  </div>

  <script>
    function getGreeting() {
      const hour = new Date().getHours();
      if (hour < 12) return "Good morning";
      if (hour < 17) return "Good afternoon";
      return "Good evening";
    }

    fetch('/api/me')
      .then(res => {
        if (!res.ok) throw new Error('Not logged in');
        return res.json();
      })
      .then(data => {
        const avatarEl = document.getElementById('avatarInitial');
        if (avatarEl) {
          avatarEl.classList.remove('skeleton-box', 'skeleton-avatar');
          avatarEl.style.color = '';
          avatarEl.textContent = data.name.charAt(0).toUpperCase();
        }
        const heroSkeleton = document.getElementById('heroSkeletonText');
        const heroReal = document.getElementById('heroRealText');
        if (heroSkeleton) heroSkeleton.style.display = 'none';
        if (heroReal) heroReal.style.display = 'block';

        document.getElementById('greetingLine').textContent = `${getGreeting()}, ${data.name}`;
        document.getElementById('idLine').textContent = `Student ID: ${data.studentId}`;

        // Populate top right header profile chip
        const headerAvatar = document.getElementById('headerAvatar');
        const headerName = document.getElementById('headerProfileName');
        if (headerName) headerName.textContent = data.name.split(' ')[0];
        if (headerAvatar) headerAvatar.textContent = data.name.charAt(0).toUpperCase();

        // Fetch avatar if uploaded
        fetch('/api/profile').then(r => r.ok ? r.json() : null).then(p => {
          if (p && p.avatarUrl && headerAvatar) {
            headerAvatar.innerHTML = `<img src="${p.avatarUrl}" alt="${p.name}">`;
          }
        }).catch(() => { });
      })
      .catch(() => {
        const toast = document.getElementById('minimalAuthToast');
        if (toast) {
          toast.classList.add('show');
          setTimeout(() => toast.classList.remove('show'), 4000);
        }
      });

    const logoutBtnEl = document.getElementById('logoutBtn');
    if (logoutBtnEl) {
      logoutBtnEl.addEventListener('click', () => {
        fetch('/api/logout', { method: 'POST' })
          .then(() => window.location.href = 'index.html');
      });
    }

    document.querySelectorAll('.nav-item').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.nav-item').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
      });
    });

    function escapeHtml(str) {
      if (!str) return '';
      return String(str).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
    }

    function formatSize(bytes) {
      if (bytes < 1024) return bytes + ' B';
      if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(1) + ' KB';
      return (bytes / (1024 * 1024)).toFixed(1) + ' MB';
    }

    function timeAgo(iso) {
      if (!iso) return 'just now';
      const time = new Date(iso).getTime();
      if (isNaN(time)) return 'just now';

      let diffMs = Date.now() - time;
      // Handle client clock being behind server clock
      if (diffMs < 0) diffMs = Math.abs(diffMs);

      const mins = Math.floor(diffMs / 60000);
      if (mins < 1) return 'just now';
      if (mins < 60) return mins + 'm ago';
      const hrs = Math.floor(mins / 60);
      if (hrs < 24) return hrs + 'h ago';
      return Math.floor(hrs / 24) + 'd ago';
    }

    function getFileBadge(name) {
      const ext = (name.match(/\.([a-zA-Z0-9]+)$/) || ['', 'FILE'])[1].toUpperCase();
      let iconClass = 'badge-doc';
      if (['PDF'].includes(ext)) iconClass = 'badge-pdf';
      else if (['ZIP', 'RAR', '7Z', 'TAR', 'GZ'].includes(ext)) iconClass = 'badge-zip';
      else if (['JPG', 'JPEG', 'PNG', 'WEBP', 'GIF', 'SVG'].includes(ext)) iconClass = 'badge-img';
      else if (['JS', 'PY', 'CPP', 'C', 'JAVA', 'HTML', 'CSS', 'JSON', 'SQL'].includes(ext)) iconClass = 'badge-code';
      else if (['PPT', 'PPTX', 'KEY'].includes(ext)) iconClass = 'badge-slide';
      return { ext, iconClass };
    }

    function showToast(message) {
      let toast = document.getElementById('socialToast');
      if (!toast) {
        toast = document.createElement('div');
        toast.id = 'socialToast';
        toast.className = 'social-toast';
        document.body.appendChild(toast);
      }
      toast.innerHTML = `<svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M20 6L9 17l-5-5"/></svg><span>${message}</span>`;
      toast.classList.add('show');
      setTimeout(() => toast.classList.remove('show'), 2400);
    }

    function copyPostLink(fileId) {
      const url = `${window.location.origin}/api/files/${fileId}/view`;
      navigator.clipboard.writeText(url).then(() => {
        showToast('Direct file link copied to clipboard');
      }).catch(() => {
        showToast('Link ready to share');
      });
    }

    async function toggleLike(fileId, btn) {
      if (btn.disabled) return;
      const isLiked = btn.dataset.liked === 'true';
      const countEl = btn.querySelector('.like-count');
      const currentCount = parseInt(countEl.textContent || '0', 10);
      function updateLike(liked, count) {
        btn.dataset.liked = String(liked);
        btn.classList.toggle('liked', liked);
        btn.setAttribute('aria-pressed', String(liked));
        btn.setAttribute('aria-label', liked ? 'Unlike post' : 'Like post');
        btn.querySelector('svg').setAttribute('fill', liked ? 'currentColor' : 'none');
        countEl.textContent = count;
      }
      updateLike(!isLiked, Math.max(0, currentCount + (isLiked ? -1 : 1)));
      btn.disabled = true;
      try {
        const res = await fetch(`/api/files/${fileId}/like`, { method: 'POST' });
        const data = await res.json();
        if (!res.ok) throw new Error(data.message || 'Could not update like.');
        updateLike(Boolean(data.liked), data.likeCount);
      } catch (err) {
        console.error('Like error:', err);
        updateLike(isLiked, currentCount);
        showToast(escapeHtml(err.message || 'Could not update like.'));
      } finally {
        btn.disabled = false;
      }
    }

    async function toggleCommentPanel(fileId, card) {
      const panel = card.querySelector('.post-comment-drawer, .comment-panel');
      const isOpen = panel.classList.contains('open');
      if (isOpen) {
        panel.classList.remove('open');
        return;
      }
      panel.classList.add('open');
      if (!panel.dataset.loaded) {
        const res = await fetch(`/api/files/${fileId}/comments`);
        const comments = await res.json();
        panel.querySelector('.comment-list').innerHTML = comments.map(c => `
          <div class="comment-item">
            <div class="comment-avatar">${escapeHtml(c.commenterName.charAt(0).toUpperCase())}</div>
            <div style="flex: 1; min-width: 0;">
              <p class="comment-author">${escapeHtml(c.commenterName)}</p>
              <p class="comment-text">${escapeHtml(c.commentText)}</p>
            </div>
          </div>
        `).join('') || '<p class="comment-empty">No comments yet. Start the discussion!</p>';
        panel.dataset.loaded = 'true';
      }
    }

    async function submitComment(fileId, card) {
      const input = card.querySelector('.comment-input');
      const text = input.value.trim();
      if (!text) return;
      const res = await fetch(`/api/files/${fileId}/comments`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ text })
      });
      if (!res.ok) return;
      input.value = '';
      const panel = card.querySelector('.post-comment-drawer, .comment-panel');
      panel.dataset.loaded = '';
      await toggleCommentPanel(fileId, card);
      toggleCommentPanel(fileId, card);

      // Increment comment badge count
      const countEl = card.querySelector('.comment-count');
      if (countEl) {
        countEl.textContent = parseInt(countEl.textContent || '0') + 1;
      }
    }

    function showAppleConfirmModal({
      title = 'Delete Item?',
      message = 'Are you sure you want to delete this item? This action cannot be undone.',
      confirmText = 'Delete',
      cancelText = 'Cancel',
      isDanger = true
    } = {}) {
      return new Promise((resolve) => {
        let overlay = document.getElementById('appleConfirmModalOverlay');
        if (!overlay) {
          overlay = document.createElement('div');
          overlay.id = 'appleConfirmModalOverlay';
          overlay.className = 'apple-confirm-overlay';
          overlay.innerHTML = `
            <div class="apple-confirm-card" onclick="event.stopPropagation()">
              <div class="apple-confirm-icon-wrap" id="appleConfirmIcon">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M3 6h18M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path>
                  <line x1="10" y1="11" x2="10" y2="17"></line>
                  <line x1="14" y1="11" x2="14" y2="17"></line>
                </svg>
              </div>
              <h3 class="apple-confirm-title" id="appleConfirmTitle"></h3>
              <p class="apple-confirm-desc" id="appleConfirmDesc"></p>
              <div class="apple-confirm-actions">
                <button type="button" class="apple-confirm-btn cancel" id="appleConfirmCancelBtn">Cancel</button>
                <button type="button" class="apple-confirm-btn danger" id="appleConfirmActionBtn">Delete</button>
              </div>
            </div>
          `;
          document.body.appendChild(overlay);
        }

        const titleEl = document.getElementById('appleConfirmTitle');
        const descEl = document.getElementById('appleConfirmDesc');
        const cancelBtn = document.getElementById('appleConfirmCancelBtn');
        const actionBtn = document.getElementById('appleConfirmActionBtn');

        titleEl.textContent = title;
        descEl.textContent = message;
        cancelBtn.textContent = cancelText;
        actionBtn.textContent = confirmText;

        if (isDanger) {
          actionBtn.className = 'apple-confirm-btn danger';
        } else {
          actionBtn.className = 'apple-confirm-btn';
          actionBtn.style.background = '#1d1d1f';
          actionBtn.style.color = '#ffffff';
        }

        function cleanup(result) {
          overlay.classList.remove('open');
          overlay.removeEventListener('click', onOverlayClick);
          cancelBtn.removeEventListener('click', onCancel);
          actionBtn.removeEventListener('click', onConfirm);
          document.removeEventListener('keydown', onKeyDown);
          resolve(result);
        }

        function onOverlayClick() { cleanup(false); }
        function onCancel() { cleanup(false); }
        function onConfirm() { cleanup(true); }
        function onKeyDown(e) {
          if (e.key === 'Escape') cleanup(false);
        }

        overlay.addEventListener('click', onOverlayClick);
        cancelBtn.addEventListener('click', onCancel);
        actionBtn.addEventListener('click', onConfirm);
        document.addEventListener('keydown', onKeyDown);

        requestAnimationFrame(() => {
          overlay.classList.add('open');
        });
      });
    }

    async function deletePost(fileId, btn) {
      const confirmed = await showAppleConfirmModal({
        title: 'Delete Resource?',
        message: 'Are you sure you want to delete this resource? This action cannot be undone.',
        confirmText: 'Delete Resource',
        cancelText: 'Cancel',
        isDanger: true
      });
      if (!confirmed) return;

      try {
        const res = await fetch(`/api/files/${fileId}`, { method: 'DELETE' });
        const data = await res.json();
        if (res.ok) {
          feedItems = feedItems.filter(item => item._feedType !== 'file' || Number(item.id) !== fileId);
          showToast('Post deleted successfully');
          const card = btn.closest('.feed-card');
          if (card) {
            card.style.transition = 'all 0.3s ease';
            card.style.opacity = '0';
            card.style.transform = 'scale(0.96)';
            setTimeout(() => card.remove(), 300);
          }
        } else {
          showToast(data.message || 'Failed to delete post');
        }
      } catch (err) {
        showToast('Network error while deleting post');
      }
    }

    function renderPost(post) {
      if (post.type === 'assignment' || post._feedType === 'assignment') {
        return renderAssignmentPost(post);
      }
      if (post.type === 'status' || post.type === 'notice') {
        return renderStatusPost(post);
      }
      return renderFilePost(post);
    }

    function renderPostShell({ kind, id, className = '', profileUrl, avatar, name, badge = '', meta, controls = '', body, actions, comments = '' }) {
      return `
        <article class="feed-card social-post-card post-card ${className}" data-${kind}-id="${id}">
          <a href="${profileUrl}" class="post-avatar" aria-label="View ${escapeHtml(name)}'s profile">${avatar}</a>
          <div class="post-main post-body">
            <header class="post-header">
              <div class="post-user-info">
                <div class="post-author-row">
                  <a href="${profileUrl}" class="post-author-name post-author-link">${escapeHtml(name)}</a>
                  ${badge}
                </div>
                <div class="post-meta-row">${meta}</div>
              </div>
              ${controls ? `<div class="post-header-actions">${controls}</div>` : ''}
            </header>
            ${body}
            ${actions}
            ${comments}
          </div>
        </article>`;
    }

    function renderPostActions({ liked = false, likes = 0, comments = 0, likeAction, commentAction, shareAction, extra = '' }) {
      return `<footer class="post-actions post-footer">
        <button type="button" class="action-btn like-btn ${liked ? 'liked' : ''}" data-liked="${Boolean(liked)}" aria-pressed="${Boolean(liked)}" aria-label="${liked ? 'Unlike' : 'Like'} post" onclick="${likeAction}">
          <svg viewBox="0 0 24 24" fill="${liked ? 'currentColor' : 'none'}" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78L12 21.23l8.84-8.84a5.5 5.5 0 0 0 0-7.78z"/></svg>
          <span class="like-count">${likes}</span>
        </button>
        <button type="button" class="action-btn comment-btn" ${commentAction ? `onclick="${commentAction}" aria-label="Reply to post"` : 'disabled aria-label="Replies unavailable for Lab assignments" title="Lab assignments do not support replies"'}>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 11.5a8.5 8.5 0 0 1-8.5 8.5 8.4 8.4 0 0 1-3.5-.75L3 21l1.8-5.4A8.4 8.4 0 0 1 4 12.5 8.5 8.5 0 1 1 21 11.5z"/></svg>
          <span class="comment-count">${comments}</span>
        </button>
        <button type="button" class="action-btn share-btn" onclick="${shareAction}" aria-label="Share post" title="Copy link to post">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 12v8a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-8M16 6l-4-4-4 4M12 2v13"/></svg>
        </button>
        ${extra}
      </footer>`;
    }

    function renderFilePost(f) {
      const badge = getFileBadge(f.originalName);
      const initial = (f.uploaderName || 'S').charAt(0).toUpperCase();
      const avatarUrl = safePostUrl(f.uploaderAvatar);
      const avatarHtml = avatarUrl
        ? `<img src="${avatarUrl}" alt="${escapeHtml(f.uploaderName)}" class="post-avatar-img">`
        : escapeHtml(initial);
      const subjectTag = f.subject ? `<span class="post-tag">${escapeHtml(f.subject)}</span>` : '';
      const chapterTag = f.chapter ? `<span class="post-tag">${escapeHtml(f.chapter)}</span>` : '';
      const uploaderRole = f.uploaderRole || 'student';
      const isSpecialUploader = uploaderRole === 'admin' || uploaderRole === 'teacher' || uploaderRole === 'faculty';
      let verifiedBadgeHtml = '';

      if (uploaderRole === 'admin') {
        verifiedBadgeHtml = `<span class="post-verified-badge post-admin-badge" title="Verified System Administrator">
            <svg viewBox="0 0 24 24" width="11" height="11" fill="currentColor"><path d="M12 1L3 5v6c0 5.55 3.84 10.74 9 12 5.16-1.26 9-6.45 9-12V5l-9-4zm-2 16l-4-4 1.41-1.41L10 14.17l6.59-6.59L18 9l-8 8z"/></svg>
            Admin
          </span>`;
      } else if (uploaderRole === 'teacher' || uploaderRole === 'faculty') {
        verifiedBadgeHtml = `<span class="post-verified-badge post-admin-badge" title="Verified Faculty">
            <svg viewBox="0 0 24 24" width="11" height="11" fill="currentColor"><path d="M12 1L3 5v6c0 5.55 3.84 10.74 9 12 5.16-1.26 9-6.45 9-12V5l-9-4zm-2 16l-4-4 1.41-1.41L10 14.17l6.59-6.59L18 9l-8 8z"/></svg>
            Teacher
          </span>`;
      } else if (uploaderRole === 'cr' || uploaderRole === 'class_rep') {
        verifiedBadgeHtml = `<span class="post-verified-badge post-cr-badge" title="Official Class Representative">
            <svg viewBox="0 0 24 24" width="11" height="11" fill="currentColor"><path d="M12 1L3 5v6c0 5.55 3.84 10.74 9 12 5.16-1.26 9-6.45 9-12V5l-9-4zm-2 16l-4-4 1.41-1.41L10 14.17l6.59-6.59L18 9l-8 8z"/></svg>
            Class Rep
          </span>`;
      }

      const fileHandleHtml = isSpecialUploader
        ? `<span class="post-student-handle">@${escapeHtml(f.uploadedBy || 'student')}</span> <span class="post-meta-sep">&middot;</span> `
        : '';

      const deleteBtnHtml = f.canDelete
        ? `<button class="post-delete-btn" onclick="deletePost(${f.id}, this)" title="Delete post">
            <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M3 6h18M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/>
            </svg>
          </button>`
        : '';

      return renderPostShell({
        kind: 'file', id: f.id, className: isSpecialUploader ? 'notice' : '',
        profileUrl: 'profile.html?id=' + encodeURIComponent(f.uploadedBy), avatar: avatarHtml,
        name: f.uploaderName || 'Student', badge: verifiedBadgeHtml,
        meta: `${fileHandleHtml}<time class="post-timestamp" datetime="${escapeHtml(f.uploadedAt)}">${timeAgo(f.uploadedAt)}</time>`,
        controls: deleteBtnHtml,
        body: `
            <div class="post-content">
              ${f.title && f.title !== f.originalName ? `<h3 class="post-title">${escapeHtml(f.title)}</h3>` : ''}
              ${(subjectTag || chapterTag) ? `<div class="post-tags">${subjectTag}${chapterTag}</div>` : ''}
            </div>

            <div class="file-attachment">
              <div class="file-icon ${badge.iconClass}">
                <span>${badge.ext}</span>
              </div>
              <div class="file-info">
                <p class="file-name" title="${escapeHtml(f.originalName)}">${escapeHtml(f.originalName)}</p>
                <span class="file-meta">${formatSize(f.sizeBytes)} &middot; ${badge.ext} Resource</span>
              </div>
              <div class="file-actions">
                <a href="/api/files/${f.id}/view" target="_blank" rel="noopener" class="file-action" title="Preview file in browser">
                  <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
                  <span>View</span>
                </a>
                <a href="/api/files/${f.id}/download" class="file-action primary" title="Download file">
                  <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M7 10l5 5 5-5M12 15V3"/></svg>
                  <span>Get</span>
                </a>
              </div>
            </div>
        `,
        actions: renderPostActions({ liked: f.liked, likes: f.likeCount || 0, comments: f.commentCount || 0,
          likeAction: `toggleLike(${f.id}, this)`, commentAction: `toggleCommentPanel(${f.id}, this.closest('.feed-card'))`, shareAction: `copyPostLink(${f.id})` }),
        comments: `<div class="comment-panel post-comment-drawer">
              <div class="comment-list"></div>
              <div class="comment-composer">
                <input type="text" class="comment-input post-comment-input" placeholder="Write a comment for the class…" maxlength="500">
                <button class="comment-submit post-comment-submit" onclick="submitComment(${f.id}, this.closest('.feed-card'))" title="Post comment">
                  <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 2L11 13M22 2l-7 20-4-9-9-4 20-7z"/></svg>
                </button>
              </div>
            </div>`
      });
    }

    function renderAssignmentPost(a) {
      // Feed assignments share the post layout and API; Code Lab keeps its question controls.
      if (a.type === 'assignment') return renderFeedPostCard(a);

      const qCount = Number(a.questionCount || 0);
      const subCount = Number(a.submissionCount || a.submissioncount || 0);
      const mySubCount = Number(a.mySubmissionCount || a.mysubmissioncount || 0);
      const initials = (a.teacherName || 'Faculty')
        .split(' ')
        .map(w => w[0])
        .slice(0, 2)
        .join('')
        .toUpperCase();

      const likeKey = 'liked_assign_' + a.id;
      const isLiked = localStorage.getItem(likeKey) === 'true';
      const likeCountKey = 'like_count_assign_' + a.id;
      const initialLikeCount = parseInt(localStorage.getItem(likeCountKey) || '0', 10);

      // Determine student completion status (Submitted vs Remaining)
      let statusBadgeHtml = '';
      if (mySubCount > 0 && mySubCount >= qCount && qCount > 0) {
        statusBadgeHtml = `
          <a href="/code-lab/my-submissions.html" class="post-action-btn status-btn submitted" title="You have submitted this assignment">
            <svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg>
            <span>Submitted</span>
          </a>
        `;
      } else if (mySubCount > 0 && mySubCount < qCount) {
        statusBadgeHtml = `
          <a href="/code-lab/assignment.html?id=${a.id}" class="post-action-btn status-btn partial" title="${mySubCount} of ${qCount} questions completed">
            <svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><polyline points="12 6 12 12 16 14"></polyline></svg>
            <span>${mySubCount}/${qCount} Submitted</span>
          </a>
        `;
      } else {
        statusBadgeHtml = `
          <a href="/code-lab/assignment.html?id=${a.id}" class="post-action-btn status-btn not-submitted" title="Remaining to be completed. Click to solve assignment.">

              <a href="/code-lab/submissions.html?id=${a.id}" class="post-action-btn submission-btn" title="View class submissions">

    async function deleteAssignmentPost(id, btn, event) {
      if (event) event.stopPropagation();
      const confirmed = await showAppleConfirmModal({
        title: 'Delete Assignment?',
        message: 'Are you sure you want to delete this assignment post? All associated questions, student submissions, and logs will be permanently deleted.',
        confirmText: 'Delete Post',
        cancelText: 'Cancel',
        isDanger: true
      });
      if (!confirmed) return;

      try {
        const res = await fetch(`/api/code-lab/assignments/${id}`, { method: 'DELETE' });
        const data = await res.json();
        if (res.ok) {
          feedItems = feedItems.filter(item => item._feedType !== 'assignment' || Number(item.id) !== id);
          showToast('Assignment deleted successfully');
          const card = btn.closest('.feed-card');
          if (card) {
            card.style.transition = 'all 0.3s cubic-bezier(0.25, 1, 0.5, 1)';
            card.style.opacity = '0';
            card.style.transform = 'scale(0.96)';
            setTimeout(() => card.remove(), 300);
          }
        } else {
          showToast(data.message || 'Failed to delete assignment');
        }
      } catch (err) {
        showToast('Network error while deleting assignment');
      }
    }

    function copyAssignmentLink(id) {
      const url = `${window.location.origin}/code-lab/assignment.html?id=${encodeURIComponent(id)}`;
      const onCopied = () => showToast('Assignment link copied to clipboard');
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(url).then(onCopied).catch(() => fallbackCopy(url, onCopied));
      } else {
        fallbackCopy(url, onCopied);
      }
    }

    function toggleAssignmentLike(id, btn) {
      const isLiked = btn.dataset.liked === 'true';
      const countEl = btn.querySelector('.like-count');
      const currentCount = parseInt(countEl ? countEl.textContent : '0', 10) || 0;
      const newLiked = !isLiked;
      const newCount = newLiked ? currentCount + 1 : Math.max(0, currentCount - 1);

      btn.dataset.liked = newLiked ? 'true' : 'false';
      btn.classList.toggle('liked', newLiked);
      const svg = btn.querySelector('svg');
      if (svg) svg.setAttribute('fill', newLiked ? 'currentColor' : 'none');
      if (countEl) countEl.textContent = newCount;

      btn.setAttribute('aria-pressed', String(newLiked));
      btn.setAttribute('aria-label', newLiked ? 'Unlike post' : 'Like post');
      localStorage.setItem('liked_assign_' + id, newLiked ? 'true' : 'false');
      localStorage.setItem('like_count_assign_' + id, String(newCount));
    }

    let feedItems = [];
    let postsCursor = null;
    let postsLoaded = false;
    const loadMorePostsBtn = document.getElementById('loadMorePosts');
    const postFeedMessage = document.getElementById('postFeedMessage');

    function safePostUrl(value) {
      if (typeof value !== 'string' || !value) return '';
      try {
        const url = new URL(value, window.location.origin);
        return ['http:', 'https:'].includes(url.protocol) ? escapeHtml(url.href) : '';
      } catch (_) {
        return '';
      }
    }

    const openCommentPosts = new Set();

    function needsTruncation(content) {
      return (content || '').trim().split(/\s+/).filter(Boolean).length > 150;
    }

    function renderStatusPost(post) {
      return renderFeedPostCard(post);
    }

    function renderFeedPostCard(post) {
      const profileUrl = 'profile.html?id=' + encodeURIComponent(post.studentId);
      const avatarUrl = safePostUrl(post.avatarUrl);
      const avatar = avatarUrl
        ? `<img src="${avatarUrl}" alt="${escapeHtml(post.name)}" class="post-avatar-img">`
        : escapeHtml((post.name || 'S').charAt(0).toUpperCase());

      const isSpecialRole = post.role === 'admin' || post.role === 'teacher' || post.role === 'faculty';
      const isClassRep = post.role === 'cr' || post.role === 'class_rep';

      // PART 1: Role badge - only render if not default student
      let roleBadgeHtml = '';
      if (post.role === 'admin') {
        roleBadgeHtml = `<span class="post-verified-badge post-admin-badge" title="Verified System Administrator"><svg viewBox="0 0 24 24" width="11" height="11" fill="currentColor"><path d="M12 1L3 5v6c0 5.55 3.84 10.74 9 12 5.16-1.26 9-6.45 9-12V5l-9-4zm-2 16l-4-4 1.41-1.41L10 14.17l6.59-6.59L18 9l-8 8z"/></svg>Admin</span>`;
      } else if (post.role === 'teacher' || post.role === 'faculty') {
        roleBadgeHtml = `<span class="post-verified-badge post-admin-badge" title="Verified Faculty"><svg viewBox="0 0 24 24" width="11" height="11" fill="currentColor"><path d="M12 1L3 5v6c0 5.55 3.84 10.74 9 12 5.16-1.26 9-6.45 9-12V5l-9-4zm-2 16l-4-4 1.41-1.41L10 14.17l6.59-6.59L18 9l-8 8z"/></svg>Teacher</span>`;
      } else if (isClassRep) {
        roleBadgeHtml = `<span class="post-verified-badge post-cr-badge" title="Official Class Representative"><svg viewBox="0 0 24 24" width="11" height="11" fill="currentColor"><path d="M12 1L3 5v6c0 5.55 3.84 10.74 9 12 5.16-1.26 9-6.45 9-12V5l-9-4zm-2 16l-4-4 1.41-1.41L10 14.17l6.59-6.59L18 9l-8 8z"/></svg>Class Rep</span>`;
      }

      // PART 1 & 6: Only show @studentID when author's role is admin or teacher, with proper spacing
      const handleHtml = isSpecialRole
        ? `<span class="post-student-handle">@${escapeHtml(post.studentId)}</span> <span class="post-meta-sep">&middot;</span> `
        : '';

      const attachmentUrl = safePostUrl(post.attachment_url);

      // PART 2: Long text - Show more truncation (>150 words) and collapse 3+ newlines to max 2
      const cleanContent = (post.content || '').replace(/\n{3,}/g, '\n\n');
      const shouldTruncate = needsTruncation(cleanContent);

      // PART 5: Notice visual accent for Admin or Notice posts
      const isNotice = post.type === 'notice' || isSpecialRole;
      const noticeClass = isNotice ? ' notice' : '';

      const commentCount = post.comment_count ?? post.commentCount ?? 0;
      const likeCount = post.like_count ?? post.likeCount ?? 0;
      const isCommentsOpen = openCommentPosts.has(post.id);

      return renderPostShell({
        kind: 'post', id: post.id, className: 'status-post-card' + noticeClass,
        profileUrl, avatar, name: post.name, badge: roleBadgeHtml,
        meta: `${handleHtml}<time class="post-timestamp" datetime="${escapeHtml(post.created_at)}">${timeAgo(post.created_at)}</time>`,
        controls: post.canDelete ? `<button type="button" class="post-delete-btn" onclick="deleteStatusPost(${post.id}, this)" aria-label="Delete post" title="Delete post"><svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18M19 6v14H5V6m3 0V3h8v3"/></svg></button>` : '',
        body: `
            <div class="post-content">
              ${shouldTruncate ? `
                <div class="post-content-clamped">
                  <p class="status-post-text">${escapeHtml(cleanContent)}</p>
                </div>
                <button type="button" class="show-more-link post-expand-btn" onclick="togglePostExpand(this)">Show more</button>
              ` : `
                <div class="post-content-unclamped">
                  <p class="status-post-text">${escapeHtml(cleanContent)}</p>
                </div>
              `}
            </div>
            ${attachmentUrl ? `<div class="post-image"><img src="${attachmentUrl}" alt="Image attached by ${escapeHtml(post.name)}" loading="lazy" decoding="async" tabindex="0" role="button" aria-label="Open full image" aria-haspopup="dialog" onerror="this.hidden = true; this.nextElementSibling.hidden = false;"><a class="status-post-attachment" href="${attachmentUrl}" target="_blank" rel="noopener noreferrer" hidden>View attachment ↗</a></div>` : ''}
`,
        actions: renderPostActions({ liked: post.liked_by_me, likes: likeCount, comments: commentCount,
          likeAction: `toggleStatusLike(${post.id}, this)`, commentAction: `togglePostComments(${post.id}, this.closest('.feed-card'))`, shareAction: `copySharePostLink(${post.id})`,
          extra: post.type === 'assignment' ? `<span class="post-submitted-count">${post.submission_count} submitted</span>` : '' }),
        comments: `<div class="post-comments-drawer${isCommentsOpen ? ' open' : ''}" id="comments-drawer-${post.id}">
              <div class="post-comments-header-row">
                <span class="post-comments-title">Replies</span>
                <button type="button" class="post-comments-close-btn" onclick="closePostComments(${post.id})" aria-label="Hide replies" title="Hide replies">
                  <svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
                  <span>Hide</span>
                </button>
              </div>
              <form class="post-comment-composer" onsubmit="submitPostComment(${post.id}, this, event)">
                <textarea class="post-comment-textarea" placeholder="Post your reply…" rows="2" maxlength="2000" required></textarea>
                <div class="post-comment-composer-actions">
                  <button type="submit" class="post-comment-submit-btn">Reply</button>
                </div>
              </form>
              <div class="post-comments-list"></div>
            </div>`
      });
    }

    function renderFeed() {
      const container = document.getElementById('realFiles');
      feedItems = feedItems.filter(item => item._feedType !== 'assignment' && item.type !== 'assignment');
      feedItems.sort((a, b) => b._feedTime - a._feedTime || b.id - a.id);
      // Reuse existing cards so paging or publishing preserves open comments and pending likes.
      const fragment = document.createDocumentFragment();
      feedItems.forEach(item => {
        const attribute = { post: 'post', assignment: 'assignment', file: 'file' }[item._feedType];
        const existing = container.querySelector(`[data-${attribute}-id="${item.id}"]`);
        if (existing) {
          fragment.appendChild(existing);
        } else {
          const template = document.createElement('template');
          template.innerHTML = renderPost(item);
          fragment.appendChild(template.content);
        }
      });
      container.replaceChildren(fragment);
      if (!feedItems.length) {
        container.innerHTML = `<div class="post-feed-empty"><p>No posts shared yet</p><p>Share a status above or upload notes in Library.</p></div>`;
      }
      loadMorePostsBtn.hidden = postsLoaded && postsCursor === null;
      loadMorePostsBtn.textContent = postsLoaded ? 'Load older posts' : 'Retry loading posts';
      initDashboardCardPhysics();
    }

    function addFeedPosts(posts) {
      const existing = new Set(feedItems.filter(item => item._feedType === 'post').map(item => item.id));
      posts.forEach(post => {
        if (post.type === 'assignment') return;
        if (!existing.has(post.id)) {
          feedItems.push({ ...post, _feedType: 'post', _feedTime: new Date(post.created_at).getTime() });
          existing.add(post.id);
        }
      });
    }

    async function fetchPostPage(before = null) {
      const response = await fetch('/api/posts?limit=20' + (before === null ? '' : '&before=' + before));
      if (!response.ok) throw new Error('Could not load posts. Please try again.');
      return response.json();
    }

    async function loadFeed() {
      const [files, page] = await Promise.all([
        fetch('/api/files').then(r => r.ok ? r.json() : []).catch(() => []),
        fetchPostPage().catch(err => { postFeedMessage.textContent = err.message; return null; })
      ]);
      feedItems = [
        ...files.map(f => ({ ...f, _feedType: 'file', _feedTime: new Date(f.uploadedAt || f.createdAt || 0).getTime() }))
      ];
      if (page) {
        addFeedPosts(page.posts);
        postsCursor = page.nextCursor;
        postsLoaded = true;
      }
      renderFeed();
    }

    const feedReady = loadFeed();

    loadMorePostsBtn.addEventListener('click', async () => {
      loadMorePostsBtn.disabled = true;
      postFeedMessage.textContent = '';
      try {
        const page = await fetchPostPage(postsCursor);
        addFeedPosts(page.posts);
        postsCursor = page.nextCursor;
        postsLoaded = true;
        renderFeed();
      } catch (err) {
        postFeedMessage.textContent = err.message;
      } finally {
        loadMorePostsBtn.disabled = false;
      }
    });

    // --- Create Post Modal Dialog Controls ---
    const postModalOverlay = document.getElementById('postModalOverlay');
    const openPostModalBtn = document.getElementById('openPostModalBtn');
    const closePostModalBtn = document.getElementById('closePostModalBtn');

    function openPostModal() {
      const modal = document.getElementById('postModalOverlay') || postModalOverlay;
      if (!modal) return;
      const message = document.getElementById('postComposerMessage');
      if (message) message.textContent = '';
      modal.removeAttribute('hidden');
      modal.hidden = false;
      modal.classList.add('open');
      document.body.style.overflow = 'hidden';
      const contentEl = document.getElementById('postContent');
      if (contentEl) setTimeout(() => contentEl.focus(), 60);
    }

    function closePostModal() {
      const modal = document.getElementById('postModalOverlay') || postModalOverlay;
      if (!modal) return;
      modal.classList.remove('open');
      modal.setAttribute('hidden', '');
      modal.hidden = true;
      document.body.style.overflow = '';
      const openBtn = document.getElementById('openPostModalBtn') || openPostModalBtn;
      if (openBtn) openBtn.focus();
    }

    if (openPostModalBtn) {
      openPostModalBtn.addEventListener('click', (e) => {
        e.preventDefault();
        openPostModal();
      });
    }
    if (closePostModalBtn) {
      closePostModalBtn.addEventListener('click', (e) => {
        e.preventDefault();
        closePostModal();
      });
    }
    if (postModalOverlay) {
      postModalOverlay.addEventListener('click', (event) => {
        if (event.target === postModalOverlay) closePostModal();
      });
    }
    document.addEventListener('keydown', (event) => {
      if (event.key === 'Escape') {
        const modal = document.getElementById('postModalOverlay') || postModalOverlay;
        if (modal && !modal.hidden && modal.classList.contains('open')) {
          closePostModal();
        }
      }
    });

    const postImageInput = document.getElementById('postImageInput');
    const postImagePreview = document.getElementById('postImagePreview');
    const postImagePreviewImg = document.getElementById('postImagePreviewImg');
    const choosePostImageBtn = document.getElementById('choosePostImage');
    const removePostImageBtn = document.getElementById('removePostImage');
    let postImagePreviewUrl = null;

    function clearPostImage() {
      if (postImagePreviewUrl) URL.revokeObjectURL(postImagePreviewUrl);
      postImagePreviewUrl = null;
      postImageInput.value = '';
      postImagePreviewImg.removeAttribute('src');
      postImagePreview.hidden = true;
    }

    choosePostImageBtn.addEventListener('click', () => postImageInput.click());
    removePostImageBtn.addEventListener('click', clearPostImage);
    postImageInput.addEventListener('change', () => {
      const file = postImageInput.files[0];
      const message = document.getElementById('postComposerMessage');
      message.textContent = '';
      if (!file) return clearPostImage();
      if (!file.type.startsWith('image/') || file.size > 5 * 1024 * 1024) {
        clearPostImage();
        message.textContent = file.size > 5 * 1024 * 1024
          ? 'Images must be 5 MB or smaller.' : 'Please choose an image file.';
        return;
      }
      if (postImagePreviewUrl) URL.revokeObjectURL(postImagePreviewUrl);
      postImagePreviewUrl = URL.createObjectURL(file);
      postImagePreviewImg.src = postImagePreviewUrl;
      postImagePreview.hidden = false;
    });

    document.getElementById('postComposer').addEventListener('submit', async (event) => {
      event.preventDefault();
      const content = document.getElementById('postContent');
      const type = document.getElementById('postType');
      const button = document.getElementById('publishPost');
      const message = document.getElementById('postComposerMessage');
      if (button.disabled) return;
      if (!content.value.trim()) {
        message.textContent = 'Write something before posting.';
        content.focus();
        return;
      }
      button.disabled = content.disabled = type.disabled = true;
      postImageInput.disabled = choosePostImageBtn.disabled = removePostImageBtn.disabled = true;
      button.textContent = 'Posting…';
      message.textContent = '';
      try {
        await feedReady;
        const formData = new FormData();
        formData.append('content', content.value);
        formData.append('type', type.value);
        if (postImageInput.files[0]) formData.append('image', postImageInput.files[0]);
        const response = await fetch('/api/posts', {
          method: 'POST',
          body: formData
        });
        const data = await response.json();
        if (!response.ok) throw new Error(data.message || 'Could not publish your post.');
        addFeedPosts([data]);
        renderFeed();
        content.value = '';
        clearPostImage();
        message.textContent = 'Post shared with your class.';
        if (typeof showToast === 'function') showToast('Post shared with your class.');
        if (typeof closePostModal === 'function') closePostModal();
      } catch (err) {
        message.textContent = err.message || 'Could not publish your post. Please try again.';
      } finally {
        button.disabled = content.disabled = type.disabled = false;
        postImageInput.disabled = choosePostImageBtn.disabled = removePostImageBtn.disabled = false;
        button.textContent = 'Post';
      }
    });

    const pendingPostLikes = new Set();

    function updateStatusLike(id, liked, count) {
      const post = feedItems.find(item => item._feedType === 'post' && item.id === id);
      if (post) Object.assign(post, { liked_by_me: liked, like_count: count });
      const button = document.querySelector(`[data-post-id="${id}"] .like-btn`);
      if (!button) return;
      button.dataset.liked = String(liked);
      button.classList.toggle('liked', liked);
      button.setAttribute('aria-pressed', String(liked));
      button.setAttribute('aria-label', liked ? 'Unlike post' : 'Like post');
      button.querySelector('svg').setAttribute('fill', liked ? 'currentColor' : 'none');
      button.querySelector('.like-count').textContent = count;
      button.disabled = pendingPostLikes.has(id);
    }

    async function toggleStatusLike(id, button) {
      if (pendingPostLikes.has(id)) return;
      const liked = button.dataset.liked === 'true';
      const count = Number(button.querySelector('.like-count').textContent);
      pendingPostLikes.add(id);
      updateStatusLike(id, !liked, Math.max(0, count + (liked ? -1 : 1)));
      try {
        const response = await fetch(`/api/posts/${id}/like`, { method: liked ? 'DELETE' : 'POST' });
        const data = await response.json();
        if (!response.ok) throw new Error(data.message || 'Could not update like.');
        updateStatusLike(id, data.liked_by_me, data.like_count);
      } catch (err) {
        updateStatusLike(id, liked, count);
        showToast(escapeHtml(err.message || 'Could not update like. Please try again.'));
      } finally {
        pendingPostLikes.delete(id);
        const currentButton = document.querySelector(`[data-post-id="${id}"] .like-btn`);
        if (currentButton) currentButton.disabled = false;
      }
    }

    async function deleteStatusPost(id, button) {
      const confirmed = await showAppleConfirmModal({
        title: 'Delete Post?',
        message: 'Are you sure you want to delete this post? This action cannot be undone.',
        confirmText: 'Delete Post',
        cancelText: 'Cancel',
        isDanger: true
      });
      if (!confirmed) return;
      button.disabled = true;
      try {
        const response = await fetch(`/api/posts/${id}`, { method: 'DELETE' });
        const data = await response.json();
        if (!response.ok) throw new Error(data.message || 'Could not delete post.');
        feedItems = feedItems.filter(item => item._feedType !== 'post' || item.id !== id);
        renderFeed();
        showToast('Post deleted.');
      } catch (err) {
        button.disabled = false;
        showToast(escapeHtml(err.message || 'Could not delete post. Please try again.'));
      }
    }

    function togglePostExpand(btn) {
      const container = btn.closest('.post-content');
      if (!container) return;
      const clamped = container.querySelector('.post-content-clamped');
      if (!clamped) return;
      const isExpanded = clamped.classList.toggle('expanded');
      btn.textContent = isExpanded ? 'Show less' : 'Show more';
    }

    function copySharePostLink(postId) {
      const url = `${window.location.origin}/dashboard.html?post=${encodeURIComponent(postId)}`;
      const onCopied = () => showToast('Post link copied to clipboard');
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(url).then(onCopied).catch(() => fallbackCopy(url, onCopied));
      } else {
        fallbackCopy(url, onCopied);
      }
    }

    function fallbackCopy(text, cb) {
      const el = document.createElement('textarea');
      el.value = text;
      el.style.position = 'fixed';
      el.style.left = '-9999px';
      document.body.appendChild(el);
      el.select();
      try {
        document.execCommand('copy');
        if (cb) cb();
      } catch (_) {
        showToast('Failed to copy link');
      }
      document.body.removeChild(el);
    }

    function renderPostCommentItem(c) {
      const profileUrl = 'profile.html?id=' + encodeURIComponent(c.studentId || c.student_id || '');
      const avatarUrl = safePostUrl(c.avatarUrl || c.avatar_url);
      const avatar = avatarUrl
        ? `<img src="${avatarUrl}" alt="${escapeHtml(c.name || 'User')}" class="comment-avatar-img">`
        : escapeHtml((c.name || 'S').charAt(0).toUpperCase());

      const isSpecial = c.role === 'admin' || c.role === 'teacher' || c.role === 'faculty';
      const isCR = c.role === 'cr' || c.role === 'class_rep';
      let roleBadge = '';
      if (c.role === 'admin') {
        roleBadge = `<span class="post-verified-badge post-admin-badge" style="font-size: 10px; padding: 1px 6px;">Admin</span>`;
      } else if (c.role === 'teacher' || c.role === 'faculty') {
        roleBadge = `<span class="post-verified-badge post-admin-badge" style="font-size: 10px; padding: 1px 6px;">Teacher</span>`;
      } else if (isCR) {
        roleBadge = `<span class="post-verified-badge post-cr-badge" style="font-size: 10px; padding: 1px 6px;">Class Rep</span>`;
      }

      const handleHtml = isSpecial && (c.studentId || c.student_id)
        ? `<span class="post-student-handle" style="font-size: 12px;">@${escapeHtml(c.studentId || c.student_id)}</span>`
        : '';

      return `
        <div class="post-comment-item" data-comment-id="${c.id}">
          <a href="${profileUrl}" class="post-comment-avatar">${avatar}</a>
          <div class="post-comment-body">
            <div class="post-comment-header">
              <a href="${profileUrl}" class="post-comment-author">${escapeHtml(c.name || 'Student')}</a>
              ${roleBadge}
              ${handleHtml}
              <time class="post-comment-time" datetime="${escapeHtml(c.created_at || '')}">${timeAgo(c.created_at)}</time>
            </div>
            <p class="post-comment-text">${escapeHtml(c.content || '')}</p>
          </div>
        </div>
      `;
    }

    function renderPostCommentsList(listEl, comments) {
      if (!comments || !comments.length) {
        listEl.innerHTML = '<p class="post-comments-empty">No comments yet. Be the first to reply!</p>';
        return;
      }
      listEl.innerHTML = comments.map(c => renderPostCommentItem(c)).join('');
    }

    function closePostComments(postId) {
      openCommentPosts.delete(postId);
      const drawer = document.getElementById(`comments-drawer-${postId}`);
      if (drawer) {
        drawer.classList.remove('open');
      }
    }

    async function togglePostComments(postId, card) {
      if (!card) card = document.querySelector(`[data-post-id="${postId}"]`);
      if (!card) return;
      const drawer = card.querySelector(`#comments-drawer-${postId}`) || card.querySelector('.post-comments-drawer');
      if (!drawer) return;

      const isOpen = openCommentPosts.has(postId) || drawer.classList.contains('open');
      if (isOpen) {
        openCommentPosts.delete(postId);
        drawer.classList.remove('open');
        return;
      }

      openCommentPosts.add(postId);
      drawer.classList.add('open');

      if (!drawer.dataset.loaded) {
        const listEl = drawer.querySelector('.post-comments-list');
        if (listEl) {
          listEl.innerHTML = '<p class="post-comments-empty" style="text-align: center;">Loading comments…</p>';
          try {
            const res = await fetch(`/api/posts/${postId}/comments`);
            if (!res.ok) throw new Error('Could not load comments');
            const data = await res.json();
            drawer.dataset.loaded = 'true';
            renderPostCommentsList(listEl, data.comments || []);
          } catch (err) {
            listEl.innerHTML = `<p class="post-comments-empty" style="color: var(--accent-red, #ff453a);">${escapeHtml(err.message)}</p>`;
          }
        }
      }

      const textarea = drawer.querySelector('.post-comment-textarea');
      if (textarea) textarea.focus();
    }

    async function submitPostComment(postId, form, event) {
      if (event) event.preventDefault();
      const textarea = form.querySelector('.post-comment-textarea');
      const submitBtn = form.querySelector('.post-comment-submit-btn');
      const content = textarea.value.trim();
      if (!content) return;

      submitBtn.disabled = true;
      textarea.disabled = true;
      try {
        const res = await fetch(`/api/posts/${postId}/comments`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ content })
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.message || 'Could not post comment.');

        textarea.value = '';
        openCommentPosts.add(postId);
        const drawer = form.closest('.post-comments-drawer');
        if (drawer) drawer.classList.add('open');
        const listEl = drawer ? drawer.querySelector('.post-comments-list') : null;
        if (listEl) {
          drawer.dataset.loaded = 'true';
          const emptyMsg = listEl.querySelector('.post-comments-empty');
          if (emptyMsg) emptyMsg.remove();
          const temp = document.createElement('div');
          temp.innerHTML = renderPostCommentItem(data.comment);
          listEl.appendChild(temp.firstElementChild);
        }

        const card = document.querySelector(`[data-post-id="${postId}"]`);
        if (card) {
          const countEl = card.querySelector('.comment-count');
          if (countEl) countEl.textContent = data.comment_count;
        }
        const postObj = feedItems.find(item => item._feedType === 'post' && item.id === postId);
        if (postObj) {
          postObj.comment_count = data.comment_count;
          postObj.commentCount = data.comment_count;
        }

        showToast('Reply posted');
      } catch (err) {
        showToast(escapeHtml(err.message || 'Failed to post reply'));
      } finally {
        submitBtn.disabled = false;
        textarea.disabled = false;
        textarea.focus();
      }
    }

    feedReady.then(() => {
      const urlParams = new URLSearchParams(window.location.search);
      const targetPostId = urlParams.get('post');
      if (targetPostId) {
        const targetCard = document.querySelector(`[data-post-id="${targetPostId}"]`);
        if (targetCard) {
          targetCard.scrollIntoView({ behavior: 'smooth', block: 'center' });
          targetCard.style.transition = 'box-shadow 0.3s ease, border-color 0.3s ease';
          targetCard.style.borderColor = 'var(--accent-color, #1d9bf0)';
          targetCard.style.boxShadow = '0 0 0 2px rgba(29, 155, 240, 0.3)';
          setTimeout(() => {
            targetCard.style.borderColor = '';
            targetCard.style.boxShadow = '';
          }, 3000);
        }
      }
    });

    // --- Search Logic ---
    const searchInput = document.getElementById('headerSearchInput');
    const searchResults = document.getElementById('searchResults');
    const realFiles = document.getElementById('realFiles');
    const demoNotes = document.getElementById('demoNotes');
    const dashHero = document.querySelector('.dash-hero');
    const feedHeading = document.querySelector('.feed-heading');

    let searchTimeout = null;

    function renderSubjectCard(s) {
      return `
        <a href="library.html?subject=${encodeURIComponent(s.subject)}" class="search-subject-card">
          <div class="subject-icon">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg>
          </div>
          <div class="subject-info">
            <h4>${escapeHtml(s.subject)}</h4>
            <span>${s.fileCount} files &middot; ${s.chapterCount} chapters</span>
          </div>
        </a>
      `;
    }

    function renderStudentCard(s) {
      const initial = (s.name || 'S').charAt(0).toUpperCase();
      const avatarHtml = s.avatarUrl
        ? `<img src="${s.avatarUrl}" alt="${escapeHtml(s.name)}">`
        : initial;

      let badgeHtml = '';
      if (s.role === 'admin') {
        badgeHtml = `<span class="post-verified-badge post-admin-badge" title="System Administrator">Admin</span>`;
      } else if (s.role === 'cr' || s.role === 'class_rep') {
        badgeHtml = `<span class="post-verified-badge post-cr-badge" title="Class Representative">Class Rep</span>`;
      }

      return `
        <a href="profile.html?id=${s.studentId}" class="search-student-card">
          <div class="student-card-avatar">${avatarHtml}</div>
          <div class="student-card-info">
            <div class="student-card-name-row">
              <h4 class="student-card-name">${escapeHtml(s.name)}</h4>
              ${badgeHtml}
            </div>
            <div class="student-card-meta">
              <span>@${escapeHtml(s.studentId)}</span>
              &middot; <span>${escapeHtml(s.semester || 'Semester 1')}</span>
              &middot; <span>${s.filesCount || s.filescount || 0} upload${(s.filesCount || s.filescount) == 1 ? '' : 's'}</span>
            </div>
          </div>
        </a>
      `;
    }

    if (searchInput) {
      searchInput.addEventListener('input', (e) => {
        const q = e.target.value.trim();
        clearTimeout(searchTimeout);

        if (!q) {
          // Restore default view
          searchResults.style.display = 'none';
          dashHero.style.display = 'flex'; // .dash-hero is flex
          feedHeading.style.display = 'flex';
          const composerSec = document.getElementById('postComposerSection');
          if (composerSec) composerSec.hidden = false;
          document.getElementById('postPagination').hidden = false;
          realFiles.style.display = 'block';
          if (demoNotes) demoNotes.style.display = 'block';
          return;
        }

        searchTimeout = setTimeout(async () => {
          try {
            const res = await fetch('/api/search?q=' + encodeURIComponent(q));
            if (!res.ok) return;
            const data = await res.json();

            dashHero.style.display = 'none';
            feedHeading.style.display = 'none';
            const composerSec = document.getElementById('postComposerSection');
            if (composerSec) composerSec.hidden = true;
            document.getElementById('postPagination').hidden = true;
            realFiles.style.display = 'none';
            if (demoNotes) demoNotes.style.display = 'none';

            searchResults.style.display = 'block';

            let html = '<div class="search-results-heading"><h2>Search Results</h2><span>For "' + escapeHtml(q) + '"</span></div>';

            if (data.assignments && data.assignments.length > 0) {
              html += '<h3 class="search-section-title">Code Lab Assignments</h3>';
              html += data.assignments.map(renderAssignmentPost).join('');
            }

            if (data.students && data.students.length > 0) {
              html += '<h3 class="search-section-title">Students & Classmates</h3>';
              html += '<div class="search-students-grid">';
              html += data.students.map(renderStudentCard).join('');
              html += '</div>';
            }

            if (data.subjects && data.subjects.length > 0) {
              html += '<h3 class="search-section-title">Subjects</h3>';
              html += '<div class="search-subjects-grid">';
              html += data.subjects.map(renderSubjectCard).join('');
              html += '</div>';
            }

            if (data.files && data.files.length > 0) {
              html += '<h3 class="search-section-title">Files & Notes</h3>';
              html += data.files.map(renderPost).join('');
            }

            const hasResults = (data.assignments && data.assignments.length > 0) || (data.students && data.students.length > 0) || (data.subjects && data.subjects.length > 0) || (data.files && data.files.length > 0);
            if (!hasResults) {
              html += `
                <div class="empty-search-state" style="text-align:center; padding:36px 16px;">
                  <img src="/minecraft-404-voxel-ruby.svg" alt="No results found" class="empty-voxel-illu" style="max-width: 230px; margin: 0 auto 14px;">
                  <p style="font-size:15px; font-weight:700; color:var(--text-primary,#111827); margin:0 0 4px;">No results found</p>
                  <p style="font-size:13px; color:var(--text-tertiary,#86868b); margin:0;">No assignments, students, files, or subjects found matching your query.</p>
                </div>
              `;
            }

            searchResults.innerHTML = html;
            setTimeout(initDashboardCardPhysics, 50);
          } catch (err) {
            console.error("Search error:", err);
          }
        }, 300);
      });
    }

    // --- 3D Gyro Perspective Tilt Physics (Same as Photo Gallery) ---
    function initDashboardCardPhysics() {
      const cards = document.querySelectorAll('.feed-card, .fb-card, .social-post-card, .search-subject-card, .search-student-card');
      cards.forEach(card => {
        if (card.matches('.post-card, .post-composer')) return;
        if (card.dataset.physicsBound) return;
        card.dataset.physicsBound = 'true';

        let rect;
        card.addEventListener('mouseenter', () => {
          rect = card.getBoundingClientRect();
        });

        card.addEventListener('mousemove', (e) => {
          if (!rect) rect = card.getBoundingClientRect();
          const x = e.clientX - rect.left;
          const y = e.clientY - rect.top;
          const cx = rect.width / 2;
          const cy = rect.height / 2;
          const rotateX = ((y - cy) / cy) * -3.2;
          const rotateY = ((x - cx) / cx) * 3.2;

          card.style.transform = `perspective(900px) rotateX(${rotateX.toFixed(2)}deg) rotateY(${rotateY.toFixed(2)}deg) translateZ(4px)`;
        });

        card.addEventListener('mouseleave', () => {
          card.style.transform = '';
        });
      });
    }

    setTimeout(initDashboardCardPhysics, 400);
    const dashObs = new MutationObserver(() => initDashboardCardPhysics());
    if (realFiles) dashObs.observe(realFiles, { childList: true });
    if (searchResults) dashObs.observe(searchResults, { childList: true });
  </script>
  <script src="notifications.js"></script>
  <script src="chatbot.js"></script>

  <div id="minimalAuthToast" class="minimal-auth-toast">
    <svg viewBox="0 0 24 24" width="20" height="20" stroke="currentColor" fill="none" stroke-width="2.5"
      style="opacity: 0.9;">
      <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
      <path d="M7 11V7a5 5 0 0110 0v4"></path>
    </svg>
    <span>Login required to access this page. <a href="login.html">Sign In</a></span>
  </div>

  <div id="imageLightbox" class="lightbox hidden" role="dialog" aria-modal="true" aria-label="Full image" tabindex="-1">
    <button type="button" class="lightbox-close" aria-label="Close full image">&times;</button>
    <img id="lightboxImg" alt="">
  </div>
  <script>
    const imageLightbox = document.getElementById('imageLightbox');
    const lightboxImg = document.getElementById('lightboxImg');
    const lightboxClose = imageLightbox.querySelector('.lightbox-close');
    let lightboxTrigger = null;
    let lightboxPreviousOverflow = '';

    function openPostImage(image) {
      if (image.hidden) return;
      lightboxTrigger = image;
      lightboxImg.src = image.currentSrc || image.src;
      lightboxImg.alt = image.alt;
      lightboxPreviousOverflow = document.body.style.overflow;
      document.body.style.overflow = 'hidden';
      imageLightbox.classList.remove('hidden');
      lightboxClose.focus();
    }

    function closePostImage() {
      imageLightbox.classList.add('hidden');
      lightboxImg.removeAttribute('src');
      document.body.style.overflow = lightboxPreviousOverflow;
      if (lightboxTrigger?.isConnected) lightboxTrigger.focus();
      lightboxTrigger = null;
    }

    document.getElementById('realFiles').addEventListener('click', (event) => {
      if (event.target.matches('.post-image img')) openPostImage(event.target);
    });
    document.getElementById('realFiles').addEventListener('keydown', (event) => {
      if (event.target.matches('.post-image img') && ['Enter', ' '].includes(event.key)) {
        event.preventDefault();
        openPostImage(event.target);
      }
    });
    lightboxClose.addEventListener('click', closePostImage);
    imageLightbox.addEventListener('click', (event) => {
      if (event.target === imageLightbox) closePostImage();
    });
    document.addEventListener('keydown', (event) => {
      if (imageLightbox.classList.contains('hidden')) return;
      if (event.key === 'Escape') closePostImage();
      if (event.key === 'Tab') {
        event.preventDefault();
        lightboxClose.focus();
      }
    });
  </script>
  <!-- PWA Service Worker Registration -->
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('/sw.js').catch(err => {
          console.warn('[SW Registration Notice]:', err);
        });
      });
    }
  </script>
