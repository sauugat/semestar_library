<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Upload Resource — Semester Library</title>
  <script>
    fetch('/api/me').then(r => { if (!r.ok) window.location.replace('login.html'); }).catch(() => window.location.replace('login.html'));
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@600;700;800&family=Outfit:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body class="dash upload-page-body">

  <!-- Top Apple Pro Header -->
  <header class="dash-header">
    <a href="dashboard.html" class="lib-wordmark">Semester Library</a>
    <div class="dash-header-actions">
      <a href="profile.html" class="dash-profile-chip" title="View Profile">
        <div class="dash-profile-avatar" id="headerAvatar">·</div>
        <span class="dash-profile-label" id="headerProfileName">Profile</span>
      </a>
      <button class="dash-logout" onclick="location.href='dashboard.html'">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>
          <polyline points="9 22 9 12 15 12 15 22"/>
        </svg>
        Feed
      </button>
      <button id="logoutBtn" class="dash-logout">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/>
          <path d="M16 17l5-5-5-5"/><path d="M21 12H9"/>
        </svg>
        Sign Out
      </button>
    </div>
  </header>

  <!-- Upload Studio Container -->
  <main class="upload-studio-container">

    <div class="upload-studio-card">
      
      <!-- Card Header -->
      <div class="upload-studio-header">
        <div class="upload-badge-icon">
          <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 3v12"/><path d="M7 8l5-5 5 5"/><path d="M5 21h14a2 2 0 0 0 2-2v-4"/><path d="M3 15v4a2 2 0 0 0 2 2"/>
          </svg>
        </div>
        <div>
          <h1 class="upload-studio-title">Share Study Resource</h1>
          <p class="upload-studio-sub">Upload notes, slide decks, assignment solutions, or code to share with your classmates.</p>
        </div>
      </div>

      <!-- Upload Form -->
      <form id="uploadForm" class="upload-studio-form">
        
        <!-- Drag & Drop Zone -->
        <label for="fileInput" class="upload-drop-card" id="dropZone">
          <div class="drop-icon-circle">
            <svg viewBox="0 0 24 24" width="28" height="28" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M17 8l-5-5-5 5M12 3v12"/>
            </svg>
          </div>
          <div class="drop-text-wrapper">
            <strong id="dropMainText">Choose a file or drag & drop here</strong>
            <span id="dropSubText">Supports PDF, DOCX, ZIP, PPT, Images, and Code (Up to 25MB)</span>
          </div>
          <span class="drop-browse-btn">Browse File</span>
          <input type="file" id="fileInput" name="file" hidden required>
        </label>

        <!-- Selected File Indicator -->
        <div id="fileSelectedBar" class="file-selected-pill" style="display: none;">
          <div class="file-sel-info">
            <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>
            <span id="selectedFileName" class="sel-name">filename.pdf</span>
            <span id="selectedFileSize" class="sel-size">0 KB</span>
          </div>
          <button type="button" id="removeFileBtn" class="sel-remove-btn" title="Remove file">&times;</button>
        </div>

        <!-- Resource Title -->
        <div class="form-group">
          <label for="titleInput" class="studio-label">Resource Title / Caption</label>
          <input type="text" id="titleInput" class="studio-input" placeholder="e.g. Chapter 4 Logic Gates & Boolean Algebra Notes" maxlength="100">
          <span class="studio-hint">Give your resource a clear, descriptive title for classmates</span>
        </div>

        <!-- Subject & Chapter 2-Column Row -->
        <div class="form-row-2">
          <div class="form-group">
            <label for="subjectInput" class="studio-label">Subject</label>
            <input type="text" id="subjectInput" class="studio-input" placeholder="e.g. Digital Logic" maxlength="60">
          </div>
          <div class="form-group">
            <label for="chapterInput" class="studio-label">Chapter / Unit</label>
            <input type="text" id="chapterInput" class="studio-input" placeholder="e.g. Chapter 4" maxlength="60">
          </div>
        </div>

        <!-- Submission Actions -->
        <div class="upload-action-row">
          <button type="button" class="btn-studio-secondary" onclick="location.href='dashboard.html'">Cancel</button>
          <button type="submit" class="btn-studio-primary" id="uploadBtn">
            <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M12 3v12"/><path d="M7 8l5-5 5 5"/><path d="M5 21h14a2 2 0 0 0 2-2v-4"/><path d="M3 15v4a2 2 0 0 0 2 2"/>
            </svg>
            <span>Publish Resource</span>
          </button>
        </div>

        <p id="uploadMsg" class="studio-status-msg"></p>

      </form>

    </div>

  </main>

  <!-- macOS Floating Dock Navigation -->
  <nav class="bottom-nav">
    <a href="dashboard.html" class="nav-item">
      <svg viewBox="0 0 24 24"><path d="M14 3v4a1 1 0 0 0 1 1h4"/><path d="M17 21H7a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h7l5 5v11a2 2 0 0 1-2 2z"/><path d="M9 13h6M9 17h4"/></svg>
      <span class="nav-label">Feed</span>
    </a>
    <a href="chat.html" class="nav-item">
      <svg viewBox="0 0 24 24"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path></svg>
      <span class="nav-label">Chat</span>
    </a>
    <a href="library.html" class="nav-item">
      <svg viewBox="0 0 24 24"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg>
      <span class="nav-label">Library</span>
    </a>
    <a href="syllabus.html" class="nav-item">
      <svg viewBox="0 0 24 24"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>
      <span class="nav-label">Syllabus</span>
    </a>
    <a href="routine.html" class="nav-item">
      <svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg>
      <span class="nav-label">Routine</span>
    </a>
  </nav>

  <script>
    fetch('/api/me').then(r => { if (!r.ok) window.location.href = 'login.html'; });

    fetch('/api/profile').then(r => r.json()).then(p => {
      if (p) {
        const headerAvatar = document.getElementById('headerAvatar');
        const headerName = document.getElementById('headerProfileName');
        if (headerName) headerName.textContent = p.name ? p.name.split(' ')[0] : 'Profile';
        if (headerAvatar) {
          if (p.avatarUrl) {
            headerAvatar.innerHTML = `<img src="${p.avatarUrl}" alt="${p.name}">`;
          } else {
            headerAvatar.textContent = p.name ? p.name.charAt(0).toUpperCase() : 'S';
          }
        }
      }
    }).catch(() => {});

    document.getElementById('logoutBtn').addEventListener('click', () => {
      fetch('/api/logout', { method: 'POST' }).then(() => window.location.href = 'index.html');
    });

    const fileInput = document.getElementById('fileInput');
    const dropZone = document.getElementById('dropZone');
    const dropMainText = document.getElementById('dropMainText');
    const uploadForm = document.getElementById('uploadForm');
    const uploadMsg = document.getElementById('uploadMsg');
    const uploadBtn = document.getElementById('uploadBtn');
    const fileSelectedBar = document.getElementById('fileSelectedBar');
    const selectedFileName = document.getElementById('selectedFileName');
    const selectedFileSize = document.getElementById('selectedFileSize');
    const removeFileBtn = document.getElementById('removeFileBtn');

    function formatBytes(bytes) {
      if (bytes < 1024) return bytes + ' B';
      if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(1) + ' KB';
      return (bytes / (1024 * 1024)).toFixed(1) + ' MB';
    }

    function handleFilePicked(file) {
      if (!file) return;
      selectedFileName.textContent = file.name;
      selectedFileSize.textContent = formatBytes(file.size);
      fileSelectedBar.style.display = 'flex';
      dropZone.style.borderColor = '#1d1d1f';
      
      // Auto-suggest title if empty
      const titleInput = document.getElementById('titleInput');
      if (!titleInput.value.trim()) {
        const cleanName = file.name.replace(/\.[^/.]+$/, "").replace(/[-_]/g, " ");
        titleInput.value = cleanName;
      }
    }

    fileInput.addEventListener('change', () => {
      if (fileInput.files.length) {
        handleFilePicked(fileInput.files[0]);
      }
    });

    removeFileBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      fileInput.value = '';
      fileSelectedBar.style.display = 'none';
      dropZone.style.borderColor = 'var(--ap-border)';
    });

    ['dragover', 'dragleave', 'drop'].forEach(evt => {
      dropZone.addEventListener(evt, e => e.preventDefault());
    });

    dropZone.addEventListener('dragover', () => {
      dropZone.classList.add('dragover');
    });

    dropZone.addEventListener('dragleave', () => {
      dropZone.classList.remove('dragover');
    });

    dropZone.addEventListener('drop', e => {
      dropZone.classList.remove('dragover');
      if (e.dataTransfer.files.length) {
        fileInput.files = e.dataTransfer.files;
        handleFilePicked(e.dataTransfer.files[0]);
      }
    });

    function showToast(message) {
      let toast = document.getElementById('socialToast');
      if (!toast) {
        toast = document.createElement('div');
        toast.id = 'socialToast';
        toast.className = 'social-toast';
        document.body.appendChild(toast);
      }
      toast.innerHTML = `<svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M20 6L9 17l-5-5"/></svg><span>${message}</span>`;
      toast.classList.add('show');
      setTimeout(() => toast.classList.remove('show'), 2600);
    }

    uploadForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      if (!fileInput.files.length) {
        uploadMsg.textContent = 'Please choose a file to upload.';
        uploadMsg.className = 'studio-status-msg error';
        return;
      }

      const formData = new FormData();
      formData.append('file', fileInput.files[0]);
      formData.append('title', document.getElementById('titleInput').value.trim());
      formData.append('subject', document.getElementById('subjectInput').value.trim());
      formData.append('chapter', document.getElementById('chapterInput').value.trim());

      uploadBtn.disabled = true;
      uploadBtn.innerHTML = `<span>Uploading…</span>`;
      uploadMsg.textContent = '';
      uploadMsg.className = 'studio-status-msg';

      try {
        const res = await fetch('/api/files/upload', { method: 'POST', body: formData });
        const data = await res.json();
        if (!res.ok) throw new Error(data.message || 'Upload failed');
        
        showToast('Resource published to feed successfully!');
        
        fileInput.value = '';
        fileSelectedBar.style.display = 'none';
        document.getElementById('titleInput').value = '';
        document.getElementById('subjectInput').value = '';
        document.getElementById('chapterInput').value = '';
        
        uploadMsg.className = 'studio-status-msg success';
        uploadMsg.innerHTML = `File uploaded successfully! <a href="dashboard.html" class="view-feed-link">View in Feed &rarr;</a>`;
        
        // Redirect to dashboard after 1.2 seconds so they can see their new post
        setTimeout(() => {
          window.location.href = 'dashboard.html';
        }, 1200);

      } catch (err) {
        uploadMsg.textContent = err.message || 'Error uploading file.';
        uploadMsg.className = 'studio-status-msg error';
      } finally {
        uploadBtn.disabled = false;
        uploadBtn.innerHTML = `
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 3v12"/><path d="M7 8l5-5 5 5"/><path d="M5 21h14a2 2 0 0 0 2-2v-4"/><path d="M3 15v4a2 2 0 0 0 2 2"/>
          </svg>
          <span>Publish Resource</span>
        `;
      }
    });
  </script>

</body>
</html>
