<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Files — Semester Library</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body class="dash">

  <header class="dash-header">
    <span class="lib-wordmark">Semester Library</span>
    <button id="logoutBtn" class="dash-logout">
      <svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/>
        <path d="M16 17l5-5-5-5"/>
        <path d="M21 12H9"/>
      </svg>
      Logout
    </button>
  </header>

  <div class="feed-heading">
    <h2>Shared Files</h2>
    <span id="fileCount"></span>
  </div>

  <section class="upload-box">
    <form id="uploadForm">
      <label for="titleInput" class="upload-label">File name</label>
      <input type="text" id="titleInput" class="upload-title-input" placeholder="e.g. Chapter 4 Slides, Lab 6 Solution" maxlength="80">

      <label for="fileInput" class="upload-drop" id="dropZone">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 3v12"/>
          <path d="M7 8l5-5 5 5"/>
          <path d="M5 21h14a2 2 0 0 0 2-2v-4"/>
          <path d="M3 15v4a2 2 0 0 0 2 2"/>
        </svg>
        <span id="dropText">Click to choose a file, or drag one here</span>
        <input type="file" id="fileInput" name="file" hidden required>
      </label>
      <button type="submit" class="btn-primary upload-btn" id="uploadBtn">Upload</button>
      <p id="uploadMsg" class="error-msg"></p>
    </form>
  </section>

  <main class="feed" id="fileList"></main>

  <nav class="bottom-nav">
    <button class="nav-item" onclick="location.href='dashboard.html'">
      <svg viewBox="0 0 24 24"><path d="M14 3v4a1 1 0 0 0 1 1h4"/><path d="M17 21H7a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h7l5 5v11a2 2 0 0 1-2 2z"/><path d="M9 13h6M9 17h4"/></svg>
      <span class="nav-label">Notes</span>
    </button>
    <button class="nav-item active">
      <svg viewBox="0 0 24 24"><path d="M12 3v12"/><path d="M7 8l5-5 5 5"/><path d="M5 21h14a2 2 0 0 0 2-2v-4"/><path d="M3 15v4a2 2 0 0 0 2 2"/></svg>
      <span class="nav-label">Files</span>
    </button>
    <button class="nav-item">
      <svg viewBox="0 0 24 24"><path d="M21 11.5a8.5 8.5 0 0 1-8.5 8.5 8.4 8.4 0 0 1-3.5-.75L3 21l1.8-5.4A8.4 8.4 0 0 1 4 12.5 8.5 8.5 0 1 1 21 11.5z"/></svg>
      <span class="nav-label">Chat</span>
    </button>
    <button class="nav-item">
      <svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg>
      <span class="nav-label">Routine</span>
    </button>
  </nav>

  <script>
    fetch('/api/me').then(r => { if (!r.ok) window.location.href = 'login.html'; });

    document.getElementById('logoutBtn').addEventListener('click', () => {
      fetch('/api/logout', { method: 'POST' }).then(() => window.location.href = 'index.html');
    });

    const fileInput = document.getElementById('fileInput');
    const dropZone = document.getElementById('dropZone');
    const dropText = document.getElementById('dropText');
    const uploadForm = document.getElementById('uploadForm');
    const uploadMsg = document.getElementById('uploadMsg');
    const uploadBtn = document.getElementById('uploadBtn');

    fileInput.addEventListener('change', () => {
      if (fileInput.files.length) dropText.textContent = fileInput.files[0].name;
    });

    ['dragover', 'dragleave', 'drop'].forEach(evt => {
      dropZone.addEventListener(evt, e => e.preventDefault());
    });
    dropZone.addEventListener('drop', e => {
      if (e.dataTransfer.files.length) {
        fileInput.files = e.dataTransfer.files;
        dropText.textContent = e.dataTransfer.files[0].name;
      }
    });

    uploadForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      if (!fileInput.files.length) return;

      const formData = new FormData();
      formData.append('file', fileInput.files[0]);
      formData.append('title', document.getElementById('titleInput').value.trim());

      uploadBtn.disabled = true;
      uploadBtn.textContent = 'Uploading…';
      uploadMsg.textContent = '';

      try {
        const res = await fetch('/api/files/upload', { method: 'POST', body: formData });
        const data = await res.json();
        if (!res.ok) throw new Error(data.message || 'Upload failed');
        dropText.textContent = 'Click to choose a file, or drag one here';
        fileInput.value = '';
        document.getElementById('titleInput').value = '';
        loadFiles();
      } catch (err) {
        uploadMsg.textContent = err.message;
      } finally {
        uploadBtn.disabled = false;
        uploadBtn.textContent = 'Upload';
      }
    });

    function formatSize(bytes) {
      if (bytes < 1024) return bytes + ' B';
      if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(1) + ' KB';
      return (bytes / (1024 * 1024)).toFixed(1) + ' MB';
    }

    function timeAgo(iso) {
      const diffMs = Date.now() - new Date(iso).getTime();
      const mins = Math.floor(diffMs / 60000);
      if (mins < 1) return 'just now';
      if (mins < 60) return mins + 'm ago';
      const hrs = Math.floor(mins / 60);
      if (hrs < 24) return hrs + 'h ago';
      return Math.floor(hrs / 24) + 'd ago';
    }
function isImageFile(name) {
      return /\.(jpg|jpeg|png|gif|webp|svg)$/i.test(name);
    }

    function getFileExt(name) {
      const match = name.match(/\.([a-zA-Z0-9]+)$/);
      return match ? match[1].toUpperCase() : 'FILE';
    }
    
    async function loadFiles() {
      const res = await fetch('/api/files');
      if (!res.ok) return;
      const files = await res.json();

      document.getElementById('fileCount').textContent =
        files.length + (files.length === 1 ? ' file' : ' files');

      const list = document.getElementById('fileList');

      if (!files.length) {
        list.innerHTML = '<p class="empty-state">No files shared yet — be the first to upload one.</p>';
        return;
      }

      list.innerHTML = files.map(f => `
        <article class="fb-card" data-file-id="${f.id}">
          <div class="fb-card-header">
            <div class="fb-avatar">${f.uploaderName.charAt(0).toUpperCase()}</div>
            <div class="fb-header-text">
              <p class="fb-uploader-name">${f.uploaderName}</p>
              <p class="fb-meta">uploaded a file &middot; ${timeAgo(f.uploadedAt)}</p>
            </div>
          </div>
          <p class="fb-caption">${f.title || f.originalName}</p>
          <a href="/api/files/${f.id}/view" target="_blank" class="fb-preview">
            ${isImageFile(f.originalName) ? `
              <img src="/api/files/${f.id}/view" alt="${f.originalName}" class="fb-preview-img">
            ` : `
              <div class="fb-doc-thumb">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M14 3v4a1 1 0 0 0 1 1h4"/>
                  <path d="M17 21H7a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h7l5 5v11a2 2 0 0 1-2 2z"/>
                </svg>
                <span class="fb-ext-badge">${getFileExt(f.originalName)}</span>
                <div class="fb-play-badge">
                  <svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
                </div>
              </div>
              <div class="fb-doc-titlebar">${f.originalName} &middot; ${formatSize(f.sizeBytes)}</div>
            `}
          </a>
          <div class="fb-actions">
            <a href="/api/files/${f.id}/view" target="_blank" class="file-view">View</a>
            <a href="/api/files/${f.id}/download" class="file-download">Download</a>
          </div>
        </article>
      `).join('');
    }

   loadFiles();

    // --- Hover preview popup ---
    const previewPopup = document.createElement('div');
    previewPopup.className = 'file-preview-popup';
    previewPopup.innerHTML = '<iframe></iframe>';
    document.body.appendChild(previewPopup);
    const previewFrame = previewPopup.querySelector('iframe');
    let previewTimer = null;

    document.getElementById('fileList').addEventListener('mouseover', (e) => {
      const card = e.target.closest('[data-file-id]');
      if (!card || card.dataset.hovering) return;
      document.querySelectorAll('[data-file-id]').forEach(c => c.dataset.hovering = '');
      card.dataset.hovering = 'true';

      clearTimeout(previewTimer);
      previewTimer = setTimeout(() => {
        previewFrame.src = `/api/files/${card.dataset.fileId}/view`;
        previewPopup.classList.add('visible');
      }, 200);
    });

    document.getElementById('fileList').addEventListener('mousemove', (e) => {
      const card = e.target.closest('[data-file-id]');
      if (!card) return;
      let top = e.clientY + 16;
      let left = e.clientX + 16;
      if (left + 280 > window.innerWidth) left = e.clientX - 296;
      if (top + 200 > window.innerHeight) top = e.clientY - 216;
      previewPopup.style.top = top + 'px';
      previewPopup.style.left = left + 'px';
    });

    document.getElementById('fileList').addEventListener('mouseout', (e) => {
      const card = e.target.closest('[data-file-id]');
      if (!card || card.contains(e.relatedTarget)) return;
      clearTimeout(previewTimer);
      previewPopup.classList.remove('visible');
      previewFrame.src = '';
      card.dataset.hovering = '';
    });
  </script>

</body>
</html>
