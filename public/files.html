<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <script src="/theme.js"></script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Upload Note — Semester Library</title>

  <!-- Web App Manifest & iOS PWA Metadata -->
  <link rel="manifest" href="/manifest.json">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Semester Library">
  <meta name="theme-color" content="#ffffff">

  <script>
    fetch('/api/me').then(r => { if (!r.ok) showAuthModal(true); }).catch(() => showAuthModal(true));
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.v4.css">
  <link rel="stylesheet" href="chatbot.css">
  <script src="syllabus-helper.js"></script>
  <style>
    :root {
      --bg: #f8f9fa;
      --surface: #ffffff;
      --surface-hover: #f3f4f6;
      --border: rgba(0, 0, 0, 0.12);
      --border-focus: #0071e3;
      --text: #111827;
      --text-muted: #6b7280;
      --accent: #0071e3;
      --accent-hover: #0077ed;
      --dropzone-bg: #f9fafb;
      --dropzone-hover: #f3f4f6;
      --dropzone-border: rgba(0, 0, 0, 0.16);
      --card-shadow: 0 8px 30px rgba(0, 0, 0, 0.06), 0 1px 3px rgba(0, 0, 0, 0.04);
      --radius: 20px;
    }

    html[data-theme="dark"],
    body.dark-mode {
      --bg: #0a0a0a;
      --surface: #171717;
      --surface-hover: #222222;
      --border: rgba(255, 255, 255, 0.12);
      --border-focus: #0071e3;
      --text: #f5f5f7;
      --text-muted: #8e8e93;
      --accent: #0071e3;
      --accent-hover: #0077ed;
      --dropzone-bg: #1c1c1e;
      --dropzone-hover: #242426;
      --dropzone-border: rgba(255, 255, 255, 0.16);
      --card-shadow: 0 12px 40px rgba(0, 0, 0, 0.7), 0 0 0 1px rgba(255, 255, 255, 0.06);
    }

    * {
      box-sizing: border-box;
    }

    body.dash {
      background: var(--bg);
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, "SF Pro Text", sans-serif;
      color: var(--text);
      -webkit-font-smoothing: antialiased;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      margin: 0;
      padding: 0;
      transition: background 0.25s ease, color 0.25s ease;
    }

    .upload-container {
      width: 100%;
      max-width: 600px;
      margin: 40px auto 60px;
      padding: 0 20px;
      box-sizing: border-box;
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: stretch;
    }

    .upload-card-clean {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 34px 30px;
      box-shadow: var(--card-shadow);
      box-sizing: border-box;
      width: 100%;
      display: flex;
      flex-direction: column;
      transition: background 0.25s ease, border-color 0.25s ease, box-shadow 0.25s ease;
    }

    .upload-card-header {
      display: flex;
      align-items: flex-start;
      gap: 14px;
      margin-bottom: 22px;
      padding-bottom: 16px;
      border-bottom: 1px solid var(--border);
    }

    .upload-header-icon-wrap {
      width: 42px;
      height: 42px;
      border-radius: 12px;
      background: rgba(0, 113, 227, 0.12);
      color: var(--accent);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      border: 1px solid rgba(0, 113, 227, 0.22);
    }

    .upload-header-text {
      flex: 1;
      min-width: 0;
    }

    .upload-head-title {
      font-size: 20px;
      font-weight: 800;
      letter-spacing: -0.02em;
      margin: 0 0 4px;
      color: var(--text);
      line-height: 1.25;
    }

    .upload-head-sub {
      font-size: 13px;
      color: var(--text-muted);
      margin: 0;
      line-height: 1.4;
    }

    /* Minimal Dropzone with stylized Icon */
    .clean-dropzone {
      border: 2px dashed var(--dropzone-border);
      border-radius: 16px;
      padding: 28px 18px;
      text-align: center;
      cursor: pointer;
      background: var(--dropzone-bg);
      transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
      margin-bottom: 22px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 8px;
      box-sizing: border-box;
      width: 100%;
    }

    .clean-dropzone:hover, .clean-dropzone.dragover {
      border-color: var(--accent);
      background: var(--dropzone-hover);
    }

    .dropzone-icon-circle {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      background: var(--accent);
      color: #ffffff;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 4px;
      box-shadow: 0 4px 14px rgba(0, 113, 227, 0.32);
      transition: transform 0.2s ease;
    }

    .clean-dropzone:hover .dropzone-icon-circle {
      transform: translateY(-2px) scale(1.05);
    }

    .dropzone-label {
      font-size: 14.5px;
      font-weight: 700;
      color: var(--text);
    }

    .dropzone-hint {
      font-size: 12px;
      color: var(--text-muted);
      line-height: 1.4;
    }

    /* File Queue Section */
    .file-queue-section {
      background: var(--dropzone-bg);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 14px;
      margin-bottom: 20px;
      box-sizing: border-box;
      width: 100%;
    }

    .file-queue-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 10px;
      padding-bottom: 8px;
      border-bottom: 1px solid var(--border);
    }

    .file-queue-title {
      font-size: 13px;
      font-weight: 700;
      color: var(--text);
    }

    .btn-clear-all {
      background: none;
      border: none;
      color: #ef4444;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
      padding: 2px 8px;
      border-radius: 6px;
      transition: background 0.15s;
    }

    .btn-clear-all:hover {
      background: rgba(239, 68, 68, 0.12);
    }

    .file-queue-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
      max-height: 200px;
      overflow-y: auto;
      padding-right: 4px;
    }

    .file-queue-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 9px 12px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 10px;
      font-size: 13px;
      box-sizing: border-box;
      width: 100%;
    }

    .file-queue-left {
      display: flex;
      align-items: center;
      gap: 9px;
      min-width: 0;
      flex: 1;
    }

    .file-type-pill {
      font-size: 10px;
      font-weight: 800;
      padding: 2px 7px;
      border-radius: 6px;
      text-transform: uppercase;
      letter-spacing: 0.02em;
      flex-shrink: 0;
    }

    .badge-pdf { background: #fee2e2; color: #b91c1c; }
    .badge-doc { background: #dbeafe; color: #1d4ed8; }
    .badge-img { background: #dcfce7; color: #15803d; }
    .badge-zip { background: #f3e8ff; color: #7e22ce; }
    .badge-ppt { background: #ffedd5; color: #c2410c; }
    .badge-other { background: #f3f4f6; color: #4b5563; }

    [data-theme="dark"] .badge-pdf, body.dark-mode .badge-pdf { background: rgba(239, 68, 68, 0.18); color: #f87171; }
    [data-theme="dark"] .badge-doc, body.dark-mode .badge-doc { background: rgba(59, 130, 246, 0.18); color: #60a5fa; }
    [data-theme="dark"] .badge-img, body.dark-mode .badge-img { background: rgba(16, 185, 129, 0.18); color: #34d399; }
    [data-theme="dark"] .badge-zip, body.dark-mode .badge-zip { background: rgba(168, 85, 247, 0.18); color: #c084fc; }
    [data-theme="dark"] .badge-ppt, body.dark-mode .badge-ppt { background: rgba(249, 115, 22, 0.18); color: #fb923c; }
    [data-theme="dark"] .badge-other, body.dark-mode .badge-other { background: #2a2a2a; color: #d1d5db; }

    .file-queue-name {
      font-weight: 600;
      color: var(--text);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      flex: 1;
      min-width: 0;
    }

    .file-queue-size {
      font-size: 11.5px;
      color: var(--text-muted);
      flex-shrink: 0;
    }

    .file-queue-remove {
      background: none;
      border: none;
      color: var(--text-muted);
      font-size: 18px;
      line-height: 1;
      cursor: pointer;
      width: 26px;
      height: 26px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 0;
      border-radius: 6px;
      transition: all 0.15s;
      flex-shrink: 0;
    }

    .file-queue-remove:hover {
      color: #ef4444;
      background: rgba(239, 68, 68, 0.12);
    }

    .clean-grid-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px;
      width: 100%;
      box-sizing: border-box;
    }

    @media (max-width: 540px) {
      .clean-grid-row {
        grid-template-columns: 1fr;
        gap: 0;
      }
    }

    .clean-field {
      margin-bottom: 18px;
      width: 100%;
      box-sizing: border-box;
    }

    .clean-label {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      font-size: 12px;
      font-weight: 700;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.04em;
      margin-bottom: 7px;
      line-height: 1.3;
    }

    .clean-label span {
      font-weight: normal;
      text-transform: none;
      letter-spacing: normal;
    }

    .clean-input, .clean-select {
      width: 100%;
      box-sizing: border-box;
      padding: 12px 14px;
      border: 1.5px solid var(--border);
      border-radius: 12px;
      font-size: 14px;
      font-family: inherit;
      color: var(--text);
      background: var(--surface);
      outline: none;
      transition: border-color 0.2s ease, box-shadow 0.2s ease;
      display: block;
    }

    .clean-select {
      cursor: pointer;
      appearance: none;
      -webkit-appearance: none;
      -moz-appearance: none;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 24 24' width='16' height='16' fill='none' stroke='%23888888' stroke-width='2' stroke-linecap='round' stroke-linejoin='round' xmlns='http://www.w3.org/2000/svg'%3E%3Cpolyline points='6 9 12 15 18 9'%3E%3C/polyline%3E%3C/svg%3E");
      background-repeat: no-repeat;
      background-position: right 14px center;
      background-size: 16px;
      padding-right: 40px;
    }

    .clean-input:focus, .clean-select:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(0, 113, 227, 0.16);
    }

    .clean-select:disabled {
      background-color: var(--dropzone-bg);
      color: var(--text-muted);
      cursor: not-allowed;
      opacity: 0.65;
    }

    .clean-select option {
      background: var(--surface);
      color: var(--text);
    }

    [data-theme="dark"] .clean-select option,
    body.dark-mode .clean-select option {
      background: #171717;
      color: #f5f5f7;
    }

    .btn-submit-clean {
      width: 100%;
      box-sizing: border-box;
      padding: 14px 20px;
      border-radius: 12px;
      background: var(--accent);
      color: #ffffff;
      font-size: 14.5px;
      font-weight: 700;
      border: none;
      cursor: pointer;
      margin-top: 10px;
      box-shadow: 0 4px 14px rgba(0, 113, 227, 0.3);
      transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .btn-submit-clean:hover {
      background: var(--accent-hover);
      transform: translateY(-1px);
      box-shadow: 0 6px 20px rgba(0, 113, 227, 0.42);
    }

    .btn-submit-clean:active {
      transform: scale(0.99);
    }

    .btn-submit-clean:disabled {
      background: var(--border);
      color: var(--text-muted);
      cursor: not-allowed;
      transform: none;
      box-shadow: none;
    }

    #statusMsg {
      font-size: 13px;
      text-align: center;
      margin-top: 14px;
      font-weight: 600;
      min-height: 20px;
    }

    @media (max-width: 768px) {
      .upload-container {
        margin: 20px auto 80px;
        padding: 0 16px;
        max-width: 100%;
      }

      .upload-card-clean {
        padding: 24px 20px;
        border-radius: 16px;
      }

      .clean-dropzone {
        padding: 24px 16px;
      }

      .clean-input, .clean-select {
        min-height: 48px;
        font-size: 16px !important; /* Prevents iOS auto-zoom */
      }

      .btn-submit-clean {
        min-height: 50px;
        font-size: 15px;
      }

      .file-queue-name {
        max-width: 170px;
      }
    }

    @media (max-width: 480px) {
      .upload-container {
        margin: 12px auto 60px;
        padding: 0 12px;
      }

      .upload-card-clean {
        padding: 20px 16px;
        border-radius: 14px;
      }

      .upload-card-header {
        gap: 12px;
        margin-bottom: 18px;
        padding-bottom: 14px;
      }

      .upload-header-icon-wrap {
        width: 38px;
        height: 38px;
      }

      .upload-head-title {
        font-size: 18px;
      }

      .upload-head-sub {
        font-size: 12px;
      }

      .clean-dropzone {
        padding: 20px 12px;
      }
    }
  </style>
  <link rel="stylesheet" href="auth-modal.css">
  <link rel="stylesheet" href="/theme-overrides.css">
</head>
<body class="dash">

  <!-- Slim Header -->
  <header class="dash-header">
    <div class="dash-header-left">
      <a href="dashboard.html" class="lib-wordmark">Semester Library</a>
      <span class="apple-univ-tag">GU</span>
    </div>

    <nav class="dash-header-nav">
      <a href="dashboard.html" class="header-nav-item">Feed</a>
      <a href="library.html" class="header-nav-item">Library</a>
      <a href="/code-lab/subjects.html" class="header-nav-item">Assignments</a>
      <a href="routine.html" class="header-nav-item">Routine</a>
      <a href="chat.html" class="header-nav-item">Chat</a>
      <a href="chatbot.html" class="header-nav-item">Kyana AI</a>
    </nav>

    <div class="dash-header-actions">
      <button type="button" class="theme-toggle-btn dash-theme-btn" id="themeToggleBtn" aria-label="Toggle theme" title="Toggle theme">
        <span class="theme-toggle-track">
          <svg class="theme-icon-sun" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <circle cx="12" cy="12" r="5"></circle>
            <line x1="12" y1="1" x2="12" y2="3"></line>
            <line x1="12" y1="21" x2="12" y2="23"></line>
            <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
            <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
            <line x1="1" y1="12" x2="3" y2="12"></line>
            <line x1="21" y1="12" x2="23" y2="12"></line>
            <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
            <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
          </svg>
          <svg class="theme-icon-moon" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
          </svg>
        </span>
      </button>
      <a href="profile.html" class="dash-profile-chip" title="View Profile">
        <div class="dash-profile-avatar" id="headerAvatar">·</div>
        <span class="dash-profile-label" id="headerProfileName">Profile</span>
      </a>
    </div>
  </header>

  <main class="upload-container">
    <div class="upload-card-clean">
      <div class="upload-card-header">
        <div class="upload-header-icon-wrap">
          <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M17 8l-5-5-5 5M12 3v12"/>
          </svg>
        </div>
        <div class="upload-header-text">
          <h1 class="upload-head-title">Share Study Material</h1>
          <p class="upload-head-sub">Publish notes, slide decks, or assignments directly to your semester library.</p>
        </div>
      </div>

      <form id="uploadForm">
        
        <!-- Multi-File Dropzone with stylized Icon -->
        <label for="fileInput" class="clean-dropzone" id="dropZone">
          <div class="dropzone-icon-circle">
            <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
              <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M17 8l-5-5-5 5M12 3v12"/>
            </svg>
          </div>
          <span class="dropzone-label" id="dropLabel">Choose file(s) or drag & drop</span>
          <span class="dropzone-hint">PDF, DOCX, ZIP, Images, PPTX up to 250MB each &middot; Select multiple files</span>
          <input type="file" id="fileInput" multiple hidden>
        </label>

        <!-- Selected Files Queue Display -->
        <div id="fileQueueSection" class="file-queue-section" style="display:none;">
          <div class="file-queue-header">
            <span class="file-queue-title" id="fileQueueSummary">0 files selected</span>
            <button type="button" class="btn-clear-all" id="clearAllFilesBtn">Clear All</button>
          </div>
          <div class="file-queue-list" id="fileQueueList"></div>
        </div>

        <!-- Title -->
        <div class="clean-field">
          <label class="clean-label" for="titleInput">Resource Title <span style="font-weight:normal; text-transform:none; color:var(--text-muted);">(Optional &middot; defaults to file name)</span></label>
          <input type="text" id="titleInput" class="clean-input" placeholder="e.g. Chapter 2 Digital Logic Notes" maxlength="100">
        </div>

        <!-- Semester & Course Row -->
        <div class="clean-grid-row">
          <div class="clean-field">
            <label class="clean-label" for="semesterSelect">Semester</label>
            <select id="semesterSelect" class="clean-select" required>
              <option value="">Select Semester…</option>
            </select>
          </div>

          <div class="clean-field">
            <label class="clean-label" for="subjectSelect">Subject / Course</label>
            <select id="subjectSelect" class="clean-select" disabled required>
              <option value="">Choose semester first</option>
            </select>
            <input type="text" id="customSubInput" class="clean-input" placeholder="Enter custom subject" style="display:none; margin-top:8px;">
          </div>
        </div>

        <!-- Chapter / Unit -->
        <div class="clean-field">
          <label class="clean-label" for="chapterSelect">Chapter / Unit</label>
          <select id="chapterSelect" class="clean-select" disabled>
            <option value="">Choose subject first</option>
          </select>
          <input type="text" id="customChapterInput" class="clean-input" placeholder="Enter custom unit name" style="display:none; margin-top:8px;">
        </div>

        <button type="submit" class="btn-submit-clean" id="submitBtn">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M17 8l-5-5-5 5M12 3v12"/>
          </svg>
          <span id="submitBtnLabel">Publish to Library</span>
        </button>
        <p id="statusMsg" style="font-size:13px; text-align:center; margin-top:12px; font-weight:600;"></p>
      </form>
    </div>
  </main>

  <footer class="app-global-footer">
    <div class="app-footer-inner">
      <div class="app-footer-brand">
        <strong>Semester Library</strong>
        <span>· Bachelor of Information Technology</span>
      </div>
      <div class="app-footer-meta">
        <span>Gandaki University</span>
      </div>
    </div>
  </footer>

  <script>
    fetch('/api/me').then(r => { if (!r.ok) showAuthModal(true); });

    fetch('/api/profile').then(r => r.ok ? r.json() : null).then(p => {
      if (p) {
        const headerAvatar = document.getElementById('headerAvatar');
        const headerName = document.getElementById('headerProfileName');
        if (headerName) headerName.textContent = p.name ? p.name.split(' ')[0] : 'Profile';
        if (headerAvatar) {
          if (p.avatarUrl) {
            headerAvatar.innerHTML = `<img src="${p.avatarUrl}" alt="${p.name}">`;
          } else {
            headerAvatar.textContent = p.name ? p.name.charAt(0).toUpperCase() : 'S';
          }
        }
      }
    }).catch(() => {});

    const fileInput = document.getElementById('fileInput');
    const dropZone = document.getElementById('dropZone');
    const fileQueueSection = document.getElementById('fileQueueSection');
    const fileQueueSummary = document.getElementById('fileQueueSummary');
    const fileQueueList = document.getElementById('fileQueueList');
    const clearAllFilesBtn = document.getElementById('clearAllFilesBtn');
    const titleInput = document.getElementById('titleInput');

    const semesterSelect = document.getElementById('semesterSelect');
    const subjectSelect = document.getElementById('subjectSelect');
    const chapterSelect = document.getElementById('chapterSelect');
    const customSubInput = document.getElementById('customSubInput');
    const customChapterInput = document.getElementById('customChapterInput');
    const submitBtn = document.getElementById('submitBtn');
    const submitBtnLabel = document.getElementById('submitBtnLabel');
    const statusMsg = document.getElementById('statusMsg');

    let syllabusData = null;
    let semesterList = [];
    let libraryStats = [];
    let libraryFiles = [];
    let selectedFiles = [];

    function formatBytes(bytes) {
      if (!bytes || bytes === 0) return '0 Bytes';
      const k = 1024;
      const sizes = ['Bytes', 'KB', 'MB', 'GB'];
      const i = Math.floor(Math.log(bytes) / Math.log(k));
      return parseFloat((bytes / Math.pow(k, i)).toFixed(1)) + ' ' + sizes[i];
    }

    function getFileTypeInfo(filename) {
      const ext = (filename.split('.').pop() || '').toLowerCase();
      if (['pdf'].includes(ext)) return { ext: 'PDF', badge: 'badge-pdf' };
      if (['doc', 'docx', 'txt', 'rtf', 'odt'].includes(ext)) return { ext: ext.toUpperCase(), badge: 'badge-doc' };
      if (['png', 'jpg', 'jpeg', 'gif', 'webp', 'svg'].includes(ext)) return { ext: 'IMG', badge: 'badge-img' };
      if (['zip', 'rar', '7z', 'tar', 'gz'].includes(ext)) return { ext: 'ZIP', badge: 'badge-zip' };
      if (['ppt', 'pptx'].includes(ext)) return { ext: 'PPT', badge: 'badge-ppt' };
      return { ext: ext.slice(0, 4).toUpperCase() || 'FILE', badge: 'badge-other' };
    }

    function renderFileQueue() {
      if (selectedFiles.length === 0) {
        fileQueueSection.style.display = 'none';
        submitBtnLabel.textContent = 'Publish to Library';
        return;
      }

      fileQueueSection.style.display = 'block';
      let totalSize = selectedFiles.reduce((acc, f) => acc + f.size, 0);
      fileQueueSummary.textContent = `${selectedFiles.length} file${selectedFiles.length > 1 ? 's' : ''} selected (${formatBytes(totalSize)})`;
      submitBtnLabel.textContent = `Publish ${selectedFiles.length} File${selectedFiles.length > 1 ? 's' : ''} to Library`;

      fileQueueList.innerHTML = selectedFiles.map((file, idx) => {
        const info = getFileTypeInfo(file.name);
        return `
          <div class="file-queue-item">
            <div class="file-queue-left">
              <span class="file-type-pill ${info.badge}">${info.ext}</span>
              <span class="file-queue-name" title="${escapeHtml(file.name)}">${escapeHtml(file.name)}</span>
              <span class="file-queue-size">${formatBytes(file.size)}</span>
            </div>
            <button type="button" class="file-queue-remove" onclick="removeQueuedFile(${idx})" title="Remove file">&times;</button>
          </div>
        `;
      }).join('');
    }

    window.removeQueuedFile = function(index) {
      selectedFiles.splice(index, 1);
      renderFileQueue();
    };

    clearAllFilesBtn.addEventListener('click', () => {
      selectedFiles = [];
      fileInput.value = '';
      renderFileQueue();
    });

    function addFiles(files) {
      if (!files || !files.length) return;
      for (let i = 0; i < files.length; i++) {
        const file = files[i];
        if (file.size > 25 * 1024 * 1024) continue;
        const exists = selectedFiles.some(f => f.name === file.name && f.size === file.size);
        if (!exists) selectedFiles.push(file);
      }
      if (selectedFiles.length === 1 && !titleInput.value.trim()) {
        titleInput.value = selectedFiles[0].name.replace(/\.[^/.]+$/, '').replace(/[-_]/g, ' ');
      }
      renderFileQueue();
    }

    fileInput.addEventListener('change', () => {
      if (fileInput.files.length) addFiles(fileInput.files);
    });

    ['dragover', 'dragleave', 'drop'].forEach(e => dropZone.addEventListener(e, evt => evt.preventDefault()));
    dropZone.addEventListener('dragover', () => dropZone.classList.add('dragover'));
    dropZone.addEventListener('dragleave', () => dropZone.classList.remove('dragover'));
    dropZone.addEventListener('drop', e => {
      dropZone.classList.remove('dragover');
      if (e.dataTransfer && e.dataTransfer.files.length) {
        addFiles(e.dataTransfer.files);
      }
    });

    async function init() {
      try {
        const [sData, statsRes, filesRes] = await Promise.all([
          window.SyllabusHelper.loadSyllabusData(),
          fetch('/api/library/stats').then(r => r.ok ? r.json() : []).catch(() => []),
          fetch('/api/files').then(r => r.ok ? r.json() : []).catch(() => [])
        ]);
        syllabusData = sData;
        libraryStats = statsRes || [];
        libraryFiles = filesRes || [];
        semesterList = window.SyllabusHelper.getFormattedSemesters(syllabusData);

        semesterSelect.innerHTML = '<option value="">Select Semester…</option>' + 
          semesterList.map(s => `<option value="${s.shortName}">${s.fullLabel}</option>`).join('') +
          '<option value="General">General / All Semesters</option>';

        // Query params auto-fill
        const params = new URLSearchParams(location.search);
        const sem = params.get('sem');
        const sub = params.get('subject') || params.get('sub');
        const chap = params.get('chapter');

        if (sem) {
          const match = semesterList.find(s => s.rawSemester.toLowerCase() === sem.toLowerCase() || s.shortName.toLowerCase() === sem.toLowerCase());
          if (match) {
            semesterSelect.value = match.shortName;
            semesterSelect.dispatchEvent(new Event('change'));
          }
        }

        if (sub) {
          setTimeout(() => {
            let subFound = false;
            for (let opt of subjectSelect.options) {
              if (opt.value.toLowerCase() === sub.toLowerCase() || opt.value.toLowerCase().includes(sub.toLowerCase())) {
                subjectSelect.value = opt.value;
                subjectSelect.dispatchEvent(new Event('change'));
                subFound = true;
                break;
              }
            }
            if (!subFound && sub) {
              subjectSelect.value = '__custom__';
              subjectSelect.dispatchEvent(new Event('change'));
              customSubInput.value = sub;
            }
            if (chap) {
              setTimeout(() => {
                let chapFound = false;
                for (let opt of chapterSelect.options) {
                  if (opt.value.toLowerCase().includes(chap.toLowerCase()) || opt.value.toLowerCase() === chap.toLowerCase()) {
                    chapterSelect.value = opt.value;
                    chapterSelect.dispatchEvent(new Event('change'));
                    chapFound = true;
                    break;
                  }
                }
                if (!chapFound && chap) {
                  chapterSelect.value = '__custom__';
                  chapterSelect.dispatchEvent(new Event('change'));
                  customChapterInput.value = chap;
                }
              }, 40);
            }
          }, 40);
        }
      } catch (e) {
        console.error(e);
      }
    }

    semesterSelect.addEventListener('change', () => {
      const val = semesterSelect.value;
      customSubInput.style.display = 'none';
      customChapterInput.style.display = 'none';

      if (!val) {
        subjectSelect.innerHTML = '<option value="">Choose semester first</option>';
        subjectSelect.disabled = true;
        chapterSelect.innerHTML = '<option value="">Choose subject first</option>';
        chapterSelect.disabled = true;
        return;
      }

      const sem = semesterList.find(s => s.shortName === val);
      const courses = sem ? sem.courses : [];
      const normSem = window.SyllabusHelper.normalizeSemester(val);
      const syllabusCourseNames = new Set((courses || []).map(c => c.title.toLowerCase().trim()));

      const customSubjects = new Set();
      (libraryStats || []).concat(libraryFiles || []).forEach(item => {
        if (item && item.subject && item.subject.trim()) {
          const itemSem = window.SyllabusHelper.normalizeSemester(item.semester || '');
          if (itemSem === normSem && !syllabusCourseNames.has(item.subject.toLowerCase().trim())) {
            customSubjects.add(item.subject.trim());
          }
        }
      });

      let opts = '<option value="">Select Course / Subject…</option>';
      if (courses.length) {
        courses.forEach(c => {
          opts += `<option value="${escapeHtml(c.title)}">${c.code ? c.code + ' — ' : ''}${escapeHtml(c.title)}</option>`;
        });
      }
      if (customSubjects.size > 0) {
        Array.from(customSubjects).sort().forEach(subName => {
          opts += `<option value="${escapeHtml(subName)}">${escapeHtml(subName)}</option>`;
        });
      }
      opts += '<option value="__custom__">+ Custom Subject</option>';

      subjectSelect.innerHTML = opts;
      subjectSelect.disabled = false;

      chapterSelect.innerHTML = '<option value="">Choose subject first</option>';
      chapterSelect.disabled = true;
    });

    subjectSelect.addEventListener('change', () => {
      const val = subjectSelect.value;
      customChapterInput.style.display = 'none';

      if (val === '__custom__') {
        customSubInput.style.display = 'block';
        customSubInput.focus();
        chapterSelect.innerHTML = '<option value="General">Complete Notes / General</option><option value="Lab / Practical">Lab / Practical Work</option><option value="__custom__">+ Custom Unit</option>';
        chapterSelect.disabled = false;
        return;
      }
      customSubInput.style.display = 'none';

      if (!val) {
        chapterSelect.innerHTML = '<option value="">Choose subject first</option>';
        chapterSelect.disabled = true;
        return;
      }

      const course = window.SyllabusHelper.findCourse(syllabusData, val);
      const units = course && course.contents ? window.SyllabusHelper.parseCourseUnits(course.contents) : [];

      // Find existing custom chapters for this subject from libraryStats and libraryFiles
      const existingChapters = new Set();
      (libraryStats || []).concat(libraryFiles || []).forEach(item => {
        if (item && item.subject && item.subject.toLowerCase().trim() === val.toLowerCase().trim() && item.chapter) {
          const ch = item.chapter.trim();
          const lower = ch.toLowerCase();
          const isGenOrLab = lower === 'general' || lower === 'general notes' || lower === 'complete notes' || lower === 'complete notes / general' || lower.includes('lab') || lower.includes('practical');
          const isSyllabus = units.some(u => ch.includes(`Unit ${u.num}`) || (u.title && u.title.length > 3 && ch.includes(u.title)));
          if (!isGenOrLab && !isSyllabus) {
            existingChapters.add(ch);
          }
        }
      });

      let opts = '<option value="General">Complete Notes / General</option>';
      if (units.length) {
        opts += '<optgroup label="Syllabus Units">';
        units.forEach(u => {
          opts += `<option value="Unit ${u.num}: ${escapeHtml(u.title)}">Unit ${u.num}: ${escapeHtml(u.title)}</option>`;
        });
        opts += '</optgroup>';
      }
      if (existingChapters.size > 0) {
        Array.from(existingChapters).sort().forEach(chapName => {
          opts += `<option value="${escapeHtml(chapName)}">${escapeHtml(chapName)}</option>`;
        });
      }
      opts += '<option value="Lab / Practical">Lab / Practical Work</option><option value="__custom__">+ Custom Unit</option>';

      chapterSelect.innerHTML = opts;
      chapterSelect.disabled = false;
    });

    chapterSelect.addEventListener('change', () => {
      if (chapterSelect.value === '__custom__') {
        customChapterInput.style.display = 'block';
        customChapterInput.focus();
      } else {
        customChapterInput.style.display = 'none';
      }
    });

    function escapeHtml(str) {
      if (!str) return '';
      return String(str).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
    }

    document.getElementById('uploadForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      if (selectedFiles.length === 0) {
        statusMsg.textContent = 'Please choose at least one file.';
        statusMsg.style.color = '#ef4444';
        return;
      }

      let sub = subjectSelect.value === '__custom__' ? customSubInput.value.trim() : subjectSelect.value;
      let chap = chapterSelect.value === '__custom__' ? customChapterInput.value.trim() : chapterSelect.value;

      if (!semesterSelect.value || !sub) {
        statusMsg.textContent = 'Please select semester and course.';
        statusMsg.style.color = '#ef4444';
        return;
      }

      const fd = new FormData();
      for (const file of selectedFiles) {
        fd.append('files', file);
      }
      fd.append('title', titleInput.value.trim());
      fd.append('semester', semesterSelect.value);
      fd.append('subject', sub);
      fd.append('chapter', chap || '');

      submitBtn.disabled = true;
      submitBtn.innerHTML = `<span class="app-spinner spinner-sm spinner-light" style="margin-right:8px; display:inline-block; vertical-align:middle;"></span><span id="submitBtnLabel">Publishing ${selectedFiles.length} file${selectedFiles.length > 1 ? 's' : ''}…</span>`;
      statusMsg.textContent = '';

      try {
        let supaClient = null;
        try {
          if (window.supabase) {
            const cfgRes = await fetch('/api/chat/config');
            if (cfgRes.ok) {
              const cfg = await cfgRes.json();
              if (cfg.url && cfg.key) {
                supaClient = window.supabase.createClient(cfg.url, cfg.key);
              }
            }
          }
        } catch (e) {}

        if (supaClient) {
          // Direct browser-to-Supabase Storage upload (bypasses Vercel 4.5MB limit)
          const uploadedRecords = [];
          for (let i = 0; i < selectedFiles.length; i++) {
            const file = selectedFiles[i];
            submitBtnLabel.textContent = `Uploading (${i + 1}/${selectedFiles.length}) ${file.name.substring(0, 16)}…`;
            const ext = file.name.includes('.') ? file.name.substring(file.name.lastIndexOf('.')) : '';
            const cleanBase = file.name.replace(/\.[^/.]+$/, '').replace(/[^a-zA-Z0-9_-]/g, '_').substring(0, 40);
            const storedName = `${Date.now()}_${Math.random().toString(36).substring(2, 8)}_${cleanBase}${ext}`;

            const { data: upData, error: upErr } = await supaClient.storage
              .from('library_files')
              .upload(storedName, file, { cacheControl: '3600', upsert: false });

            if (upErr) {
              throw new Error(`Supabase upload failed: ${upErr.message}. Make sure 'library_files' public bucket is created in Supabase.`);
            }

            const { data: pubData } = supaClient.storage.from('library_files').getPublicUrl(storedName);
            uploadedRecords.push({
              storedName,
              originalName: file.name,
              size: file.size,
              mimeType: file.type || 'application/octet-stream',
              publicUrl: pubData ? pubData.publicUrl : ''
            });
          }

          submitBtnLabel.textContent = 'Saving details…';
          const recRes = await fetch('/api/files/record-upload', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              files: uploadedRecords,
              title: titleInput.value.trim(),
              semester: semesterSelect.value,
              subject: sub,
              chapter: chap || ''
            })
          });

          if (recRes.status === 401) {
            showAuthModal(true);
            return;
          }

          const recData = await recRes.json();
          if (!recRes.ok) throw new Error(recData.message || 'Failed to save upload info.');

          statusMsg.textContent = `Uploaded ${selectedFiles.length} file(s) successfully! Redirecting to library…`;
          statusMsg.style.color = '#10b981';
          setTimeout(() => location.href = 'library.html', 1000);
        } else {
          // Standard server fallback upload
          const fd = new FormData();
          for (const file of selectedFiles) {
            fd.append('files', file);
          }
          fd.append('title', titleInput.value.trim());
          fd.append('semester', semesterSelect.value);
          fd.append('subject', sub);
          fd.append('chapter', chap || '');

          const res = await fetch('/api/files/upload', { method: 'POST', body: fd });
          if (res.status === 401) {
            showAuthModal(true);
            return;
          }

          const ct = res.headers.get('content-type') || '';
          let data = {};
          if (ct.includes('application/json')) {
            data = await res.json();
          } else {
            const text = await res.text();
            throw new Error(`Server returned status ${res.status}. Please restart your server if updated.`);
          }

          if (!res.ok) throw new Error(data.message || 'Upload failed');
          statusMsg.textContent = `Uploaded ${selectedFiles.length} file(s) successfully! Redirecting to library…`;
          statusMsg.style.color = '#10b981';
          setTimeout(() => location.href = 'library.html', 1000);
        }
      } catch (err) {
        statusMsg.textContent = err.message || 'Upload error.';
        statusMsg.style.color = '#ef4444';
        submitBtn.disabled = false;
        submitBtnLabel.textContent = 'Publish to Library';
      }
    });

    init();
  </script>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="notifications.js"></script>
  <script src="chatbot.js"></script>
  <script src="auth-modal.js"></script>
  <!-- PWA Service Worker Registration -->
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('/sw.js').catch(err => {
          console.warn('[SW Registration Notice]:', err);
        });
      });
    }
  </script>
</body>
</html>
