<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <script src="/theme.js"></script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Notices — Semester Library</title>
  <meta name="description" content="View the latest official notices, academic circulars, and announcements for Gandaki University students.">
  <meta name="robots" content="index, follow">
  <link rel="canonical" href="https://semestar-library.vercel.app/notices">

  <!-- Web App Manifest & iOS PWA Metadata -->
  <link rel="manifest" href="/manifest.json">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Semester Library">
  <meta name="theme-color" content="#ffffff">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@600;700;800&family=Outfit:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.v4.css">
  <link rel="stylesheet" href="auth-modal.css">
  <link rel="stylesheet" href="/theme-overrides.css">
</head>
<body class="dash syllabus-page-body">
  <header class="dash-header">
    <a href="/dashboard.html" class="lib-wordmark">Semester Library</a>

    <nav class="dash-header-nav">
      <a href="/dashboard.html" class="header-nav-item">Feed</a>
      <a href="/library.html" class="header-nav-item">Library</a>
      <a href="/code-lab/subjects.html" class="header-nav-item">Assignments</a>
      <a href="/routine.html" class="header-nav-item">Routine</a>
      <a href="/chat.html" class="header-nav-item">Chat</a>
      <a href="/chatbot.html" class="header-nav-item">Kyana AI</a>
    </nav>

    <div class="dash-header-actions">
      <a href="/profile.html" class="dash-profile-chip" title="View Profile">
        <div class="dash-profile-avatar" id="headerAvatar">·</div>
        <span class="dash-profile-label" id="headerProfileName">Profile</span>
      </a>
    </div>
  </header>

  <main class="syllabus-container">
    <header class="syllabus-header-section">
      <div class="syllabus-heading-row">
        <div>
          <h1 class="syllabus-main-title">University Notices</h1>
          <p class="syllabus-sub-title">Official circulars and announcements from Gandaki University</p>
        </div>
      </div>
    </header>

    <section class="syllabus-content-area" id="noticesContainer" style="max-width: 800px;">
      <div class="detail-section-card" id="noticesLoading">
        <p class="section-body-text" style="color: var(--text-secondary, #888);">Loading official notices…</p>
      </div>
    </section>
  </main>

  <script>
    async function loadOfficialNotices() {
      const container = document.getElementById('noticesContainer');
      try {
        const res = await fetch('/api/posts?type=notice&official=true');
        if (res.status === 401) {
          container.innerHTML = `
            <div class="detail-section-card">
              <div class="section-card-header">
                <h3>Official Notices</h3>
              </div>
              <p class="section-body-text" style="color: var(--text-secondary, #888);">
                Please sign in to view official notices and academic circulars.
              </p>
            </div>
          `;
          return;
        }
        if (!res.ok) throw new Error('Failed to load notices');
        const data = await res.json();
        const notices = (data.posts || []).filter(p => p.type === 'notice');
        if (notices.length === 0) {
          container.innerHTML = `
            <div class="detail-section-card">
              <div class="section-card-header">
                <h3>No Notices Available</h3>
              </div>
              <p class="section-body-text" style="color: var(--text-secondary, #888);">
                There are no official notices published at this moment. New announcements from university administration and CRs will appear here.
              </p>
            </div>
          `;
          return;
        }

        container.innerHTML = notices.map(n => {
          const dateStr = n.created_at ? new Date(n.created_at).toLocaleDateString(undefined, { year: 'numeric', month: 'short', day: 'numeric' }) : '';
          const authorRole = (n.role || 'official').toUpperCase();
          const authorName = n.name || 'Administration';
          return `
            <div class="detail-section-card" style="margin-bottom: 20px;">
              <div class="section-card-header" style="display: flex; justify-content: space-between; align-items: baseline;">
                <h3>${escapeHtml(n.content.split('\n')[0].substring(0, 100))}</h3>
                <span style="font-size: 12px; color: var(--text-secondary, #888);">${dateStr}</span>
              </div>
              <p class="section-body-text" style="white-space: pre-wrap; margin-top: 12px;">${escapeHtml(n.content)}</p>
              <div style="margin-top: 14px; font-size: 13px; color: var(--text-secondary, #888);">
                Published by <strong>${escapeHtml(authorName)}</strong> <span style="background: rgba(99, 102, 241, 0.15); color: #818cf8; padding: 2px 8px; border-radius: 999px; font-size: 11px; margin-left: 6px;">${escapeHtml(authorRole)}</span>
              </div>
              ${n.attachment_url ? `<div style="margin-top: 12px;"><a href="${encodeURI(n.attachment_url)}" target="_blank" rel="noopener noreferrer" style="color: #6366f1; text-decoration: underline; font-size: 13px;">View Attachment</a></div>` : ''}
            </div>
          `;
        }).join('');
      } catch (err) {
        container.innerHTML = `
          <div class="detail-section-card">
            <p class="section-body-text" style="color: #ef4444;">Could not load notices. Please refresh to try again.</p>
          </div>
        `;
      }
    }

    function escapeHtml(str) {
      if (!str) return '';
      return String(str).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
    }

    window.addEventListener('DOMContentLoaded', loadOfficialNotices);
  </script>


  <footer class="app-global-footer">
    <div class="app-footer-inner">
      <div class="app-footer-brand">
        <strong>Semester Library</strong>
        <span>· Bachelor of Information Technology</span>
      </div>
      <div class="app-footer-meta">
        <span>Gandaki University</span>
      </div>
    </div>
  </footer>
  <script src="auth-modal.js"></script>
  <!-- PWA Service Worker Registration -->
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('/sw.js').catch(err => {
          console.warn('[SW Registration Notice]:', err);
        });
      });
    }
  </script>
</body>
</html>
