<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Create Account — Semester Library</title>

  <!-- Web App Manifest & iOS PWA Metadata -->
  <link rel="manifest" href="/manifest.json">
  <link rel="apple-touch-icon" href="/logo.jpg">
  <link rel="icon" type="image/png" sizes="192x192" href="/logo.jpg">

  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Semester Library">

  <!-- Anti-flash inline script: reads localStorage or defaults to prefers-color-scheme -->
  <script>
    (function() {
      try {
        var stored = localStorage.getItem('theme');
        var theme = stored;
        if (!theme) {
          theme = (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) ? 'dark' : 'light';
        }
        document.documentElement.setAttribute('data-theme', theme);
        if (theme === 'dark') {
          document.documentElement.classList.add('dark');
        } else {
          document.documentElement.classList.remove('dark');
        }
      } catch (e) {}
    })();
  </script>

  <script src="theme.js"></script>

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

  <!-- Stylesheets -->
  <link rel="stylesheet" href="style.v4.css">
  <link rel="stylesheet" href="theme-overrides.css">
  <link rel="stylesheet" href="auth-ui.css">
</head>

<body class="apple-signin-page">

  <!-- Top-Right Theme Toggle Button -->
  <div class="theme-toggle-wrap">
    <button type="button" class="theme-toggle-btn" id="themeToggleBtn" aria-label="Toggle theme" title="Toggle theme">
      <svg class="theme-icon-sun" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <circle cx="12" cy="12" r="5"></circle>
        <line x1="12" y1="1" x2="12" y2="3"></line>
        <line x1="12" y1="21" x2="12" y2="23"></line>
        <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
        <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
        <line x1="1" y1="12" x2="3" y2="12"></line>
        <line x1="21" y1="12" x2="23" y2="12"></line>
        <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
        <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
      </svg>
      <svg class="theme-icon-moon" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
      </svg>
    </button>
  </div>

  <!-- Registration Card (Same 460px max-width, 32px padding as login) -->
  <main class="apple-signin-card register-card">

    <!-- 56px Centered Monochrome Logo -->
    <img src="logo.jpg" alt="Semester Library" class="auth-logo">

    <h1 class="auth-title">Create an Account</h1>
    <p class="auth-subtext">Join Gandaki University students on Semester Library</p>

    <!-- Inline Alert Banner -->
    <div id="authAlert" class="auth-banner" style="display: none;" role="alert">
      <div class="auth-banner-title" id="authAlertTitle"></div>
      <div class="auth-banner-msg" id="authAlertMsg"></div>
    </div>

    <!-- Success View (Shown after successful submission) -->
    <div id="successBox" style="display: none; width: 100%; text-align: center; padding: 8px 0;">
      <h2 style="font-size: 20px; font-weight: 700; margin-bottom: 8px; color: var(--text);">Registration Submitted</h2>
      <p id="successMessageText" style="font-size: 14px; color: var(--muted); line-height: 1.5; margin-bottom: 24px;">
        A verification link has been sent to your email. Please check your inbox and verify your email address to activate your account.
      </p>
      <a href="login.html" class="btn btn-primary" style="text-decoration: none;">Go to Sign In</a>
    </div>

    <!-- Registration Form -->
    <form id="registerForm" class="form" onsubmit="handleRegister(event)">

      <!-- Full Name -->
      <div class="field">
        <label for="fullName" class="field-label">Full Name</label>
        <input type="text" id="fullName" name="fullName" class="input" placeholder="e.g. Saugat Subedi" required autocomplete="name">
      </div>

      <!-- Student ID & Username Grid -->
      <div class="row-2">
        <div class="field">
          <label for="studentId" class="field-label">Student ID</label>
          <input type="text" id="studentId" name="studentId" class="input" placeholder="e.g. 26020266" required>
        </div>
        <div class="field">
          <label for="username" class="field-label">Username</label>
          <input type="text" id="username" name="username" class="input" placeholder="e.g. saugat_subedi" required autocomplete="username">
        </div>
      </div>

      <!-- Email Address -->
      <div class="field">
        <label for="email" class="field-label">Email Address (Required for verification)</label>
        <input type="email" id="email" name="email" class="input" placeholder="student@example.com" required autocomplete="email">
      </div>

      <!-- Department & Semester Grid -->
      <div class="row-2">
        <div class="field">
          <label for="department" class="field-label">Department</label>
          <select id="department" name="department" class="select" required>
            <option value="BIT" selected>BIT</option>
            <option value="BBA">BBA</option>
            <option value="BPharm">BPharm</option>
            <option value="BTech">BTech Food</option>
            <option value="BLLB">BLLB</option>
          </select>
        </div>
        <div class="field">
          <label for="semester" class="field-label">Semester</label>
          <select id="semester" name="semester" class="select" required>
            <option value="Semester 1" selected>Semester 1</option>
            <option value="Semester 2">Semester 2</option>
            <option value="Semester 3">Semester 3</option>
            <option value="Semester 4">Semester 4</option>
            <option value="Semester 5">Semester 5</option>
            <option value="Semester 6">Semester 6</option>
            <option value="Semester 7">Semester 7</option>
            <option value="Semester 8">Semester 8</option>
          </select>
        </div>
      </div>

      <!-- Gender (Optional) -->
      <div class="field">
        <label for="gender" class="field-label">Gender (Optional)</label>
        <select id="gender" name="gender" class="select">
          <option value="" selected>Prefer not to say</option>
          <option value="male">Male</option>
          <option value="female">Female</option>
          <option value="other">Other</option>
        </select>
      </div>

      <!-- Password & Confirm Password Grid with Inside Visibility Toggles -->
      <div class="row-2">
        <div class="field">
          <label for="password" class="field-label">Password</label>
          <div class="field-password-wrap">
            <input type="password" id="password" name="password" class="input" placeholder="Min. 8 characters" required autocomplete="new-password">
            <button type="button" class="password-toggle" aria-label="Toggle password visibility">
              <svg class="eye-open-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                <circle cx="12" cy="12" r="3"></circle>
              </svg>
              <svg class="eye-closed-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="display:none;">
                <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path>
                <line x1="1" y1="1" x2="23" y2="23"></line>
              </svg>
            </button>
          </div>
        </div>

        <div class="field">
          <label for="confirmPassword" class="field-label">Confirm Password</label>
          <div class="field-password-wrap">
            <input type="password" id="confirmPassword" name="confirmPassword" class="input" placeholder="Repeat password" required autocomplete="new-password">
            <button type="button" class="password-toggle" aria-label="Toggle password visibility">
              <svg class="eye-open-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                <circle cx="12" cy="12" r="3"></circle>
              </svg>
              <svg class="eye-closed-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="display:none;">
                <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path>
                <line x1="1" y1="1" x2="23" y2="23"></line>
              </svg>
            </button>
          </div>
        </div>
      </div>

      <!-- Legal Consent Checkbox (No heavy bordered box) -->
      <label class="checkbox-wrap" for="acceptTerms">
        <input type="checkbox" id="acceptTerms" name="acceptTerms" class="custom-checkbox" required>
        <span>
          I agree to the
          <a href="privacy.html" target="_blank" rel="noopener noreferrer" class="link" onclick="event.stopPropagation()">Privacy Policy</a>
          and
          <a href="termsandconditions.html" target="_blank" rel="noopener noreferrer" class="link" onclick="event.stopPropagation()">Terms &amp; Conditions</a>.
        </span>
      </label>

      <!-- Submit Button -->
      <button type="submit" class="btn btn-primary" id="registerBtn">Create Account</button>

      <p id="errorMsg" class="error-msg" style="display: none;"></p>

      <!-- Sign In Link -->
      <div class="auth-switch-text">
        Already have an account? <a href="login.html" class="link" style="font-weight: 600;">Sign In</a>
      </div>

      <!-- Subtle Footer Navigation Links -->
      <div class="auth-footer-links">
        <a href="index.html" class="link-subtle">← Back to HomePage</a>
      </div>

    </form>

  </main>

  <script src="/auth.js"></script>
  <script>
    function showRegisterAlert(message, type = 'error', title = null) {
      const banner = document.getElementById('authAlert');
      const titleEl = document.getElementById('authAlertTitle');
      const msgEl = document.getElementById('authAlertMsg');
      const legacyErrorMsg = document.getElementById('errorMsg');

      if (legacyErrorMsg) legacyErrorMsg.textContent = message;
      if (!banner) return;

      banner.className = 'auth-banner';
      if (titleEl) {
        titleEl.textContent = title || (type === 'error' ? 'Validation Error' : 'Notice');
        titleEl.style.display = 'block';
      }
      if (msgEl) msgEl.textContent = message;

      banner.style.display = 'flex';
      banner.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
    }

    function hideAuthAlert() {
      const banner = document.getElementById('authAlert');
      if (banner) banner.style.display = 'none';
      const legacy = document.getElementById('errorMsg');
      if (legacy) legacy.textContent = '';
    }

    // Password Toggles
    document.querySelectorAll('.password-toggle, .apple-password-toggle').forEach(btn => {
      btn.onclick = function (e) {
        e.preventDefault();
        const wrap = btn.closest('.field-password-wrap, .apple-password-field-wrap');
        if (!wrap) return;
        const input = wrap.querySelector('input');
        if (!input) return;
        const isPassword = input.type === 'password';
        input.type = isPassword ? 'text' : 'password';
        const openIcon = btn.querySelector('.eye-open-icon');
        const closedIcon = btn.querySelector('.eye-closed-icon');
        if (openIcon && closedIcon) {
          openIcon.style.display = isPassword ? 'none' : 'block';
          closedIcon.style.display = isPassword ? 'block' : 'none';
        }
      };
    });

    async function handleRegister(e) {
      e.preventDefault();
      hideAuthAlert();

      const registerBtn = document.getElementById('registerBtn');
      const form = document.getElementById('registerForm');
      const successBox = document.getElementById('successBox');

      const fullName = document.getElementById('fullName').value.trim();
      const studentId = document.getElementById('studentId').value.trim();
      const username = document.getElementById('username').value.trim();
      const email = document.getElementById('email').value.trim();
      const department = document.getElementById('department').value;
      const semester = document.getElementById('semester').value;
      const gender = document.getElementById('gender').value;
      const password = document.getElementById('password').value;
      const confirmPassword = document.getElementById('confirmPassword').value;
      const consentCheckbox = document.getElementById('acceptTerms');

      if (!fullName || !studentId || !username || !email || !password || !confirmPassword) {
        showRegisterAlert('Please fill out all required fields.', 'error');
        return;
      }

      if (!consentCheckbox.checked) {
        showRegisterAlert('Please accept the Privacy Policy and Terms & Conditions to create an account.', 'error');
        return;
      }

      if (password.length < 8) {
        showRegisterAlert('Password must be at least 8 characters long.', 'error');
        return;
      }

      if (password !== confirmPassword) {
        showRegisterAlert('Passwords do not match. Please re-enter both passwords.', 'error');
        return;
      }

      registerBtn.disabled = true;
      registerBtn.textContent = 'Creating account…';

      try {
        const payload = {
          fullName,
          studentId,
          username,
          email,
          department,
          semester,
          gender: gender || null,
          password,
          confirmPassword
        };

        const { data, error } = await SemesterAuth.signUp(payload);

        if (error) {
          showRegisterAlert(error.message || 'Registration failed. Please check your information.', 'error', 'Registration Error');
          registerBtn.disabled = false;
          registerBtn.textContent = 'Create Account';
          return;
        }

        form.style.display = 'none';
        successBox.style.display = 'block';
        if (data && data.message) {
          document.getElementById('successMessageText').textContent = data.message;
        }
      } catch (err) {
        showRegisterAlert(err.message || 'Connection error. Please try again.', 'error');
        registerBtn.disabled = false;
        registerBtn.textContent = 'Create Account';
      }
    }
  </script>
</body>
</html>
