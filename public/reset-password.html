<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Reset Password — Semester Library</title>

  <!-- Web App Manifest & iOS PWA Metadata -->
  <link rel="manifest" href="/manifest.json">
  <link rel="apple-touch-icon" href="/logo.jpg">
  <link rel="icon" type="image/png" sizes="192x192" href="/logo.jpg">

  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Semester Library">

  <!-- Anti-flash inline script: reads localStorage or defaults to prefers-color-scheme -->
  <script>
    (function() {
      try {
        var stored = localStorage.getItem('theme');
        var theme = stored;
        if (!theme) {
          theme = (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) ? 'dark' : 'light';
        }
        document.documentElement.setAttribute('data-theme', theme);
        if (theme === 'dark') {
          document.documentElement.classList.add('dark');
        } else {
          document.documentElement.classList.remove('dark');
        }
      } catch (e) {}
    })();
  </script>

  <script src="/theme.js"></script>

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

  <!-- Stylesheets -->
  <link rel="stylesheet" href="style.v4.css">
  <link rel="stylesheet" href="/theme-overrides.css">
  <link rel="stylesheet" href="/auth-ui.css">
</head>

<body class="apple-signin-page">

  <!-- Top-Right Theme Toggle Button -->
  <div class="theme-toggle-wrap">
    <button type="button" class="theme-toggle-btn" id="themeToggleBtn" aria-label="Toggle theme" title="Toggle theme">
      <svg class="theme-icon-sun" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <circle cx="12" cy="12" r="5"></circle>
        <line x1="12" y1="1" x2="12" y2="3"></line>
        <line x1="12" y1="21" x2="12" y2="23"></line>
        <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
        <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
        <line x1="1" y1="12" x2="3" y2="12"></line>
        <line x1="21" y1="12" x2="23" y2="12"></line>
        <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
        <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
      </svg>
      <svg class="theme-icon-moon" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
      </svg>
    </button>
  </div>

  <!-- Reset Password Card -->
  <main class="apple-signin-card">

    <!-- 56px Centered Monochrome Logo -->
    <img src="logo.jpg" alt="Semester Library" class="auth-logo">

    <h1 class="auth-title">Reset Your Password</h1>
    <p class="auth-subtext">Choose a new, secure password for your account</p>

    <!-- Inline Alert Banner -->
    <div id="authAlert" class="auth-banner" style="display: none;" role="alert">
      <div class="auth-banner-title" id="authAlertTitle"></div>
      <div class="auth-banner-msg" id="authAlertMsg"></div>
    </div>

    <!-- Success View -->
    <div id="successBox" style="display: none; width: 100%; text-align: center; padding: 8px 0;">
      <h2 style="font-size: 20px; font-weight: 700; margin-bottom: 8px; color: var(--text);">Password Updated</h2>
      <p style="font-size: 14px; color: var(--muted); line-height: 1.5; margin-bottom: 24px;">
        Your password has been changed successfully. Redirecting you to sign in…
      </p>
      <a href="login.html" class="btn btn-primary" style="text-decoration: none;">Go to Sign In</a>
    </div>

    <!-- Reset Form -->
    <form id="resetForm" class="form" onsubmit="handleResetPassword(event)">

      <!-- New Password -->
      <div class="field">
        <label for="newPassword" class="field-label">New Password</label>
        <div class="field-password-wrap">
          <input type="password" id="newPassword" name="newPassword" class="input" placeholder="At least 8 characters" required autocomplete="new-password">
          <button type="button" class="password-toggle" aria-label="Toggle password visibility">
            <svg class="eye-open-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
              <circle cx="12" cy="12" r="3"></circle>
            </svg>
            <svg class="eye-closed-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="display:none;">
              <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path>
              <line x1="1" y1="1" x2="23" y2="23"></line>
            </svg>
          </button>
        </div>
      </div>

      <!-- Confirm New Password -->
      <div class="field">
        <label for="confirmNewPassword" class="field-label">Confirm New Password</label>
        <div class="field-password-wrap">
          <input type="password" id="confirmNewPassword" name="confirmNewPassword" class="input" placeholder="Repeat new password" required autocomplete="new-password">
          <button type="button" class="password-toggle" aria-label="Toggle password visibility">
            <svg class="eye-open-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
              <circle cx="12" cy="12" r="3"></circle>
            </svg>
            <svg class="eye-closed-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="display:none;">
              <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path>
              <line x1="1" y1="1" x2="23" y2="23"></line>
            </svg>
          </button>
        </div>
      </div>

      <!-- Submit Button -->
      <button type="submit" class="btn btn-primary" id="resetBtn">Update Password</button>

      <p id="errorMsg" class="error-msg" style="display: none;"></p>

      <div class="auth-footer-links">
        <a href="login.html" class="link-subtle">← Back to Sign In</a>
      </div>

    </form>

  </main>

  <script src="/auth.js"></script>
  <script>
    function showResetAlert(message, type = 'error') {
      const banner = document.getElementById('authAlert');
      const titleEl = document.getElementById('authAlertTitle');
      const msgEl = document.getElementById('authAlertMsg');
      const legacyErrorMsg = document.getElementById('errorMsg');

      if (legacyErrorMsg) legacyErrorMsg.textContent = message;
      if (!banner) return;

      banner.className = 'auth-banner';
      if (titleEl) {
        titleEl.textContent = type === 'error' ? 'Password Error' : 'Success';
        titleEl.style.display = 'block';
      }
      if (msgEl) msgEl.textContent = message;

      banner.style.display = 'flex';
    }

    function hideAuthAlert() {
      const banner = document.getElementById('authAlert');
      if (banner) banner.style.display = 'none';
      const legacy = document.getElementById('errorMsg');
      if (legacy) legacy.textContent = '';
    }

    // Password Toggles
    document.querySelectorAll('.password-toggle, .apple-password-toggle').forEach(btn => {
      btn.onclick = function (e) {
        e.preventDefault();
        const wrap = btn.closest('.field-password-wrap, .apple-password-field-wrap');
        if (!wrap) return;
        const input = wrap.querySelector('input');
        if (!input) return;
        const isPassword = input.type === 'password';
        input.type = isPassword ? 'text' : 'password';
        const openIcon = btn.querySelector('.eye-open-icon');
        const closedIcon = btn.querySelector('.eye-closed-icon');
        if (openIcon && closedIcon) {
          openIcon.style.display = isPassword ? 'none' : 'block';
          closedIcon.style.display = isPassword ? 'block' : 'none';
        }
      };
    });

    async function handleResetPassword(e) {
      e.preventDefault();
      hideAuthAlert();

      const resetBtn = document.getElementById('resetBtn');
      const form = document.getElementById('resetForm');
      const successBox = document.getElementById('successBox');

      const newPassword = document.getElementById('newPassword').value;
      const confirmNewPassword = document.getElementById('confirmNewPassword').value;

      if (!newPassword || !confirmNewPassword) {
        showResetAlert('Please enter and confirm your new password.', 'error');
        return;
      }

      if (newPassword.length < 8) {
        showResetAlert('Password must be at least 8 characters long.', 'error');
        return;
      }

      if (newPassword !== confirmNewPassword) {
        showResetAlert('Passwords do not match. Please re-enter both passwords.', 'error');
        return;
      }

      resetBtn.disabled = true;
      resetBtn.textContent = 'Updating password…';

      try {
        const { error } = await SemesterAuth.updatePassword(newPassword);

        if (error) {
          showResetAlert(error.message || 'Failed to update password. Your recovery link may have expired.', 'error');
          resetBtn.disabled = false;
          resetBtn.textContent = 'Update Password';
          return;
        }

        form.style.display = 'none';
        successBox.style.display = 'block';

        setTimeout(() => {
          window.location.href = '/login.html';
        }, 1800);
      } catch (err) {
        showResetAlert(err.message || 'Connection error. Please try again.', 'error');
        resetBtn.disabled = false;
        resetBtn.textContent = 'Update Password';
      }
    }
  </script>
</body>
</html>
