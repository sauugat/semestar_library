<!DOCTYPE html>
<html lang="en" data-theme="dark">

<head>
  <script src="/theme.js"></script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Reset Password — Semester Library</title>

  <link rel="manifest" href="/manifest.json">
  <link rel="apple-touch-icon" href="/logo.jpg">
  <link rel="icon" type="image/png" sizes="192x192" href="/logo.jpg">

  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Semester Library">
  <meta name="theme-color" content="#0a0a0a">

  <!-- Anti-flash inline script -->
  <script>
    (function() {
      try {
        var t = localStorage.getItem('theme');
        if (!t) {
          t = 'dark';
          try { localStorage.setItem('theme', 'dark'); } catch (e) {}
        }
        var d = t === 'dark';
        document.documentElement.setAttribute('data-theme', t);
        if (d) {
          document.documentElement.classList.add('dark');
        } else {
          document.documentElement.classList.remove('dark');
        }
      } catch (e) {}
    })();
  </script>

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

  <!-- Styles -->
  <link rel="stylesheet" href="style.v4.css">
  <link rel="stylesheet" href="/auth-ui.css">
  <link rel="stylesheet" href="/theme-overrides.css">
</head>

<body class="apple-signin-page">

  <!-- Top-Right Theme Toggle -->
  <div style="position: fixed; top: 20px; right: 24px; z-index: 999;">
    <button type="button" class="theme-toggle-btn" id="themeToggleBtn" aria-label="Toggle theme" title="Toggle theme">
      <span class="theme-toggle-track">
        <svg class="theme-icon-sun" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <circle cx="12" cy="12" r="5"></circle>
          <line x1="12" y1="1" x2="12" y2="3"></line>
          <line x1="12" y1="21" x2="12" y2="23"></line>
          <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
          <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
          <line x1="1" y1="12" x2="3" y2="12"></line>
          <line x1="21" y1="12" x2="23" y2="12"></line>
          <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
          <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
        </svg>
        <svg class="theme-icon-moon" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
        </svg>
      </span>
    </button>
  </div>

  <main class="apple-signin-container">

    <div class="apple-signin-card" style="max-width: 440px;">

      <!-- Logo Emblem Halo -->
      <div class="apple-emblem-halo">
        <div class="apple-emblem-ring"></div>
        <img src="logo.jpg" alt="Semester Library Logo" class="apple-emblem-img" style="border-radius: 50%;">
      </div>

      <h1 class="apple-signin-headline">Reset Your Password</h1>
      <p class="apple-signin-subtext">Choose a new, secure password for your account</p>

      <!-- Rich Alert Banner -->
      <div id="authAlert" class="auth-banner" style="display: none; margin-bottom: 14px;" role="alert">
        <div class="auth-banner-icon" id="authAlertIcon"></div>
        <div class="auth-banner-content">
          <div class="auth-banner-title" id="authAlertTitle"></div>
          <div class="auth-banner-msg" id="authAlertMsg"></div>
        </div>
        <button type="button" class="auth-banner-close" onclick="hideAuthAlert()" aria-label="Dismiss alert">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="14" height="14">
            <line x1="18" y1="6" x2="6" y2="18"></line>
            <line x1="6" y1="6" x2="18" y2="18"></line>
          </svg>
        </button>
      </div>

      <!-- Success Card (Shown after password update) -->
      <div id="successBox" style="display: none; width: 100%; text-align: center; padding: 12px 0;">
        <div class="apple-confirm-icon-wrap" style="margin: 0 auto 16px auto; background: rgba(34, 197, 94, 0.12); color: #22c55e; border-color: rgba(34, 197, 94, 0.25);">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" width="26" height="26">
            <path d="M20 6L9 17l-5-5"/>
          </svg>
        </div>
        <h2 style="font-size: 20px; font-weight: 700; margin-bottom: 8px;">Password Updated!</h2>
        <p style="font-size: 14px; color: var(--text-secondary, #86868b); line-height: 1.5; margin-bottom: 24px;">
          Your password has been changed successfully. Redirecting you to sign in…
        </p>
        <a href="login.html" class="apple-primary-btn" style="text-decoration: none;">
          <span>Go to Sign In</span>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" class="apple-btn-arrow">
            <path d="M5 12h14M12 5l7 7-7 7" />
          </svg>
        </a>
      </div>

      <!-- Reset Password Form -->
      <form id="resetForm" class="apple-signin-form" onsubmit="handleResetPassword(event)">

        <div class="apple-input-group" style="margin-top: 10px;">

          <!-- New Password -->
          <div class="apple-input-row">
            <label for="newPassword" class="apple-input-label">New Password</label>
            <div class="apple-password-field-wrap">
              <input type="password" id="newPassword" name="newPassword" class="apple-text-field" placeholder="At least 8 characters" required autocomplete="new-password">
              <button type="button" class="apple-password-toggle" aria-label="Toggle password visibility">
                <svg class="eye-open-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="16" height="16">
                  <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                  <circle cx="12" cy="12" r="3"></circle>
                </svg>
                <svg class="eye-closed-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="16" height="16" style="display:none;">
                  <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path>
                  <line x1="1" y1="1" x2="23" y2="23"></line>
                </svg>
              </button>
            </div>
          </div>

          <!-- Confirm New Password -->
          <div class="apple-input-row">
            <label for="confirmNewPassword" class="apple-input-label">Confirm New Password</label>
            <div class="apple-password-field-wrap">
              <input type="password" id="confirmNewPassword" name="confirmNewPassword" class="apple-text-field" placeholder="Repeat new password" required autocomplete="new-password">
              <button type="button" class="apple-password-toggle" aria-label="Toggle password visibility">
                <svg class="eye-open-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="16" height="16">
                  <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                  <circle cx="12" cy="12" r="3"></circle>
                </svg>
                <svg class="eye-closed-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="16" height="16" style="display:none;">
                  <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path>
                  <line x1="1" y1="1" x2="23" y2="23"></line>
                </svg>
              </button>
            </div>
          </div>

        </div>

        <!-- Submit Button -->
        <button type="submit" class="apple-primary-btn" id="resetBtn" style="margin-top: 20px;">
          <span>Update Password</span>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" class="apple-btn-arrow">
            <path d="M5 12h14M12 5l7 7-7 7" />
          </svg>
        </button>

        <p id="errorMsg" class="error-msg" style="display: none;"></p>

        <div class="apple-support-links" style="margin-top: 20px;">
          <a href="login.html" class="apple-text-link">← Back to Sign In</a>
        </div>

      </form>

    </div>

  </main>

  <script src="/auth.js"></script>
  <script>
    function showResetAlert(message, type = 'error') {
      const banner = document.getElementById('authAlert');
      const titleEl = document.getElementById('authAlertTitle');
      const msgEl = document.getElementById('authAlertMsg');
      const iconEl = document.getElementById('authAlertIcon');
      const legacyErrorMsg = document.getElementById('errorMsg');

      if (legacyErrorMsg) legacyErrorMsg.textContent = message;
      if (!banner) return;

      banner.className = 'auth-banner ' + type;
      if (titleEl) {
        titleEl.textContent = type === 'error' ? 'Password Error' : 'Success';
        titleEl.style.display = 'block';
      }
      if (msgEl) msgEl.textContent = message;

      if (iconEl) {
        if (type === 'error') {
          iconEl.innerHTML = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>`;
        } else {
          iconEl.innerHTML = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M8 12l2.5 2.5L16 9"/></svg>`;
        }
      }

      banner.style.display = 'flex';
    }

    function hideAuthAlert() {
      const banner = document.getElementById('authAlert');
      if (banner) banner.style.display = 'none';
      const legacy = document.getElementById('errorMsg');
      if (legacy) legacy.textContent = '';
    }

    // Password Toggles
    document.querySelectorAll('.apple-password-toggle').forEach(btn => {
      btn.onclick = function (e) {
        e.preventDefault();
        const wrap = btn.closest('.apple-password-field-wrap');
        if (!wrap) return;
        const input = wrap.querySelector('input');
        if (!input) return;
        const isPassword = input.type === 'password';
        input.type = isPassword ? 'text' : 'password';
        const openIcon = btn.querySelector('.eye-open-icon');
        const closedIcon = btn.querySelector('.eye-closed-icon');
        if (openIcon && closedIcon) {
          openIcon.style.display = isPassword ? 'none' : 'block';
          closedIcon.style.display = isPassword ? 'block' : 'none';
        }
      };
    });

    async function handleResetPassword(e) {
      e.preventDefault();
      hideAuthAlert();

      const resetBtn = document.getElementById('resetBtn');
      const form = document.getElementById('resetForm');
      const successBox = document.getElementById('successBox');

      const newPassword = document.getElementById('newPassword').value;
      const confirmNewPassword = document.getElementById('confirmNewPassword').value;

      if (!newPassword || !confirmNewPassword) {
        showResetAlert('Please enter and confirm your new password.', 'error');
        return;
      }

      if (newPassword.length < 8) {
        showResetAlert('Password must be at least 8 characters long.', 'error');
        return;
      }

      if (newPassword !== confirmNewPassword) {
        showResetAlert('Passwords do not match. Please re-enter both passwords.', 'error');
        return;
      }

      resetBtn.disabled = true;
      resetBtn.innerHTML = '<span class="app-spinner spinner-sm spinner-light" style="margin-right:8px; display:inline-block; vertical-align:middle;"></span><span>Updating password…</span>';

      try {
        const { error } = await SemesterAuth.updatePassword(newPassword);

        if (error) {
          showResetAlert(error.message || 'Failed to update password. Your recovery link may have expired.', 'error');
          resetBtn.disabled = false;
          resetBtn.innerHTML = '<span>Update Password</span>';
          return;
        }

        form.style.display = 'none';
        successBox.style.display = 'block';

        setTimeout(() => {
          window.location.href = '/login.html';
        }, 1800);
      } catch (err) {
        showResetAlert(err.message || 'Connection error. Please try again.', 'error');
        resetBtn.disabled = false;
        resetBtn.innerHTML = '<span>Update Password</span>';
      }
    }
  </script>
</body>
</html>
