<!DOCTYPE html>
<html lang="en" data-theme="dark">

<head>
  <script src="/theme.js"></script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Reset Password — Semester Library</title>

  <link rel="manifest" href="/manifest.json">
  <link rel="apple-touch-icon" href="/logo.jpg">
  <link rel="icon" type="image/png" sizes="192x192" href="/logo.jpg">

  <!-- Anti-flash inline script -->
  <script>
    (function() {
      try {
        var t = localStorage.getItem('theme');
        if (!t) {
          t = 'dark';
          try { localStorage.setItem('theme', 'dark'); } catch (e) {}
        }
        var d = t === 'dark';
        document.documentElement.setAttribute('data-theme', t);
        if (d) {
          document.documentElement.classList.add('dark');
        } else {
          document.documentElement.classList.remove('dark');
        }
      } catch (e) {}
    })();
  </script>

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="style.v4.css">
  <link rel="stylesheet" href="/theme-overrides.css">
</head>

<body class="apple-signin-page">

  <main class="apple-signin-card" style="max-width: 440px; margin: 60px auto;">

    <div class="apple-signin-header">
      <div class="apple-logo-wrap">
        <img src="logo.jpg" alt="Semester Library Logo" class="apple-signin-logo" width="60" height="60">
      </div>
      <h1 class="apple-signin-headline">Reset Your Password</h1>
      <p class="apple-signin-subtext">Choose a strong, secure password for your account</p>
    </div>

    <!-- Success Message Box -->
    <div id="successBox" style="display: none; padding: 24px; border-radius: 14px; background: rgba(34, 197, 94, 0.1); border: 1px solid rgba(34, 197, 94, 0.3); text-align: center; margin-top: 20px;">
      <svg viewBox="0 0 24 24" width="48" height="48" fill="none" stroke="#22c55e" stroke-width="2" style="margin: 0 auto 12px auto; display: block;">
        <circle cx="12" cy="12" r="10"/>
        <path d="M8 12l2.5 2.5L16 9"/>
      </svg>
      <h3 style="color: #22c55e; margin-bottom: 8px; font-size: 18px;">Password Updated!</h3>
      <p style="font-size: 14px; color: #6e6e73; line-height: 1.5;">Your password has been changed successfully. Redirecting to sign in...</p>
    </div>

    <!-- Reset Password Form -->
    <form id="resetForm" class="apple-signin-form" onsubmit="handleResetPassword(event)">

      <div class="apple-input-group">

        <!-- New Password -->
        <div class="apple-input-row">
          <label for="newPassword" class="apple-input-label">New Password</label>
          <input type="password" id="newPassword" name="newPassword" class="apple-text-field" placeholder="At least 8 characters" required autocomplete="new-password">
        </div>

        <!-- Confirm New Password -->
        <div class="apple-input-row">
          <label for="confirmNewPassword" class="apple-input-label">Confirm New Password</label>
          <input type="password" id="confirmNewPassword" name="confirmNewPassword" class="apple-text-field" placeholder="Repeat new password" required autocomplete="new-password">
        </div>

      </div>

      <!-- Submit Button -->
      <button type="submit" class="apple-primary-btn" id="resetBtn" style="margin-top: 18px;">
        <span>Update Password</span>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" class="apple-btn-arrow">
          <path d="M5 12h14M12 5l7 7-7 7" />
        </svg>
      </button>

      <!-- Error Message -->
      <p id="errorMsg" class="error-msg" style="margin-top: 12px;"></p>

      <div class="apple-support-links" style="margin-top: 20px;">
        <a href="login.html" class="apple-text-link">← Back to Sign In</a>
      </div>

    </form>

  </main>

  <script src="/auth.js"></script>
  <script>
    async function handleResetPassword(e) {
      e.preventDefault();
      const errorMsg = document.getElementById('errorMsg');
      const resetBtn = document.getElementById('resetBtn');
      const form = document.getElementById('resetForm');
      const successBox = document.getElementById('successBox');

      errorMsg.textContent = '';

      const newPassword = document.getElementById('newPassword').value;
      const confirmNewPassword = document.getElementById('confirmNewPassword').value;

      if (!newPassword || !confirmNewPassword) {
        errorMsg.textContent = 'Please enter and confirm your new password.';
        return;
      }

      if (newPassword.length < 8) {
        errorMsg.textContent = 'Password must be at least 8 characters long.';
        return;
      }

      if (newPassword !== confirmNewPassword) {
        errorMsg.textContent = 'Passwords do not match.';
        return;
      }

      resetBtn.disabled = true;
      resetBtn.innerHTML = '<span class="app-spinner spinner-sm spinner-light" style="margin-right:8px; display:inline-block; vertical-align:middle;"></span><span>Updating…</span>';

      try {
        const { error } = await SemesterAuth.updatePassword(newPassword);

        if (error) {
          errorMsg.textContent = error.message || 'Failed to update password. Your recovery link may have expired.';
          resetBtn.disabled = false;
          resetBtn.innerHTML = '<span>Update Password</span>';
          return;
        }

        form.style.display = 'none';
        successBox.style.display = 'block';

        setTimeout(() => {
          window.location.href = '/login.html';
        }, 1500);
      } catch (err) {
        errorMsg.textContent = err.message || 'Connection error. Please try again.';
        resetBtn.disabled = false;
        resetBtn.innerHTML = '<span>Update Password</span>';
      }
    }
  </script>
</body>
</html>
