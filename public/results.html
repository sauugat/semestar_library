<!DOCTYPE html>
<html lang="en" data-theme="dark">

<head>
  <script src="/theme.js"></script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Academic Results — Semester Library</title>

  <link rel="manifest" href="/manifest.json">
  <link rel="apple-touch-icon" href="/logo.jpg">
  <link rel="icon" type="image/png" sizes="192x192" href="/logo.jpg">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Semester Library">
  <meta name="theme-color" content="#ffffff">
  <script>
    (function () {
      try {
        var t = localStorage.getItem('theme') || 'dark';
        document.documentElement.setAttribute('data-theme', t);
        if (t === 'dark') {
          document.documentElement.classList.add('dark');
        } else {
          document.documentElement.classList.remove('dark');
        }
      } catch (e) {}
    })();
  </script>

  <script src="/auth.js?v=28"></script>
  <script>
    SemesterAuth.protectPage();
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@600;700;800&family=Outfit:wght@600;700;800&family=Inter:wght@400;500;600;700;800&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="style.v4.css">
  <link rel="stylesheet" href="chatbot.css">
  <link rel="stylesheet" href="auth-modal.css">
  <link rel="stylesheet" href="/theme-overrides.css">
  <script src="/academic-context.js"></script>
  <style>
    :root {
      --bg: #f8f9fa;
      --surface: #ffffff;
      --surface-subtle: #f3f4f6;
      --border: rgba(0, 0, 0, 0.14);
      --border-strong: rgba(0, 0, 0, 0.24);
      --text: #111827;
      --text-muted: #4b5563;
    }

    [data-theme="dark"],
    html.dark,
    body.dark-mode {
      --bg: var(--bg-base, #0a0a0a);
      --surface: var(--bg-surface-raised, #141416);
      --surface-subtle: #1c1c1f;
      --border: #2a2a2e;
      --border-strong: #3f3f46;
      --text: var(--text-primary, #f5f5f5);
      --text-muted: var(--text-secondary, #a1a1aa);
    }

    body.dash {
      background: var(--bg);
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      color: var(--text);
      -webkit-font-smoothing: antialiased;
    }

    .res-page-wrap {
      width: 100%;
      max-width: 1180px;
      margin: 0 auto;
      padding: 28px 24px 96px;
      box-sizing: border-box;
    }

    .res-page-head {
      width: 100%;
      margin: 0 0 22px;
      padding: 26px 28px;
      background: var(--surface);
      border: 1.5px solid var(--border);
      border-radius: 18px;
      box-sizing: border-box;
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 20px;
      flex-wrap: wrap;
    }

    .res-hero-copy {
      display: flex;
      flex-direction: column;
      gap: 6px;
      min-width: 0;
      flex: 1;
    }

    .res-hero-kicker {
      font-size: 0.74rem;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: var(--text-muted);
      line-height: 1.2;
      margin: 0;
    }

    .res-page-title {
      font-family: 'Plus Jakarta Sans', 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      font-size: clamp(1.65rem, 2.6vw, 2.15rem);
      font-weight: 800;
      letter-spacing: -0.025em;
      line-height: 1.15;
      margin: 0;
      color: var(--text);
    }

    .res-page-subtitle {
      margin: 2px 0 0;
      font-size: 0.9rem;
      line-height: 1.5;
      color: var(--text-muted);
      max-width: 680px;
    }

    @media (max-width: 768px) {
      .res-page-wrap {
        padding: 14px 12px 64px !important;
      }
      .res-page-head {
        margin: 0 0 16px !important;
        padding: 18px 16px !important;
        border-radius: 14px !important;
      }
      .res-page-title {
        font-size: 1.45rem !important;
      }
      .res-page-subtitle {
        font-size: 0.84rem !important;
      }
    }
  </style>
</head>

<body class="dash">

  <header class="dash-header">
    <a href="dashboard.html" class="lib-wordmark">Semester Library</a>

    <nav class="dash-header-nav">
      <a href="dashboard.html" class="header-nav-item">Feed</a>
      <a href="library.html" class="header-nav-item">Library</a>
      <a href="/code-lab/subjects.html" class="header-nav-item">Assignments</a>
      <a href="routine.html" class="header-nav-item">Routine</a>
      <a href="attendance.html" class="header-nav-item">Attendance</a>
      <a href="marks-entry.html" class="header-nav-item" id="navMarksEntryItem" data-role-nav="teacher" style="display:none;">Marks Entry</a>
      <a href="results.html" class="header-nav-item active" id="navResultsItem" data-role-nav="student">Results</a>
      <a href="chat.html" class="header-nav-item">Chat</a>
      <a href="chatbot.html" class="header-nav-item">Kyana AI</a>
      <a href="download.html" class="header-nav-item">App</a>
    </nav>

    <div class="dash-header-actions">
      <button type="button" class="theme-toggle-btn" id="themeToggleBtn" aria-label="Toggle theme" title="Toggle theme">
        <span class="theme-toggle-track">
          <svg class="theme-icon-sun" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="5"></circle><line x1="12" y1="1" x2="12" y2="3"></line><line x1="12" y1="21" x2="12" y2="23"></line><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line><line x1="1" y1="12" x2="3" y2="12"></line><line x1="21" y1="12" x2="23" y2="12"></line><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line></svg>
          <svg class="theme-icon-moon" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path></svg>
        </span>
      </button>
      <a href="profile.html" class="dash-profile-chip" title="View Profile">
        <div class="dash-profile-avatar" id="headerAvatar">·</div>
        <span class="dash-profile-label" id="headerProfileName">Profile</span>
      </a>
    </div>
  </header>

  <main class="res-page-wrap">
    <div id="studentResultsMount"></div>
  </main>

  <script src="/js/student-results.js?v=5"></script>
  <script>
    document.addEventListener('DOMContentLoaded', async () => {
      try {
        const user = await SemesterAuth.getUser();
        if (!user) {
          window.location.replace('/login.html?redirect=/results.html');
          return;
        }
        SemesterAuth.initHeader(user);
        const role = String(user.role || 'student').trim().toLowerCase();
        const mountEl = document.getElementById('studentResultsMount');

        if (role === 'teacher' || role === 'faculty' || role === 'admin') {
          if (window.StudentResultsDashboard && typeof window.StudentResultsDashboard.injectStyles === 'function') {
            window.StudentResultsDashboard.injectStyles();
          }
          if (mountEl) {
            mountEl.innerHTML = `
              <div class="stu-res-root">
                <div class="stu-res-card" style="text-align:center; padding:40px 24px;">
                  <div style="font-size:1.12rem; font-weight:800; margin-bottom:8px;">
                    ${role === 'admin' ? 'Administrator Account Detected' : 'Faculty Account Detected'}
                  </div>
                  <div style="font-size:0.88rem; color:var(--text-muted); max-width:520px; margin:0 auto 18px; line-height:1.5;">
                    This page displays personal published exam results for enrolled student and CR accounts. Use the Marks Entry workspace to configure exams, enter marks, and publish results.
                  </div>
                  <div style="display:flex; justify-content:center; gap:10px; flex-wrap:wrap;">
                    <a href="/marks-entry.html" class="stu-res-btn stu-res-btn-primary">Open Marks Entry</a>
                  </div>
                </div>
              </div>
            `;
          }
          return;
        }

        if (window.StudentResultsDashboard && mountEl) {
          await window.StudentResultsDashboard.mount(mountEl);
        }
      } catch (err) {
        window.location.replace('/login.html');
      }
    });
  </script>
</body>

</html>
