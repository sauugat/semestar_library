<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Settings — Semester Library</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@600;700;800&family=Outfit:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <script>
    fetch('/api/me').then(r => { if (!r.ok) window.location.replace('/login.html'); }).catch(() => window.location.replace('/login.html'));
  </script>
</head>
<body class="dash profile-body">

  <header class="dash-header">
    <a href="dashboard.html" class="lib-wordmark">Semester Library</a>
    <div class="dash-header-actions">
      <a href="profile.html" class="dash-profile-chip" title="My Profile" style="text-decoration: none;">
        <span class="dash-profile-label">Profile</span>
      </a>
      <button class="dash-logout" onclick="location.href='dashboard.html'">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" width="16" height="16">
          <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>
          <polyline points="9 22 9 12 15 12 15 22"/>
        </svg>
        Feed
      </button>
      <button id="logoutBtn" class="dash-logout">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" width="16" height="16">
          <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/>
          <path d="M16 17l5-5-5-5"/><path d="M21 12H9"/>
        </svg>
        Sign Out
      </button>
    </div>
  </header>

  <main class="profile-container" style="max-width: 540px; margin: 60px auto;">
    <section class="profile-hero-card" style="padding: 40px; border-radius: 20px;">
      <div style="display: flex; align-items: center; gap: 12px; margin-bottom: 24px;">
        <div style="width: 48px; height: 48px; background: var(--ap-canvas); border-radius: 12px; display: flex; align-items: center; justify-content: center; color: var(--ap-text-primary);">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="24" height="24"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg>
        </div>
        <div>
          <h2 style="font-family: 'Plus Jakarta Sans', sans-serif; font-size: 24px; font-weight: 800; margin: 0;">Security Settings</h2>
          <p style="color: var(--ap-text-secondary); margin: 4px 0 0; font-size: 14px;">Manage your password and authentication.</p>
        </div>
      </div>
      
      <form id="changePasswordForm">
        <div class="input-group" style="margin-bottom: 20px;">
          <label style="display: block; font-weight: 600; margin-bottom: 8px; font-size: 14px; color: var(--ap-text-primary);">Current Password</label>
          <input type="password" id="currentPassword" required class="ap-input" style="width: 100%; padding: 14px 16px; border-radius: 12px; border: 1px solid var(--ap-border); background: var(--ap-surface); font-family: inherit; font-size: 15px; outline: none; transition: border-color 0.2s;" onfocus="this.style.borderColor='var(--ap-border-strong)'" onblur="this.style.borderColor='var(--ap-border)'">
        </div>
        
        <div class="input-group" style="margin-bottom: 20px;">
          <label style="display: block; font-weight: 600; margin-bottom: 8px; font-size: 14px; color: var(--ap-text-primary);">New Password <span style="color: var(--ap-text-tertiary); font-weight: 400; font-size: 12px;">(Min 6 characters)</span></label>
          <input type="password" id="newPassword" required minlength="6" class="ap-input" style="width: 100%; padding: 14px 16px; border-radius: 12px; border: 1px solid var(--ap-border); background: var(--ap-surface); font-family: inherit; font-size: 15px; outline: none; transition: border-color 0.2s;" onfocus="this.style.borderColor='var(--ap-border-strong)'" onblur="this.style.borderColor='var(--ap-border)'">
        </div>

        <div class="input-group" style="margin-bottom: 32px;">
          <label style="display: block; font-weight: 600; margin-bottom: 8px; font-size: 14px; color: var(--ap-text-primary);">Confirm New Password</label>
          <input type="password" id="confirmPassword" required minlength="6" class="ap-input" style="width: 100%; padding: 14px 16px; border-radius: 12px; border: 1px solid var(--ap-border); background: var(--ap-surface); font-family: inherit; font-size: 15px; outline: none; transition: border-color 0.2s;" onfocus="this.style.borderColor='var(--ap-border-strong)'" onblur="this.style.borderColor='var(--ap-border)'">
        </div>

        <div id="passwordError" style="background: rgba(0,0,0,0.04); color: var(--ap-text-primary); padding: 12px 16px; border-radius: 8px; font-size: 14px; font-weight: 500; margin-bottom: 24px; display: none; border-left: 3px solid #000;"></div>
        <div id="passwordSuccess" style="background: rgba(0,0,0,0.04); color: var(--ap-text-primary); padding: 12px 16px; border-radius: 8px; font-size: 14px; font-weight: 500; margin-bottom: 24px; display: none; border-left: 3px solid #000;"></div>

        <button type="submit" id="submitBtn" style="width: 100%; display: flex; align-items: center; justify-content: center; padding: 16px; border: none; background: #000000; color: #ffffff; border-radius: 12px; font-weight: 600; font-size: 15px; cursor: pointer; transition: all 0.2s; font-family: 'Inter', sans-serif;">
          Update Password
        </button>
      </form>
    </section>
  </main>

  <script>
    document.getElementById('changePasswordForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      
      const current = document.getElementById('currentPassword').value;
      const newPass = document.getElementById('newPassword').value;
      const confirmPass = document.getElementById('confirmPassword').value;
      const errEl = document.getElementById('passwordError');
      const succEl = document.getElementById('passwordSuccess');
      const btn = document.getElementById('submitBtn');
      
      errEl.style.display = 'none';
      succEl.style.display = 'none';
      
      if (newPass !== confirmPass) {
        errEl.textContent = 'New passwords do not match.';
        errEl.style.display = 'block';
        return;
      }
      
      btn.textContent = 'Updating...';
      btn.style.opacity = '0.7';
      btn.disabled = true;
      
      try {
        const res = await fetch('/api/change-password', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ currentPassword: current, newPassword: newPass })
        });
        
        const data = await res.json();
        if (res.ok) {
          succEl.textContent = 'Password successfully updated!';
          succEl.style.display = 'block';
          document.getElementById('changePasswordForm').reset();
        } else {
          errEl.textContent = data.message || 'An error occurred';
          errEl.style.display = 'block';
        }
      } catch (err) {
        errEl.textContent = 'Failed to connect to server.';
        errEl.style.display = 'block';
      } finally {
        btn.textContent = 'Update Password';
        btn.style.opacity = '1';
        btn.disabled = false;
      }
    });

    document.getElementById('logoutBtn').addEventListener('click', async () => {
      await fetch('/api/logout', { method: 'POST' });
      window.location.replace('login.html');
    });
  </script>
  <script src="notifications.js"></script>
</body>
</html>
