<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <script src="/theme.js"></script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>BIT Syllabus — Semester Library</title>
  <meta name="description" content="Complete Gandaki University BIT syllabus: 4 years, 8 semesters, 47 courses, 138 credits, 5 elective specialization clusters, and unit-wise micro-syllabus.">
  <meta name="robots" content="index, follow">
  <link rel="canonical" href="https://semestar-library.vercel.app/syllabus">

  <!-- Web App Manifest & iOS PWA Metadata -->
  <link rel="manifest" href="/manifest.json">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Semester Library">
  <meta name="theme-color" content="#0B0B0B">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@600;700;800&family=Outfit:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@600;700;800&family=Outfit:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.v4.css?v=25">
  <link rel="stylesheet" href="chatbot.css?v=25">
  <link rel="stylesheet" href="auth-modal.css?v=25">
  <link rel="stylesheet" href="/theme-overrides.css?v=25">
  <link rel="stylesheet" href="syllabus-style-addition.css?v=28">
  <script src="/auth.js?v=27"></script>
  <script src="/js/swr.js?v=27"></script>
</head>
<body class="dash syllabus-page-body">

  <!-- Top Navigation Header -->
  <header class="dash-header">
    <a href="dashboard.html" class="lib-wordmark">Semester Library</a>

    <nav class="dash-header-nav">
      <a href="dashboard.html" class="header-nav-item">Feed</a>
      <a href="library.html" class="header-nav-item">Library</a>
      <a href="/code-lab/subjects.html" class="header-nav-item">Assignments</a>
      <a href="routine.html" class="header-nav-item">Routine</a>
      <a href="chat.html" class="header-nav-item">Chat</a>
      <a href="chatbot.html" class="header-nav-item">Kyana AI</a>
    </nav>

    <div class="dash-header-actions">
      <a href="profile.html" class="dash-profile-chip" title="View Profile">
        <div class="dash-profile-avatar" id="headerAvatar">·</div>
        <span class="dash-profile-label" id="headerProfileName">Profile</span>
      </a>
    </div>
  </header>

  <!-- Main Container -->
  <main class="syllabus-container">

    <!-- Header & Breadcrumb -->
    <header class="syllabus-header-section">
      <nav class="syllabus-breadcrumb" id="breadcrumb" aria-label="Breadcrumb"></nav>

      <div class="syllabus-heading-row">
        <div>
          <h1 class="syllabus-main-title" id="syllabusTitle">BIT Syllabus</h1>
          <p class="syllabus-sub-title" id="syllabusSub">Gandaki University · 4 Years · 8 Semesters · 138 Credits</p>
        </div>
        <div id="syllabusActionSlot" class="syllabus-action-slot"></div>
      </div>
    </header>

    <!-- Main Dynamic Content -->
    <section class="syllabus-content-area" id="syllabusGrid">
      <div class="syl-semester-grid" aria-hidden="true">
        <div class="syl-semester-card" style="opacity:0.55;"><div style="height:20px;width:32%;background:var(--syl-surface-raised);border-radius:5px;margin-bottom:12px;"></div><div style="height:14px;width:72%;background:var(--syl-surface-subtle);border-radius:4px;"></div></div>
        <div class="syl-semester-card" style="opacity:0.55;"><div style="height:20px;width:32%;background:var(--syl-surface-raised);border-radius:5px;margin-bottom:12px;"></div><div style="height:14px;width:72%;background:var(--syl-surface-subtle);border-radius:4px;"></div></div>
      </div>
    </section>

  </main>

  <footer class="app-global-footer">
    <div class="app-footer-inner">
      <div class="app-footer-brand">
        <strong>Semester Library</strong>
        <span>· Bachelor of Information Technology</span>
      </div>
      <div class="app-footer-meta">
        <span>Gandaki University</span>
      </div>
    </div>
  </footer>

  <script>
    let APP_SYLLABUS = null;
    let CURRENT_USER_SEMESTER_ROMAN = null;
    let ACTIVE_SEARCH_QUERY = '';
    let ACTIVE_CLUSTER_FILTER = 'ALL';

    const NUM_TO_ROMAN = { '1': 'I', '2': 'II', '3': 'III', '4': 'IV', '5': 'V', '6': 'VI', '7': 'VII', '8': 'VIII' };
    const ROMAN_TO_YEAR = {
      'I': 'Year 1', 'II': 'Year 1',
      'III': 'Year 2', 'IV': 'Year 2',
      'V': 'Year 3', 'VI': 'Year 3',
      'VII': 'Year 4', 'VIII': 'Year 4'
    };

    function normalizeRomanSemester(raw) {
      if (!raw) return null;
      const clean = String(raw).replace(/^semester\s+/i, '').replace(/^sem[\s_-]*/i, '').trim().toUpperCase();
      if (NUM_TO_ROMAN[clean]) return NUM_TO_ROMAN[clean];
      if (ROMAN_TO_YEAR[clean]) return clean;
      return null;
    }

    SemesterAuth.getUser().then(user => {
      if (user) {
        window.IS_AUTHENTICATED = true;
        SemesterAuth.initHeader(user);
        const sem = normalizeRomanSemester(user.semester || user.current_semester || user.semester_number);
        if (sem && sem !== CURRENT_USER_SEMESTER_ROMAN) {
          CURRENT_USER_SEMESTER_ROMAN = sem;
          if (APP_SYLLABUS && currentPath().length === 0) {
            renderLandingContent();
          }
        }
      } else {
        window.IS_AUTHENTICATED = false;
        SemesterAuth.initHeader(null);
      }
    }).catch(() => {
      window.IS_AUTHENTICATED = false;
    });

    async function loadAppSyllabus() {
      if (window.SWR && typeof window.SWR.get === 'function') {
        const res = await window.SWR.get('/syllabus-app-data.json', {
          ttl: 24 * 60 * 60 * 1000,
          userScoped: false,
          fetcher: async () => {
            const r = await fetch('syllabus-app-data.json');
            if (!r.ok) throw new Error('Failed to load syllabus-app-data.json');
            return r.json();
          },
          onData: (data, meta) => {
            APP_SYLLABUS = data;
            if (meta && meta.source === 'network' && meta.changed && typeof route === 'function') {
              route();
            }
          }
        });
        if (res && res.data) {
          APP_SYLLABUS = res.data;
          return APP_SYLLABUS;
        }
      }
      if (APP_SYLLABUS) return APP_SYLLABUS;
      const res = await fetch('syllabus-app-data.json');
      if (!res.ok) throw new Error('Failed to load syllabus-app-data.json');
      APP_SYLLABUS = await res.json();
      return APP_SYLLABUS;
    }

    function escapeHtml(str) {
      if (str === null || str === undefined) return '';
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
    }

    function currentPath() {
      return decodeURIComponent(location.hash.replace(/^#/, '')).split('/').filter(Boolean);
    }

    function getAllSearchableCourses(data) {
      const core = (data.semesters || [])
        .flatMap(s => s.courses || [])
        .filter(c => !c.isElectiveSlot);
      const electives = data.electives || [];
      return [...core, ...electives];
    }

    function searchAppCourses(data, query) {
      const q = query.trim().toLowerCase();
      if (!q) return [];
      return getAllSearchableCourses(data).filter(course => {
        if (
          (course.code || '').toLowerCase().includes(q) ||
          (course.title || '').toLowerCase().includes(q) ||
          (course.semester || '').toLowerCase().includes(q) ||
          (course.year || '').toLowerCase().includes(q) ||
          (course.cluster && course.cluster.toLowerCase().includes(q))
        ) {
          return true;
        }
        if (
          (course.objectives || []).some(o => o.toLowerCase().includes(q)) ||
          (course.description && course.description.toLowerCase().includes(q)) ||
          (course.outcomes && course.outcomes.some(o => o.toLowerCase().includes(q)))
        ) {
          return true;
        }
        return (course.units || []).some(
          u =>
            (u.title || '').toLowerCase().includes(q) ||
            (u.topics || []).some(t => t.toLowerCase().includes(q))
        );
      });
    }

    function courseDetailHash(course) {
      if (course.isElectiveSlot) return '#Electives';
      const courseKey = `${course.code}-${course.title}`;
      if (course.cluster) {
        return `#Electives/${encodeURIComponent(courseKey)}`;
      }
      return `#${encodeURIComponent(course.year)}/${encodeURIComponent(course.semester)}/${encodeURIComponent(courseKey)}`;
    }

    function libraryUrlForCourse(course, unit) {
      const params = new URLSearchParams();
      params.set('subject', course.title);
      if (course.semester && !course.cluster) {
        params.set('semester', `Semester ${course.semester}`);
      }
      if (unit) {
        params.set('unit', String(unit.unitNumber));
        params.set('chapter', `Unit ${unit.unitNumber}: ${unit.title}`);
      }
      return `library.html?${params.toString()}`;
    }

    function renderBreadcrumb(path) {
      const crumbs = [
        `<a href="#" class="crumb-chip ${path.length === 0 ? 'active' : ''}">
          <svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>
          <span>BIT Syllabus</span>
        </a>`
      ];

      let acc = '';
      path.forEach((part, i) => {
        acc += (i === 0 ? '' : '/') + part;
        const isLast = i === path.length - 1;
        const label = part.length > 30 ? part.slice(0, 28) + '…' : part;
        crumbs.push(`
          <span class="crumb-chevron" aria-hidden="true">
            <svg viewBox="0 0 24 24" width="12" height="12" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="9 18 15 12 9 6"/></svg>
          </span>
          <a href="#${encodeURIComponent(acc)}" class="crumb-chip ${isLast ? 'active' : ''}" title="${escapeHtml(part)}">
            <span>${escapeHtml(label)}</span>
          </a>
        `);
      });

      document.getElementById('breadcrumb').innerHTML = crumbs.join('');
    }

    // ─── Accordion & Toggle Helpers ──────────────────────────────────────────
    window.toggleUnitAccordion = function(idx) {
      const el = document.getElementById(`unitAccordion-${idx}`);
      if (!el) return;
      el.classList.toggle('expanded');
      updateAllUnitsToggleBtn();
    };

    window.toggleAllUnits = function() {
      const accordions = document.querySelectorAll('.syl-unit-accordion');
      const allExpanded = Array.from(accordions).every(a => a.classList.contains('expanded'));
      accordions.forEach(a => a.classList.toggle('expanded', !allExpanded));
      updateAllUnitsToggleBtn();
    };

    function updateAllUnitsToggleBtn() {
      const btn = document.getElementById('toggleAllUnitsBtn');
      if (!btn) return;
      const accordions = document.querySelectorAll('.syl-unit-accordion');
      const allExpanded = accordions.length > 0 && Array.from(accordions).every(a => a.classList.contains('expanded'));
      btn.textContent = allExpanded ? 'Collapse All' : 'Expand All';
    }

    window.toggleCourseOverview = function() {
      const list = document.getElementById('courseOverviewExtra');
      const btn = document.getElementById('overviewToggleBtn');
      if (!list || !btn) return;
      const isExpanded = list.getAttribute('data-expanded') === 'true';
      list.setAttribute('data-expanded', isExpanded ? 'false' : 'true');
      list.style.display = isExpanded ? 'none' : 'flex';
      btn.innerHTML = isExpanded
        ? '<span>Show All</span><svg viewBox="0 0 24 24" width="12" height="12" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="6 9 12 15 18 9"/></svg>'
        : '<span>Show Less</span><svg viewBox="0 0 24 24" width="12" height="12" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="18 15 12 9 6 15"/></svg>';
    };

    window.handleSyllabusSearch = function(query) {
      ACTIVE_SEARCH_QUERY = query;
      const clearBtn = document.getElementById('searchClearBtn');
      if (clearBtn) clearBtn.style.display = query.trim() ? 'flex' : 'none';
      renderLandingResults();
    };

    window.clearSyllabusSearch = function() {
      ACTIVE_SEARCH_QUERY = '';
      const input = document.getElementById('syllabusSearchInput');
      if (input) {
        input.value = '';
        input.focus();
      }
      const clearBtn = document.getElementById('searchClearBtn');
      if (clearBtn) clearBtn.style.display = 'none';
      renderLandingResults();
    };

    // ═════════════════════════════════════════════════════════════════════════
    // LEVEL 1: BIT SYLLABUS LANDING PAGE (Grouped by Academic Year + Electives)
    // ═════════════════════════════════════════════════════════════════════════
    async function loadLanding() {
      const data = await loadAppSyllabus();
      const info = data.programInfo || {};
      document.title = 'BIT Syllabus — Semester Library';
      document.getElementById('syllabusTitle').textContent = 'BIT Syllabus';
      document.getElementById('syllabusSub').textContent =
        `${info.university || 'Gandaki University'} · ${info.durationYears || 4} Years · ${info.totalSemesters || 8} Semesters · ${info.totalCredits || 138} Credits`;
      document.getElementById('syllabusActionSlot').innerHTML = `
        <a href="#Overview" class="syllabus-action-pill secondary">
          <svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2.2"><circle cx="12" cy="12" r="10"/><line x1="12" y1="16" x2="12" y2="12"/><line x1="12" y1="8" x2="12.01" y2="8"/></svg>
          <span>Program Info &amp; Roadmap</span>
        </a>
      `;

      renderLandingContent();
    }

    function renderLandingContent() {
      if (!APP_SYLLABUS) return;
      const grid = document.getElementById('syllabusGrid');
      const q = ACTIVE_SEARCH_QUERY.trim();

      grid.innerHTML = `
        <div class="syllabus-search-box">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.2">
            <circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>
          </svg>
          <input
            type="text"
            id="syllabusSearchInput"
            class="syllabus-search-input"
            placeholder="Search subject name, course code, or topic..."
            value="${escapeHtml(ACTIVE_SEARCH_QUERY)}"
            oninput="handleSyllabusSearch(this.value)"
            autocomplete="off"
            spellcheck="false"
          >
          <button
            type="button"
            id="searchClearBtn"
            class="syllabus-search-clear"
            onclick="clearSyllabusSearch()"
            style="display: ${q ? 'flex' : 'none'};"
            title="Clear search"
            aria-label="Clear search"
          >
            <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
          </button>
        </div>
        <div id="syllabusLandingBody"></div>
      `;

      renderLandingResults();
    }

    function renderLandingResults() {
      if (!APP_SYLLABUS) return;
      const body = document.getElementById('syllabusLandingBody');
      if (!body) return;
      const q = ACTIVE_SEARCH_QUERY.trim();

      if (q) {
        const matches = searchAppCourses(APP_SYLLABUS, q);
        let html = `
          <div class="syl-section-header">
            <h2 class="syl-section-title normal-case">Search Results (${matches.length})</h2>
            <button type="button" class="syl-toggle-btn muted" onclick="clearSyllabusSearch()">Clear</button>
          </div>
        `;

        if (matches.length === 0) {
          html += `
            <div class="syl-empty-state">
              <svg viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
              <p style="margin:0;">No subjects found for &ldquo;${escapeHtml(q)}&rdquo;</p>
            </div>
          `;
        } else {
          html += `<div class="syl-subject-list">`;
          matches.forEach(course => {
            html += `
              <a href="${courseDetailHash(course)}" class="syl-subject-card">
                <div class="syl-subject-top">
                  <div class="syl-meta-pills-row">
                    <span class="syl-code-pill">${escapeHtml(course.code)}</span>
                    <span class="syl-section-meta">Sem ${escapeHtml(course.semester)} &middot; ${escapeHtml(course.creditDisplay || course.credit)} Cr &middot; ${escapeHtml(course.nature)}</span>
                  </div>
                  <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2.5" style="color: var(--syl-text-muted); flex-shrink:0;"><polyline points="9 18 15 12 9 6"/></svg>
                </div>
                <h3 class="syl-subject-title">${escapeHtml(course.title)}</h3>
                ${course.cluster ? `<p class="syl-subject-desc">${escapeHtml(course.cluster)}</p>` : ''}
              </a>
            `;
          });
          html += `</div>`;
        }

        body.innerHTML = html;
        return;
      }

      const yearGroups = [
        { yearNumber: 1, yearLabel: 'Year 1', subtitle: 'First Year' },
        { yearNumber: 2, yearLabel: 'Year 2', subtitle: 'Second Year' },
        { yearNumber: 3, yearLabel: 'Year 3', subtitle: 'Third Year' },
        { yearNumber: 4, yearLabel: 'Year 4', subtitle: 'Fourth Year' }
      ];

      let html = '';
      yearGroups.forEach(group => {
        const sems = (APP_SYLLABUS.semesters || []).filter(s => s.yearNumber === group.yearNumber);
        const yearTotalCourses = sems.reduce((sum, s) => sum + (s.totalCourses || (s.courses || []).length), 0);
        const yearTotalCredits = sems.reduce((sum, s) => sum + (s.totalCredits || 0), 0);

        html += `
          <div class="syl-year-group">
            <div class="syl-section-header">
              <h2 class="syl-section-title">${group.yearLabel} &middot; ${group.subtitle}</h2>
              <span class="syl-section-meta">${yearTotalCourses} Subjects &middot; ${yearTotalCredits} Cr</span>
            </div>

            <div class="syl-semester-grid">
              ${sems.map(sem => {
                const isMySem = CURRENT_USER_SEMESTER_ROMAN === sem.semesterRoman;
                const link = `#${encodeURIComponent(sem.year)}/${encodeURIComponent(sem.semesterRoman)}`;
                return `
                  <a href="${link}" class="syl-semester-card ${isMySem ? 'is-current' : ''}">
                    <div class="syl-card-top-row">
                      <span class="syl-sem-badge ${isMySem ? 'current' : ''}">SEM ${escapeHtml(sem.semesterRoman)}</span>
                      ${isMySem
                        ? `<span class="syl-current-indicator"><span class="syl-current-dot"></span>Current</span>`
                        : `<span class="syl-section-meta">${sem.totalCredits} Credits</span>`
                      }
                    </div>
                    <h3 class="syl-card-title">Semester ${escapeHtml(sem.semesterRoman)}</h3>
                    <p class="syl-card-subtitle">${sem.totalCourses} Subjects &middot; ${sem.totalCredits} Credits</p>
                    ${sem.description ? `<p class="syl-card-desc">${escapeHtml(sem.description)}</p>` : ''}
                    <div class="syl-card-footer">
                      <span>View Subjects</span>
                      <svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/></svg>
                    </div>
                  </a>
                `;
              }).join('')}
            </div>
          </div>
        `;
      });

      const electivesCount = (APP_SYLLABUS.electives || []).length;
      const clustersCount = (APP_SYLLABUS.clusters || []).length;
      html += `
        <div class="syl-year-group" style="margin-bottom:0;">
          <div class="syl-section-header">
            <h2 class="syl-section-title">Specialization Tracks</h2>
            <span class="syl-section-meta">Sem VII &amp; VIII</span>
          </div>

          <a href="#Electives" class="syl-electives-card">
            <div style="flex:1; min-width:0;">
              <div class="syl-meta-pills-row" style="margin-bottom:6px;">
                <span class="syl-sem-badge">${clustersCount} Clusters</span>
                <span class="syl-section-meta">${electivesCount} Elective Subjects</span>
              </div>
              <h3 class="syl-card-title" style="margin:0 0 3px;">Elective Specialization Courses</h3>
              <p class="syl-card-subtitle">Good Governance, ML &amp; Data Science, Network &amp; Internet, Software Dev &amp; GIS</p>
            </div>
            <div class="syl-icon-circle" aria-hidden="true">
              <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/></svg>
            </div>
          </a>
        </div>
      `;

      body.innerHTML = html;
    }

    // ═════════════════════════════════════════════════════════════════════════
    // LEVEL 2: SUBJECTS LISTING (#Year 1/I or #Electives)
    // ═════════════════════════════════════════════════════════════════════════
    async function loadSubjects(year, semesterRoman, initialCluster) {
      const data = await loadAppSyllabus();
      const isElectives = year === 'Electives';
      const activeSem = isElectives
        ? null
        : (data.semesters || []).find(
            s => s.semesterRoman.toUpperCase() === String(semesterRoman).toUpperCase()
          );

      if (isElectives && initialCluster) {
        ACTIVE_CLUSTER_FILTER = initialCluster;
      } else if (isElectives && !initialCluster) {
        ACTIVE_CLUSTER_FILTER = 'ALL';
      }

      document.title = isElectives
        ? 'Elective Subjects — BIT Syllabus'
        : `Semester ${activeSem ? activeSem.semesterRoman : semesterRoman} Subjects — BIT Syllabus`;
      document.getElementById('syllabusTitle').textContent = isElectives
        ? 'Elective Subjects'
        : `Semester ${activeSem ? activeSem.semesterRoman : semesterRoman} Subjects`;
      document.getElementById('syllabusSub').textContent = isElectives
        ? `5 Specialization Clusters · ${(data.electives || []).length} Elective Courses`
        : `${activeSem ? activeSem.year : year} · Gandaki University · Bachelor of Information Technology`;

      document.getElementById('syllabusActionSlot').innerHTML = `
        <a href="#" class="syllabus-action-pill secondary">
          <svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2.2"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg>
          <span>All Semesters</span>
        </a>
      `;

      const allCourses = isElectives ? (data.electives || []) : (activeSem ? activeSem.courses : []);
      const grid = document.getElementById('syllabusGrid');

      if (!allCourses.length) {
        grid.innerHTML = '<div class="syl-empty-state"><p style="margin:0;">No courses found for this semester.</p></div>';

    function findCourseInAppData(data, year, semester, courseKey) {
      const normKey = String(courseKey || '').toLowerCase().replace(/[^a-z0-9]/g, '');
      const matchCourse = (list) => (list || []).find(c => {
        const normCode = (c.code || '').toLowerCase().replace(/[^a-z0-9]/g, '');
        const normTitle = (c.title || '').toLowerCase().replace(/[^a-z0-9]/g, '');
        return (
          normCode + normTitle === normKey ||
          normTitle === normKey ||
          normCode === normKey ||
          (normCode && normCode !== 'ele' && normKey.startsWith(normCode)) ||
          (normTitle && normKey.includes(normTitle)) ||
          (normTitle && normTitle.includes(normKey))
        );
      });

      if (year === 'Electives') {
        const elec = matchCourse(data.electives);
        if (elec) return { course: elec, semesterObj: null, isElective: true };
      }

      if (semester) {
        const semObj = (data.semesters || []).find(
          s => s.semesterRoman.toUpperCase() === String(semester).toUpperCase()
        );
        if (semObj) {
          const found = matchCourse(semObj.courses);
          if (found) return { course: found, semesterObj: semObj, isElective: false };
        }
      }

      for (const semObj of (data.semesters || [])) {
        const found = matchCourse(semObj.courses);
        if (found) return { course: found, semesterObj: semObj, isElective: false };
      }

      const fallbackElec = matchCourse(data.electives);
      if (fallbackElec) return { course: fallbackElec, semesterObj: null, isElective: true };

      return null;
    }

            <div class="syl-kpi-label">Normal Duration (Max ${info.maxDurationYears || 8} Yrs)</div>
          </div>
          <div class="syl-kpi-card">
            <div class="syl-kpi-value">${info.totalSemesters || 8}</div>
            <div class="syl-kpi-label">Semesters</div>
          </div>
          <div class="syl-kpi-card">
            <div class="syl-kpi-value">${info.totalCourses || 47}</div>
            <div class="syl-kpi-label">Total Courses</div>
          </div>
          <div class="syl-kpi-card">
            <div class="syl-kpi-value">${info.totalCredits || 138}</div>
            <div class="syl-kpi-label">Total Credits · Min ${info.minAttendancePercent || 80}% Att.</div>
          </div>
        </div>

        <div class="syl-info-grid">
          <div class="syl-detail-section" style="margin-bottom:0;">
            <div class="syl-section-header-row"><span class="syl-section-header-title">Vision &amp; Mission</span></div>
            <p class="syl-prose"><strong style="color:var(--syl-text-primary);">Vision:</strong> ${escapeHtml(info.vision)}</p>
            <p class="syl-prose"><strong style="color:var(--syl-text-primary);">Mission:</strong> ${escapeHtml(info.mission)}</p>
          </div>
          <div class="syl-detail-section" style="margin-bottom:0;">
            <div class="syl-section-header-row"><span class="syl-section-header-title">Eligibility &amp; Education System</span></div>
            <p class="syl-prose">${escapeHtml(info.eligibility)}</p>
            <ul class="syl-bullet-list" style="margin-top:6px;">
              ${(info.educationSystem || []).map(item => `
                <li class="syl-bullet-item"><span class="syl-bullet-dot">&bull;</span><span>${escapeHtml(item)}</span></li>
              `).join('')}
            </ul>
          </div>
        </div>

        <div class="syl-detail-section">
          <div class="syl-section-header-row"><span class="syl-section-header-title">Program Learning Outcomes</span></div>
          <ul class="syl-bullet-list">
            ${(info.learningOutcomes || []).map(item => `
              <li class="syl-bullet-item"><span class="syl-bullet-dot">&bull;</span><span>${escapeHtml(item)}</span></li>
            `).join('')}
          </ul>
        </div>

        <div class="syl-detail-section">
          <div class="syl-section-header-row"><span class="syl-section-header-title">Career Prospects</span></div>
          <div class="syl-tag-cloud">
            ${(info.careerProspects || []).map(c => `<span class="syl-meta-pill primary">${escapeHtml(c)}</span>`).join('')}
          </div>
        </div>

        <div class="syl-detail-section" style="padding:0; overflow:hidden; margin-top:16px;">
          <div style="padding:14px 16px; border-bottom:1px solid var(--syl-border);">
            <h3 class="syl-strip-title" style="font-size:14px;">8-Semester Curriculum Breakdown</h3>
            <p class="syl-strip-subtitle">Select any semester row to inspect its subjects</p>
          </div>
          <div style="overflow-x:auto;">
            <table class="syl-roadmap-table">
              <thead>
                <tr>
                  <th>Year</th>
                  <th>Semester</th>
                  <th>Focus</th>
                  <th>Subjects</th>
                  <th style="text-align:right;">Credits</th>
                </tr>
              </thead>
              <tbody>
                ${(data.semesters || []).map(sem => `
                  <tr onclick="location.hash='#${encodeURIComponent(sem.year)}/${encodeURIComponent(sem.semesterRoman)}'">
                    <td style="font-weight:700; color:var(--syl-text-primary); white-space:nowrap;">${escapeHtml(sem.year)}</td>
                    <td style="white-space:nowrap;"><span class="syl-sem-badge">SEM ${escapeHtml(sem.semesterRoman)}</span></td>
                    <td style="font-size:12px;">${escapeHtml(sem.description || '')}</td>
                    <td style="white-space:nowrap;">${sem.totalCourses} Subjects</td>
                    <td style="text-align:right; font-weight:700; color:var(--syl-text-primary); white-space:nowrap;">${sem.totalCredits} Cr</td>
                  </tr>
                `).join('')}
              </tbody>
            </table>
          </div>
        </div>

        <div class="syl-section-header" style="margin-top:18px;">
          <h3 class="syl-section-title">Elective Specialization Clusters</h3>
          <span class="syl-section-meta">5 Clusters · Semesters VII &amp; VIII</span>
        </div>

        <div class="syl-cluster-grid">
          ${(data.clusters || []).map(cl => {
            const label = `Cluster ${cl.number}: ${cl.name}`;
            return `
              <a href="#Electives" class="syl-cluster-card" onclick="ACTIVE_CLUSTER_FILTER='${escapeHtml(label).replace(/'/g, "\\'")}';">
                <div class="syl-meta-pills-row" style="margin-bottom:6px;">
                  <span class="syl-sem-badge">Cluster ${cl.number}</span>
                  <span class="syl-section-meta">${(cl.courses || []).length} Courses</span>
                </div>
                <h4 style="font-size:14.5px; font-weight:700; color:var(--syl-text-primary); margin:0 0 4px;">${escapeHtml(cl.name)}</h4>
                <p style="font-size:12px; color:var(--syl-text-muted); margin:0 0 10px; line-height:1.45;">${escapeHtml(cl.description)}</p>
                <ul class="syl-bullet-list">
                  ${(cl.courses || []).map(c => `<li class="syl-bullet-item"><span class="syl-bullet-dot">&bull;</span><span>${escapeHtml(c)}</span></li>`).join('')}
                </ul>
              </a>
            `;
          }).join('')}
        </div>
      `;

      grid.innerHTML = html;
    }

    // Direct Year View (#Year 1)
    async function loadYearSemesters(yearLabel) {
      const data = await loadAppSyllabus();
      const sems = (data.semesters || []).filter(s => s.year.toLowerCase() === yearLabel.toLowerCase());
      document.title = `${yearLabel} — BIT Syllabus`;
      document.getElementById('syllabusTitle').textContent = `${yearLabel} Curriculum`;
      document.getElementById('syllabusSub').textContent = `Select a semester in ${yearLabel} to view subjects and micro-syllabus`;
      document.getElementById('syllabusActionSlot').innerHTML = `
        <a href="#" class="syllabus-action-pill secondary">
          <svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2.2"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg>
          <span>All Semesters</span>
        </a>
      `;

      const grid = document.getElementById('syllabusGrid');
      grid.innerHTML = `
        <div class="syl-section-header">
          <h2 class="syl-section-title">${escapeHtml(yearLabel)} Semesters</h2>
          <span class="syl-section-meta">${sems.length} Semesters</span>
        </div>
        <div class="syl-semester-grid">
          ${sems.map(sem => `
            <a href="#${encodeURIComponent(sem.year)}/${encodeURIComponent(sem.semesterRoman)}" class="syl-semester-card">
              <div class="syl-card-top-row">
                <span class="syl-sem-badge">SEM ${escapeHtml(sem.semesterRoman)}</span>
                <span class="syl-section-meta">${sem.totalCredits} Credits</span>
              </div>
              <h3 class="syl-card-title">Semester ${escapeHtml(sem.semesterRoman)}</h3>
              <p class="syl-card-subtitle">${sem.totalCourses} Subjects &middot; ${sem.totalCredits} Credits</p>
              ${sem.description ? `<p class="syl-card-desc">${escapeHtml(sem.description)}</p>` : ''}
              <div class="syl-card-footer">
                <span>View Subjects</span>
                <svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/></svg>
              </div>
            </a>
          `).join('')}
        </div>
      `;
    }

    // ─── Router ──────────────────────────────────────────────────────────────
    async function route() {
      ACTIVE_SEARCH_QUERY = '';
      const urlParams = new URLSearchParams(window.location.search);
      const courseParam = urlParams.get('course');
      const semParam = urlParams.get('semester') || urlParams.get('sem');

      if (!location.hash || location.hash === '#') {
        if (courseParam) {
          const data = await loadAppSyllabus();
          const found = findCourseInAppData(data, '', '', courseParam);
          if (found && found.course) {
            location.hash = courseDetailHash(found.course);
            return;
          }
        }
        if (semParam) {
          const roman = normalizeRomanSemester(semParam);
          if (roman && ROMAN_TO_YEAR[roman]) {
            location.hash = `#${encodeURIComponent(ROMAN_TO_YEAR[roman])}/${encodeURIComponent(roman)}`;
            return;
          }
        }
      }

      const path = currentPath();
      renderBreadcrumb(path);

      if (path.length === 0) {
        await loadLanding();
      } else if (path.length === 1 && path[0] === 'Overview') {
        await loadOverview();
      } else if (path.length === 1) {
        if (path[0] === 'Electives') {
          await loadSubjects('Electives', '', ACTIVE_CLUSTER_FILTER !== 'ALL' ? ACTIVE_CLUSTER_FILTER : null);
        } else if (/^Year\s+\d$/i.test(path[0])) {
          await loadYearSemesters(path[0]);
        } else {
          const roman = normalizeRomanSemester(path[0]);
          if (roman && ROMAN_TO_YEAR[roman]) {
            await loadSubjects(ROMAN_TO_YEAR[roman], roman);
          } else {
            await loadCourseDetail('', '', path[0]);
          }
        }
      } else if (path.length === 2) {
        if (path[0] === 'Electives') {
          await loadCourseDetail('Electives', '', path[1]);
        } else if (/^(I|II|III|IV|V|VI|VII|VIII)$/i.test(path[1])) {
          await loadSubjects(path[0], path[1].toUpperCase());
        } else {
          await loadCourseDetail(path[0], '', path[1]);
        }
      } else {
        await loadCourseDetail(path[0], path[1], path[2]);
      }

      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    window.addEventListener('hashchange', route);
    route();
  </script>
