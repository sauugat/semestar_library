  <script>
    SemesterAuth.getUser().then(user => {
      if (user) {
        window.IS_AUTHENTICATED = true;
        SemesterAuth.initHeader(user);
      } else {
        window.IS_AUTHENTICATED = false;
        SemesterAuth.initHeader(null);
      }
    }).catch(() => {
      window.IS_AUTHENTICATED = false;
    });

    const logoutBtnEl = document.getElementById('logoutBtn');
    if (logoutBtnEl) {
      logoutBtnEl.addEventListener('click', (e) => {
        e.preventDefault();
        SemesterAuth.logout();
      });
    }

    let SYLLABUS = null;
    let ACTIVE_SEARCH_QUERY = '';
    let ACTIVE_CLUSTER_FILTER = 'ALL';

    async function loadData() {
      if (window.SWR && typeof window.SWR.get === 'function') {
        const res = await window.SWR.get('/syllabus-data.json', {
          ttl: 24 * 60 * 60 * 1000,
          userScoped: false,
          fetcher: async () => {
            const r = await fetch('syllabus-data.json');
            return r.json();
          },
          onData: (data, meta) => {
            SYLLABUS = data;
            if (meta && meta.source === 'network' && meta.changed && typeof route === 'function') {
              route();
            }
          }
        });
        if (res && res.data) {
          SYLLABUS = res.data;
          return SYLLABUS;
        }
      }
      if (SYLLABUS) return SYLLABUS;
      const res = await fetch('syllabus-data.json');
      SYLLABUS = await res.json();
      return SYLLABUS;
    }

    function currentPath() {
      return decodeURIComponent(location.hash.replace(/^#/, '')).split('/').filter(Boolean);
    }

    function escapeHtml(str) {
      if (!str) return '';
      return String(str).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
    }

    function renderBreadcrumb(path) {
      let crumbs = [
        `<a href="#" class="crumb-chip ${path.length === 0 ? 'active' : ''}">
          <svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>
          <span>Syllabus</span>
        </a>`
      ];

      let acc = '';
      path.forEach((part, i) => {
        acc += (i === 0 ? '' : '/') + part;
        const isLast = i === path.length - 1;
        const label = part.length > 28 ? part.slice(0, 26) + '…' : part;
        crumbs.push(`
          <span class="crumb-chevron">
            <svg viewBox="0 0 24 24" width="12" height="12" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="9 18 15 12 9 6"/></svg>
          </span>
          <a href="#${encodeURIComponent(acc)}" class="crumb-chip ${isLast ? 'active' : ''}" title="${escapeHtml(part)}">
            <span>${escapeHtml(label)}</span>
          </a>
        `);
      });

      document.getElementById('breadcrumb').innerHTML = crumbs.join('');
    }

    function textToHtml(text) {
      if (!text) return '';
      return text.split('\n').map(l => escapeHtml(l.trim())).filter(Boolean).join('<br>');
    }

    // Separate course contents, laboratory work, and textbooks/references
    function extractCourseSections(course) {
      let contents = course.contents || '';
      let lab = course.lab || '';
      let textbooks = Array.isArray(course.textbooks) ? [...course.textbooks] : [];

      function cleanField(rawText) {
        if (!rawText) return { text: '', extractedBooks: [], extractedLab: '' };
        let text = rawText;
        let extractedLab = '';
        let extractedBooks = [];

        const labRegex = /(?:Laboratory\s*Works?|Practical\s*Works?|Lab\s*Exercises?|Laboratory\s*Work\/Case\s*Studies|Practical\s*Sessions?):([\s\S]*?)(?=(?:Text\s*books?|Reference\s*books?|References?|Suggested\s*Readings?|Recommended\s*Books?):|$)/i;
        const labMatch = text.match(labRegex);
        if (labMatch) {
          extractedLab = labMatch[1].trim();
          text = text.replace(labMatch[0], '').trim();
        }

        const tbRegex = /(?:Text\s*books?|Reference\s*books?|References?|Suggested\s*Readings?|Recommended\s*Books?|Suggested\s*Textbooks?|Reference\s*Materials?):([\s\S]*)$/i;
        const tbMatch = text.match(tbRegex);
        if (tbMatch) {
          const tbSection = tbMatch[1].trim();
          text = text.slice(0, tbMatch.index).trim();
          
          const lines = tbSection.split('\n').map(l => l.trim()).filter(Boolean);
          let currentBook = '';
          for (let l of lines) {
            if (/^(\d+[\.\)]|\*|\-|\u2022)\s*/.test(l)) {
              if (currentBook) extractedBooks.push(currentBook.trim());
              currentBook = l.replace(/^(\d+[\.\)]|\*|\-|\u2022)\s*/, '');
            } else {
              if (currentBook) currentBook += ' ' + l;
              else currentBook = l;
            }
          }
          if (currentBook) extractedBooks.push(currentBook.trim());
        }

        return { text, extractedBooks, extractedLab };
      }

      const fromContents = cleanField(contents);
      contents = fromContents.text;
      if (fromContents.extractedLab) {
        lab = lab ? (lab + '\n\n' + fromContents.extractedLab) : fromContents.extractedLab;
      }
      if (fromContents.extractedBooks.length) {
        textbooks = textbooks.concat(fromContents.extractedBooks);
      }

      const fromLab = cleanField(lab);
      lab = fromLab.text;
      if (fromLab.extractedBooks.length) {
        textbooks = textbooks.concat(fromLab.extractedBooks);
      }

      textbooks = textbooks.map(b => b.replace(/\s+/g, ' ').trim()).filter(Boolean);
      textbooks = [...new Set(textbooks)];

      return { contents, lab, textbooks };
    }

    // Helper to format course unit breakdown
    function parseCourseContents(raw) {
      if (!raw) return [];
      const lines = raw.split('\n');
      const units = [];
      let currentUnit = null;

      for (let line of lines) {
        const trimmed = line.trim();
        if (!trimmed) continue;
        
        if (/^(?:Text\s*books?|Reference\s*books?|References?|Suggested\s*Readings?|Recommended\s*Books?):/i.test(trimmed)) {
          break;
        }

        const unitMatch = trimmed.match(/^(\d+)\.\s+([A-Za-z].*?)(?:\s+(\d+\s*hrs?))?$/i);
        const isSubtopic = /^\d+\.\d+/.test(trimmed);

        if (unitMatch && !isSubtopic) {
          if (currentUnit) units.push(currentUnit);
          currentUnit = {
            num: unitMatch[1],
            title: unitMatch[2].replace(/\s+\d+\s*hrs?$/i, '').trim(),
            hrs: unitMatch[3] || '',
            topics: []
          };
        } else if (currentUnit) {
          currentUnit.topics.push(trimmed);
        } else {
          if (!currentUnit) {
            currentUnit = { num: '1', title: 'Module Contents', hrs: '', topics: [trimmed] };
          }
        }
      }
      if (currentUnit) units.push(currentUnit);
      return units;
    }

    // Toggle Unit Accordion (Only one or many)
    window.toggleUnitAccordion = function(idx) {
      const el = document.getElementById(`unitAccordion-${idx}`);
      if (!el) return;
      el.classList.toggle('expanded');
      updateAllUnitsToggleBtn();
    };

    window.toggleAllUnits = function() {
      const accordions = document.querySelectorAll('.syl-unit-accordion');
      const allExpanded = Array.from(accordions).every(a => a.classList.contains('expanded'));
      accordions.forEach(a => {
        if (allExpanded) {
          a.classList.remove('expanded');
        } else {
          a.classList.add('expanded');
        }
      });
      updateAllUnitsToggleBtn();
    };

    function updateAllUnitsToggleBtn() {
      const btn = document.getElementById('toggleAllUnitsBtn');
      if (!btn) return;
      const accordions = document.querySelectorAll('.syl-unit-accordion');
      const allExpanded = Array.from(accordions).every(a => a.classList.contains('expanded'));
      btn.textContent = allExpanded ? 'Collapse All' : 'Expand All';
    }

    window.toggleCourseOverview = function() {
      const container = document.getElementById('courseOverviewContent');
      const btn = document.getElementById('overviewToggleBtn');
      if (!container || !btn) return;
      const isExpanded = container.getAttribute('data-expanded') === 'true';
      if (isExpanded) {
        container.setAttribute('data-expanded', 'false');
        container.style.maxHeight = '84px';
        container.style.overflow = 'hidden';
        btn.textContent = 'Show All';
      } else {
        container.setAttribute('data-expanded', 'true');
        container.style.maxHeight = 'none';
        container.style.overflow = 'visible';
        btn.textContent = 'Show Less';
      }
    };

    // Live Search on Syllabus Landing Page
    window.handleSyllabusSearch = function(query) {
      ACTIVE_SEARCH_QUERY = query;
      const clearBtn = document.getElementById('searchClearBtn');
      if (clearBtn) {
        clearBtn.style.display = query.trim() ? 'flex' : 'none';
      }
      renderLandingContent();
    };

    window.clearSyllabusSearch = function() {
      const input = document.getElementById('syllabusSearchInput');
      if (input) {
        input.value = '';
        input.focus();
      }
      ACTIVE_SEARCH_QUERY = '';
      const clearBtn = document.getElementById('searchClearBtn');
      if (clearBtn) clearBtn.style.display = 'none';
      renderLandingContent();
    };

    // ═════════════════════════════════════════════════════════════════════════
    // LEVEL 1: LANDING PAGE (Grouped by Academic Year + Electives + Search)
    // ═════════════════════════════════════════════════════════════════════════
    async function loadYears() {
      const data = await loadData();
      document.getElementById('syllabusTitle').textContent = 'BIT Syllabus';
      document.getElementById('syllabusSub').textContent = 'Gandaki University · 4 Years · 8 Semesters · 138 Credits';
      document.getElementById('syllabusActionSlot').innerHTML = `
        <a href="#Overview" class="syllabus-action-pill secondary">
          <svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M3 3v18h18"/><path d="M18.7 8 13 13.7l-3-3L4.7 15.7"/></svg>
          <span>Curriculum Roadmap</span>
        </a>
      `;

      renderLandingContent();
    }

    function renderLandingContent() {
      if (!SYLLABUS) return;
      const grid = document.getElementById('syllabusGrid');
      const q = ACTIVE_SEARCH_QUERY.trim().toLowerCase();

      // Search Box Shell
      let html = `
        <div class="syllabus-search-box">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.2">
            <circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>
          </svg>
          <input 
            type="text" 
            id="syllabusSearchInput" 
            class="syllabus-search-input" 
            placeholder="Search subject name or course code (e.g. DSA, CIT111, Java)..." 
            value="${escapeHtml(ACTIVE_SEARCH_QUERY)}"
            oninput="handleSyllabusSearch(this.value)"
            autocomplete="off"
            spellcheck="false"
          >
          <button 
            id="searchClearBtn" 
            class="syllabus-search-clear" 
            onclick="clearSyllabusSearch()" 
            style="display: ${q ? 'flex' : 'none'};" 
            title="Clear search"
          >
            <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
          </button>
        </div>
      `;

      // If Search Active: Render matching subjects directly
      if (q) {
        const matches = [];
        // Search core courses
        (SYLLABUS.semesters || []).forEach(sem => {
          (sem.courses || []).forEach(c => {
            if (
              c.title.toLowerCase().includes(q) ||
              c.code.toLowerCase().includes(q) ||
              sem.semester.toLowerCase() === q ||
              (c.contents && c.contents.toLowerCase().includes(q))
            ) {
              matches.push({ course: c, year: sem.year, semester: sem.semester });
            }
          });
        });
        // Search electives
        (SYLLABUS.electives || []).forEach(c => {
          if (
            c.title.toLowerCase().includes(q) ||
            c.code.toLowerCase().includes(q) ||
            (c.cluster && c.cluster.toLowerCase().includes(q)) ||
            (c.contents && c.contents.toLowerCase().includes(q))
          ) {
            matches.push({ course: c, year: 'Electives', semester: '' });
          }
        });

        html += `
          <div class="syl-section-header">
            <h2 class="syl-section-title">Matching Subjects (${matches.length})</h2>
            <button class="syl-toggle-btn" onclick="clearSyllabusSearch()">Clear</button>
          </div>
        `;

        if (matches.length === 0) {
          html += `
            <div class="syl-empty-state">
              <svg viewBox="0 0 24 24" width="28" height="28" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
              <p>No subjects found for &quot;${escapeHtml(ACTIVE_SEARCH_QUERY)}&quot;</p>
            </div>
          `;
        } else {
          html += `<div style="display: flex; flex-direction: column; gap: 8px;">`;
          matches.forEach(({ course, year, semester }) => {
            const courseKey = `${course.code}-${course.title}`;
            const targetHash = `#${encodeURIComponent(year)}/${encodeURIComponent(semester)}/${encodeURIComponent(courseKey)}`;

            html += `
              <a href="${targetHash}" class="syl-subject-card">
                <div class="syl-subject-top">
                  <div class="syl-meta-pills-row">
                    <span class="syl-code-pill">${escapeHtml(course.code)}</span>
                    <span class="syl-meta-pill">${semester ? `Sem ${escapeHtml(semester)}` : 'Elective'} &middot; ${escapeHtml(course.credit)} Cr</span>
                    <span class="syl-meta-pill">${escapeHtml(course.nature || 'TH')}</span>
                  </div>
                  <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2.5" style="color: var(--syl-text-muted);"><polyline points="9 18 15 12 9 6"/></svg>
                </div>
                <h3 class="syl-subject-title">${escapeHtml(course.title)}</h3>
                ${course.cluster ? `<p class="syl-subject-desc">${escapeHtml(course.cluster)}</p>` : ''}
              </a>
            `;
          });
          html += `</div>`;
        }

        grid.innerHTML = html;
        return;
      }

      // Default Grouped View: Year 1 to Year 4
      const yearMeta = [
        { year: 'Year 1', subtitle: 'First Year (Semesters I & II)' },
        { year: 'Year 2', subtitle: 'Second Year (Semesters III & IV)' },
        { year: 'Year 3', subtitle: 'Third Year (Semesters V & VI)' },
        { year: 'Year 4', subtitle: 'Fourth Year (Semesters VII & VIII)' }
      ];

      yearMeta.forEach(({ year, subtitle }) => {
        const sems = (SYLLABUS.semesters || []).filter(s => s.year === year);
        const yearTotalCourses = sems.reduce((sum, s) => sum + s.courses.length, 0);
        const yearTotalCredits = sems.reduce((sum, s) => sum + (parseInt(s.totalCredits) || 0), 0);

        html += `
          <div style="margin-bottom: 22px;">
            <div class="syl-section-header">
              <h2 class="syl-section-title">${year} &middot; ${subtitle.split('(')[0].trim()}</h2>
              <span class="syl-section-meta">${yearTotalCourses} Subjects &middot; ${yearTotalCredits} Credits</span>
            </div>

            <div class="syl-semester-grid">
              ${sems.map(s => {
                const courseCount = s.courses.length;
                const credits = s.totalCredits;
                const link = `#${encodeURIComponent(s.year)}/${encodeURIComponent(s.semester)}`;

                return `
                  <a href="${link}" class="syl-semester-card">
                    <div class="syl-card-top-row">
                      <span class="syl-sem-badge">SEM ${escapeHtml(s.semester)}</span>
                      <span class="syl-section-meta">${credits} Credits</span>
                    </div>
                    <h3 class="syl-card-title">Semester ${escapeHtml(s.semester)}</h3>
                    <p class="syl-card-subtitle">${courseCount} Subjects &middot; Prescribed Curriculum</p>
                    <div class="syl-card-footer">
                      <span>View Subjects</span>
                      <svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/></svg>
                    </div>
                  </a>
                `;
              }).join('')}
            </div>
          </div>
        `;
      });

      // Specialization Electives Card
      html += `
        <div style="margin-top: 10px;">
          <div class="syl-section-header">
            <h2 class="syl-section-title">Specialization Tracks &middot; Semesters VII &amp; VIII</h2>
            <span class="syl-section-meta">5 Clusters &middot; 15 Electives</span>
          </div>

          <a href="#Electives" class="syl-electives-card">
            <div style="flex: 1;">
              <div class="syl-meta-pills-row" style="margin-bottom: 6px;">
                <span class="syl-sem-badge">5 Clusters</span>
                <span class="syl-section-meta">${(SYLLABUS.electives || []).length} Elective Subjects</span>
              </div>
              <h3 class="syl-card-title" style="margin: 0 0 4px 0;">Elective Specialization Courses</h3>
              <p class="syl-card-subtitle">AI/ML, Data Science, Cloud/IoT, E-Gov &amp; Software Engineering</p>
            </div>
            <div class="syl-icon-circle">
              <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/></svg>
            </div>
          </a>
        </div>
      `;

      grid.innerHTML = html;
    }

    // ═════════════════════════════════════════════════════════════════════════
    // LEVEL 2: SEMESTER SUBJECTS LISTING (#Year 1/I or #Electives)
    // ═════════════════════════════════════════════════════════════════════════
    async function loadCourses(year, semester) {
      const data = await loadData();
      const isElectives = year === 'Electives';
      
      document.getElementById('syllabusTitle').textContent = isElectives ? 'Electives' : `${year} · Semester ${semester}`;
      document.getElementById('syllabusSub').textContent = isElectives ? 'Specialized elective course outlines' : 'Prescribed curriculum & unit breakdown';
      document.getElementById('syllabusActionSlot').innerHTML = `
        <a href="#" class="syllabus-action-pill secondary">
          <svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2.2"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg>
          <span>All Semesters</span>
        </a>
      `;

      const allCourses = isElectives ? data.electives : (data.semesters.find(s => s.year === year && s.semester === semester)?.courses || []);
      const grid = document.getElementById('syllabusGrid');

      if (!allCourses.length) {
        grid.innerHTML = '<div class="syl-empty-state"><p>No courses found for this semester.</p></div>';

      }

      const totalCredits = isElectives ? '3 Each' : (data.semesters.find(s => s.year === year && s.semester === semester)?.totalCredits || 0);

      window.setElectiveCluster = function(cl) {
        ACTIVE_CLUSTER_FILTER = cl;
        renderSubjectList();

      function renderSubjectList() {
        let visibleCourses = allCourses;
        if (isElectives && ACTIVE_CLUSTER_FILTER !== 'ALL') {

        if (isElectives) {

              ${clusters.map((cl, i) => `

        html += `

        html += visibleCourses.map(c => {
          const isTheoryPractical = (c.nature || '').includes('PR');
          const courseKey = `${c.code}-${c.title}`;
          const targetHash = `#${encodeURIComponent(year)}/${encodeURIComponent(semester || '')}/${encodeURIComponent(courseKey)}`;
          const { contents } = extractCourseSections(c);
          const units = parseCourseContents(contents);

          return `

                </div>
                <button 
                  type="button"
                  class="syl-notes-btn" 
                  onclick="event.stopPropagation(); window.location.href='library.html?subject=${encodeURIComponent(c.title)}';"
                  title="View notes for this subject"
                >
                  <svg viewBox="0 0 24 24" width="12" height="12" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/></svg>

              ${c.cluster ? `<p class="syl-subject-desc">${escapeHtml(c.cluster)}</p>` : (c.objectives ? `<p class="syl-subject-desc">${escapeHtml(c.objectives.slice(0, 120))}…</p>` : '')}

    // LEVEL 3: INDIVIDUAL SUBJECT SYLLABUS & MICRO-SYLLABUS DETAIL
    // ═════════════════════════════════════════════════════════════════════════
    async function loadCourseDetail(year, semester, courseKey) {
      const data = await loadData();
      const isElectives = year === 'Electives';
      let courses = isElectives ? data.electives : (data.semesters.find(s => s.year === year && s.semester === semester)?.courses || []);
      
      const normKey = courseKey.toLowerCase().replace(/[^a-z0-9]/g, '');
      let course = courses.find(c => {
        const normCode = (c.code || '').toLowerCase().replace(/[^a-z0-9]/g, '');
        const normTitle = (c.title || '').toLowerCase().replace(/[^a-z0-9]/g, '');
        return (
          normCode + normTitle === normKey ||
          normTitle === normKey ||
          normCode === normKey ||
          (normCode && normKey.startsWith(normCode)) ||
          normKey.includes(normTitle) ||
          normTitle.includes(normKey)
        );
      });

      // Search all semesters if not matched in current
      if (!course) {
        for (const sem of (data.semesters || [])) {
          const match = sem.courses.find(c => {
            const normCode = (c.code || '').toLowerCase().replace(/[^a-z0-9]/g, '');
            const normTitle = (c.title || '').toLowerCase().replace(/[^a-z0-9]/g, '');
            return (
              normCode + normTitle === normKey ||
              normTitle === normKey ||
              normCode === normKey ||
              (normCode && normKey.startsWith(normCode)) ||
              normKey.includes(normTitle) ||
              normTitle.includes(normKey)
            );
          });
          if (match) {
            course = match;
            year = sem.year;
            semester = sem.semester;
            break;
          }
        }
      }

      const grid = document.getElementById('syllabusGrid');

      if (!course) {
        grid.innerHTML = '<div class="syl-empty-state"><p>Course syllabus not found.</p></div>';
        return;
      }

      document.getElementById('syllabusTitle').textContent = `${course.code} · Syllabus`;
      document.getElementById('syllabusSub').textContent = `${course.title} · ${course.credit} Credits · ${course.nature}`;
      document.getElementById('syllabusActionSlot').innerHTML = `
        <a href="#${encodeURIComponent(year)}${semester ? '/' + encodeURIComponent(semester) : ''}" class="syllabus-action-pill secondary">

          <span>${semester ? `Sem ${semester} Subjects` : 'Electives'}</span>
        </a>
        <a href="library.html?subject=${encodeURIComponent(course.title)}" class="syllabus-action-pill">
          <svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/></svg>
          <span>Subject Notes</span>
        </a>
      `;

      const { contents, lab, textbooks } = extractCourseSections(course);
      const units = parseCourseContents(contents);
      const hasLongOverview = (course.objectives && course.objectives.length > 180) || (course.description && course.description.length > 180);

      let html = `
        <!-- Subject Header & Metadata Card -->
        <div class="syl-detail-header-card">
          <div class="syl-meta-pills-row">
            <span class="syl-code-pill">${escapeHtml(course.code)}</span>
            <span class="syl-meta-pill">${escapeHtml(course.credit)} Credits</span>
            <span class="syl-meta-pill">${escapeHtml(course.nature || 'Theory')}</span>
            ${semester ? `<span class="syl-meta-pill">Semester ${escapeHtml(semester)}</span>` : ''}
          </div>
          <h2 class="syl-detail-title">${escapeHtml(course.title)}</h2>

                        onclick="event.stopPropagation();"
                        title="Study with Kyana AI"
                      >
                        <span>Study</span>

                      <a

      if (lab) {

      // Textbooks & References
      if (textbooks.length > 0) {

      const urlParams = new URLSearchParams(window.location.search);
      const semParam = urlParams.get('semester') || urlParams.get('sem');
      if (semParam && (!location.hash || location.hash === '#')) {
        const semMap = {
          '1': { year: 'Year 1', sem: 'I' }, 'I': { year: 'Year 1', sem: 'I' },
          '2': { year: 'Year 1', sem: 'II' }, 'II': { year: 'Year 1', sem: 'II' },
          '3': { year: 'Year 2', sem: 'III' }, 'III': { year: 'Year 2', sem: 'III' },
          '4': { year: 'Year 2', sem: 'IV' }, 'IV': { year: 'Year 2', sem: 'IV' },
          '5': { year: 'Year 3', sem: 'V' }, 'V': { year: 'Year 3', sem: 'V' },
          '6': { year: 'Year 3', sem: 'VI' }, 'VI': { year: 'Year 3', sem: 'VI' },
          '7': { year: 'Year 4', sem: 'VII' }, 'VII': { year: 'Year 4', sem: 'VII' },
          '8': { year: 'Year 4', sem: 'VIII' }, 'VIII': { year: 'Year 4', sem: 'VIII' }
        };
        const target = semMap[semParam.toUpperCase()] || semMap[semParam];
        if (target) {
          location.hash = `#${encodeURIComponent(target.year)}/${encodeURIComponent(target.sem)}`;
          return;
        }
      }

      const path = currentPath();
      renderBreadcrumb(path);
      if (path.length === 0) {
        loadYears();
      } else if (path.length === 1 && path[0] === 'Overview') {
        loadOverview();
      } else if (path.length === 1) {
        if (path[0] === 'Electives') {
          loadCourses('Electives', '');
        } else if (/^Year\s+\d$/i.test(path[0])) {
          loadSemesters(path[0]);
        } else {
          const semMap = { 'I': 'Year 1', 'II': 'Year 1', 'III': 'Year 2', 'IV': 'Year 2', 'V': 'Year 3', 'VI': 'Year 3', 'VII': 'Year 4', 'VIII': 'Year 4' };
          const semYear = semMap[path[0].toUpperCase()];
          if (semYear) {
            loadCourses(semYear, path[0].toUpperCase());
            return;
          }
          const data = await loadData();
          for (const s of (data.semesters || [])) {
            const match = s.courses.find(c => 
              c.title.toLowerCase() === path[0].toLowerCase() ||
              c.code.toLowerCase() === path[0].toLowerCase() ||
              (c.code + '-' + c.title).toLowerCase() === path[0].toLowerCase() ||
              path[0].toLowerCase().includes(c.title.toLowerCase())
            );
            if (match) {
              loadCourseDetail(s.year, s.semester, match.code + '-' + match.title);
              return;
            }
          }
          loadSemesters(path[0]);
        }
      } else if (path.length === 2) {
        if (/^(I|II|III|IV|V|VI|VII|VIII)$/i.test(path[1])) {
          loadCourses(path[0], path[1].toUpperCase());
        } else {
          loadCourseDetail(path[0], '', path[1]);
        }
      } else {
        loadCourseDetail(path[0], path[1], path[2]);
      }
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    window.addEventListener('hashchange', route);
    route();
  </script>
